            abs='--absolute-path';
          else
            abs='--relative-path';
          fi;
          clang_checks=$(clang-tidy --list-checks);
          gcc_version=$(gcc --version);
          gpp_version=$(g++ --version);
          cmake_list='CMakeLists.txt';
          clang_file='parameter-file';
          clang_tidy='.clang-tidy';
          clangd_tidy='/home/runner/.local/bin/clangd-tidy';
          clang_includes='check-file-includes.txt';
          if [[ "${{ env.run_clang_tidy }}" ]] && ${{ env.analyzer == '1' }} && [[ -e "${compile_json}" ]]; then
            echo -e '\n####################\nRUN-CLANG-TIDY ANALYZING FILES\n####################\n' | process_input;
            if ${{ inputs.format }} && [[ $(whereis clang-format) ]]; then
              [[ ! -f '.clang-format' ]] && echo -e '[check-file] creating new .clang-format file as none was found\n' | process_input && clang-format -style=LLVM -dump-config > .clang-format 2>&1 | process_input;
              "${{ env.run_clang_tidy }}" -p build -j "$(nproc)" -config-file "${clang_tidy}" -export-fixes build/fixes.yaml -fix -format -style 'file' 2>&1 | process_input || echo -e "\n::notice::run-clang-tidy exit-code ($?)" | process_input;
            else
              "${{ env.run_clang_tidy }}" -p build -j "$(nproc)" -config-file "${clang_tidy}" -export-fixes build/fixes.yaml -fix 2>&1 | process_input || echo -e "\n::notice::run-clang-tidy exit-code ($?)" | process_input;
            fi;
            if [[ "${PIPESTATUS[0]}" == '1' ]] || [[ -s "${project_log}" ]] && [[ $(grep -aiF 'Process completed with exit code' "${project_log}") ]]; then
              echo 'check_build=false' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]] && [[ $(grep -aF 'error:' "${project_log}") ]]; then
              echo -e "\n::notice::Errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
            elif [[ -s "${project_log}" ]]; then
              echo -e "\n::notice::No errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
            fi;
            [[ $(grep -aiE 'fixit|fix-it' "${project_log}") ]] && echo "file_fixed=1" >> "${GITHUB_ENV}";
          elif [[ ! "${{ env.run_clang_tidy }}" ]] && ${{ env.analyzer == '1' }} && [[ -e "${compile_json}" ]]; then
            echo -e "\n####################\n::error:: run-clang-tidy missing in repo Exiting...\n####################\n" | process_input;
          fi;
          if [[ -f "${clang_file}" ]] && ${{ env.analyzer == '2' }} && [[ -e "${compile_json}" ]]; then
            files_list=false
            if [[ "$(clang_includes)" ]] && [[ "$(source_files)" ]] ; then
              echo -e "\n####################\n\t${file_type} file(s) & include objectives found continuing...\n####################" | process_input;
              clang_includes >> "${clang_file}" && source_files >> "${clang_file}" && files_list=true
            elif [[ "$(source_files)" ]]; then
              echo -e "\n####################\n\t${file_type} file(s) found continuing...\n####################" | process_input;
              source_files >> "${clang_file}" && files_list=true
            else	
              echo -e "\n::error::No ${file_type} files found searching repository\nExiting...\n" | process_input;
            fi;
            echo -e "\n####################\n\t${clang_file} found continuing...\n####################" | process_input;
            echo -e '\n####################\nCLANG-TIDY CONFIG CHECKED\n####################\n' | process_input;
