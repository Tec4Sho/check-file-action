                errors=true
              fi;
            fi;
            if ${{ inputs.number > 0 }}; then
              if [[ ${{ inputs.number }} -eq ${count1} ]]; then
                echo -e "\nFile ${count1} checking auto stopped at $(basename ${file})\n";
