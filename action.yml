              ${{ inputs.internal == 'true' }} && header_source=$(find "${{ env.base }}" -path "*/${{ inputs.dirpath }}/*" -type d \( -name 'include' -o -name 'uapi' -o -name 'radix-tree' -o -name "${{ env.arch }}" \) -print | grep . || fdfind -p "${abs}" --max-results="${{ inputs.limit }}" -t d ".*/(${{ env.arch }}|uapi|include|radix-tree)(/|$)" "${{ env.base }}");
              while IFS= read -r include; do
                include_count=$((include_count + 1));
                echo "${include_count}" > "${count1}";
                echo -e "-I${include}" >> 'compile_flags.txt';
                echo -n "${include};";
              done <<< "${header_source}";
              if [[ -s "${clang_includes}" ]] && ${{ inputs.include }}; then
                while IFS= read -r include; do
                  include_count_extra=$((include_count_extra + 1));
                  echo "${include_count_extra}" > "${count2}";
                  echo -e "-I${include}" >> 'compile_flags.txt';
                  echo -n "${include#./};";
                done < "${clang_includes}";
              fi;
            fi;
          }
          clang_includes() {
            fdfind -p "${abs}" --max-results="${{ inputs.limit }}" -t d ".*/(${{ env.arch }}|hwregs|gdb|uapi|include|radix-tree)(/|$)" "${{ env.base }}" | while IFS= read -r include; do
              echo -e "--extra-arg=-I${include#./}";
            done;
          }
          source_files() {
            find "${{ env.base }}" -not \( -path '*/CMakeFiles' -prune -o -path '*/build' -prune -o -path '*/.git' -prune -o -path '*/.github' -prune \) -type f -name "*.${file_type}" -print | while IFS= read -r file; do
              echo -e "${file#./}";
            done;
          }
          mkdir -p build/bin
          [[ ! -f "${cmake_list}" ]] && cmake_list="${{ github.action_path }}/${cmake_list}" && cp $cmake_list .;
          echo 'build_error=false' >> "${GITHUB_ENV}";
          echo 'github_source_files=false' >> "${GITHUB_ENV}";
          echo 'github_include_dirs=false' >> "${GITHUB_ENV}";
          echo 'github_source_dirs=false' >> "${GITHUB_ENV}";
          if [[ "$(source_files)" ]]; then
            echo 'github_source_files=true' >> "${GITHUB_ENV}";
          fi;
          if [[ "$(cmake_includes)" ]]; then
            echo "github_include_dirs=$(cmake_includes)" >> "${GITHUB_ENV}";
            if [[ -f "${count3}" ]]; then
              echo -e "\n####################\n\t\033[1mCHECK-FILE:\033[0m added \033[1m$(cat ${count3})\033[0m source include directories [source:\033[32m auto mode\033[0m]\n\tcmake additional header objectives updated successfully!\n####################" | process_input;
            elif [[ -f "${count2}" ]]; then
              echo -e "\n####################\n\t\033[1mCHECK-FILE:\033[0m added $(cat ${count1}) header include directories\n\t\033[1mCHECK-FILE:\033[0m updated $(cat ${count2}) additional header directories\n####################" | process_input;
            else
              echo -e "\n####################\n\t\033[1mCHECK-FILE:\033[0m added $(cat ${count1}) header include directories\n####################" | process_input;
            fi;
          elif ${{ env.include_count > '1000' }} && ${{ env.sources }}; then
            echo -e "\n####################\n\t\033[1mCHECK-FILE:\033[0m added \033[1m${{ env.include_count }}\033[0m source files & their include directories [source:\033[32m auto mode\033[0m]\n\tcmake source & header objectives updated successfully!\n####################" | process_input;
          elif ${{ env.include_count > '1000' }}; then
            echo -e "\n####################\n\t\033[1mCHECK-FILE:\033[0m added \033[1m${{ env.include_count }}\033[0m source include directories [source:\033[32m auto mode\033[0m]\n\tcmake max additional header objectives updated successfully!\n####################" | process_input;
          elif [[ -e 'check-file-compile.txt' ]]; then
            total_count=$(gawk 'NF > 0 { count++ } END { print count }' 'check-file-compile.txt');
            echo -e "\n####################\n\t\033[1mCHECK-FILE:\033[0m added \033[1m${total_count}\033[0m source files & their include directories [source:\033[32m auto mode\033[0m]\n\tcmake source files & header objectives updated successfully!\n####################" | process_input;
          fi;
          if [[ -f "${clang_tidy}" ]]; then
            echo -e '\n####################\n\t.clang-tidy found continuing...\n####################' | process_input;
          fi;
          if [[ -f "${cmake_list}" ]]; then
            echo -e '\n####################\n\tCMakeLists.txt found continuing...\n####################' | process_input;
          fi;
          if [[ -d 'build' ]]; then
            echo -e '\n####################\n\tbuild directory created continuing...\n####################\n' | process_input;
            if ${{ inputs.content == 'false' }} && [[ "$(source_dirs)" ]] && [[ ! -f "${compile_json}" ]] && (${{ env.sources }} || [[ -e 'check-file-compile.txt' ]] || [[ -e 'build-source-files.txt' ]]); then
              echo "github_source_dirs=$(source_dirs)" >> "${GITHUB_ENV}";
              echo -e 'Cmake Sources: mode [1]\n';
              cmake -S . -DPROJECT_SRC_DIRS="$(source_dirs)" -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build 2>&1 | cmakebar --replay --est true | process_input || echo "::error::( $? ) Missing or malformed CMakeList.txt!?" | process_input;
            elif [[ "$(source_dirs)" ]] && [[ ! -f "${compile_json}" ]] && (${{ env.sources }} || [[ -e 'check-file-compile.txt' ]]); then
              echo "github_source_dirs=$(source_dirs)" >> "${GITHUB_ENV}";
              echo -e 'Cmake Sources: mode [1]\n';
              cmake -S . -DPROJECT_SRC_DIRS="$(source_dirs)" -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build 2>&1 | process_input || echo "::error::( $? ) Missing or malformed CMakeList.txt!?" | process_input;
            elif [[ "$(source_dirs)" ]] && [[ "$(cmake_includes)" ]] && [[ ! -f "${compile_json}" ]]; then
              echo "github_source_dirs=$(source_dirs)" >> "${GITHUB_ENV}";
              echo -e 'Cmake Sources: mode [2]\n';
              cmake -S . -DPROJECT_INCLUDE_SRC="${include_source}" -DPROJECT_INCLUDE_DIRS="$(cmake_includes)" -DPROJECT_SRC_DIRS="$(source_dirs)" -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build 2>&1 | process_input || echo "::error::( $? ) Missing or malformed CMakeList.txt!?" | process_input;
            elif [[ ! -f "${compile_json}" ]]; then
              echo -e 'Cmake Sources: mode [3]\n';
              cmake -S . -DPROJECT_INCLUDE_SRC="${include_source}" -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build 2>&1 | process_input || echo "::error::( $? ) Missing or malformed CMakeList.txt!?" | process_input;
            fi;
            echo "github_include_dirs=" >> "${GITHUB_ENV}";
            if [[ "${PIPESTATUS[0]}" == '0' ]]; then
              if ${{ inputs.upload }}; then
                echo 'build_files=1' >> "${GITHUB_ENV}";
              fi;
            fi;
          fi;
          if [[ -d 'build' ]] && ${{ env.dirname != '' }} && ${{ inputs.repository == 'false' }}; then
            cp -Rf build ${github}/ && echo -e "\n####################\n\tbuild content copied to github workspace\n####################" | process_input;
          fi;
          if [[ "${user_compile_json}" == 'true' ]]; then
            echo -e "\n####################\n\t${compile_json} was found successfully...\n####################" | process_input;
          elif [[ -e "${compile_json}" ]]; then
            echo -e "\n####################\n\t${compile_json} was created successfully...\n####################" | process_input;
          fi;
        fi;
        echo '';
        seconds="$((SECONDS - start_time))";
        echo "seconds=${seconds}" >> "${GITHUB_ENV}";
      shell: bash
      continue-on-error: true

    - name: Project Analyze
      if: inputs.project == 'true' && inputs.analyzer > '0' && inputs.pattern == ''
      run: |        
        source ~/.bashrc
        set +e
        start_time="${{ env.seconds }}";
        export CMAKE_EXPORT_COMPILE_COMMANDS=ON
        repository=${{ github.event.repository.name }};
        github="${GITHUB_WORKSPACE}";
        project_log="${github}/${repository}_project.log";
        clang_sources='check-file-sources.txt';
        codechecker='codechecker.yaml';
        user_compile_json=false
        count1='count1.txt';
        count2='count2.txt';
        count3='count3.txt';
        check_build=false
        include_source=false
        file_type='c';
        update=true
        fixed=false;
        if ${{ inputs.repository == 'false' }} && ${{ env.dirname != '' }}; then
          cd "${{ env.dirname }}";
        fi;
        process_input() {
          case "${{ inputs.output }}" in
            1) tee -a "${project_log}" ;; # Show in console AND save
            2) cat >> "${project_log}" ;;  # Save only (append)
            3) cat ;;                   # Show in console only
            4) cat >/dev/null ;;        # Completely silent
            *) cat ;;                   # Default fallback
          esac
        }
        if ${{ env.check_build == 'false' }}; then
          echo 'check_build=false' >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.update == 'false' }}; then
          echo 'update=false' >> "${GITHUB_ENV}";
          update=false
        fi;
        if ${{ inputs.filetype != '' }}; then
          file_type="${{ inputs.filetype }}";
        fi;
        echo "filetype=${file_type}" >> "${GITHUB_ENV}";
        if [[ "${file_type}" == [cth]* ]]; then
          clang_tidy_version=$(clang-tidy --version);
          clang_version=$(clang --version);
          verify_config=$(clang-tidy --verify-config);
          cmake_version=$(cmake --version);
          if [[ -f 'compile_commands.json' ]]; then
            user_compile_json=true
            compile_json='compile_commands.json';
            cp -vf ${compile_json} build/
          elif [[ -f 'build/compile_commands.json' ]]; then
            compile_json='build/compile_commands.json';
          else
            compile_json='build/compile_commands.json';
          fi;
          if ${{ inputs.absolute }}; then
            abs='--absolute-path';
          else
            abs='--relative-path';
          fi;
          clang_checks=$(clang-tidy --list-checks);
          gcc_version=$(gcc --version);
          gpp_version=$(g++ --version);
          cmake_list='CMakeLists.txt';
          clang_file='parameter-file';
          clang_tidy='.clang-tidy';
          clangd_tidy='/home/runner/.local/bin/clangd-tidy';
          clang_includes='check-file-includes.txt';
          if [[ "${{ env.run_clang_tidy }}" ]] && ${{ env.analyzer == '1' }} && [[ -e "${compile_json}" ]]; then
            echo -e '\n####################\nRUN-CLANG-TIDY ANALYZING FILES\n####################\n' | process_input;
            if ${{ inputs.format }} && [[ $(whereis clang-format) ]]; then
              [[ ! -f '.clang-format' ]] && echo -e '[check-file] creating new .clang-format file as none was found\n' | process_input && clang-format -style=LLVM -dump-config > .clang-format 2>&1 | process_input;
              "${{ env.run_clang_tidy }}" -p build -j "$(nproc)" -config-file "${clang_tidy}" -export-fixes build/fixes.yaml -fix -format -style 'file' 2>&1 | process_input || echo -e "\n::notice::run-clang-tidy exit-code ($?)" | process_input;
            else
              "${{ env.run_clang_tidy }}" -p build -j "$(nproc)" -config-file "${clang_tidy}" -export-fixes build/fixes.yaml -fix 2>&1 | process_input || echo -e "\n::notice::run-clang-tidy exit-code ($?)" | process_input;
            fi;
            if [[ "${PIPESTATUS[0]}" == '1' ]] || [[ -s "${project_log}" ]] && grep -qaiF 'Process completed with exit code' "${project_log}"; then
              echo 'check_build=false' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]] && grep -qaF 'error:' "${project_log}"; then
              echo -e "\n::notice::Errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
            elif [[ -s "${project_log}" ]]; then
              echo -e "\n::notice::No errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
            fi;
            [[ $(grep -aiE 'fixit|fix-it' "${project_log}") ]] && echo "file_fixed=1" >> "${GITHUB_ENV}";
          elif [[ ! "${{ env.run_clang_tidy }}" ]] && ${{ env.analyzer == '1' }} && [[ -e "${compile_json}" ]]; then
            echo -e "\n####################\n::error:: run-clang-tidy missing in repo Exiting...\n####################\n" | process_input;
          fi;
          if [[ -f "${clang_file}" ]] && ${{ env.analyzer == '2' }} && [[ -e "${compile_json}" ]]; then
            files_list=false
            if [[ "$(clang_includes)" ]] && [[ "$(source_files)" ]] ; then
              echo -e "\n####################\n\t${file_type} file(s) & include objectives found continuing...\n####################" | process_input;
              clang_includes >> "${clang_file}" && source_files >> "${clang_file}" && files_list=true
            elif [[ "$(source_files)" ]]; then
              echo -e "\n####################\n\t${file_type} file(s) found continuing...\n####################" | process_input;
              source_files >> "${clang_file}" && files_list=true
            else	
              echo -e "\n::error::No ${file_type} files found searching repository\nExiting...\n" | process_input;
            fi;
            echo -e "\n####################\n\t${clang_file} found continuing...\n####################" | process_input;
            echo -e '\n####################\nCLANG-TIDY CONFIG CHECKED\n####################\n' | process_input;
            if [[ "${files_list}" ]]; then
              cp -vf "${clang_file}" 'build/parameter-source.txt' 2>/dev/null;
              echo -e '\n####################\nCLANG-TIDY ANALYZING FILES\n####################\n' | process_input;
              clang-tidy @parameter-file 2>&1 | process_input || echo -e "\n::notice::clang-tidy exit-code ($?)" | process_input;
              if [[ "${PIPESTATUS[0]}" == '1' ]] || [[ -s "${project_log}" ]] && grep -qaiF 'Process completed with exit code' "${project_log}"; then
                echo 'check_build=false' >> "${GITHUB_ENV}";
              elif [[ -s "${project_log}" ]] && grep -qaF 'error:' "${project_log}"; then
                echo -e "\n::notice::Errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
              elif [[ -s "${project_log}" ]]; then
                echo -e "\n::notice::No errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
              fi;
            grep -qaiE 'fixit|fix-it' "${project_log}" && echo "file_fixed=1" >> "${GITHUB_ENV}";
            fi;
          elif [[ ! -e "${clang_file}" ]] && ${{ env.analyzer == '2' }} && [[ -e "${compile_json}" ]]; then
            echo -e "\n####################\n::error:: parameter-file missing in repo Exiting...\n####################\n" | process_input;
          fi;
          if [[ -f "${clangd_tidy}" ]] && ${{ env.analyzer == '3' }} && [[ -e "${compile_json}" ]]; then
            echo -e '\n####################\nCLANGD-TIDY ANALYZING FILES\n####################\n' | process_input;
            fdfind -j "$(nproc)" -p "${abs}" -e "${{ inputs.filetype }}" "${{ env.base }}" -X clangd-tidy -p build/ -j "$(nproc)" --color always --tqdm 2>&1 | process_input || echo -e "\n::notice::clangd-tidy exit-code ($?)" | process_input;
            if [[ "${PIPESTATUS[0]}" == '1' ]] || [[ -s "${project_log}" ]] && grep -qaiF 'Process completed with exit code' "${project_log}"; then
              echo 'check_build=false' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]] && grep -qaF 'error:' "${project_log}"; then
              echo -e "\n::notice::Errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
            elif [[ -s "${project_log}" ]]; then
              echo -e "\n::notice::No errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
            fi;
          elif [[ ! -e "${clangd_tidy}" ]] && ${{ env.analyzer == '3' }} && [[ -e "${compile_json}" ]]; then
            echo -e "\n####################\n::error::${clangd_tidy##/*} file missing in repo Exiting...\n####################\n" | process_input;
          fi;
          if [[ $(which CodeChecker) ]] && ${{ env.analyzer == '4' }} && [[ -e "${compile_json}" ]]; then
            echo -e '\n####################\n\tCODECHECKER ANALYZING FILES...\n####################\n' | process_input;
            sudo bash -c 'source ~/.bashrc';
            export TERM=dumb; 
            export CC_LOGGER_GCC_LIKE="gcc:g++:clang:clang++:/cc:c++";
            if [[ -e "/home/runner/codechecker/venv/bin/activate" ]]; then
              sudo bash -c 'source /home/runner/codechecker/venv/bin/activate'
            else
              echo -e "\nUnable to source ( /home/runner/codechecker/venv/bin/activate ) file\n" | process_input;
            fi;
            [[ ! -s 'skip.txt' ]] && echo -e '# Skip all system includes\n-*/usr/include/*\n-*/usr/local/include/*\n-*/site-packages/*' > 'skip.txt';
            if ${{ inputs.repair }}; then
              echo -e "\nRepair mode continuing without config file continuing...\n" | process_input;
              CodeChecker analyze "${compile_json}" --jobs "$(nproc)" --output ./reports 2>&1 | process_input || echo -e "\nCodeChecker analyzer exit-code ($?)" | process_input;
              CodeChecker fixit --checker-name bugprone-suspicious-string-compare --jobs "$(nproc)" --apply ./reports 2>&1 | process_input || echo -e "\nCodeChecker fixit exit-code ($?)" | process_input;
              CodeChecker parse ./reports 2>&1 | process_input || echo -e "\nCodeChecker parse exit-code ($?)" | process_input;
            else
              [[ -e "${codechecker}" ]] && echo -e "\n${codechecker} file was found continuing...\n" | process_input || echo -e "\n::warning::${codechecker} file was not found continuing...\n" | process_input;
              [[ -e "${codechecker}" ]] && CodeChecker check --logfile "${compile_json}" --config "${codechecker}" --jobs "$(nproc)" 2>&1 | process_input || echo -e "\nCodeChecker check exit-code ($?)" | process_input;
              [[ ! -e "${codechecker}" ]] && CodeChecker check --logfile "${compile_json}" --jobs "$(nproc)" 2>&1 | process_input || echo -e "\nCodeChecker check exit-code ($?)" | process_input;
            fi;
            if [[ "${PIPESTATUS[0]}" == '1' || "${PIPESTATUS[1]}" == '1' ]] || [[ -s "${project_log}" && grep -qaiF 'Process completed with exit code' "${project_log}"; then
              echo 'check_build=false' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]] && grep -qaiE 'error:|Error while processing' "${project_log}"; then
              echo -e "\n::notice::Errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
            elif [[ -s "${project_log}" ]]; then
              echo -e "\n::notice::No errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
            fi;
            [[ $(grep -aiE 'fixit|fix-it' "${project_log}") ]] && echo "file_fixed=1" >> "${GITHUB_ENV}";
          elif [[ ! $(which CodeChecker) ]] && ${{ env.analyzer == '4' }} && [[ -e 'compile_commands.json' ]]; then
            echo -e "\n####################\n::error::CodeChecker not installed Exiting...\n####################\n" | process_input;
          fi;
          [[ -f 'compile_flags.txt' ]] && mv -f 'compile_flags.txt' 'build/';
        fi;
        echo '';
        seconds="$((SECONDS + start_time))";
        echo "seconds=${seconds}" >> "${GITHUB_ENV}";
      shell: bash
      continue-on-error: true

    - name: NULL Errors Fixer
      if: inputs.project == 'true' && env.filename != '' && inputs.fix == 'true' && inputs.pattern == ''
      run: |
        source ~/.bashrc
        set +e
        start_time="${{ env.seconds }}";
        CMAKE_EXPORT_COMPILE_COMMANDS=ON
        CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)";
        repository=${{ github.event.repository.name }};
        process_input() {
          case "${{ inputs.output }}" in
            1) tee -a "${project_log}" ;; # Show in console AND save
            2) cat >> "${project_log}" ;;  # Save only (append)
            3) cat ;;                   # Show in console only
            4) cat >/dev/null ;;        # Completely silent
            *) cat ;;                   # Default fallback
          esac
        }
        if ${{ inputs.absolute == 'true' }}; then
          path='--absolute-path';
        else
          path='--relative-path';
        fi;
        file_type="${{ inputs.filetype }}";
        file_count=1
        count=0
        if ${{ inputs.database == 'true' }} && [[ "${file_type}" == [cth]* ]]; then
          if [[ $(echo "${{ inputs.filename }}" | grep -Eo '^[a-zA-Z0-9_-]+.[a-zA-Z0-9_-]+$') ]]; then
            files=$(grep -sF "${{ inputs.dirpath }}/${{ env.filename }}" "${{ env.database }}" | grep . || grep -sF "${{ inputs.filename }}" "${{ env.database }}");
            echo -e "\n####################\nDatabase Filename: ${{ inputs.filename }}\n####################" | process_input;
          elif [[ $(echo "${{ inputs.filename }}" | grep -Eo '^[a-zA-Z0-9_-]+$') ]]; then
            files=$(grep -sF "${{ inputs.dirpath }}/${{ env.filename }}" "${{ env.database }}" | grep . || grep -sF "${{ inputs.filename }}" "${{ env.database }}");
            echo -e "\n####################\nDatabase Filename: ${{ inputs.filename }}\n####################" | process_input;
          elif ${{ inputs.filetype != '' }}; then
            regex="\.${{ inputs.filetype }}$";
            files=$(grep -sE "${{ inputs.dirpath }}/.${regex}" "${{ env.database }}" | grep . || grep -sE "${regex}" "${{ env.database }}");
            echo -e "\n####################\nDatabase File Extension: ${{ env.filename }}\n####################" | process_input;
          fi;
        elif [[ "${file_type}" == [cth]* ]]; then
          if [[ $(echo "${{ inputs.filename }}" | grep -Eo '^[a-zA-Z0-9_-]+.[a-zA-Z0-9_-]+$') ]]; then
            files=$(fdfind -j "$(nproc)" -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**/${{ inputs.filename }}" "${{ env.base }}" | grep . || fdfind -j "$(nproc)" -p "${path}" --type file -g "**/${{ inputs.filename }}" "${{ env.base }}");
            echo -e "\n####################\nFilename: ${{ inputs.filename }}\n####################" | process_input;
          elif [[ $(echo "${{ inputs.filename }}" | grep -Eo '^[a-zA-Z0-9_-]+$') ]]; then
            files=$(fdfind -j "$(nproc)" -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**/${{ inputs.filename }}" "${{ env.base }}" | grep . || fdfind -j "$(nproc)" -p "${path}" --type file -g "**/${{ inputs.filename }}" "${{ env.base }}");
            echo -e "\n####################\nFilename: ${{ inputs.filename }}\n####################" | process_input;
          elif ${{ inputs.filetype != '' }}; then
            files=$(fdfind -j "$(nproc)" -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**/*.${{ inputs.filetype }}" "${{ env.base }}" | grep . || fdfind -j "$(nproc)" -p "${path}" --type file -e "${{ inputs.filetype }}" "${{ env.base }}");
            echo -e "\n####################\nFile Extension: ${{ env.filename }}\n####################" | process_input;
          fi;
        fi;
        if [[ -n "${files}" ]] && [[ "${file_type}" == [cth]* ]]; then
        echo -e "\n####################\nMutli instances of NULL in source files cleaning\n####################\n";
        while IFS= read -r file; do
          count=$((file_count++));
          echo -e "\n\033[1mChecking\033[0m ${file##*/} / ${count}";
          cp "${file}" "${file}.bak";
          sed -i 's/\(= NULL\)\{2,\}/= NULL/g' "${file}";
          if ! cmp -s "${file}" "${file}.bak"; then
            echo -e "\n\033[31mChanges made multiple [ null = null ] removed:\033[0m ${file}";
          else
            echo -e "\n\033[32mNo changes made multiple [ null = null ] not found\033[0m";
          fi;
          rm "${file}.bak"; 
          if ${{ inputs.number > '0' }}; then
            if [[ "${{ inputs.number }}" -eq "${count}" ]]; then
              echo -e "\nFile checking auto stopped at: ${count} / ${file##*/}" | process_input;
              break;
            fi;
          fi; 
        done <<< "${files}";
        echo '';
        seconds="$((SECONDS + start_time))";
        echo "seconds=${seconds}" >> "${GITHUB_ENV}";
      shell: bash
      continue-on-error: true
      
    - name: Build Project
      if: inputs.project == 'true' && inputs.build > '0' && inputs.build < '5' && inputs.pattern == ''
      run: |
        source ~/.bashrc
        set +e
