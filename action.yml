            echo -e '\n[\033[1mGCC Mode\033[0m]\n';
            while IFS= read -r file; do
              count1=$((file_count++));
              gcc -MM -MG "${file}" 2>&1 | process_input;
            done <<< "${include_files[@]}";
          echo 'check_build=true' >> "${GITHUB_ENV}";
          elif [[ "${{ inputs.filetype }}" == [c]* ]] && [[ "$(which g++)" ]]; then
            ${{ inputs.include }} && export CPLUS_INCLUDE_PATH+="$(find "${{ env.base }}" \( -name 'acpi' -o -name 'api' -o -name 'asm' -o -name 'core' -o -name 'drivers' -o -name 'fs' -o -name 'generated' -o -name 'gpu' -o -name 'include' -o -name 'linux' -o -name 'mtk' -o -name 'mt-plat' -o -name 'subcmd' -o -name 'subdev' -o -name 'sysdep' -o -name 'util' \) -maxdepth 2 -type d -printf '%p:')";
            echo -e '\n[\033[1mG++ Mode\033[0m]\n';
            while IFS= read -r file; do
