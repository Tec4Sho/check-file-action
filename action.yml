          elif [[ -e "${compile_json}" ]]; then
            echo -e "\n####################\n\t${compile_json} was created successfully...\n####################" | process_input;
          fi;
        fi;
        echo '';
        seconds="$((SECONDS - start_time))";
        echo "seconds=${seconds}" >> "${GITHUB_ENV}";
      shell: bash
      continue-on-error: true

    - name: Project Analyze
