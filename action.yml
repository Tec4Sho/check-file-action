        file=$(sudo find ${GITHUB_WORKSPACE} -type f -name "checkmake.ini" -print -quit);
        path='/home/runner/checkmake.ini';
        error_log="${GITHUB_WORKSPACE}/${{ inputs.filename }}_error.log";
        if ${{ inputs.database }}; then
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(grep -sF "/${{ inputs.filename }}" "${{ env.database }}");
            echo -e "\n####################\nLiteral String Pattern Matching Active\n####################\n";
          else
            regex="\${{ inputs.filename }}$";
            files=$(grep -sE "${regex}" "${{ env.database }}");
            echo -e "\n####################\nExtended Regex Pattern Matching Active\n####################\n";
          fi;
          clang_file=$(grep -sF -m 1 '.clang-tidy' "${{ env.database }}");
          repaired=$(grep -sF -m 1 'check-file-repaired.txt' "${{ env.database }}");
        else
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "${{ inputs.filename }}" -print);
          else
            files=$(sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "*${{ inputs.filename }}" -print);
          fi;
          clang_file=$(sudo find ${{ env.file_path }} -type f -name '.clang-tidy' -print -quit);
          repaired=$(sudo find ${{ env.file_path }} -type f -name 'check-file-repaired.txt' -print -quit);
        fi;
        if [[ ${file} ]]; then
          echo -e "\n####################\ncheckmake.ini found copying\n####################\n";
          sudo cp -vf "${file}" "${path}" 2>/dev/null;
        fi;
        makefile_count=1
        if [[ $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]] && [[ -n ${files} ]]; then
          process_input() {
            while IFS= read -r log; do
              if [[ ${{ inputs.output == 1 }} ]]; then
                echo "$log" | tee -a "${error_log}";
              elif [[ ${{ inputs.output == 2 }} ]]; then
                echo "$log" >> "${error_log}";
              elif [[ ${{ inputs.output == 3 }} ]]; then
                echo "$log";
              fi;
            done;
          }
          echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################\n";
          { time -p for file in ${files[@]}; do
            count4=$((makefile_count++));
            echo -e "\n####################\n\tFILE PATH (${count4})\n####################\n";
            echo "$(dirname ${file})";
            if ${{ inputs.content }}; then
              echo -e "\n####################\n\tFILE CONTENT\n####################\n\n";
              batcat --theme=ansi --paging=never --show-all --color=always --style=full "${file}";
              echo -e "\n\n";
            fi;
            echo -e "\n####################\nCHECKMAKE ANALYZING $(basename ${file}) FOR ERROR(S) ($count4)\n####################\n";
            checkmake "${file}" 2>/dev/null | process_input || echo -e "::error:: ( $? ) Broken pipe check. PipeStatus [0]: ${PIPESTATUS[0]}, PipeStatus [1]: ${PIPESTATUS[1]}";
            if [[ -s "${error_log}" ]] && [[ ! $(grep -sE "${file}.*error:" "${error_log}") ]]; then
              echo -e "\n####################\nCHECKMAKE NO ERRORS FOUND ${file}\n####################\n";
            else
              echo -e "\n####################\nCHECKMAKE FOUND ERROR(S)\n####################\n";
              errors=true
            fi;
          done; echo '| Runtime |'; } 2>&1
          echo -e "\n::notice:: Total number of ${{ inputs.filename }} file(s) checked is: ${count4}\n";
          echo -e "Scanning Completed!\nCheckMake Exiting!\n .....\n";
          if [[ "${errors}" ]]; then
            echo "file_error=1" >> "${GITHUB_ENV}";
          fi;
          echo "file_found=1" >> "${GITHUB_ENV}";
        elif [[ $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]]; then
          echo -e "\n####################\nFINISHED SEARCHING MK FILES\nNO $(echo ${{ inputs.filename }} | sed 's/[\/\$]//g') FOUND\n####################\n";
        fi;
      shell: bash
      continue-on-error: true

    - name: Check All Files
      if: inputs.filename != '' && env.file_found == 0 
      run: |
        export LC_ALL=C
        set +e
        file_name="${{ inputs.filename }}";
        file_type="${file_name##*.}";
        if ${{ inputs.database }}; then
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(grep -sF "/${{ inputs.filename }}" "${{ env.database }}");
            echo -e "\n####################\nLiteral String Pattern Matching Active\n####################\n";
          else
            regex="\${{ inputs.filename }}$";
            files=$(grep -sE "${regex}" "${{ env.database }}");
            echo -e "\n####################\nExtended Regex Pattern Matching Active\n####################\n";
          fi;
          clang_file=$(grep -sF -m 1 '.clang-tidy' "${{ env.database }}");
          repaired=$(grep -sF -m 1 'check-file-repaired.txt' "${{ env.database }}");
        else
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "${{ inputs.filename }}" -print);
          else
            files=$(sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "*${{ inputs.filename }}" -print);
          fi;
          clang_file=$(sudo find ${{ env.file_path }} -type f -name '.clang-tidy' -print -quit);
          repaired=$(sudo find ${{ env.file_path }} -type f -name 'check-file-repaired.txt' -print -quit);
        fi;
        file_count=1
        if [[ ${files} ]]; then
          echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################\n";
          { time -p for file in ${files[@]}; do
            count5=$((file_count++));
            echo -e "\n####################\n\tFILE PATH (${count5})\n####################\n";
            echo "$(dirname ${file})";
            if ${{ inputs.content }}; then
              echo -e "\n####################\n\tFILE CONTENT (${count5})\n####################\n\n";
              batcat --theme=ansi --paging=never --show-all --color=always --style=full "${file}";
              echo -e "\n\n";
            fi;
          done; echo '| Runtime |'; } 2>&1
          echo -e "\n::notice:: Total number of ${{ inputs.filename }} file(s) checked is: ${count5}\n";
          echo -e "Scanning Completed!\nCheckfile Exiting!\n .....\n";
          echo "file_found=1" >> "${GITHUB_ENV}";
        else
          echo -e "\n####################\nFINISHED SEARCHING ALL FILES\nNO $(echo ${{ inputs.filename }} | sed 's/[\/\$]//g') FOUND\n####################\n";
        fi;
      shell: bash
      continue-on-error: true

    - name: Word text Match
      if: inputs.pattern != ''
      run: |
        export LC_ALL=C
        set +e
        file_count=1
        if ${{ inputs.database }}; then
          matched1=$(time -p sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "*.${type}" -print | xargs -r -P "$(nproc --all)" sudo rg -j "$(nproc --all)" --color always -sHFn "${{ inputs.pattern }}" 2>/dev/null);
          content1=$(time -p sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "*.${type}" -print | xargs -r -P "$(nproc --all)" sudo rg -j "$(nproc --all)" -l --quiet "${{ inputs.pattern }}" 2>/dev/null);
          matched2=$(time -p sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -print | xargs -r -P "$(nproc --all)" sudo rg -j "$(nproc --all)" --color always -sHFn "${{ inputs.pattern }}" 2>/dev/null);
          content2=$(time -p sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -print | xargs -r -P "$(nproc --all)" sudo rg -j "$(nproc --all)" -l --quiet "${{ inputs.pattern }}" 2>/dev/null);
        else
          matched1=$(time -p sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "*.${type}" -exec sudo grep --color=always -sHanF "${{ inputs.pattern }}" "{}" \; );
          content1=$(time -p sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "*.${type}" -exec sudo grep -q "${{ inputs.pattern }}" "{}" \; );
          matched2=$(time -p sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -exec sudo grep --color=always -sHanF "${{ inputs.pattern }}" "{}" \; );
          content2=$(time -p sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -exec sudo grep -q "${{ inputs.pattern }}" "{}" \; );
        fi;
        echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################\n";
        echo -e "\n####################\nPattern Matching: ${{ inputs.pattern }}\n####################\n";
        if [[ "${{ inputs.filetype }}" != 'none' ]]; then
          for type in ${types[@]}; do
            echo '| Runtime |';
            matches=${matched1};
            if [[ -n ${matches} ]]; then
              counter=$( echo "${matches}" | rg -c "${{ inputs.pattern }}" );
              echo -e "\n####################\n (${counter}) CONTENT MATCH(S) FOUND IN ${{ inputs.filetype }} FILE(S)\n####################\n";
              echo -e "\n${matches}\n";
              if ${{ inputs.content }}; then
                echo '| Runtime |';
                contents=${content1};
                for c in ${contents[@]}; do
                  count=$((file_count++));
                  echo -e "\n####################\n\tFILE PATH (${count})\n####################\n";
                  echo -e "\n$(dirname ${c})\n":
                  echo -e "\n####################\n\tFILE CONTENT (${count})\n####################\n\n";
                  batcat --theme=ansi --paging=never --show-all --color=always --style=full "${c}";
                  echo -e "\n####################\nFILE COMPLETED\n####################\n";
                done;
              fi;
            else
              echo -e "\n####################\n::warning::PATTERN MATCH FINISHED SEARCHING NO ${{ inputs.pattern }} FOUND\n####################\n";
            fi;
          done;
          echo -e "\nScanning Completed!\nPattern Locator\nExiting...\n";
        else
          echo '| Runtime |';
          matches=${matched2};
          if [[ ${matches} ]]; then
            counter=$( echo "${matches}" | rg -c "${{ inputs.pattern }}" );
            echo -e "\n####################\n (${counter}) CONTENT MATCH(S) FOUND IN FILE(S)\n####################\n";
            echo -e "\n${matches}\n";
            if ${{ inputs.content }}; then
              echo '| Runtime |';
              content=${content2};
              for c in ${content[@]}; do
                count=$((file_count++));
                echo -e "\n####################\n\tFILE PATH (${count})\n####################\n";
                echo -e "\n$(dirname ${c})\n":
                echo -e "\n####################\n\tFILE CONTENT (${count})\n####################\n\n";
                batcat --theme=ansi --paging=never --show-all --color=always --style=full "${c}";
                echo -e "\n####################\nFILE COMPLETED\n####################\n";
              done;
            fi;
          else
            echo -e "\n####################\n::warning::PATTERN MATCH FINISHED SEARCHING NO ${{ inputs.pattern }} FOUND\n####################\n";
          fi;
          echo -e "\nScanning Completed!\nPattern Locator\nExiting...\n";
        fi;
      shell: bash
      continue-on-error: true

    - name: Directory Contains
      if: inputs.filename != '' && inputs.content != 'false'
      run: |
        echo ''
        check_file=$(dirname $(sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "${{ inputs.filename }}"));
        file_count=$(sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) | wc -l);
        if [[ ${{ env.file_found }} != 0  ]]; then
          echo -e "\n####################\nNOTE: Contents found in directory for $(echo ${{ inputs.filename }} | sed 's/[\/\$]//g')\n####################\n";
          ls -Shap "${check_file}";
          echo -e "\n[CLONED REPOSITORY] Total Files: ${file_count}\n";
        fi;
      shell: bash
      continue-on-error: true

    - name: Cleanup Artifacts Report
      if: inputs.report != 'false'
      run: |
        echo '';
        set +e
        min_size_bytes=$((25 * 1024 * 1024));
        filename1="${GITHUB_WORKSPACE}/${{ env.repository }}_project.log";
        filename2="${GITHUB_WORKSPACE}/${{ inputs.filename }}_error.log";
        if [[ -s "${filename1}" ]]; then
          filesize1=$(sudo stat -c%s "${filename1}" 2>/dev/null);
          ansi2txt "${filename1}" > "${filename1}.tmp";
          mv -vf "${filename1}.tmp" "${filename1}";
          if (( filesize1 > min_size_bytes )); then
            split -b 25M "${filename1}" 'part_'
            echo "file1_parted=1" >> "${GITHUB_ENV}";
          fi;
        fi;
        if [[ -s "${filename2}" ]]; then
          filesize2=$(sudo stat -c%s "${filename2}" 2>/dev/null);
          ansi2txt "${filename2}" > "${filename2}.tmp";
          mv -vf "${filename2}.tmp" "${filename2}";
          if (( filesize2 > min_size_bytes )); then
            split -b 25M "${filename2}" 'part_'
            echo "file2_parted=1" >> "${GITHUB_ENV}";
          fi;
        fi;
      shell: bash
      continue-on-error: true
      
    - name: Repository Update
      if: env.update == 'true' && env.file_fixed == 1
      run: |
        echo '';
        error_log="${GITHUB_WORKSPACE}/${{ inputs.filename }}_error.log";
        repair_date="$(date +%Y%m%d)";
        repository=$(sudo find ${GITHUB_WORKSPACE} -type d -name ".git" -print -quit);
        if [[ -d ${repository} ]]; then
          process_input() {
            while IFS= read -r log; do
              if [[ ${{ inputs.output == 1 }} ]]; then
                echo "$log" | tee -a "${error_log}";
              elif [[ ${{ inputs.output == 2 }} ]]; then
                echo "$log" >> "${error_log}";
              elif [[ ${{ inputs.output == 3 }} ]]; then
                echo "$log";
              fi;
            done;
          }
          cd "${repository%/*}";
          if ${{ inputs.project }}; then
            git config --global --add safe.directory .
          fi;
          git config --global user.name "${{ github.actor }}";
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com";
          git config --global credential.helper store
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git add .
          git commit -m "check-file-action repaired errors in ${{ inputs.filename }} file(s)";
          git push origin "${{ github.ref }}";
          if [[ ${PIPESTATUS[0]} == 0 ]] || [[ ${PIPESTATUS[1]} == 0 ]]; then
            echo -e "\n####################\nCHECK FILE UPDATED REPOSITORY\n####################\n";
            echo -e "\n####################\nUPDATED FILE(S) LIST:\n####################\n";
            git diff --name-only @{push}@{1} @{push} | process_input;
            echo -e "\n\t########## ${repair_date} ##########\n";
          else
            echo -e "\n####################\nCHECK FILE COULD NOT UPDATED REPO FILE(S)\n####################\n";
            echo 'Retrying again after git fetches branch';
            git fetch origin "${{ github.ref }}";
            git add .
            git commit -m "check-file-action repaired errors in ${{ inputs.filename }} file(s)";
            git push origin "${{ github.ref }}";
            if [[ ${PIPESTATUS[0]} == 0 ]] || [[ ${PIPESTATUS[1]} == 0 ]]; then
              echo -e "\n####################\nCHECK FILE UPDATED REPOSITORY\n####################\n";
              echo -e "\n####################\nUPDATED FILE(S) LIST:\n####################\n";
              git diff --name-only @{push}@{1} @{push} | process_input;
              echo -e "\n\t########## ${repair_date} ##########\n";
              if ${{ inputs.project }}; then
                git status | process_input 2>/dev/null;
              fi;
            else
              echo 'Was git push event successful status ? unknown';
            fi;
          fi;
        else
          echo -e "\n####################\nCHECK FILE CANT FIND (.git) DIR FOR UPDATING\n####################\n";
        fi;
      shell: bash
      continue-on-error: true

    - name: Uploading ${{ github.repository }} Project Build Release
      if: inputs.build != 'false' && inputs.project != 'false' && env.build_files == 1
      uses: softprops/action-gh-release@v1
      with:
        files: build/*
        name: Check File Action Build Report For ${{ github.repository }} Repository.
        tag_name: ${{ github.run_id }}
      continue-on-error: true

    - name: Uploading build_cache Checked Report Artifacts
      if: inputs.report != 'false' && inputs.filename != '' && env.file_found == 1 && inputs.stored == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Cppcheck Checked File(s) Report Artifacts
        path: build_cache
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ inputs.filename }} Error Report Artifact
      if: inputs.report != 'false' && inputs.filename != '' && env.file_found == 1
      uses: actions/upload-artifact@v4
      with:
        name: Checked ${{ inputs.filename }} File(s) Report
        path: ${{ inputs.filename }}_error.log
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ env.repository }} Project Report Artifact
      if: inputs.report != 'false' && inputs.project != 'false' && env.check_build != 'false'
      uses: actions/upload-artifact@v4
      with:
        name: Clang ${{ env.filetype }} File(s) Report
        path: ${{ env.repository }}_project.log
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ inputs.filename }} Error Report Artifacts
      if: inputs.report != 'false' && inputs.filename != '' && env.file_found == 1 && env.file2_parted == 1
      uses: actions/upload-artifact@v4
      with:
        name: Checked ${{ inputs.filename }} File(s) Split Report
        path: part_*
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ github.repository }} Project Report Artifacts
      if: inputs.report != 'false' && inputs.project != 'false' && env.check_build == 'true' && env.file1_parted == 1
      uses: actions/upload-artifact@v4
      with:
        name: Clang ${{ env.filetype }} File(s) Split Report
        path: part_*
        include-hidden-files: true
      continue-on-error: true

    - name: Delete Files
      if: inputs.filename != '' || inputs.pattern != '' || inputs.project != 'false'
      run: |
        date
        if [[ -f "${GITHUB_WORKSPACE}/${{ env.repository }}_project.log" ]]; then
          echo -e "\nPROJECT: $(rm -vf ${GITHUB_WORKSPACE}/${{ env.repository }}_project.log)\n";
        fi;
        if [[ -f "${GITHUB_WORKSPACE}/${{ inputs.filename }}_error.log" ]]; then
          echo -e "\nLOGFILE: $(rm -vf ${GITHUB_WORKSPACE}/${{ inputs.filename }}_error.log)\n";
        fi;
        if [[ -f "${GITHUB_WORKSPACE}/database" ]]; then
          echo -e "\nDATABASE: $(rm -vf ${GITHUB_WORKSPACE}/database)\n";
        fi;
      shell: bash
      continue-on-error: true

    - name: Action Check
      if: inputs.filename == '' && inputs.pattern == '' && inputs.project != 'true'
      run: |
        echo ''
        echo -e "\n::error::No input provided to • filename: none • pattern: none • project: false\n\tNothing To Do! ?\n";
      shell: bash
      continue-on-error: true

    - name: Exiting
      run: |
        echo '';
        export TERM=xterm-256color
        if [[ -n ${TERM} ]]; then
          center_text() {
            local text="$1";
            local term_cols="$(tput cols)";
            local text_length="${#text}";
            if [[ -n $(node ${{ github.action_path }}/scripts/mobile.js 2>/dev/null) ]] || [[ -n $(node ${{ github.action_path }}/scripts/view.js 2>/dev/null) ]]; then
              local padding="$(( (term_cols - text_length) / 2 ))";
              local text="$(echo $1 | tr -d '\n')";
              print '';
              printf "%*s%s\n" "${padding}" "" "${text}"
              print '';
            else
              echo -e "${text}"
            fi;
          }
        fi;
        texta="######################";
        textb="\033[1m# CHECK FILE EXITING #\033[0m";
        textc="######################";
        center_text "\n${texta}";
        center_text "${textb}";
        center_text "${textc}\n";
      shell: bash
      continue-on-error: true
