              --jobs "$(nproc)" \
              --print-steps \
              -b "source ${envsetup} && lunch ${{ inputs.makefile }} && $make ${{ env.filename }} -j$(nproc --all) -k" \
              2>&1 | process_input || echo -e "\n::notice::CodeChecker check exit-code ($?)" | process_input;
          elif [[ "${envsetup}" ]]; then
