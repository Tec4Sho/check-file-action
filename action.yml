            text "\n${text3a}";
            text "${text3b}";
            text "${text3c}";
          else
            text "\n${text4a}";
            text "${text4b}";
            text "${text4c}";
            date '+%Y%m%d' > "${repaired}" || echo -e "::warning::${repaired} backup file not found";
          fi;
        fi;
        if ${{ inputs.database == 'true' }}; then
          if ${{ inputs.root == 'true' }}; then
            sudo find "/" -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -xdev -type f -print | sort -t/ -k1.2 > 'database';
          else
            find "${base}" -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -type f -print | sort -t/ -k1.2 > 'database';
          fi;
          if [[ -s 'database' ]]; then
            text "\n${text5a}";
            text "${text5b}";
            text "${text5c}";
            echo 'database=database' >> "${GITHUB_ENV}";
          else
            text "\n${text5a}";
            text "${text6}";
            text "${text5c}";
          fi;
        fi;
        if ${{ env.filename != '' }} && ${{ inputs.build == '0' }}; then
          text "\n${text7a}";
          text "${text7b}";
          text "${text7c}";
        fi;
        if ${{ inputs.pattern != '' }} && ${{ inputs.filetype != '' }}; then
          text "\n${text8a}";
          text "${text8b}";
          text "${text8c}";
        elif ${{ inputs.pattern != '' }}; then
          text "\n${text9a}";
          text "${text9b}";
          text "${text9c}";
        fi;
        if ${{ inputs.dirpath != '' }} && ${{ env.filename != '' }} && ${{ inputs.build == '0' }}; then
          text "\n${text10a}";
          text "${text10b}";
          text "${text10c}";
        elif ${{ inputs.dirpath != '' }} && ${{ env.filename != '' }} && ${{ inputs.build > '0' }}; then
          text "\n${text10d}";
          text "${text10e}";
          text "${text10f}";
        fi;
        if ${{ inputs.project == 'true' }} && ${{ env.filename != '' }} && ${{ inputs.analyzer > '0' }}; then
          text "::warning:: project:true and filename:set both enabled auto sets analyzer:0 to disable\nTo remove this warning use ( analyzer: 0 )\n";
          echo "analyzer=0" >> "${GITHUB_ENV}";
        else
          echo "analyzer=${{ inputs.analyzer }}" >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.repository == 'false' }} && ${{ inputs.dirpath != '' }}; then
          echo -e "\nRepository auto clone disabled checking all project files in: ${GITHUB_WORKSPACE}";
        fi;
        source_dirs=$(ls);
        type_count=0
        total_files=$(find -type f | grep -v '\.git/.' | wc -l);
        file_type0=$(find -type f -name "*.${{ inputs.filetype }}" | grep -v '\.git/.' | wc -l);
        file_type1=$(find -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.c++' -o -name '*.tpp' \) | grep -v '\.git/.' | wc -l);
        file_type2=$(find -type f \( -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.h++' \) | grep -v '\.git/.' | wc -l);
        percentage0=$(echo "scale=2; (${file_type0:-0} / ${total_files:-0}) * 100" | bc);
        percentage1=$(echo "scale=2; (${file_type1:-0} / ${total_files:-0}) * 100" | bc);
        percentage2=$(echo "scale=2; (${file_type2:-0} / ${total_files:-0}) * 100" | bc);
        include_dirs=$(find -type d -name 'include' -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | wc -l);
        file_count() {
          fdfind -j "$(nproc)" --type file . | grep -iEo '\_[[:alnum:]]+$|\-[[:alnum:]]+$|\.[[:alnum:]]+$|[[:alnum:]]+$' | tr -d '_\-\.' | sort | uniq -c | sed 's/^ *//' | while IFS= read -r file; do
            echo "${file} files";
          done;
        }
        directory() {
          while IFS= read -r dir; do
            if [[ -d "${dir}" ]]; then
              count=$(find "${dir}" -type f | wc -l);
              echo "${dir}: ${count} files";
            fi;
          done <<< "${source_dirs[@]}";
        }
        file_types() {
          type_count=0
          while IFS= read -r file; do
            type_count=$(expr ${type_count} + 1);
          done < <(file_count);
          echo "${type_count}";
        }
        if ${{ inputs.content == 'true' }}; then
          if [[ "$(directory)" ]]; then
            echo -e "\n#####################\nProject Source Directories:\n#####################\n\n$(directory)";
          fi;
          if [[ "$(file_count)" ]]; then
            echo -e "\n#####################\nProject File Types:\n#####################\n\n$(file_count)";
          fi;
          if [[ "$(file_types)" ]]; then
            echo -e "\n#####################\nDifferent File Types: \033[1m$(file_types)\033[0m\n#####################";
          fi;
          if [[ "${include_dirs}" ]]; then
            echo -e "\n#####################\nTotal Include Directories: \033[1m${include_dirs}\033[0m\n#####################";
          fi;
          if [[ "${total_files:-0}" > '0' ]] && ${{ inputs.filetype != '' }}; then
            echo -e "\nThe total percentage of ${{ inputs.filetype }} files is: \033[1m${percentage0:-0}%\033[0m";
            echo -e "\nThe total percentage of header files is: \033[1m${percentage2:-0}%\033[0m";
            echo -e "\n#####################\nRepository: \033[1m${repo}\033[0m\n#####################\n\nProject has \033[1m${total_files}\033[0m files total";
          elif [[ "${total_files:-0}" > '0' ]]; then
            echo -e "\nThe total percentage of c/c++ files is: \033[1m${percentage1:-0}%\033[0m";
            echo -e "\nThe total percentage of header files is: \033[1m${percentage2:-0}%\033[0m";
            echo -e "\n#####################\nRepository: \033[1m${repo}\033[0m\n#####################\n\nProject has \033[1m${total_files}\033[0m files total";
          else
            echo -e "\n#####################\n::warning::Repository: ${{ inputs.dirpath }} has no ${{ inputs.filetype }} files build only?! continuing....\n#####################\n";
          fi;
        fi;
        text "\n${text11a}" 2>/dev/null;
        text "${text11b}" 2>/dev/null;
        text "${text11c}\n" 2>/dev/null;
      shell: bash
      continue-on-error: true

    - name: Linux Project Includes
      if: ( inputs.project == 'true' || env.filename != '' ) && inputs.pattern == ''
      run: |
        source ~/.bashrc
        set +e
        [[ -n "${LINUXINCLUDE}" ]] && echo -e "\nUSER INCLUDE CHECK: ${USERINCLUDE}\nLINUX INCLUDE CHECK: ${LINUXINCLUDE}";
        srctree="${GITHUB_WORKSPACE}";
        objtree="${srctree}";
        hdr_arch="${{ env.arch }}";
        if ${{ inputs.internal == 'true' }}; then
          ${{ inputs.dirname != '' }} && srctree="${GITHUB_WORKSPACE}/${{ inputs.dirname }}" && objtree="${GITHUB_WORKSPACE}/${{ inputs.dirname }}";
          LINUXINCLUDE="-I${srctree}/arch/${hdr_arch}/include \
        -I${objtree}/arch/${hdr_arch}/include/generated/uapi \
        -I${objtree}/arch/${hdr_arch}/include/generated \
        -I${objtree}/include \
        -I${srctree}/drivers/misc/mediatek/include";
          USERINCLUDE="-I${srctree}/arch/${hdr_arch}/include/uapi \
        -I${objtree}/arch/${hdr_arch}/include/generated/uapi \
        -I${srctree}/include/uapi \
        -I${objtree}/include/generated/uapi \
        -include ${srctree}/include/linux/kconfig.h";
        KBUILD_OPT="";
          if [[ -n "${KBUILD_SRC}" ]]; then
            KBUILD_OPT="-I${srctree}/include";
          fi;
          ${{ inputs.content == 'true' }} && echo -e "\nUSERINCLUDE: ${USERINCLUDE//$'\n'/ }" | tr ' ' '\n' && echo -e "\nLINUXINCLUDE: ${LINUXINCLUDE//$'\n'/ }" | tr ' ' '\n';
        else
          if [[ -n "${KBUILD_SRC}" ]]; then
            KBUILD_OPT="-I${srctree}/include";
          fi;
          LINUXINCLUDE="-I/usr/src/linux-headers-$(uname -r)/include";
          USERINCLUDE="-I${srctree}/arch/${hdr_arch}/include/uapi";
          ${{ inputs.content == 'true' }} && echo -e "\nUSERINCLUDE: ${USERINCLUDE// /}" && echo -e "\nLINUXINCLUDE: ${LINUXINCLUDE// /}";
        fi;
        if ${{ inputs.project == 'true' }} && ${{ inputs.internal == 'true' }} && ${{ env.arch == 'arm' }} && [[ -n "${LLVM_PATH}" ]]; then
          echo -e "\nLLVM_ARM_PATH: ${LLVM_PATH}";
          echo -e "LLVM_ARM_TOOLCHAIN: ${LLVM_TOOLCHAIN}";
        fi;
        echo "USERINCLUDE=${USERINCLUDE}" >> "${GITHUB_ENV}";
        echo "LINUXINCLUDE=${LINUXINCLUDE}" >> "${GITHUB_ENV}";
        echo "export srctree=${srctree}" | sudo tee -a ~/.bashrc >/dev/null;
        echo "export objtree=${objtree}" | sudo tee -a ~/.bashrc >/dev/null;
        echo "export hdr_arch=${hdr_arch}" | sudo tee -a ~/.bashrc >/dev/null;
        echo "export USERINCLUDE=${USERINCLUDE}" | sudo tee -a ~/.bashrc >/dev/null;
        echo "export LINUXINCLUDE=${LINUXINCLUDE}" | sudo tee -a ~/.bashrc >/dev/null;
        if ${{ inputs.internal == 'true' }}; then
          LINUXINCLUDE="${LINUXINCLUDE//  /}";
          LINUXINCLUDE="${LINUXINCLUDE//$'-I'/:}";
          LINUXINCLUDE="${LINUXINCLUDE#:}";
          USERINCLUDE="${USERINCLUDE//  /}";
          USERINCLUDE="${USERINCLUDE//$'-I'/:}";
          USERINCLUDE="${USERINCLUDE#:}";
          echo "export C_INCLUDE_PATH=${LINUXINCLUDE}${USERINCLUDE}:${C_INCLUDE_PATH}" | sudo tee -a ~/.bashrc >/dev/null;
          echo "export CPLUS_INCLUDE_PATH=${LINUXINCLUDE}${USERINCLUDE}:${CPLUS_INCLUDE_PATH}" | sudo tee -a ~/.bashrc >/dev/null;
        fi;
        config=$(find "${{ env.base }}" -type f -path '*/config/*' -name 'kernel.release' | grep . || sudo find "/usr/src" -xdev -type f -name 'kernel.release' -print);
        if [[ "${config}" ]] && ${{ inputs.content == 'true' }}; then
          export PATH="$PATH";
          echo -e "\n####################\nSystem Binary Paths: ${PATH}\n####################";
          echo -e "\nLINUXKERNEL RELEASES:";
          sudo less $(echo -n ${config});
          release1="$(sudo less $(echo -n ${config}) | awk 'NR==1')";
          release2="$(sudo less $(echo -n ${config}) | awk 'NR==2')";
          release3="$(sudo less $(echo -n ${config}) | awk 'NR==3')";
          [[ -n "${release1}" ]] && echo "release1=${release1}" >> "${GITHUB_ENV}";
          [[ -n "${release2}" ]] && echo "release2=${release2}" >> "${GITHUB_ENV}";
          [[ -n "${release3}" ]] && echo "release3=${release3}" >> "${GITHUB_ENV}";
        fi;
        echo '';
      shell: bash
      continue-on-error: true

    - name: Source Includes Fixer A
      if: inputs.source == '1' || inputs.source == '2'
      run: |
        echo '';
        set +e
        start_time="${SECONDS}";
        file_name="${{ env.filename }}";
        file_type="${file_name##*.}";
        repository=${{ github.event.repository.name }};
        project_log="${repository}_project.log";
        export LC_ALL=C
        export LS_COLORS=true
        SAVEIFS="${IFS}";
        include_missing=1
        include_count=1
        include_total=1
        include_dirs=1
        file_count=1
        count1=0
        count2=0
        count3=0
        count4=0
        count5=0
        checked=false
        source_include=false
        includes_found=false
        include1='include-file1.txt';
        include_list='check-file-sources.txt';
        name_count_file='name-count-file.txt';
        include_count_file='include-count-file.txt';
        github="${GITHUB_WORKSPACE}";
        process_input() {
          case "${{ inputs.output }}" in
            1) tee -a "${project_log}" ;; # Show in console AND save
            2) cat >> "${project_log}" ;;  # Save only (append)
            3) cat ;;                   # Show in console only
            4) cat >/dev/null ;;        # Completely silent
            *) cat ;;                   # Default fallback
          esac
        }
        if ${{ inputs.absolute == 'true' }}; then
          abs='--absolute-path';
        else
          abs='--relative-path';
        fi;
        echo -e "####################\n\t\033[33mPROGRESSIVE SCAN MODE\033[0m\n####################" | process_input;
        include_files1=$(fdfind -p -c auto "${abs}" -e "${{ inputs.filetype }}" "${{ env.base }}" -j "$(nproc)" | gawk -F'/' '{print $NF, $0}' | sort -k1,1 | cut -d' ' -f2-);
        include_files2=$(fdfind -p -c auto "${abs}" -e "${{ inputs.filetype }}" "${{ env.base }}" -j "$(nproc)" | xargs -r rg --sort=path --trim -H -o '^#include[[:space:]]+[<].*[>]' | tr -d '<>' | gawk '{ print $NF, $0 }' | sort -k1,1 -us | cut -d' ' -f2-);
        [[ -f "${include_list}" ]] && mv -f "${include_list}" "${include_list}.old";
        [[ -f "${include1}" ]] && rm -f "include-file*.txt";
        [[ -f "${name_count_file}" ]] && rm -f "${name_count_file}";
        [[ -f "${include_count_file}" ]] && rm -f "${include_count_file}";
        if [[ "${{ inputs.filetype }}" == [c]* ]] && ${{ inputs.source == '1' }} && [[ "${include_files1}" ]]; then
          declare -A processed
          declare -A missing
          echo -e "\n\033[32m\033[1mCHECK-FILE:\033[0m discovered include objectives running full scan now: \033[0m\033[1mContent Display\033[0m  [\033[1m verbose \033[0m]" | process_input;
          echo -e "\n####################\n\033[1mCHECK-FILE:\033[0m Auto Fix Sources Include [ Status: \033[32mAnalzying\033[0m ]\n####################" | process_input;
          while IFS= read -r file; do
            include_count=1
            count1=$((file_count++));
            echo -e "\n####################\n\t\033[33mSOURCE FILE\033[0m ( ${count1} )\n####################" | process_input;
            echo -e "\nSource File Location: ${file}" | process_input;
            echo -e "\nAnalyzing Includes Source File ${count1}: ${file##*/}" | process_input;
            if ${{ inputs.include == 'true' }}; then
              includes_found=false
              include_source=$( { rg --sort=path --trim -o '^#include[[:space:]]+["].*["]' "${file}" 2>/dev/null || true; } | gawk '{print $2}' | tr -d '"' | sort -u);
              if [[ "${include_source}" ]]; then
                echo -e "\n\tuser include file objectives:\n\n${include_source}" | process_input;
                while IFS= read -r include; do
                  if [[ "${include}" == *.[ch]* ]] && [[ ! "${processed[$include]}" ]]; then
                    processed["$include"]=1
                    path1="${include##*./}";
                    path2="${path1##[:]*}";
                    path3="${path2%'\n'}";
                    path4="${path3%\\}";
                    clean_path="${path4}";
                    file1="${include##*./}";
                    file2="${file1##[:]*}";
                    file3="${file2%'\n'}";
                    file4="${file3%\\}";
                    clean_file="${file4##*/}";
                    if [[ ${include} == *"/"* ]]; then
                      header=$(fdfind "${abs}" -p -t f -g "**/${clean_path4##*./}" "${{ env.base }}");  
                    else
                      header=$(fdfind "${abs}" -p -t f -g "**/${clean_file}" "${file%/*}");
                    fi;
                    if [[ -n "${header}" ]]; then
                      while IFS= read -r includes; do
                        count2=$((include_count++));
                        count3=$((include_total++));
                        echo "${includes%/*/*}" >> "${include1}";
                        echo -e "\n\033[33mSource file #include \033[0m\033[1m( ${includes##*/} )\033[0m\033[33m is located!\033[0m  [ ✅ ]\n\n\033[32mREAL FILE LOCATION:\033[0m ${includes}" | process_input;
                      done <<< "${header}";
                      includes_found=true
                    elif [[ -n "${missing[$include]}" ]]; then
                      echo -e "\n\033[33mSource file #include \033[0m( ${include} )\033[33m already listed missing!\033[0m  [\033[1m skipped \033[0m]" | process_input;
                      includes_found=false      
                    else
                      includes_found=false
                      missing["${include}"]=1
                      count5=$((include_missing++));
                      echo -e "\n::notice::\033[31mSource file #include \033[0m( ${file4##+(*./)} )\033[31m is missing!?\033[0m  [ ❌ ]" | process_input;
                    fi;
                  elif [[ -n "${processed[$include]}" ]]; then
                    echo -e "\n\033[34mSource file #include \033[0m( ${include} )\033[34m already added to includes list!\033[0m  [\033[1m skipped \033[0m]" | process_input;  
                  fi;
                done <<< "${include_source}";
              fi;
              if [[ "${includes_found}" ]]; then
                echo -e "\n${count2}\033[32m include file objectives confirmed added after scanning file: \033[0m\033[1m${file##*/}\033[0m  [ ✅ ]" | process_input;
              elif [[ -z "${include_source}" ]]; then
                echo -e "\n\033[33mNo include file objectives confirmed after scanning file: \033[0m\033[1m${file##*/}\033[0m  [ 🚫 ]" | process_input;
              else
                echo -e "\n${count5}\033[33m include file objectives confirmed missing after scanning file: \033[0m\033[1m${file##*/}\033[0m  [ ❌ ]" | process_input;
              fi;  
            fi;
          done <<< "${include_files1}";
          if [[ -s "${include1}" ]]; then
            awk '!seen[$0]++' "${include1}" > "${include_list}";
          fi;
          if [[ -s "${include_list}" ]]; then
            count4=$(awk 'NF > 0 { count++ } END { print count }' "${include_list}");
          fi;
          echo -e "\n::notice::\033[32mTotal source file checked during scan\033[0m\033[1m ${count1}\033[0m" | process_input;
          if [[ "${includes_found}" ]]; then
            echo 'check_build=true' >> "${GITHUB_ENV}";
            echo -e "\n::notice::\033[34mTotal include source file added during scan\033[0m\033[1m ${count3}\033[0m\n[Hint] \033[1m${count4}\033[0m included directories added after duplicate cleaning!!!\033[0m\nSet option (\033[1m cache: true \033[0m) to use this list for source include checks without manually downloading an adding the file to your repo\n With cache you should set (\033[1m source: 0 \033[0m)running sources again each check!" | process_input;
          else
            echo -e '\n::notice::\033[31mNo include objectives discovered or \033[1mCHECK-FILE:\033[0m encountered an issue!!!\033[0m' | process_input;
          fi;
          if [[ "${count5}" > '0' ]]; then
            echo -e "\n::notice::\033[34m⚠️ Total include source files missing during scan\033[0m\033[1m ${count5}\033[0m\n[Hint] Many source files may call these \033[31mmissing include files.\nYou may need to remove the missing include file objectives or added the file before compiling!!!" | process_input;
          fi;
          unset processed;
          unset missing;
          [[ -s "${include_list}" ]] && mkdir -p build && echo -e "\nSaving list to build: $(cp -vf ${include_list} build/)" | process_input;
          seconds=$((SECONDS - start_time));
          m=$((seconds / 60));
          s=$((seconds % 60));
          printf "Project Auto Include Runtime: %d minutes and %d seconds\n" "$m" "$s" | process_input;
        elif [[ "${{ inputs.filetype }}" == [c]* ]] && ${{ inputs.source == '2' }} && [[ "${include_files2}" ]]; then
          echo -e "\n\033[32m\033[1mCHECK-FILE:\033[0m discovered include objectives running full scan now: \033[0m\033[1mContent Display\033[0m  [\033[33m medium \033[0m]" | process_input;
          echo -e "\n####################\n\033[1mCHECK-FILE:\033[0m Auto Fix Sources Include [ Status: \033[32mAnalzying\033[0m ]\n####################" | process_input;
          echo > "${name_count_file}";
          declare -A processed
          while IFS= read -r file; do         
            name="${file%%:*}";
            name_count="${name##*/}";
            if [[ $(grep -s "${name_count}" "${name_count_file}") ]]; then
              echo -e "\nAnalyzing Source File: ${name##*/}" | process_input;
            else
              count1=$((file_count++));
              echo "${name_count}" >> "${name_count_file}";
              echo -e "\n####################\n\t\033[33mSOURCE FILE\033[0m ( ${count1} )\n####################" | process_input;
              echo -e "\nSource File Location: ${file%%:*}" | process_input;
              echo -e "\nChecking include objective in source file: ${name##*/}  [ \033[1m${count1}\033[0m ]" | process_input;
            fi;
            includes_found=false
            include_source=$(echo "${file}" | awk '{print $2}');
            if [[ "${include_source}" ]]; then
              includes_found=true
              echo -e "\n\tinclude source: ${include_source}" | process_input;
              if [[ "${include_source}" == *.[h]* ]]; then
                path1="${include_source##*./}";
                path2="${path1##[:]*}";
                path3="${path2%'\n'}";
                path4="${path3%\\}";
                clean_path="${path4}";
                file1="${include_source##*./}";
                file2="${file1##[:]*}";
                file3="${file2%'\n'}";
                file4="${file3%\\}";
                clean_file="${file4##*/}";
                if [[ ${include_source} == *"/"* ]]; then
                  header=$(fdfind -p "${abs}" -t f -g "**/${clean_path##*./}" "${{ env.base }}");
                else
                  header=$(fdfind -p "${abs}" -t f -g "**/${clean_file}" "${{ env.base }}");
                fi;
                includes_missing=false
                if [[ -n "${header}" ]]; then
                  while IFS= read -r includes; do
                    count2=$((include_count++));
                    count3=$((include_total++));
                    echo "${includes%/*/*}" >> "${include1}";
                    echo -e "\n\033[33mSource file include \033[0m\033[1m( ${includes##*/} )\033[0m\033[33m is located!\033[0m  [ ✅ ]\n\n\033[32mREAL FILE LOCATION:\033[0m ${includes}" | process_input;
                  done <<< "${header}";
                elif [[ -n "${processed[$include_source]}" ]]; then
                  echo -e "\n\033[33mSource file #include \033[0m( ${include_source} )\033[33m already listed missing!\033[0m  [\033[1m skipped \033[0m]" | process_input;        
                else
                  includes_missing=true
                  processed["${include_source}"]=1
                  count5=$((include_missing++));
                  echo -e "\n::notice::\033[31mSource file include \033[0m( ${file4##+(*./)} )\033[31m is missing!?\033[0m  [ ❌ ]" | process_input;
                fi;
              fi;                     
            fi;
            if [[ "${includes_found}" == 'true' ]]; then
              echo -e "\n${count2}\033[32m includes successfully added after scanning file: \033[0m\033[1m${name##*/}\033[0m  [ ✅ ]" | process_input;
              source_include=true
            elif [[ "${includes_missing}" == 'true' ]]; then
              echo -e "\n\033[32m\033[1mCHECK-FILE:\033[0m discovered missing include objective after scanning file: \033[0m\033[1m${name##*/}\033[0m  [ ❌ ]" | process_input;
            elif [[ -z "${include_source}" ]]; then
              echo -e "\n\033[32m\033[1mCHECK-FILE:\033[0m discovered no include objective after scanning file: \033[0m\033[1m${name##*/}\033[0m  [ 🚫 ]" | process_input;
            fi;
          done <<< "${include_files2}";
          if [[ -s "${include1}" ]]; then
            awk '!seen[$0]++' "${include1}" > "${include_list}";
          fi;
          if [[ -s "${include_list}" ]]; then
            count4=$(awk 'NF > 0 { count++ } END { print count }' "${include_list}");
          fi;
          echo -e "\n::notice::\033[32mTotal source files checked during scan\033[0m\033[1m ${count1}\033[0m" | process_input;
          if [[ "${includes_found}" ]]; then
            echo 'check_build=true' >> "${GITHUB_ENV}";
            echo -e "\n::notice::\033[34mTotal include source file added during scan\033[0m\033[1m ${count3}\033[0m\n[Hint] \033[1m${count4}\033[0m included directories added after duplicate cleaning!!!\033[0m\nSet option (\033[1m cache: true \033[0m) to use this list for source include checks without manually downloading an adding the file to your repository\nWith caching you should then set (\033[1m source: 0 \033[0m) before checking sources again!" | process_input;
          else
            echo -e '\n::notice::\033[31mNo include objectives discovered or \033[1mCHECK-FILE:\033[0m encountered an issue!!!\033[0m' | process_input;
          fi;
          if [[ "${count5}" > '0' ]]; then
            echo -e "\n::notice::\033[34m⚠️ Total include source files missing during scan\033[0m\033[1m ${count5}\033[0m\n[Hint] Many source files may call these \033[31mmissing include files.\nYou may need to remove the missing include file objectives or added the file before compiling!!!" | process_input;
