            [[ -n "${codechecker_analyzer1}" ]] && echo -e "\n####################\n\tCODECHECKER OPTIONS\n####################\nEnabled analyzer checks:\n${codechecker_analyzer1}" | process_input;
            codechecker_analyzer2=$(CodeChecker checkers --profile sensitive | gawk '/Status: enabled/{ print prev; }{ prev=$0; }' | gawk '{ printf "    %s\n", $0; }');
            [[ -n "${codechecker_analyzer2}" ]] && echo -e "\n####################\n\tCODECHECKER OPTIONS\n####################\nEnabled profile checks:\n${codechecker_analyzer2}" | process_input;
          fi;
          ${{ inputs.content == 'true' }} && echo -e "\n####################\n\tCLANG OPTIONS\n####################\n\n${clang_checks}" | process_input;
          echo -e "\n####################\nChecking Repository:\033[32m ${{ env.base }}\033[0m\n####################" | process_input;
          echo -e "\n####################\nChecking for ${file_type} files\n####################" | process_input;
          source_dirs() {
            find -not \( -path '*/.github' -prune -o -path '*/.git' -prune \) -type d -maxdepth 1 -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r dir; do
              if [[ "${dir}" != '.' ]]; then
                echo -n "${dir#./} ";
              fi;
            done;
          }
          cmake_includes() {
            include_source_count=0
            include_count_extra=0
            include_count=0
            if ${{ inputs.number > '0' }}; then
              file_count=${{ inputs.number }};
              echo "include_source=false" >> "${GITHUB_ENV}";
              include_source=false
            elif ${{ env.include_count > '1000' }}; then
              file_count=${{ env.include_count }};
              echo "include_source=true" >> "${GITHUB_ENV}";
