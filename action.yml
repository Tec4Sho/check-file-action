                fi;
                if ${{ inputs.number > '0' }}; then
                  if [[ "${{ inputs.number }}" -eq "${count}" ]]; then
                    echo -e "\nPattern checking auto stopped at: ${count} / ${content##*/}" | process_input;
                    break;
                  fi;
                fi;
                echo -e "\n####################\n::notice::PATTERN MATCHED SEARCHING COMPLETED SUCCESSFULLY! ✅\n####################";
              done <<< "${content2[@]}";
            fi;
          else
            echo -e "\n####################\n::warning::SEARCHING COMPLETED PATTERN NOT FOUND: ${{ inputs.pattern }} ❌\n####################";
          fi;
          echo -e "\nScanning Completed!\nPattern Locator\nExiting...\n";
        fi;
        seconds="$((SECONDS + start_time))";
        m=$((seconds / 60));
        s=$((seconds % 60));
        printf "Process Runtime: %d minutes and %d seconds\n" "$m" "$s";
      shell: bash
      continue-on-error: true

    - name: Directory Contains
      if: env.filename != '' && inputs.content == 'true' && inputs.build == '0'
      run: |
        source ~/.bashrc
        set +e
        file_name="${{ env.filename }}";
        file_type="${file_name##*.}";
        file_path='check_file_paths.txt';
        logfile="${{ env.filename }}_error.log"
        [[ -e "${{ env.filename }}_data.log" ]] && logfile="${{ env.filename }}_data.log";
        file_count=1
        count=0
        process_input() {
          while IFS= read -r output; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${output}" | tee -a "${logfile}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${output}" >> "${logfile}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${output}";
            elif ${{ inputs.output == '4' }}; then
              echo -e "${output}" >/dev/null;
            fi;
          done;
        }
        if ${{ inputs.absolute == 'true' }}; then
          path='--absolute-path';
        else
          path='--relative-path';
        fi;
        if ${{ env.file_found == '1' }}; then
          if [[ -s "${file_path}" ]]; then
            echo -e "\n####################\nNOTE: Contents found in directory for ${{ env.filename }} file(s)\n####################" | process_input;
            while IFS= read -r file; do
              count=$((file_count++));
              echo -e "\nSource File: \033[32m${file} / ${count}\033[0m\n\033[1mDirectory List:\033[0m" | process_input;
              ls -ShApX "${file%/*}" | gawk '{ printf "    %s\n", $0; }' | process_input;
              if ${{ inputs.number > '0' }}; then
                if [[ "${{ inputs.number }}" -eq "${count}" ]]; then
                  echo -e "\nFile checking auto stopped at: ${count} / ${file##*/}\n" | process_input;
                  break;
                fi;
              fi;
            done < "${file_path}";
          fi;
        fi;
      shell: bash
      continue-on-error: true

    - name: Project Finalized
      if: inputs.project == 'true' || env.filename != ''
      run: |
        source ~/.bashrc
        set +e
        start_time="${{ env.seconds }}";
        compiler_list=$(dpkg --list | grep compiler | tr -d 'ii');
        repository=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
        github=${GITHUB_WORKSPACE};
        data_log="${github}/${{ env.filename }}_data.log";
        error_log="${github}/${{ env.filename }}_error.log";
        project_log="${github}/${repository}_project.log";
        if [[ -s "${data_log}" ]]; then
          log_file="${data_log}";
        elif [[ -s "${error_log}" ]]; then
          log_file="${error_log}";
        else
          log_file="${project_log}";
        fi;
        cp "$project_log" build/
        source_include_list='check-file-includes.txt';
        check_build=false
        file_type='c';
        update=true
        fixed=false
        count=1
        process_input() {
          while IFS= read -r output; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${output}" | tee -a "${log_file}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${output}" >> "${log_file}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${output}";
            elif ${{ inputs.output == '4' }}; then
              echo -e "${output}" >/dev/null;
            fi;
          done;
        }
        if ${{ inputs.absolute == 'true' }}; then
          abs='--absolute-path';
        else
          abs='--relative-path';
        fi;
        if ${{ env.check_build == 'true' }}; then
          check_build=true
        fi;
        if ${{ env.file_found == '1' }}; then
          file_found=true
        fi;
        if ${{ inputs.update == 'false' }}; then
          echo 'update=false' >> "${GITHUB_ENV}";
          update=false
        fi;
        if ${{ inputs.filetype != '' }}; then
          file_type="${{ env.filename }}";
        fi;
        echo "filetype=${file_type}" >> "${GITHUB_ENV}";
        if [[ -s "${log_file}" ]] && ([[ "${check_build}" == 'true' ]] || [[ "${file_found}" == 'true' ]]); then
          echo -e "\n####################\n\t${log_file##*/} file found checking stats...\n####################" | process_input;
          deheader_duplicates=$(grep -aFc 'duplicates' "${log_file}");
          deheader_inclusion=$(grep -saFc 'inclusion' "${log_file}");
          deheader_removed=$(grep -saFc 'remove' "${log_file}");
          codechecker_defects=$(grep -sao 'Found [1-9] defect' "${log_file}" | cut -d ' ' -f2 | gawk '{ sum += $1 } END { print sum; }');
          codechecker_no_defects=$(grep -saFoc 'Found no defects' "${log_file}");
          codechecker_success=$(grep -saFc 'successfully' "${log_file}");
          codechecker_errors=$(grep -saFc 'Error while processing' "${log_file}");
          clang_replacements=$(grep -saF 'Replacements:' "${build_fixes}" | grep -vc '[\[\]]');
          clang_information=$(grep -saiFc 'information:' "${log_file}");
          clang_files_missing=$(grep -saEc 'file not found|Include file' "${log_file}");
          if ${{ env.include_missing == 'true' }}; then
            clang_files_list1=$(grep -saEo 'Include file:[[:space:]]+["].*["]' "${log_file}" | awk '{ print $3 }' | tr -d '"' | sort -u);
            clang_files_list2=$(grep -saEo 'Include file:[[:space:]]+[<].*[>]' "${log_file}" | awk '{ print $3 }' | tr -d '<>' | sort -u);
          else
            clang_files_list1=$(grep -saEo '#include[[:space:]]+["].*["]' "${log_file}" | awk '{ print $2 }' | tr -d '"' | sort -u);
            clang_files_list2=$(grep -saEo '#include[[:space:]]+[<].*[>]' "${log_file}" | awk '{ print $2 }' | tr -d '<>' | sort -u);
          fi;
          clang_warnings=$(grep -saEo '[1-9] warnings generated|1 warning generated' "${log_file}" | cut -d ' ' -f1 | gawk '{ sum += $1 } END { print sum; }');
          clang_error1=$(grep -saEo '[1-9] errors generated|1 error generated' "${log_file}" | cut -d ' ' -f1 | gawk '{ sum += $1 } END { print sum; }');
          clang_error2=$(grep -saiEc 'error:|#error' "${log_file}");
          clang_failed=$(grep -saiFc 'failed:' "${log_file}");
          clang_fixit1=$(grep -saiEc 'fixit|fix-its' "${log_file}");
          clang_fixit2=$(grep -saiF 'clang-tidy applied' "${log_file}");
          clang_notes=$(grep -saiFc 'note:' "${log_file}");
          located_count=0
          missing_count=0
          file_count=0
          filetype="${{ env.filename }}";
          if [[ -n "${clang_information}" ]] && [[ "${clang_information:-0}" > '0' ]] && ${{ inputs.analyzer == '3' }}; then
            echo -e "\n####################\n::notice::⚠️ check-file added ${clang_information}️ information notes on ${file_type} files checked. [Hints] Information addresses key issues that may have error fixes available.\n####################" | process_input;
          fi;
          if [[ -n "${clang_warnings}" ]] && [[ "${clang_warnings:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::⚠️ check-file found ${clang_warnings}️ warnings in ${file_type} files checked. [Hints] Try using [\033[1mwarnings-as-errors\033[0m] for possible errors.\n####################" | process_input;
          fi;
          if [[ -n "${codechecker_defects}" ]] && [[ "${codechecker_defects:-0}" > '0' ]] && (${{ inputs.analyzer == '4' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}); then
            echo -e "\n####################\n::notice::⚠️ check-file checked ${codechecker_defects} ${file_type} files with defects. [Hints] Check require for those files.\n####################" | process_input;
          fi;
          if [[ -n "${codechecker_no_defects}" ]] && [[ "${codechecker_no_defects:-0}" > '0' ]] && (${{ inputs.analyzer == '4' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}); then
            echo -e "\n####################\n::notice::✅ check-file checked ${codechecker_no_defects} ${file_type} files without defects. [Hints] No check require for those files.\n####################" | process_input;
          fi;
          if [[ -n "${codechecker_success}" ]] && [[ "${codechecker_success:-0}" > '0' ]] && (${{ inputs.analyzer == '4' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}); then
            echo -e "\n####################\n::notice::✅ check-file checked ${codechecker_success} ${file_type} files successfully without issues. [Hints] No check require for those files.\n####################" | process_input;
          fi;
          if [[ -n "${clang_error1}" ]] && [[ "${clang_error1:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::🚫 check-file found ${clang_error1} errors in ${file_type} files checked. [Hints] Try using a different [analyzer: 1, 2, or 4] for possible error fixes.\n####################" | process_input;
          fi;
          if [[ -n "${clang_error2}" ]] && [[ "${clang_error2:-0}" > '0' ]] && ${{ inputs.build > '0' }}; then
            echo -e "\n####################\n::notice::🚫 check-file found \033[31m${clang_error2}\033[0m errors in ${file_type} files checked. [Hints] Try using a different [analyzer: 1, 2, or 4] for possible error fixes.\n####################" | process_input;
          fi;
          if [[ -n "${clang_failed}" ]] && [[ "${clang_failed:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::⚠️ check-file found ${clang_failed}️ fails in all files checked during build. [Hints] This means your [\033[1mBuild failed\033[0m] from possible errors.\n####################" | process_input;
          fi;
          if [[ -n "${clang_fixit1}" ]] && [[ "${clang_fixit1:-0}" > '0' ]] && ${{ inputs.analyzer > '0' }}; then
            echo -e "\n####################\n::notice::✅ check-file applied ${clang_fixit1} fix-its to ${file_type} files checked. [Hints] Try using [update: true] for updating your remote repository with the fixes.\n####################" | process_input;
            fixed=true
          fi;
          if [[ -n "${clang_fixit2}" ]] && [[ "${clang_fixit2:-0}" > '0' ]] && ${{ inputs.analyzer > '0' }}; then
            echo -e "\n####################\n::notice::✅ ${clang_fixit2} To ${file_type} files checked. [Hints] Try using (update: true) for updating your remote repository with any fixed files.\n####################" | process_input;
            fixed=true
          fi;
          if [[ -n "${clang_notes}" ]] && [[ "${clang_notes:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::⚠️ check-file added ${clang_notes} notes on ${file_type} files checked. [Hints] Notes are fix suggestions for files that should be addressed before compiling.\n####################" | process_input;
          fi;
          if [[ -f "${build_fixes}" ]] && [[ "${clang_replacements:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::✅ check-file applied ${clang_replacements} clang replacement fixes for ${file_type} files checked. [Hints] Clang export fixes are stored in build/fixes.yaml for download. Try using different (analyzer: 1, 2, or 4) for more possible error fixes.\n####################" | process_input;
          fi;
          if [[ -n "${deheader_removed}" ]] && [[ "${deheader_removed:-0}" > '0' ]] && ${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}; then
            echo -e "\n####################\n::notice::✅ check-file removed ${deheader_removed} extra inclusions in ${file_type} file(s) checked. [Hints] Try manually removing any extra includes in files before compiling.\n####################" | process_input;
            fixed=true
          fi;
          if [[ -n "${deheader_duplicates}" ]] && [[ "${deheader_duplicates:-0}" > '0' ]] && (${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}); then
            echo -e "\n####################\n::notice::🚫 check-file found ${deheader_duplicates} duplicates or colliding inclusions in ${file_type} files checked. [Hints] Try using [analyzer: 1, 2, or 4] for possible error fixes.\n####################" | process_input;
          elif [[ -n "${deheader_inclusion}" ]] && [[ "${deheader_inclusion:-0}" > '0' ]] && (${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}); then
            echo -e "\n####################\n::notice::🚫 check-file found ${deheader_inclusion} extra inclusions in ${file_type} files checked. [Hints] Try using (update: true) if headers were fixed to update remote repository.\n####################" | process_input;
          fi;
          if [[ -n "${clang_files_missing}" ]] && [[ "${clang_files_missing:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::❌ check-file discovered ${clang_files_missing} calls to missing include files in all ${file_type} file(s) checked. [Hints] Files may be there yet not included an/or duplicate missing files. Check missing files list for exact files!!!\n####################" | process_input;
            [[ -n "${clang_files_list1}" ]] && echo -e "\n####################\nMISSING USER FILES LIST:\n####################\n\n${clang_files_list1}" | process_input && echo -e "\n####################\nCHECK-FILE AUTO LOCATE FILE MATCHES IN: ${{ env.base }}/${{ env.dirname }}\n####################\n" | process_input;
            declare -A missing
            declare -A located
            found=false
            while IFS= read -r missing_file; do
              if [[ "${missing_file}" == *.[ch]* ]]; then
                file_count=$((file_count + 1));
                echo -e "\n#################### Locating missing \033[1m${missing_file}\033[0m file ( ${file_count} ) ####################" | process_input;
                path1="${missing_file//\'/}";
                path2="${path1##[:]*}";
                path3="${path2%'\n'}";
                path4="${path3%\\}";
                clean_path="${path4##*./}";
                file1="${missing_file//\'/}";
                file2="${file1##[:]*}";
                file3="${file2%'\n'}";
                file4="${file3%\\}";
                clean_file="${file4##*/}";
                if [[ "${missing_file}" == *"/"* && "${clean_path}" != "/" ]]; then
                  locate=$(fdfind "${abs}" -p -t f -g "**/${clean_path//./\\.}" "${{ env.base }}");
                elif [[ -n "${clean_file}" ]]; then
                  locate=$(fdfind "${abs}" -p -t f -g "**/${clean_file//./\\.}" "${{ env.base }}");
                fi;
                if [[ -n "${locate}" ]]; then            
                  while IFS= read -r includes; do
                    located_count=$((located_count + 1));
                    echo -e "\n\033[32mUserInclude Source ${missing_file} Location:\033[0m ${includes}  [\033[1m ${located_count} / ✅ \033[0m]" | process_input;
                    echo "${includes%/*}" >> 'check-file-includes.txt';
                  done <<< "${locate[@]}";
                  includes_found=true
                elif [[ -n "${missing[$missing_file]}" ]]; then
                  includes_found=false
                  echo -e "\n\033[33mUserInclude Source file \033[0m( ${missing_file} )\033[33m already listed missing!\033[0m  [\033[1m skipped \033[0m]" | process_input;
                else
                  includes_found=false
                  missing["$missing_file"]=1
                  missing_count=$((missing_count + 1));
                  echo -e "\n\033[31mCannot locate missing user include file\033[0m ${missing_file}  [ ${missing_count} / ❌ ]" | process_input;
                fi;
              fi;             
            done <<< "${clang_files_list1[@]}";
            unset missing;
            declare -A missing
            [[ -n "${clang_files_list2}" ]] && echo -e "\n####################\nMISSING SYSTEM FILES LIST:\n####################\n\n${clang_files_list2}" | process_input && echo -e "\n####################\nCHECK-FILE AUTO LOCATE FILE MATCHES IN: ${{ env.base }}/${{ env.dirname }}\n####################\n" | process_input;
            while IFS= read -r missing_file; do
              if [[ "${missing_file}" == *.[ch]* ]]; then 
                file_count=$((file_count + 1));
                echo -e "\n#################### Locating missing \033[1m${missing_file}\033[0m file ( ${file_count} ) ####################" | process_input;
                path1="${missing_file//\'/}";
                path2="${path1##[:]*}";
                path3="${path2%'\n'}";
                path4="${path3%\\}";
                clean_path="${path4##*./}";
                file1="${missing_file//\'/}";
                file2="${file1##[:]*}";
                file3="${file2%'\n'}";
                file4="${file3%\\}";
                clean_file="${file4##*/}";
                if [[ "${missing_file}" == *"/"* && "${clean_path}" != "/" ]]; then
                  locate=$(fdfind "${abs}" -p -t f -g "**/${clean_path//./\\.}" "${{ env.base }}");
                elif [[ -n "${clean_file}" ]]; then
                  locate=$(fdfind "${abs}" -p -t f -g "**/${clean_file//./\\.}" "${{ env.base }}");
                fi;
                if [[ -n "${locate}" ]]; then            
                  while IFS= read -r includes; do
                    located_count=$((located_count + 1));
                    echo -e "\n\033[32mSystemInclude Source ${missing_file} Location:\033[0m ${includes}  [ $located_count / ✅ ]" | process_input;
                    echo "${includes%/*}" >> 'check-file-includes.txt';
                  done <<< "${locate[@]}";
                  includes_found=true
                elif [[ -n "${missing[$missing_file]}" ]]; then
                  includes_found=false
                  echo -e "\n\033[33mSystemInclude Source file \033[0m( ${missing_file} )\033[33m already listed missing!\033[0m  [\033[1m skipped \033[0m]" | process_input;{} 
                else
                  includes_found=false
                  missing["$missing_file"]=1
                  missing_count=$((missing_count + 1));
                  echo -e "\n\033[31mCannot locate missing system include file\033[0m ${missing_file}  [ $missing_count / ❌ ]" | process_input;
                fi;
              fi;             
            done <<< "${clang_files_list2[@]}";
            unset missing;
            if [[ -s "${source_include_list}" ]]; then
              gawk '{ for (i=1;i<=NF;i++) { if ($i ~ /\.(c|cc|cpp|c\+\+|h|hh|hpp|h\+\+)/) { print $i; } } }' "${log_file}" | gawk '{ for (i=1;i<=NF;i++) print $i; }' | sed -E 's/\/[^/]*\.(h|hh|hpp|h\+\+)$//g' | grep -E '^(/[^/[:space:]]*)+/?$' | sed -E 's|(/[.][.]/?)+$||' | grep -vE "\.\..*\.${filetype}$" | gawk -v ext="${filetype}" '$0 ~ "."ext"$" { if (seen[$0]++) next; print; next; } { print; }' | gawk -v ext="${filetype}" '$0 ~ "\\."ext { delete seen; print; next; } !seen[$0]++' > "${source_include_list}" || echo "::notice::File ${source_include_list##*/} was not created!!!" | process_input;
              [[ -s "${source_include_list}" ]] && cp -f "${source_include_list}" 'build/' && echo -e "\n\033[32mCopied ${source_include_list} to build for uploading if needed.\033[0m ✅" | process_input;
            fi;
          fi;
          if ${{ inputs.update }} && ${{ env.analyzer == '2' }}; then
            echo -e "\nPARAMETERS: $(rm -vf ${clang_file} 2>/dev/null)" | process_input;
          fi;
          ${{ inputs.content == 'true' }} && echo -e "\n####################\n\tINSTALLED COMPILERS\n####################\n\n${compiler_list}" | process_input;
          if [[ "${fixed}" ]]; then
            echo "file_fixed=1" >> "${GITHUB_ENV}";
          fi;
          echo "github_include_dirs=" >> "${GITHUB_ENV}";
          if [[ "${found}" ]]; then
            echo "includes=true" >> "${GITHUB_ENV}";
          else
            echo "includes=false" >> "${GITHUB_ENV}";
          fi;
          [[ -f "/tmp/*/metadata.json" ]] && echo -e"\nCodeChecker Analyzer list: $(cp -vf "/tmp/*/metadata.json" build/)";
          echo -e '\n####################\n\t\033[32mProject Files Checked Exiting...\033[0m\n####################\n' | process_input;
        else
          echo -e '\n####################\n\t\033[33mProject Files Check Skipped Exiting...\033[0m\n####################\n' | process_input;
        fi;
        seconds="$((SECONDS + start_time))";
        m=$((seconds / 60));
        s=$((seconds % 60));
        printf "Project Process Runtime: %d minutes and %d seconds\n\n" "$m" "$s" | process_input;
      shell: bash
      continue-on-error: true

    - name: Cleanup Artifacts Report
      if: inputs.report == 'true'
      run: |
        source ~/.bashrc
        set +e
        echo "file_found=0" >> "${GITHUB_ENV}";
        min_size_bytes=$((20 * 1024 * 1024));
        filename0="${GITHUB_WORKSPACE}/temp_file.log";
        filename1="${GITHUB_WORKSPACE}/${{ env.github_repository }}_project.log";
        filename2="${GITHUB_WORKSPACE}/${{ env.filename }}_error.log";
        filename3="${GITHUB_WORKSPACE}/${{ env.filename }}_data.log";
        if [[ -s "${filename1}" ]]; then
          filesize1=$(stat -c%s "${filename1}");
          ansi2txt "${filename1}" > "${filename0}" && echo "file_found=1" >> "${GITHUB_ENV}";
          mv -f "${filename0}" "${filename1}" && echo -e "\nLogFile: ${{ env.github_repository }} [\033[1mansi2txt\033[0m] cleaned" 
          if (( filesize1 > min_size_bytes )); then
            split -d -C 10M "${filename1}" 'part_' && echo -e "\nLogFile: ${{ env.github_repository }} file split completed" && echo "file1_parted=1" >> "${GITHUB_ENV}";
          fi;
        fi;
        if [[ -s "${filename2}" ]]; then
          filesize2=$(stat -c%s "${filename2}");
          ansi2txt "${filename2}" > "${filename0}" && echo "file_found=1" >> "${GITHUB_ENV}";
          mv -f "${filename0}" "${filename2}" && echo -e "\nLogFile: ${{ env.filename }} [\033[1mansi2txt\033[0m] cleaned";
          if (( filesize2 > min_size_bytes )); then
            split -d -C 10M "${filename2}" 'part_' && echo -e "\nLogFile: ${{ env.filename }} file split completed" && echo "file2_parted=1" >> "${GITHUB_ENV}";
          fi;
        fi;
        if [[ -s "${filename3}" ]]; then
          filesize3=$(stat -c%s "${filename3}");
          ansi2txt "${filename3}" > "${filename0}" && echo "file_found=1" >> "${GITHUB_ENV}";
          mv -f "${filename0}" "${filename3}" && echo -e "\nLogFile: ${{ env.filename }} [\033[1mansi2txt\033[0m] cleaned";
          if (( filesize3 > min_size_bytes )); then
            split -d -C 10M "${filename3}" 'part_' && echo -e "\nLogFile: ${{ env.filename }} file split completed" && echo "file3_parted=1" >> "${GITHUB_ENV}";
          fi;
        fi;
      shell: bash
      continue-on-error: true
      
    - name: Repository Update
      if: env.update == 'true' && env.file_fixed == '1'
      run: |
        echo '';      
        error_log="${GITHUB_WORKSPACE}/${{ env.filename }}_error.log";
        [[ ! -e ${error_log} ]] && error_log="${GITHUB_WORKSPACE}/${{ env.github_repository }}_project.log";
        repair_date="$(date +%Y%m%d)";
        process_input() {
          while IFS= read -r output; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${output}" | tee -a "${error_log}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${output}" >> "${error_log}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${output}";
            elif ${{ inputs.output == '4' }}; then
              echo -e "${output}" >/dev/null;
            fi;
          done;
        }
        if ${{ inputs.repository == 'false' }} && ${{ env.dirname != '' }}; then
          cd "${{ env.dirname }}" && echo -e "User Current Directory;  ${{ env.dirname }}\n" | process_input;
        fi;
        if ${{ inputs.project == 'true' }}; then
          git config --global --add safe.directory . | process_input;
        fi;
        [[ -d '.git/' ]] || echo '::error::git directory not found exiting';
        git config --global user.name "${{ github.actor }}";
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com";
        git config --global credential.helper store
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999
        git add . 2>&1 | process_input;
        git commit -m "check-file-action repaired errors in ${{ env.filename }} file(s)" | process_input;
        git push origin "${{ github.ref }}" 2>&1 | process_input;
        if [[ ${PIPESTATUS[0]} == 0 ]] || [[ ${PIPESTATUS[1]} == 0 ]]; then
          echo -e "\n####################\nCHECK FILE UPDATED REPOSITORY\n####################\n" | process_input;
          echo -e "\n####################\nUPDATED FILE(S) LIST:\n####################\n" | process_input;
          git diff --name-only @{push}@{1} @{push} 2>&1 | process_input;
          echo -e "\n\t########## ${repair_date} ##########\n" | process_input;
        else
          echo -e "\n####################\nCHECK FILE COULD NOT UPDATED REPO FILE(S)\n####################\n" | process_input;
          echo 'Retrying again after git fetches branch' | process_input;
          git fetch origin "${{ github.ref }}" 2>&1 | process_input;
          git add . 2>&1 | process_input;
          git commit -m "check-file-action repaired errors in ${{ env.filename }} file(s)" | process_input;
          git push origin "${{ github.ref }}" 2>&1 | process_input;
          if [[ ${PIPESTATUS[0]} == 0 ]] || [[ ${PIPESTATUS[1]} == 0 ]]; then
            echo -e "\n####################\nCHECK FILE UPDATED REPOSITORY\n####################\n" | process_input;
            echo -e "\n####################\nUPDATED FILE(S) LIST:\n####################\n" | process_input;
            git diff --name-only @{push}@{1} @{push} 2>&1 | process_input;
            echo -e "\n\t########## ${repair_date} ##########\n" | process_input;
            if ${{ inputs.project }}; then
              git status 2>&1 | process_input;
            fi;
          else
            echo 'Was git push event successful status ? unknown' | process_input;
          fi;
        fi;
      shell: bash
      continue-on-error: true

    - name: Uploading ${{ github.repository }} Project Build Release
      if: inputs.build > '0' && inputs.project == 'true' && env.build_files == '1'
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ inputs.dirname }}/out/target/*
        name: Build For ${{ github.repository }} Repository.
        tag_name: ${{ github.run_id }}
      continue-on-error: true

    - name: Uploading ${{ github.repository }} Project Report Checks
      if: inputs.analyzer == '4' && inputs.project == 'true' && inputs.repair == 'true' && env.build_files == '1'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.github_repository }}_reports
        path: reports
      continue-on-error: true

    - name: Uploading Build Files Artifacts
      if: inputs.upload == 'true' && inputs.project == 'true' && env.build_files == '1'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.github_repository }}_build
        path: build
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ env.filename }} Error Report Artifact
      if: inputs.report == 'true' && env.filename != '' && env.file_found == '1'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.filename }}_error.log
        path: ${{ env.filename }}_error.log
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ env.filename }} Data Report Artifact
      if: inputs.report == 'true' && env.filename != '' && env.data_file == '1'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.filename }}_data.log
        path: ${{ env.filename }}_data.log
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ env.github_repository }} Project Report Artifact
      if: inputs.report == 'true' && inputs.project == 'true' && env.check_build == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.github_repository }}_project.log
        path: ${{ env.github_repository }}_project.log
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ env.filename }} Error Report Artifacts
      if: inputs.report == 'true' && env.filename != '' && env.data_file == '1' && env.file3_parted == '1'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.filename }}_split_data.log
        path: part_*
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ env.filename }} Error Report Artifacts
      if: inputs.report == 'true' && env.filename != '' && env.file_found == '1' && env.file2_parted == '1'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.filename }}_split_error.log
        path: part_*
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ github.repository }} Project Report Artifacts
      if: inputs.report == 'true' && inputs.project == 'true' && env.check_build == 'true' && env.file1_parted == '1'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.github_repository }}_split_project.log
        path: part_*
        include-hidden-files: true
      continue-on-error: true

    - name: Delete Files
      if: env.filename != '' || inputs.pattern != '' || inputs.project == 'true'
      run: |
        date
        if [[ -f "${{ env.github_repository }}_project.log" ]]; then
          echo -e "\nPROJECT: $(rm -vf ${{ env.github_repository }}_project.log)";
        fi;
        if [[ -f "${{ env.filename }}_error.log" ]]; then
          echo -e "\nLOGFILE: $(rm -vf ${{ env.filename }}_error.log)";
        fi;
        if [[ -f "${{ env.filename }}_data.log" ]]; then
          echo -e "\nDATAFILE: $(rm -vf ${{ env.filename }}_data.log)";
        fi;
        if [[ -e "database" ]]; then
          echo -e "\nDATABASE: $(rm -vf database)";
        fi;
        echo '';
      shell: bash
      continue-on-error: true

    - name: Save Project
      if: inputs.cache == 'true' && ( inputs.stored == 'true' || inputs.source == 'true' || env.includes == 'true' ) && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      id: save
      with:
        path: |
          ./build
          compile_commands.json
          check-file-sources.txt
          check-file-includes.txt
          check-file-repaired.txt
        key: ${{ steps.restore.outputs.cache-primary-key }}
        enableCrossOsArchive: true
      continue-on-error: true

    - name: Action Check
      if: env.filename == '' && inputs.pattern == '' && inputs.project == 'false' && inputs.source == '0'
      run: |
        echo ''
        echo -e "\n::debug::No input provided to:= filename: none • filetype: none • pattern: none • project: false • source: 0\n\tNothing To Do! ?\n";
      shell: bash
      continue-on-error: true

    - name: Check Project Size
      run: |
        echo '';
        echo -e "\033[33mRepository Project Total Size:\033[0m \033[1m$(du ${{ env.base }} -shx)\033[0m\n";
      shell: bash
      continue-on-error: true

    - name: Exiting
      run: |
        echo '';
        text() {
          local text="$1";
          echo -e "${text}"
        }
        texta="######################";
        textb="#\033[1m\033[32m CHECK FILE EXITING \033[0m#";
        textc="######################";
        text "${texta}";
        text "${textb}";
        text "${textc}\n";
      shell: bash
      continue-on-error: true
