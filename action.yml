name: Check File Action
description: 'Check file - Add filename to check for errors or text Word to search for within workspace files'
inputs:
  analyzer:
    description: 'Analyze all project files using options 1 - 2 - 3 - 4'
    required: false
    default: 1
    type: choice
    options:
    - 1 # clang-tidy - parameter-file for small project file checks.
    - 2 # run-clang-tidy.py - compile_commands.json for large project file checks.
    - 3 # clangd-tidy - compile_commands.json for faster large project file checks.
    - 4 # cmake - build sources and use clang-tidy for project file checks
  filename:
    description: 'Check for filename or search for text word matches'
    type: string
    required: false
    default: ''
  filetype:
    description: 'Check only these file extension types when searching for text word matches'
    type: string
    required: false
    default: 'none'
  database:
    description: 'Use file database over find commands slower performance for searches'
    type: boolean 
    required: false
    default: 'false'
  dirname:
    description: 'Your project root folder if created'
    type: string
    required: false
    default: ''
  pattern:
    description: 'Search for pattern matches in filetypes or all files'
    type: string
    required: false
    default: ''
  project:
    description: 'Fix Errors found while building project or check build only'
    type: boolean
    required: false
    default: 'false'
  rootdir:
    description: 'Search will start from root (/)'
    type: boolean
    required: false
    default: 'false'
  recheck:
    description: 'Recheck files repaired by check-file'
    type: boolean
    required: false
    default: 'false'
  repair:
    description: 'Check file and fix if able when searching for errors'
    type: boolean
    required: false
    default: 'false'
  report:
    description: 'Errors found will be logged and sent to repository releases'
    type: boolean
    required: false
    default: 'false'
  compiler:
    description: 'Clang compiler used for project building only'
    type: string
    required: false
    default: 'clang-latest'
  content:
    description: 'Search will list dir contents of found filename'
    type: boolean
    required: false
    default: 'false'
  include:
    description: 'Check include files called by C/C++ filename searches if true'
    type: boolean
    required: false
    default: 'false'
  number:
    description: 'Number of files to check before stopping action'
    type: number
    required: false
    default: 0
  stored:
    description: 'Check files with errors repaired are skipped if ran again'
    type: boolean
    required: false
    default: 'false'
  update:
    description: 'Errors repaired with check-file will push changes to remote repository'
    type: boolean
    required: false
    default: 'false'
  upload:
    description: 'Upload build files for compile_commands.json'
    type: boolean
    required: false
    default: 'false'
  output:
    description: 'Output log stdout type 1,2 or 3'
    required: false
    default: 1
    type: choice
    options:
    - 1 # Log to terminal and file.
    - 2 # Log to file only.
    - 3 # Log to terminal only.
  build:
    description: 'Fix Errors found while building repository project'
    type: boolean
    required: false
    default: 'false'

runs:
  using: composite
  steps:

    - name: Set up Go 1.25.3
      if: inputs.filename != ''
      uses: actions/setup-go@v2
      with:
        go-version: 1.25.3
      continue-on-error: true

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
      continue-on-error: true

    - name: Setup Clang Compiler 
      if: inputs.project == 'true'
      uses: rlalik/setup-cpp-compiler@master
      with:
        compiler: ${{ inputs.compiler }}
      continue-on-error: true

    - name: Linux Distro
      run: |
        echo '';
        if [[ -r '/etc/os-release' ]]; then
          . /etc/os-release
          if [[ "${ID}" == 'ubuntu' ]]; then
            echo "Name: ${NAME}"
            echo "Version: ${VERSION}"
            echo "ID: ${ID}"
            echo "ID Like: ${ID_LIKE}"
            echo "Pretty Name: ${PRETTY_NAME}"
            echo "Version ID: ${VERSION_ID}"
          else
            echo "Not running an Ubuntu distribution. ID=${ID}, VERSION=${VERSION}"
          fi;
        else
          echo "Not running a distribution with /etc/os-release available"
        fi;
      shell: bash
      continue-on-error: true

    - name: Installing Dependencies
      if: inputs.pattern != '' || inputs.filename != '' || inputs.project != 'false'
      run: |
        echo '';
        cmake_version=$(cmake --version 2>/dev/null | grep version | awk '{print $3}');
        required_version="4.2.1";
        linux_distro1="24.04";
        linux_distro2="22.04";
        linux_distro3="20.04";
        linux_verison=$(lsb_release -r | awk '{print $2}');
        echo 'export GIT_DISCOVERY_ACROSS_FILESYSTEM=1' | sudo tee -a ~/.bashrc >/dev/null;
        echo 'export DEBIAN_FRONTEND=noninteractive' | sudo tee -a ~/.bashrc >/dev/null;
        echo 'export TERM=xterm-256color' | sudo tee -a ~/.bashrc;
        echo 'deb [trusted=yes] https://apt.gabe565.com /' | sudo tee -a /etc/apt/sources.list.d/gabe565.list >/dev/null;
        sudo add-apt-repository universe >/dev/null;
        sudo add-apt-repository ppa:git-core/ppa >/dev/null;
        sudo apt-get update -yq >/dev/null 2>&1;
        sudo apt-get --fix-broken install -yq >/dev/null 2>&1;
        if ${{ inputs.project }}; then
          if [[ "${cmake_version}" < "${required_version}" ]] && ${{ inputs.project }}; then
            echo -e "\nCurrent CMake version (${cmake_version}) is older than ${required_version}. Updating...\n"
            sudo apt-get remove --purge -yq cmake >/dev/null;
            sudo apt-get install -yq ca-certificates gpg wget >/dev/null;
            sudo bash -c "$(sudo wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null)";
            if [[ "${linux_verison}" == "${linux_distro1}" ]]; then
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            elif [[ "${linux_verison}" == "${linux_distro2}" ]]; then
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            elif [[ "${linux_verison}" == "${linux_distro3}" ]]; then
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ focal main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            else
              echo -e "\nKitWare Keyring: Noble ${linux_verison}\n";
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            fi;
            echo -e "\n####################\nLinux Release: ${linux_verison}\n####################\n";
          fi;
        fi;
        text0="\n####################\ngit dependencies Installed\n####################\n";
        text1="\n####################\nripgrep dependencies Installed\n####################\n";
        text2="\n####################\nansi2txt dependencies Installed\n####################\n";
        text3="\n####################\nca-certificates dependencies Installed\n####################\n";
        text4="\n####################\ncppcheck dependencies Installed\n####################\n";
        text5="\n####################\nclang-tidy dependencies Installed\n####################\n";
        text6="\n####################\nshellharden dependencies Installed\n####################\n";
        text7="\n####################\nshellcheck dependencies Installed\n####################\n";
        text8="\n####################\ncheckmake dependencies Installed\n####################\n";
        text9="\n####################\nbatcat dependencies Installed\n####################\n";
        file_name="${{ inputs.filename }}";
        file_type="${file_name##*.}";
        github=${GITHUB_WORKSPACE};
        if [[ "${cmake_version}" < "${required_version}" ]] && ${{ inputs.project }}; then
          echo -e "Current CMake version ($cmake_version) adding latest python cmake\n"
          sudo rm -vf "$(which cmake)";
          sudo mkdir -p '/usr/local/bin'
          python -m pip install cmake --upgrade >/dev/null && echo -e "\n####################\ncmake pip dependencies Installed\n####################\n" || echo -e '::error::No cmake pip installed for project checks';
          sudo cp -vpf "/home/runner/.local/bin/cmake" '/usr/local/bin/'
        fi;
        if [[ ! $(which cmake) ]]; then
          sudo apt-get -yq install cmake && echo -e "\n####################\ncmake dependencies Installed\n####################\n" || echo -e '::error::No cmake installed for project build'; 
          [[ ! $(which cmake) ]] && exit 1
        fi;
        if [[ ! $(which git) ]]; then
          sudo apt-get -yq install git git-core >/dev/null && echo -e "${text0}" || echo -e '::error::No git installed for repo updates';
          [[ ! $(which git) ]] && exit 1
        fi;
        if [[ ! $(which python3) ]] && ${{ inputs.project }} && ${{ inputs.analyzer == 2 }}; then
          sudo apt-get -yq install python3 >/dev/null >/dev/null && echo -e "\n####################\npython3 dependencies Installed\n####################\n" || echo -e '::error::No python3 installed for project checks';
          [[ ! $(which python3) ]] && exit 1
        fi;
        if [[ ! $(which clangd) ]] && ${{ inputs.project }}; then
          sudo apt-get -yq install clangd >/dev/null && echo -e "\n####################\nclangd dependencies Installed\n####################\n" || echo -e '::error::No clangd installed for project build';
          [[ ! $(which clangd) ]] && exit 1
        fi;
        if [[ ! $(which clang-tidy) ]] && ([[ -n $(echo "${file_type}" | egrep "^c$|^c.$|^c..$|^h$|^h.$|^h..$|^t$|^t.$|^t..$") ]] && ${{ inputs.repair }}) || ${{ inputs.project }}; then
          sudo apt-get install -yq clang-tidy clang-tools >/dev/null && echo -e "${text5}" || echo -e '::error::No clang-tidy installed Exiting';
          [[ ! $(which clang-tidy) ]] && exit 1
        fi;
        if [[ ! $(which clangd-tidy) ]] && ${{ inputs.project }} && ${{ inputs.analyzer == 3 }}; then
          python3 -m pip install clangd-tidy >/dev/null && echo -e "\n####################\nclangd-tidy dependencies Installed\n####################\n" || echo -e '::error::No clangd-tidy installed for project checks';
          if [[ $(which clangd-tidy) ]]; then
            echo -e "\nclangd-tidy path: $(which clangd-tidy)\n";
          else
            exit 1
          fi;
        fi;
        if [[ ! $(which CodeChecker) ]] && ${{ inputs.project }} && ${{ inputs.analyzer == 4 }}; then
          sudo apt-get -yq install python3-pip python3-venv make >/dev/null && echo -e "\n####################\npython3-pip dependencies Installed\n####################\n" || echo -e '::error::No python3-pip installed for project checks';
          python3 -m pip install codechecker >/dev/null && echo -e "\n####################\ncodechecker dependencies Installed\n####################\n" || echo -e '::error::No codechecker installed for project checks';
          export PATH="/home/runner/codechecker/build/CodeChecker/bin:${PATH}" | sudo tee -a ~/.bashrc >/dev/null;
          export PATH="/home/runner/.local/bin:${PATH}" | sudo tee -a ~/.bashrc >/dev/null;
          sudo mkdir -p "/home/runner/codechecker/venv/include"
          sudo mkdir -p "/home/runner/codechecker/venv/bin"
          sudo chown -R "${USER}:${USER}" /home/runner/codechecker/
          cd "/home/runner/codechecker/venv"
          python3 -m venv .
          cd "${github}"
          if [[ $(which CodeChecker) ]]; then
            echo -e "\nCodeChecker path: $(which CodeChecker)\n";
          else
            exit 1
          fi;
        fi;
        if [[ ! $(llvm-config --version 2>/dev/null) ]] && ${{ inputs.project }}; then
          sudo bash -c "$(sudo wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add - >/dev/null 2>&1)"
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs) main" >/dev/null;
          sudo apt-get -yq install llvm llvm-dev lld libclang-dev >/dev/null && echo -e "\n####################\nllvm tools dependencies Installed\n####################\n" || echo -e '::error::No llvm tools installed for project build';
          [[ ! $(llvm-config --version 2>/dev/null) ]] && exit 1
        fi;
        if [[ ! $(dpkg -s build-essential 2>/dev/null) ]] && ${{ inputs.project }}; then
          sudo apt-get -yq install build-essential device-tree-compiler >/dev/null && echo -e "\n####################\nbuild-essential dependencies Installed\n####################\n" || echo -e '::error::No build-essential installed for project build';
        fi;
        if [[ ! $(which npm) ]]; then
          sudo npm install >/dev/null && echo -e "\n####################\nnpm dependencies Installed\n####################\n" || echo -e '::error::No npm installed for term_width';
          [[ ! $(which tput) ]] && exit 1
        fi;
        if [[ ! $(which tput) ]]; then
          sudo apt-get -yq install tput >/dev/null && echo -e "\n####################\ntput dependencies Installed\n####################\n" || echo -e '::error::No tput installed for term_width';
          [[ ! $(which tput) ]] && exit 1
        fi;
        if [[ ! $(which tqdm) ]] &&  ${{ inputs.project }}; then
          python -m pip install tqdm >/dev/null && echo -e "\n####################\ntqdm dependencies Installed\n####################\n" || echo -e '::warning::No tpdm installed for project progress checks';
          [[ ! $(which tqdm) ]] && exit 1
        fi;
        if [[ ! $(which rg) ]] && [[ "${{ inputs.pattern }}" != '' ]] && ${{ inputs.database }}; then
          sudo apt-get -yq install ripgrep >/dev/null && echo -e "${text1}" || echo -e '::error::No ripgrep installed for pattern matching';
          [[ ! $(which rg) ]] && exit 1
        fi;
        if [[ ! $(which ansi2txt) ]] && ${{ inputs.report }}; then
          sudo apt-get -yq install ansi2txt >/dev/null && echo -e "${text2}" || echo -e '::error::No ansi2txt installed for cleaning log report';
        fi;
        if [[ ! $(which update-ca-certificates) ]]; then
          sudo apt-get -yq install ca-certificates >/dev/null && echo -e "${text3}" || echo 'No ca-certificates installed effects can vary';
        fi;
        if [[ ! $(which cppcheck) ]] && [[ -n $(echo "${file_type}" | egrep "^c$|^c.$|^c..$|^h$|^h.$|^h..$|^t$|^t.$|^t..$") ]]; then
          sudo apt-get -yq install cppcheck >/dev/null && echo -e "${text4}" || echo -e '::error::No cppcheck installed Exiting';
          [[ ! $(which cppcheck) ]] && exit 1
        fi;
        if [[ ! $(which shellharden) ]] && [[ -n $(echo "${file_type}" | egrep -i "^sh$") ]] && ${{ inputs.repair }}; then
          sudo wget -qO 'shellharden.tar.gz' 'https://github.com/anordal/shellharden/releases/latest/download/shellharden-x86_64-unknown-linux-gnu.tar.gz' >/dev/null;
          sudo tar xf 'shellharden.tar.gz' -C '/usr/local/bin' 'shellharden' && rm -vrf 'shellharden.tar.gz' && echo -e "${text6}" || echo -e '::error::No shellharden installed Exiting';
          [[ ! $(which shellharden) ]] && exit 1
        fi;
        if [[ ! $(which shellcheck) ]] && [[ -n $(echo "${file_type}" | egrep -i "^sh$") ]]; then
          sudo apt-get -yq install shellcheck >/dev/null && echo -e "${text7}" || echo -e '::error::No shellcheck installed Exiting';
          [[ ! $(which shellcheck) ]] && exit 1
        fi;
        if [[ $(which checkmake) ]] && [[ -n ${file} ]] && [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]]; then
          sudo cp -vf "${file}" "${path}" 2>/dev/null;
        elif [[ ! -n ${file} ]] && [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]]; then
          echo -e '\ncheckmake.ini file missing, needed for checkmake to function properly\n';
        fi;
        if [[ ! $(which checkmake) ]] && [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]]; then
          go install "github.com/checkmake/checkmake/cmd/checkmake@latest" >/dev/null && echo -e "${text8}" || echo -e '::error::No checkmake installed Exiting';
          [[ ! $(which checkmake) ]] && exit 1
        fi;
        if [[ $(which bat) ]] && [[ ! $(which batcat) ]]; then
          sudo ln -sf ~/usr/bin/bat ~/usr/bin/batcat >/dev/null || echo -e '::error::No batcat installed Exiting';
          [[ ! $(which batcat) ]] && exit 1
          echo -e "\nalias batcat='bat'" | sudo tee -a ~/.bashrc >/dev/null;
          export BAT_THEME="ansi";
        elif [[ ! $(which batcat) ]]; then
          sudo apt-get -yq install bat >/dev/null && echo -e "${text9}" || echo -e '::error::No batcat installed Exiting';
          [[ ! $(which batcat) ]] && exit 1
          export BAT_THEME="ansi";
        fi;
        echo 'update=${{ inputs.update }}' >> "${GITHUB_ENV}";
        if [[ -d '/home/runner/.local/bin' ]]; then
          echo "export PATH=/home/runner/.local/bin:${PATH}" | sudo tee -a ~/.bashrc >/dev/null;
        fi;
      shell: bash
      continue-on-error: false

    - name: Set Directory Base
      if: inputs.pattern != '' || inputs.filename != '' || inputs.project != 'false'
      id: set_dirname 
      env: 
        default_path: "*" 
      run: |
        echo '';
        repair_file='check-file-repaired.txt';
        repository=$(sudo find ${GITHUB_WORKSPACE} -type d -name '.git' -print -quit);
        repo=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
        echo 'database=database' >> "${GITHUB_ENV}";
        text1a="####################";
        text1b="DEFAULT DIRECTORY (SYSTEM ROOT)";
        text1c="####################";
        text2a="####################";
        text2b="DEFAULT DIRECTORY (GITHUB WORKSPACE)";
        text2c="####################";
        text3a="####################";
        text3b="Store repaired files Enabled";
        text3c="####################";
        text4="Creating ${repair_file} for checked files";
        text5a="####################";
        text5b="Database Performance Mode Enabled";
        text5c="####################";
        text6="Database not found exiting";
        text7a="####################";
        text7b="Searching directories for ${{ inputs.filename }}) file(s)";
        text7c="####################";
        text8a="####################";
        text8b="Searching ${{ inputs.filetype }} files for ${{ inputs.pattern }} match(s)";
        text8c="####################";
        text9a="####################";
        text9b="Searching all files for ${{ inputs.pattern }} match(s)";
        text9c="####################";
        text10a="#####################";
        text10b="\033[1m# CHECK FILE ACTION #\033[0m";
        text10c="#####################";
        export TERM=xterm-256color
        if [[ ${TERM} ]]; then
          center_text() {
            local text="$1";
            local term_cols="$(tput cols)";
            local text_length="${#text}";
            if [[ $(node ${{ github.action_path }}/scripts/mobile.js 2>/dev/null) ]] || [[ $(node ${{ github.action_path }}/scripts/view.js 2>/dev/null) ]]; then
              local padding="$(( (term_cols - text_length) / 2 ))";
              local text="$(echo $1 | tr -d '\n')";
              print ''
              printf "%*s%s\n" "${padding}" "" "${text}"
              print ''
            else
              echo -e "${text}"
            fi;
          }
        fi;
        if ${{ inputs.rootdir }}; then
          center_text "\n${text1a}";
          center_text "${text1b}";
          center_text "${text1c}";
          echo -e '\n~/\n';
          echo 'file_path=/' >> "${GITHUB_ENV}";
          file_path=/
        else
          center_text "\n${text2a}";
          center_text "${text2b}";
          center_text "${text2c}";
          echo -e "\n${GITHUB_WORKSPACE}\n";
          echo "file_path=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}";
          file_path=${GITHUB_WORKSPACE}
        fi;
        if ${{ inputs.stored }} && ${{ env.update }} && [[ -d ${repository} ]]; then
          repaired="${repository%/*}/${repair_file}";
          if [[ -f ${repaired} ]]; then
            center_text "\n${text3a}";
            center_text "${text3b}";
            center_text "${text3c}\n";
          else
            center_text "\n${text4a}";
            center_text "${text4b}";
            center_text "${text4c}\n";
            date '+%Y%m%d' > "${repaired}" || echo -e "::warning:: ${repaired} backup file not found";
          fi;
        elif ${{ inputs.stored }} && [[ -d ${repository} ]]; then
          repaired="${repository%/*}/${repair_file}";
          if [[ -f ${repaired} ]]; then
            center_text "\n${text3a}";
            center_text "${text3b}";
            center_text "${text3c}\n";
          else
            center_text "\n${text4a}";
            center_text "${text4b}";
            center_text "${text4c}\n";
            date '+%Y%m%d' > "${repaired}" || echo -e "::warning:: ${repaired} backup file not found";
          fi;
          echo 'update=true' >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.database }}; then
          sudo find "${file_path}" -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -type f -print | sort -t/ -k1.2 > "${GITHUB_WORKSPACE}/database";
          if [[ -s "${GITHUB_WORKSPACE}/database" ]]; then
            center_text "\n${text5a}";
            center_text "${text5b}";
            center_text "${text5c}\n";
            echo "database=${GITHUB_WORKSPACE}/database" >> "${GITHUB_ENV}";
          else
            center_text "\n${text6a}";
            center_text "${text6b}";
            center_text "${text6c}\n" && exit 1
          fi;
        fi;
        if [[ "${{ inputs.filename }}" != '' ]]; then
          center_text "\n${text7a}";
          center_text "${text7b}";
          center_text "${text7c}\n";
        fi;
        if [[ "${{ inputs.pattern }}" != '' ]] && [[ "${{ inputs.filetype }}" != 'none' ]]; then
          center_text "\n${text8a}";
          center_text "${text8b}";
          center_text "${text8c}\n";
        elif [[ "${{ inputs.pattern }}" != '' ]]; then
          center_text "\n${text9a}";
          center_text "${text9b}";
          center_text "${text9c}\n";
        fi;
        if [[ -z "${{ inputs.dirname }}" ]]; then
          if [ -z "${{ github.event.inputs.DEVICE_PATH }}" ]; then
            dirname=${{ env.default_path }};
            echo "dirname=${dirname}" >> "${GITHUB_ENV}";
          else
            dirname=${{ github.event.inputs.DEVICE_PATH }};
            echo "dirname=${dirname}" >> "${GITHUB_ENV}";
          fi;
        else
          dirname=${{ inputs.dirname }};
          echo "dirname=${dirname}" >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.project }} && ${{ inputs.filename != '' }} && ${{ inputs.analyzer > 0 }}; then
          center_text "::warning:: inputs.project: and inputs.filename: both enabled disables inputs.analyzer:\nTo remove this warning use ( inputs.analyzer: 0 )\n";
          echo "analyzer=0" >> "${GITHUB_ENV}";
        else
          echo "analyzer=${{ inputs.analyzer }}" >> "${GITHUB_ENV}";
        fi;
        if [[ -d ${repository} ]]; then
          cd "${repository%/*}";
          src=$(ls 2>/dev/null);
          total_files=$(find -type f | grep -v '\.git/.' | wc -l);
          file_type=$(find -type f -name "*.${{ inputs.filetype }}" | grep -v '\.git/.' | wc -l);
          percentage=$(echo "scale=2; (${file_type:-0} / ${total_files:-0}) * 100" | bc);
          include_dirs=$(find -type d -name 'include' -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | wc -l);
          include_list() {
            find "${src_tree%/*}" -not \( -path "*/.github" -prune -o -path "*/.git" -prune \) -type d -name 'include' -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r include; do
              if [[ -d "${include}" ]]; then
                echo -n "${include} "
              fi;
            done;
          }
          file_types() {
            find -type f | grep -iEo '\_[[:alnum:]]+$|\-[[:alnum:]]+$|\.[[:alnum:]]+$|[[:alnum:]]+$' | tr -d '_\-\.' | sort | uniq -c | sed 's/^ *//' | while IFS= read -r file; do
              echo "${file} files"
            done;
          }
          dir_files() {
           for dir in ${src[@]}; do
             if [ -d "$dir" ]; then
               count=$(find "$dir" -type f 2>/dev/null | wc -l);
               echo "${dir}: ${count} files"
             fi;
           done;
          }        
          if ${{ inputs.project }} && [[ "$(dir_files)" ]]; then
            echo -e "\n#####################\nSource Directories:\n#####################\n\n$(dir_files)";
          fi;
          if ${{ inputs.project }} && [[ "$(file_types)" ]]; then
            echo -e "\n#####################\nProject File Types:\n#####################\n\n$(file_types)";
          fi;
          if [[ "${total_files:-0}" > '0' ]]; then
            echo -e "\n\033[1mThe total percentage of ${{ inputs.filetype }} files is: ${percentage:-0}%\033[0m\n"
            echo -e "\n#####################\nRepository: ${repo}\n#####################\n\nProject has ${total_files} files total";
          else
            echo -e "\n#####################\n::error::Repository: ${repo} files missing?\n#####################\n\nProject has no files.. Exiting";
            exit 1
          fi;
          if [[ "$(include_list)" ]]; then
            echo "target_include_dirs=$(include_list)" >> "${GITHUB_ENV}";
            echo -e "\n#####################\nInclude directories: ${include_dirs}\n#####################\n\nProject has no files.. Exiting";
          fi;
        fi;
        center_text "\n${text10a}" 2>/dev/null;
        center_text "${text10b}" 2>/dev/null;
        center_text "${text10c}\n" 2>/dev/null;
        echo "github_repository=${repo}" >> "${GITHUB_ENV}";
        echo 'file_fixed=0' >> "${GITHUB_ENV}";
        echo 'file_found=0' >> "${GITHUB_ENV}";
        echo 'file_error=0' >> "${GITHUB_ENV}";
        echo "file1_parted=0" >> "${GITHUB_ENV}";
        echo "file2_parted=0" >> "${GITHUB_ENV}";
        echo 'build_cache=false' >> "${GITHUB_ENV}";
      shell: bash
      continue-on-error: false

    - name: Check Build Project
      if: inputs.project == 'true'
      run: |
        export LLVM_ENABLE_THREADS=ON
        export CMAKE_EXPORT_COMPILE_COMMANDS=ON
        export LC_ALL=C
        set +e
        repository=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
        project_log="${GITHUB_WORKSPACE}/${repository}_project.log";
        check_build=false
        file_type='c';
        src_tree=$(find ${{ env.file_path }} -type d -name '.git' -print -quit);
        github=${GITHUB_WORKSPACE};
        update=true
        count=1
        process_input() {
          while IFS= read -r log; do
            if ${{ inputs.output == 1 }}; then
              echo -e "${log}" | tee -a "${project_log}";
            elif ${{ inputs.output == 2 }}; then
              echo -e "${log}" >> "${project_log}";
            elif ${{ inputs.output == 3 }}; then
              echo -e "${log}";
            fi;
          done;
        }
        echo 'check_build=false' >> "${GITHUB_ENV}";
        if ! ${{ inputs.update }}; then
          echo 'update=false' >> "${GITHUB_ENV}";
          update=false
        fi;
        if ${{ inputs.filetype != 'none' }}; then
          file_type="${{ inputs.filetype }}";
        fi;
        echo "filetype=${file_type}" >> "${GITHUB_ENV}";
        if [[ -d "${src_tree}" ]]; then
          cd "${src_tree%/*}";
          clang_tidy_version=$(clang-tidy --version);
          compiler_list=$(dpkg --list | grep compiler | tr -d 'ii');
          clang_version=$(clang --version);
          verify_config=$(clang-tidy --verify-config);
          cmake_version=$(cmake --version);
          project_files=$(find -not \( -path "*/CMakeFiles/*" -prune -o -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -type f -name "*.${file_type}" -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null);
          compile_json=$(find -type f -name 'compile_commands.json' -print -quit);
          include_dirs=$(find -type d -name 'include' -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | head -n 1);
          echo "target_include_dirs=${include_dirs}" >> "${GITHUB_ENV}";
          clang_checks=$(clang-tidy --list-checks);
          gcc_version=$(gcc --version);
          gpp_version=$(g++ --version);
          cmake_list='CMakeLists.txt';
          clang_file='parameter-file';
          clang_tidy='.clang-tidy';
          clangd_tidy='/home/runner/.local/bin/clangd-tidy';
          clang_run=${{ github.action_path }}/scripts/tools/run-clang-tidy.py;
          clang_fix=${{ github.action_path }}/scripts/tools/clang-apply-replacements;
          export PATH="${clang_fix}:${PATH}";
          echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################\n" | process_input;
          echo -e "\n####################\nProject Build: ${{ github.repository }}\n####################\n" | process_input;
          echo -e "\n####################\nCompiler: ${gcc_version}\n####################\n" | process_input;
          echo -e "\n####################\nCompiler: ${gpp_version}\n####################\n" | process_input;
          echo -e "\n####################\nCompiler: ${clang_version}\n####################\n" | process_input;
          echo -e "\n####################\nBuilder: ${cmake_version}\n####################\n" | process_input;
          if ${{ inputs.analyzer == 4 }}; then
            codeCR_version=$(CodeChecker version);
            echo -e "\n####################\nCodeChecker: ${codeCR_version}\n####################\n" | process_input;
          fi;
          if ${{ inputs.analyzer == 3 }}; then
            clangd_version=$(clangd-tidy --version);
            echo -e "\n####################\nClangd-Tidy: ${clangd_version}\n####################\n" | process_input;
          fi;
          echo -e "\n####################\nClang-Tidy: ${clang_tidy_version}\n####################\n" | process_input;
          echo -e "\n####################\nCLANG TIDY: ${verify_config}\n####################\n" | process_input;
          echo -e "\n####################\n\tCLANG OPTIONS\n####################\n\n${clang_checks}\n" | process_input;
          echo -e "\n####################\nChecking Repository ${src_tree%/*}\n####################\n" | process_input;
          echo -e "\n####################\nChecking for ${file_type} file(s)\n####################\n" | process_input;
	      source_dirs() {
            find -not \( -path "*/.github" -prune -o -path "*/.git" -prune \) -type d -maxdepth 1 -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r dir; do
              if [[ "${dir}" != '.' ]]; then
                echo -n "${dir#./} "
              fi;
            done;
          }
          header1_list() {
            find "${src_tree%/*}" -not \( -path "*/.github" -prune -o -path "*/.git" -prune \) -type d -name 'include' -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r include; do
              if [[ -d "${include}" ]]; then
                echo -n "${include} "
              fi;
            done;
          }
          header2_list() {
            find "${src_tree%/*}" -not \( -path "*/.github" -prune -o -path "*/.git" -prune \) -type d -name 'include' -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r include; do
              if [[ -d "${include}" ]]; then
                echo -e "--extra-arg=-I${include}"
              fi;
            done;
          }
          source_list() {
            find "${src_tree%/*}" -not \( -path "*/CMakeFiles" -prune -o -path "*/build" -prune -o -path "*/.git" -prune -o -path "*/.github" -prune \) -type f -name "*.${file_type}" -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r file; do
              echo -e "${file#./}"
            done;
          }
          if [[ -f "${clang_tidy}" ]]; then
            echo -e '\n####################\n\t.clang-tidy found continuing...\n####################\n' | process_input;
          fi;
          if [[ -f "${cmake_list}" ]]; then
            echo -e '\n####################\n\tCMakeLists.txt found continuing...\n####################\n' | process_input;
          fi;
          mkdir -p build/fixes
          if [[ -d 'build' ]]; then
            echo -e '\n####################\n\tbuild directory created continuing...\n####################\n' | process_input;
            if [[ "$(source_dirs)" ]] && [[ "$(header1_list)" ]]; then
              cmake -S . -DPROJECT_SRC_INCLUDES="$(header1_list)" -DPROJECT_SRC_DIRS="$(source_dirs)" -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build | process_input || echo "::warning:: ( $? ) cmake missing or malformed CMakeList.txt (?)" | process_input;
            elif [[ "$(source_dirs)" ]]; then
              cmake -S . -DPROJECT_SRC_DIRS="$(source_dirs)" -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build | process_input || echo "::warning:: ( $? ) cmake missing or malformed CMakeList.txt (?)" | process_input;
            else
              cmake -S . -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build | process_input || echo "::warning:: ( $? ) cmake missing or malformed CMakeList.txt (?)" | process_input;
            fi;
            if [[ "${PIPESTATUS[0]}" == 0 ]]; then
              if ${{ inputs.upload }}; then
                echo 'build_files=1' >> "${GITHUB_ENV}";
                cp -Rf ./build ${github}/ && echo -e '\n####################\n\tbuild directory copied continuing...\n####################\n' | process_input;
              fi;
            fi;
          fi;
          if [[ -e 'compile_commands.json' ]]; then
            echo -e '\n####################\n\tcompile_commands.json file symlinked continuing...\n####################\n' | process_input;
          fi;
          if [[ -f "${clang_file}" ]] && ${{ env.analyzer == 1 }}; then
            echo ' ' >> "${clang_file}";
            files_list=false
            if [[ `header2_list` ]] && [[ `source_list` ]] ; then
              echo -e "\n####################\n\t${file_type} file(s) found continuing...\n####################\n" | process_input;
              header2_list >> "${clang_file}";
              source_list >> "${clang_file}";
              files_list=true
            elif [[ `source_list` ]]; then
              echo -e "\n####################\n\t${file_type} file(s) found continuing...\n####################\n" | process_input;
              source_list >> "${clang_file}";
              files_list=true
            else	
              echo -e "\n::error::No ${file_type} files found searching repository\nExiting...\n" | process_input;
            fi;
            echo -e "\n####################\n\t${clang_file} found continuing...\n####################\n" | process_input;
            echo -e '\n####################\nCLANG-TIDY CONFIG CHECKED\n####################\n' | process_input;
            if [[ "${files_list}" ]]; then
              cp -vf "${clang_file}" 'build/check-source-files.txt' 2>/dev/null;
              echo -e '\n####################\nCLANG-TIDY ANALYZING FILE\n####################\n' | process_input;
              { time clang-tidy @parameter-file; } 2>&1 | process_input;
              if [[ -s "${project_log}" ]] && [[ $(grep -sE 'error:|Error:|Error while processing|ERROR:' "${project_log}") ]]; then
              echo -e "::notice::Errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]]; then
              echo -e "::notice::No errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            fi;
            else
              exit 1
            fi;
          elif [[ ! -e "${clang_file}" ]] && ${{ env.analyzer == 1 }}; then
            echo -e "\n####################\n\t::error:: parameter-file missing in repo Exiting...\n####################\n" | process_input;
            exit 1
          fi;
          if [[ -e "${clang_run}" ]] && ${{ env.analyzer == 2 }}; then
            echo -e "\n####################\n\trun-clang-tidy.py found continuing...\n####################\n" | process_input;
            sudo chmod -v 0755 "${clang_run}" 2>/dev/null | process_input;
            sudo chmod -R 0755 "${clang_fix}" 2>/dev/null;
            echo -e '\n####################\nRUN-CLANG-TIDY ANALYZING FILE\n####################\n' | process_input;
            { time "${{ github.action_path }}/scripts/tools/run-clang-tidy.py" -p build -config-file "${clang_tidy}" -fix -export-fixes build/fixes -j "$(nproc --all)" -enable-check-profile; } 2>&1 | process_input;
            if [[ -s "${project_log}" ]] && [[ $(grep -sE 'error:|Error:|Error while processing|ERROR:' "${project_log}") ]]; then
              echo -e "::notice::Errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]]; then
              echo -e "::notice::No errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            fi;
          elif [[ ! -e "${clang_run}" ]] && ${{ env.analyzer == 2 }}; then
            echo -e "\n####################\n\t::error:: run-clang-tidy.py missing in repo Exiting...\n####################\n" | process_input;
            exit 1
          fi;
          if [[ -f "${clangd_tidy}" ]] && ${{ env.analyzer == 3 }}; then
            echo -e '\n####################\nCLANGD-TIDY ANALYZING FILE\n####################\n' | process_input;
            { time find "${src_tree%/*}" -not \( -path "*/CMakeFiles" -prune -o -path "*/build" -prune -o -path "*/.git" -prune -o -path "*/.github" -prune \) -type f -name "*.${file_type}" -print0 | sort -nz | cut -d' ' -f 2- 2>/dev/null | xargs -0 -r -n 4 -P "$(nproc --all)" bash -c 'clangd-tidy "$@" -p build/ -j "$(nproc --all)" --color always --tqdm -- -I"${includes_dir#./}" || true' bash; } 2>&1 | process_input;
            if [[ -s "${project_log}" ]] && [[ $(grep -sE 'error:|Error:|Error while processing|ERROR:' "${project_log}") ]]; then
              echo -e "::notice::Errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]]; then
              echo -e "::notice::No errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            fi;
          elif [[ ! -e "${clangd_tidy}" ]] && ${{ env.analyzer == 3 }}; then
            echo -e "\n####################\n\t::error::${clangd_tidy##/*} file missing in repo Exiting...\n####################\n" | process_input;
            exit 1
          fi;
          if [[ -d 'build' ]] && ${{ env.analyzer == 4 }}; then
            echo -e '\n####################\n\tbuild directory created continuing...\n####################\n' | process_input;
            echo -e '\n####################\n\tCodeChecker building compile_commands.json and running analyzer...\n####################\n' | process_input;
            sudo bash -c 'source ~/.bashrc';
            if [[ -e "/home/runner/codechecker/venv/bin/activate" ]]; then
             sudo bash -c 'source /home/runner/codechecker/venv/bin/activate'
            else
             echo -e "\nUnable to source ( /home/runner/codechecker/venv/bin/activate ) file\n" | process_input;
            fi;
            [[ -e '/build/compile_commands.json' ]] && rm -vf ./build/compile_commands.json | process_input;
            CodeChecker log --build "make" --output ./compile_commands.json && { time CodeChecker analyze ./compile_commands.json --enable sensitive --output ./reports && CodeChecker fixit --checker-name bugprone-suspicious-string-compare --apply ./reports; } 2>&1 | process_input;
            if [[ -s "${project_log}" ]] && [[ $(grep -sE 'error:|Error:|Error while processing|ERROR:' "${project_log}") ]]; then
              echo -e "::notice::Errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]]; then
              echo -e "::notice::No errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            fi;
          elif [[ ! -d 'build' ]] && ${{ env.analyzer == 4 }}; then
            echo -e "\n####################\n\t::error:: build directory missing in repo Exiting...\n####################\n" | process_input;
            exit 1
          fi;
          if [[ -d 'build' ]] && ${{ inputs.build }}; then
            echo -e '\n####################\n\tBuilding project from sources...\n####################\n' | process_input;
            sudo bash -c 'source ~/.bashrc';
            if [[ -e "/home/runner/codechecker/venv/bin/activate" ]]; then
             sudo bash -c 'source /home/runner/codechecker/venv/bin/activate'
            else
             echo -e "\nUnable to source ( /home/runner/codechecker/venv/bin/activate ) file\n" | process_input;
            fi;
            { time CodeChecker check -b "cmake clean && cmake" -o ./results && CodeChecker server && CodeChecker store ./results -n "${repository}"; } 2>&1 | process_input;
            if [[ -s "${project_log}" ]] && [[ $(grep -sE 'error:|Error:|Error while processing|ERROR:' "${project_log}") ]]; then
              echo -e "::notice::Errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]]; then
              echo -e "::notice::No errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            fi;
            if ${{ inputs.upload }}; then
              echo 'build_files=1' >> "${GITHUB_ENV}";
              cp -Rf ./build ${github}/ && echo -e '\n####################\n\tbuild directory copied continuing...\n####################\n' | process_input;
            fi;
          elif [[ ! -d 'build' ]] && ${{ env.analyzer == 4 }}; then
            echo -e "\n####################\n\t::error:: build directory missing in repo Exiting...\n####################\n" | process_input;
            exit 1
          fi;
          if [[ -s "${project_log}" ]]; then
            echo -e "\n####################\n\t${project_log##*/} file found continuing...\n####################\n" | process_input;
            clang_files_missing=$(grep -sFc 'file not found' "${project_log}");
            clang_files_list=$(grep -sF 'file not found' "${project_log}" | awk '{print $3}' | awk '!seen[$0]++');
            clang_warnings=$(grep -sEc 'warning:|Warning:|WARNING:' "${project_log}");
            clang_errors=$(grep -sEc 'error:|Error:|Error while processing|ERROR:' "${project_log}");
            clang_fixits=$(grep -sEc 'fixit|fix-its|Fixit|Fix-Its|FIXIT|FIX-ITS' "${project_log}");
            clang_notes=$(grep -sEc 'note:|Note:|NOTE:' "${project_log}");
            if [[ "${clang_warnings:-0}" > '0' ]]; then
              echo -e "\n####################\n::notice::⚠️ check-file found ${clang_warnings}️ warnings in ${file_type} file(s) checked. [Hints] Try using (warnings-as-errors) for possible fixes.\n####################\n" | process_input;
            fi;
            if [[ "${clang_errors:-0}" > '0' ]]; then
              echo -e "\n####################\n::notice::🚫 check-file found ${clang_errors} errors in ${file_type} file(s) checked. [Hints] Try using (analyzer: 1, 2, or 4) for possible error fixes.\n####################\n" | process_input;
            fi;
            if [[ "${clang_fixits:-0}" > '0' ]]; then
              echo -e "\n####################\n::notice::✅ check-file applied ${clang_fixits} fix-its to ${file_type} file(s) checked. [Hints] Try using (update: true) for updating remote repository.\n####################\n" | process_input;
            fi;
            if [[ "${clang_notes:-0}" > '0' ]]; then
              echo -e "\n####################\n::notice::☑ check-file added ${clang_notes} notes on ${file_type} file(s) checked. [Hints] Notes are suggestions for files and not directly issues.\n####################\n" | process_input;
            fi;
            if [[ "${clang_files_missing:-0}" > '0' ]]; then
              echo -e "\n####################\n::notice::❌ check-file discovered ${clang_files_missing} missing include files in ${file_type} file(s) checked. [Hints] Files may be there yet not included and not directly missing.\n####################\n" | process_input;
              echo -e "\n####################\nMISSING FILES:\n####################\n\n${clang_files_list}\n" | process_input;
            fi;
          fi;
          if [[ ${update} ]] && ${{ env.analyzer == 1 }}; then
            echo -e "\nPARAMETERS: $(rm -vf ${clang_file} 2>/dev/null)\n" | process_input;
          fi;
          if ${{ inputs.build }}; then
            cp -Rf ./build ${github}/ && echo -e '\n####################\n\tbuild directory updated continuing...\n####################\n' | process_input;
          fi;
          echo -e "\n####################\n\tINSTALLED COMPILERS\n####################\n\n${compiler_list}\n" | process_input;
          if [[ ${check_build} ]]; then
            echo -e '\n####################\n\tProject Checked Exiting...\n####################\n' | process_input;
          else
            echo -e '\n####################\n\tProject Not Checked Exiting...\n####################\n' | process_input;
          fi;
        else
          echo -e '::error::Missing .git directory' | process_input;
        fi;
      shell: bash
      continue-on-error: true

    - name: Check & Repair (Clang-tools)
      if: inputs.filename != ''
      run: |
        export LC_ALL=C
        SAVEIFS=${IFS}
        include_count=1
        include_total=1
        compile_json=$(sudo find . -type f -name 'compile_commands.json' -print -quit);
        build_cache='build_cache';
        file_count=1
        file_name="${{ inputs.filename }}";
        file_type="${file_name##*.}";
        cppchecks='.cppcheck';
        error_log="${GITHUB_WORKSPACE}/${{ inputs.filename }}_error.log";
        src_tree=$(sudo find ${{ env.file_path }} -type d -name '.git' -print -quit);
        checked=false
        count2=0
        github=${GITHUB_WORKSPACE};
        process_input() {
          while IFS= read -r log; do
            if ${{ inputs.output == 1 }}; then
              echo -e "${log}" | tee -a "${error_log}";
            elif ${{ inputs.output == 2 }}; then
              echo -e "${log}" >> "${error_log}";
            elif ${{ inputs.output == 3 }}; then
              echo -e "${log}";
            fi;
          done;
        } 2>&1;
        if ${{ inputs.database }}; then
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(grep -sF "/${{ inputs.filename }}" "${{ env.database }}" 2>/dev/null);
            echo -e "\n####################\nLiteral String Pattern Matching Active\n####################\n" | process_input;
          else
            regex="\${{ inputs.filename }}$";
            files=$(grep -sE "${regex}" "${{ env.database }}" 2>/dev/null);
            echo -e "\n####################\nExtended Regex Pattern Matching Active\n####################\n" | process_input;
          fi;
          clang_file=$(grep -sF -m 1 '.clang-tidy' "${{ env.database }}");
          repaired=$(grep -sF -m 1 'check-file-repaired.txt' "${{ env.database }}");
        else
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(sudo find ${{ env.file_path }} -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "${{ inputs.filename }}" -print);
          else
            files=$(sudo find ${{ env.file_path }} -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "*${{ inputs.filename }}" -print);
          fi;
          clang_file=$(sudo find ${{ env.file_path }} -type f -name '.clang-tidy' -print -quit);
          repaired=$(sudo find ${{ env.file_path }} -type f -name 'check-file-repaired.txt' -print -quit);
        fi;
        if [[ $(echo "${file_type}" | egrep "^c$|^c.$|^c..$|^h$|^h.$|^h..$|^t$|^t.$|^t..$") ]] && [[ -n ${files} ]]; then
          echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################\n" | process_input;
          if [[ -f "${clang_file}" ]] && ${{ inputs.repair }}; then
            echo -e '\n####################\n\t.clang-tidy found continuing...\n####################\n' | process_input
          elif [[ ! -f "${clang_file}" ]] && ${{ inputs.repair }}; then
            echo -e "\n####################\n::error:: .clang-tidy not found exiting...\n####################\n" | process_input;
            exit 1
          fi;
          if [[ -f "${compile_json}" ]] && ! ${{ inputs.include }}; then
            echo -e '\n####################\n\tcompile_commands.json found continuing...\n####################\n' | process_input 
          elif [[ ! -f "${compile_json}" ]] && ! ${{ inputs.include }}; then
            echo -e "\n####################\n::error:: compile_commands.json not found\nUse inputs.project: true to create it exiting...\n####################\n" | process_input;
            exit 1
          fi;
