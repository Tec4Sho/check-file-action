    - name: Build For Arm/Arm64 Devices
      if: contains(fromJSON('["arm", "arm64", "aarch64"]'), env.arch) && inputs.build == '5' && inputs.pattern == ''
      run: |
        source ~/.bashrc
        start_time="${{ env.seconds }}";
        export CMAKE_EXPORT_COMPILE_COMMANDS=ON
        export CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)";
        export CLANG_TRIPLE=arm-linux-android-
        export SYSROOT="${SYSROOT}";
        codechecker='codechecker.yaml';
        compiler_list=$(dpkg --list | grep compiler | tr -d 'ii');
        repository=${{ github.event.repository.name }};
        github="${GITHUB_WORKSPACE}";
        project_log="${github}/${repository}_project.log";
        build_fixes='build/fixes.yaml';
        check_build=false
        check_exit=0
        file_type='c';
        envsetup=$(fdfind -p -a -t f -1 'envsetup.sh' "${github}");
        update=true
        process_input() {
          case "${{ inputs.output }}" in
            1) tee -a "${project_log}" ;; # Show in console AND save
            2) cat >> "${project_log}" ;;  # Save only (append)
            3) cat ;;                   # Show in console only
            4) cat >/dev/null ;;        # Completely silent
            *) cat ;;                   # Default fallback
          esac
        }
        if ${{ inputs.repository == 'false' }} && ${{ env.dirname != '' }}; then
          cd "${{ env.dirname }}" && echo -e "\n\033[1mUser Current Directory\033[0m: ${{ env.dirname }}" | process_input;
          codechecker=$(fdfind -p -a -t f -1 'codechecker.yaml' "${github}");
          compile_json=$(fdfind -p -a -t f -1 'compile_commands.json' "${github}");
          check_radio=$(fdfind -p -a -t f -1 -g '**/tools/check_radio_versions.py' "${github}");
          if [[ -n "$check_radio" ]]; then
            fdfind -p -a -t f 'check_radio_versions.py' "${github}" | while read -r script; do
              echo -e "\033[33mNeutralizing legacy script\033[0m: $script";
              printf "#!/usr/bin/env python\nimport sys\nsys.exit(0)\n" | sudo tee "$script";
              sudo chmod +x "$script";
            done;
          fi;
          fdfind -p -a -e "py" "${github}" | xargs sudo sed -i '1s|.*|#!/usr/bin/env python2|' && echo -e "\033[32mAll legacy scripts neutralized successfully.\033[0m";
          # Find the Makefile in the parent directory (hdmitx) and comment out the mt8163 line
          # Target the Makefile INSIDE the mt8163 directory
          SUB_MAKEFILE=$(fdfind -p -a -t f -g -1 "**/hdmitx/mt8163/Makefile" "${github}")
          if [[ -f "$SUB_MAKEFILE" ]]; then
            echo -e "\033[33mFixing MTK Recursive Path Typo in\033[0m: $SUB_MAKEFILE";
            # This prevents 'mt8163' from looking for another 'mt8163' folder inside itself
            sudo sed -i 's|obj-y += mt8163/||g' "$SUB_MAKEFILE";
          fi;
        fi;
        if [[ -f 'compile_commands.json' ]]; then
          compile_json='compile_commands.json';
        elif [[ -f 'build/compile_commands.json' ]]; then
          compile_json='build/compile_commands.json';
        fi;
        if ${{ inputs.filetype != '' }}; then
          file_type="${{ inputs.filetype }}";
        fi;
        echo -e "\n\033[33mCurrent python:\033[0m \033[1m$(python --version 2>&1)\033[0m \033[32m(active)\033[0m";
        build_module() {
          local llvm_version="${{ inputs.release }}";
          local arch_target="${{ env.arch }}";
          local kroot="${{ env.SRCTREE }}";
          local kernel_cpus=$(find "${{ env.base }}" \( -path '*/device/*' -o -path '*/vendor/*' -o -path "*/${{ inputs.DEVICE_NAME }}/*" \) -type f \( -name 'BoardConfig.mk' -o -name '*.mk' \) -print | xargs -r awk '/TARGET_CPU_VARIANT/ {print $NF; exit}' | grep -s . || false)
          [[ -z $kernel_cpus ]] && kernel_cpus='generic';
          if [[ "$arch_target" == "arm"* ]] && [[ "$arch_target" != *"64"* ]] && [[ "$kernel_cpus" == 'cortex-a7' ]]; then
            export ARCH=arm \
            CLANG_TRIPLE=arm-linux-gnueabihf- \
            CROSS_COMPILE=arm-linux-androideabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="clang --target=arm-linux-androideabi" \
            LD="clang --target=arm-linux-androideabi -fuse-ld=lld" \
            KCFLAGS="-mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard";
          elif [[ "$arch_target" =~ ^(arm64|aarch64) ]] && [[ "$kernel_cpus" == 'cortex-a53' ]]; then
            export ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="clang --target=aarch64-linux-android" \
            LD="ld.lld" \
            KCFLAGS="-mcpu=cortex-a53";
          elif [[ "$arch_target" =~ ^(arm64|aarch64) ]]&& [[ "$kernel_cpus" == 'cortex-a72' ]]; then
            export ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="clang --target=aarch64-linux-android" \
            LD="ld.lld" \
            KCFLAGS="-mcpu=cortex-a72";
          else
            export KCFLAGS="-mcpu=$kernel_cpus" CC=clang;
          fi;
          echo -e "\n\033[32mbuild module vars exported\033[0m" | process_input;
        } 2>/dev/null
        if ${{ env.build_files == '1' }}; then
          echo -e "\nChecking gcc for default includes:" | process_input;
          if [[ ${{ inputs.filetype }} == [c] ]] && ${{ inputs.content == 'true' }}; then
            `gcc -print-prog-name=cc1` -v | process_input || echo -e "\n::notice::gcc exit-code ($?)" | process_input;
          elif [[ ${{ inputs.filetype }} == [c]* ]] && ${{ inputs.content == 'true' }}; then
            `gcc -print-prog-name=cc1plus` -v | process_input || echo -e "\n::notice::gcc exit-code ($?)" | process_input;
          fi;
          echo | gcc -v -E - 2>&1 | awk '/#include <...> search starts here:/{flag=1;next} /End of search list./{flag=0} flag' | process_input || echo -e "\n::notice::gcc exit-code ($?)" | process_input;
          echo -e '\n####################\n\tCodeChecker building project from sources...(test-run -1)\n####################\n' |  process_input;
          if [[ -e "/home/runner/codechecker/venv/bin/activate" ]]; then
            source /home/runner/codechecker/venv/bin/activate
          else
            echo -e "\nUnable to source ( /home/runner/codechecker/venv/bin/activate ) file\n" | process_input;
          fi;
          export TERM=dumb
          export HOSTCFLAGS="-fcommon";
          export HOSTCXXFLAGS="-fcommon";
          export ALLOW_MISSING_DEPENDENCIES=true
          export MAKEFILE_NAME="${{ inputs.makefile }}";
          export FILENAME="${{ env.filename }}";
          export TW_THEME=$(find "${{ env.base }}" \( -path '*/device/*' -o -path '*/vendor/*' -o -path "*/${{ github.event.inputs.DEVICE_NAME }}/*" \) -type f \( -name 'BoardConfig.mk' -o -name '*.mk' \) -print | xargs -r awk '/TW_THEME/ {print $NF; exit}' | grep -s . || false)
          export TARGET_SCREEN_HEIGHT=$(find "${{ env.base }}" \( -path '*/device/*' -o -path '*/vendor/*' -o -path "*/${{ github.event.inputs.DEVICE_NAME }}/*" \) -type f \( -name 'BoardConfig.mk' -o -name '*.mk' \) -print | xargs -r awk '/TARGET_SCREEN_HEIGHT/ {print $NF; exit}' | grep -s . || false)
          export TARGET_SCREEN_WIDTH=$(find "${{ env.base }}" \( -path '*/device/*' -o -path '*/vendor/*' -o -path "*/${{ github.event.inputs.DEVICE_NAME }}/*" \) -type f \( -name 'BoardConfig.mk' -o -name '*.mk' \) -print | xargs -r awk '/TARGET_SCREEN_WIDTH/ {print $NF; exit}' | grep -s . || false)
          if [[ -e "${codechecker}" ]] && [[ -e "${envsetup}" ]] && ${{ inputs.module == 'true' }}; then
            echo -e "\ENVSETUP FILE: ${envsetup} found" | process_input;
            echo -e "\nCODECHECKER CONFIG: ${codechecker} found continuing...\n" | process_input;
            build_module 
            # 1. Source and Lunch first to populate the variables /KERNEL_OBJ TARGET_OUT_INTERMEDIATES
            source ${envsetup} && lunch $MAKEFILE_NAME
            [[ ! -n "$(get_build_var TARGET_ARCH)" ]] && DYN_ARCH="${{ env.arch }}" || DYN_ARCH=$(get_build_var TARGET_ARCH);
            DYN_CROSS=$(get_build_var TARGET_KERNEL_CROSS_COMPILE_PREFIX | xargs)
            DYN_KERNEL_SRC=$(get_build_var KERNEL_SRC_DIR)
            if [[ -z "$DYN_KERNEL_SRC" ]]; then
              PREBUILT_PATH=$(get_build_var TARGET_PREBUILT_KERNEL)
              DYN_KERNEL_SRC=$(dirname "$PREBUILT_PATH")
            fi;
            DYN_KERNEL_SRC="${DYN_KERNEL_SRC:-.}";
            DYN_OUT=$(get_build_var OUT_DIR)
            mkdir -p "$DYN_OUT";
            BUILD_CMD="export HOSTCFLAGS='-fcommon' && \
              export KCFLAGS='-w' && \
              make -C $DYN_KERNEL_SRC O=$DYN_OUT ARCH=$DYN_ARCH CROSS_COMPILE=$DYN_CROSS alldefconfig && \
              make -j$(nproc) -C $DYN_KERNEL_SRC O=$DYN_OUT ARCH=$DYN_ARCH CROSS_COMPILE=$DYN_CROSS $FILENAME";
            export BUILD_CMD
            CodeChecker check \
              --config "${codechecker}" \
              --jobs "$(nproc)" \
              --print-steps \
              --build "bash -c '$BUILD_CMD'" 2>&1 | process_input;
            check_exit=${PIPESTATUS[0]}
          elif [[ "${envsetup}" ]] && ${{ inputs.module == 'true' }}; then
            echo -e "\n${codechecker} file was not found continuing without...\n" | process_input;
            BUILD_CMD="source ${envsetup} && lunch \$MAKEFILE_NAME && make \$FILENAME -j\$(nproc) -k";
            CodeChecker check \
              --jobs "$(nproc)" \
              --print-steps \
              --build "bash -c '$BUILD_CMD'" 2>&1 | process_input;
            check_exit=${PIPESTATUS[0]}
          elif ${{ inputs.module == 'true' }}; then
            echo -e "\n${codechecker} file was not found continuing without...\n" | process_input;
            CodeChecker check \
              --jobs "$(nproc)" \
              --print-steps \
              --build "make ${{ inputs.makefile }} -nB -j$(nproc) -k" 2>&1 | process_input;
              check_exit=${PIPESTATUS[0]}
          fi;
          if [[ -e "${codechecker}" ]] && [[ -e "${envsetup}" ]] && ${{ inputs.module == 'false' }}; then
            echo -e "Source: ${envsetup}";
            echo -e "\n${codechecker} file was found continuing...\n" | process_input;
            BUILD_CMD="source /tmp/build_env.sh && source ${envsetup} && lunch \$MAKEFILE_NAME && build_alone \$FILENAME -j\$(nproc) -k";
            CodeChecker check \
              --config "${codechecker}" \
              --jobs "$(nproc)" \
              --print-steps \
              --build "bash -c '$BUILD_CMD'" 2>&1 | process_input;
            check_exit=${PIPESTATUS[0]}
          elif [[ "${envsetup}" ]] && ${{ inputs.module == 'false' }}; then
            echo -e "\n${codechecker} file was not found continuing without...\n" | process_input;
            BUILD_CMD="source /tmp/build_env.sh && source ${envsetup} && lunch \$MAKEFILE_NAME && build_alone \$FILENAME -j\$(nproc) -k";
            CodeChecker check \
              --jobs "$(nproc)" \
              --print-steps \
              --build "bash -c '$BUILD_CMD'" 2>&1 | process_input;
            check_exit=${PIPESTATUS[0]}
          elif ${{ inputs.module == 'false' }}; then
            echo -e "\n${codechecker} file was not found continuing without...\n" | process_input;
            CodeChecker check \
              --jobs "$(nproc)" \
              --print-steps \
              --build "make ${{ inputs.makefile }} -nB -j$(nproc) -k" 2>&1 | process_input;
              check_exit=${PIPESTATUS[0]}
          fi;
          if [[ -s "${project_log}" ]] && grep -aiFq 'Process completed with exit code' "${project_log}"; then
            echo -e "\n::notice::CodeChecker check exit-code ($check_exit)" | process_input;
            echo 'check_build=false' >> "${GITHUB_ENV}";
          elif [[ "$check_exit" == "1" ]] || [[ -s "${project_log}" ]] && grep -aiFq 'error:' "${project_log}"; then
            echo -e "\n::notice::\033[31mErrors found building project files!\033[0m" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
          elif [[ -s "${project_log}" ]]; then
            echo -e "\n::notice::\033[32mNo errors found building project files!\033[0m" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
          fi;
          if ${{ inputs.upload }}; then
            echo 'build_files=1' >> "${GITHUB_ENV}";     
          fi;
          if [[ -s "${project_log}" ]]; then
            grep -awE ' CC | C\+\+ ' "${project_log}" | grep -aiv '\.s' | awk '{ print $2 }' | sed -E "s/\.o$/.$file_type/g" | sort > 'build-source-files.txt'
            [[ -s 'build-source-files.txt' ]] && echo -e "\n\033[33mBuild Source Files:\033[0m Can be added to your repo for cmake custom build \033[1mcompile_commands_json\033[0m file.\nLocation: $(cp -v build-source-files.txt ${github}/build)" | process_inputs;
            cp -f "${project_log}" "${github}/build";
          fi;
          echo -e "\n\033[1mBuild test-run completed\033[0m" | process_input;
        else
          echo '::error::No cmake build files were found. Is (project: true) set?\n Exiting.....' | process_inputs;
