    - name: Uploading ${{ github.repository }} Project Report Artifacts
      if: inputs.report == 'true' && inputs.project == 'true' && env.file_found == '1' && env.file1_parted == '1'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ github.event.repository.name }}_split_project.log
        path: part_*
        include-hidden-files: true
      env: # Revert to standard paths so LLVM-ARM doesn't break the Node.js logic       
        PATH: ${{ env.BACKUP_PATH }}
        LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
        PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
        DEBIAN_FRONTEND: noninteractive
      continue-on-error: true

    - name: Delete Files
      if: env.filename != '' || inputs.pattern != '' || inputs.project == 'true'
      run: |
        date
        if [[ -f "${{ env.github_repository }}_project.log" ]]; then
          echo -e "\nPROJECT: $(rm -vf ${{ env.github_repository }}_project.log)";
        fi;
        if [[ -f "${{ env.filename }}_error.log" ]]; then
          echo -e "\nLOGFILE: $(rm -vf ${{ env.filename }}_error.log)";
        fi;
        if [[ -f "${{ env.filename }}_data.log" ]]; then
          echo -e "\nDATAFILE: $(rm -vf ${{ env.filename }}_data.log)";
        fi;
        if [[ -e "database" ]]; then
          echo -e "\nDATABASE: $(rm -vf database)";
        fi;
        echo '';
      shell: bash
      continue-on-error: true

    - name: Save Project
      if: inputs.cache == 'true' && ( inputs.stored == 'true' || inputs.source == 'true' || env.includes == 'true' ) && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      id: save
      with:
        path: |
          ./build
          compile_commands.json
          check-file-sources.txt
          check-file-includes.txt
          check-file-repaired.txt
        key: ${{ steps.restore.outputs.cache-primary-key }}
        enableCrossOsArchive: true
      continue-on-error: true

    - name: Action Check
      if: env.filename == '' && inputs.pattern == '' && inputs.project == 'false' && inputs.source == '0'
      run: |
        echo ''
        echo -e "\n::debug::No input provided to:= filename: none • filetype: none • pattern: none • project: false • source: 0\n\tNothing To Do! ?\n";
      shell: bash
      continue-on-error: true

    - name: Check Project Size
      run: |
        echo ''; 
        echo -e "\033[33mRepository Project Total Size:\033[0m \033[1m$(du ${{ env.base }} -shx)\033[0m\n";
      shell: bash
      continue-on-error: true

    - name: Exiting
      run: |
        echo '';
        text() {
          local text="$1";
          echo -e "${text}";
        }
        aurther="By: \033[4m\033[3mGerrard Johnson\033[0m";
        texta="######################";
        textb="#\033[1m\033[32m CHECK FILE EXITING \033[0m#";
        textc="######################";
        text "${aurther}\n";
        text "${texta}";
        text "${textb}";
        text "${textc}\n";
      shell: bash
      continue-on-error: true
