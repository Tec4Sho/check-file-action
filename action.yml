        include_files=$(fdfind -p -c auto "${abs}" -e "${{ inputs.filetype }}" "${{ env.base }}" | awk -F'/' '{print $NF, $0}' | sort -k1,1 | cut -d' ' -f2-);
        [[ -f "${include_list}" ]] && mv -f "${include_list}" "${include_list}.old";
