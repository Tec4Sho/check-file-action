        CC_LOGGER_GCC_LIKE="gcc:g++:clang:clang++:/cc:c++";
        ${{ inputs.include == 'true' }} && C_INCLUDE_PATH="/usr/local/include:/usr/src/linux-headers-$(uname -r)/include:${C_INCLUDE_PATH}" && CPLUS_INCLUDE_PATH="/usr/local/include:/usr/src/linux-headers-$(uname -r)/include:${CPLUS_INCLUDE_PATH}";
        ${{ inputs.internal == 'true' }} && C_INCLUDE_PATH="${LINUXINCLUDE// /} ${USERINCLUDE// /}" && CPLUS_INCLUDE_PATH="${LINUXINCLUDE// /} ${USERINCLUDE// /}";
        codechecker='codechecker.yaml';
        compiler_list=$(dpkg --list | grep compiler | tr -d 'ii');
        repository=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
