name: Check File Action
description: 'Check file - Add filename to check for errors or text Word to search for within workspace files'
inputs:
  repository:
    description: 'Auto clone user remote repo locally for checks'
    type: boolean
    required: false
    default: 'true'
  absolute:
    description: 'Search will use absolute over relative path from github workspace'
    type: boolean
    required: false
    default: 'true'
  analyzer:
    description: 'Analyze all project files using options 1 - 2 - 3 - 4'
    required: false
    default: 0
    type: choice
    options:
    - 0 # disable project analyzer
    - 1 # run-clang-tidy.py - fastest for large project file checks. fix-its
    - 2 # clang-tidy - faster for small an large project file checks. fix-its
    - 3 # clangd-tidy - fast large project file checks.
    - 4 # codechecker - compiler project file check reports.
  filename:
    description: 'Check for filename or search for text word matches'
    type: string
    required: false
    default: ''
  filetype:
    description: 'Check only these file extension types when searching for text word matches'
    type: string
    required: false
    default: 'c'
  internal:
    description: 'If checking kernel builds or projects that dont depend on external /usr/ includes'
    type: string
    required: false
    default: 'true'
  makefile:
    description: 'Make filename for building project source'
    type: string
    required: false
    default: 'Makefile'
  database:
    description: 'Use custom database over fdfind real-time file searches for added performance'
    type: boolean 
    required: false
    default: 'false'
  dirpath:
    description: 'Directory to search for files, if set an no file match it will switch to full search for file matches'
    type: string
    required: false
    default: 'workspace'
  dirname:
    description: 'If using project true with build # & repository false the directory for build to check'
    type: string
    required: false
    default: 'workspace'
  pattern:
    description: 'Search for pattern matches in filetypes or all files'
    type: string
    required: false
    default: ''
  project:
    description: 'Fix Errors found while building project or check build only'
    type: boolean
    required: false
    default: 'false'
  version:
    description: 'LLVM Clang vsrsion used for project'
    type: number
    required: false
    default: '21'
  release:
    description: 'LLVM embeded-toolchain-arm version used for arm kernels only'
    type: number
    required: false
    default: '19.1.1'
  recheck:
    description: 'Recheck files repaired by check-file'
    type: boolean
    required: false
    default: 'false'
  repair:
    description: 'Check file and fix if able when searching for errors'
    type: boolean
    required: false
    default: 'false'
  report:
    description: 'Errors found will be logged and sent to repository releases'
    type: boolean
    required: false
    default: 'false'
  content:
    description: 'Search will list dir contents of found filename'
    type: boolean
    required: false
    default: 'false'
  include:
    description: 'Check include file when checking source C/C++ filename'
    type: boolean
    required: false
    default: 'true'
  source:
    description: 'Check all soucre files for include directories to auto add for clang/cmake'
    required: false
    default: 0
    type: choice
    options:
    - 0 # Disabled
    - 1 # Locate user includes in sources and display file info.
    - 2 # Locate system includes in sources and display file info.
    - 3 # Locate user & system includes in sources and display file info fast.
  number:
    description: 'Number of files to check before stopping action'
    type: number
    required: false
    default: 0
  module:
    description: 'Make kernel modules when building project source'
    type: boolean
    required: false
    default: 'false'
  stored:
    description: 'Checked files with errors repaired are skipped if ran again'
    type: boolean
    required: false
    default: 'false'
  update:
    description: 'If errors repaired push changes to remote repository'
    type: boolean
    required: false
    default: 'false'
  upload:
    description: 'Upload build files for compile_commands.json'
    type: boolean
    required: false
    default: 'false'
  output:
    description: 'Output log stdout type 1,2 or 3'
    required: false
    default: 1
    type: choice
    options:
    - 1 # Output to terminal log and error/project file.
    - 2 # Output to error/project file only.
    - 3 # Output to terminal log only.
    - 4 # Disable most output.
  format:
    description: 'Run-clang-tidy with clang-format enabled'
    type: boolean
    required: false
    default: 'false'
  build:
    description: 'Fix Errors found while building repository project'
    type: choice
    required: false
    default: '0'
    options:
    - 0 # Disable building projects.
    - 1 # Build & check project. [CodeChecker Dry-Run Multiple-Files]
    - 2 # Build new compile_commands_json & check project. [CodeChecker Build Multiple-Files]
    - 3 # Build check includes & check project. [Deheader Dry-Run Multiple-Files]
    - 4 # Build fix includes & check project. [Deheader Build Single-Files]
  clean:
    description: 'Clean workflow on checkout'
    type: boolean
    required: false
    default: 'true'
  cache:
    description: 'Cache Needed Project Files'
    type: boolean
    required: false
    default: 'false'
  token:
    description: Token to authenticate GitHub API requests
    type: string
    required: false
    default: ${{ github.token }}
  limit:
    description: 'Limit number of include directories when adding paths'
    type: number
    required: false
    default: 150
  linux:
    description: 'Linux project builds not android'
    type: boolean
    required: false
    default: true
  arch:
    description: 'Arch to set for checking kernel project includes'
    type: string
    required: false
    default: 'x86_64'
  list:
    description: 'Path to Cmakelist.txt to use for building cmake project'
    type: string
    required: false
    default: 'workspace/kernel/alps/tb8163p3_bsp'
  root:
    description: 'Start search from linux-os root directory not just github_workspace for database'
    type: boolean
    required: false
    default: 'false'
  rsp:
    description: 'Use cmake includes.C.rsp file for including many header paths in compile json file'
    type: boolean 
    required: false
    default: 'false'
  fix:
    description: 'Use to fix multiple NUll errors in files that a dev or program editor currupted'
    type: boolean 
    required: false
    default: 'false'
outputs:
  llvm-path:
    description: The absolute path to the LLVM installation
    value: ${{ steps.output-path.outputs.llvm-path }}

runs: # Uses default x86_64 / linux user machine
  using: composite
  steps:
    - name: Linux Distro Check
      run: |
        echo '';
        echo 'export ANSIBLE_FORCE_COLOR=true' | sudo tee -a ~/.bashrc >/dev/null;
        echo -e "####################\n\033[1mCheck-File-Action-Pro version 2.0.0 [\033[42mBeta Release\033[0m]\033[0m\n####################\n";
        echo -e "\033[1mCHECK-FILE:\033[0m Started: ${{ github.event.repository.updated_at }}\n";
        if [[ -r '/etc/os-release' ]]; then
          . /etc/os-release
          if [[ "${ID}" == 'ubuntu' ]]; then
            echo "Name: ${NAME}";
            echo "Version: ${VERSION}";
            echo "ID: ${ID}";
            echo "ID Like: ${ID_LIKE}";
            echo "Pretty Name: ${PRETTY_NAME}";
            echo "Version ID: ${VERSION_ID}";
          else
            echo "Not running an Ubuntu distribution. ID=${ID}, VERSION=${VERSION}";
          fi;
        else
          echo "Not running a distribution with /etc/os-release available";
        fi;
        echo '';
      shell: bash
      continue-on-error: true

    - name: Clone Recovery Repo
      if: inputs.repository == 'true'
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        clean: ${{ inputs.clean }}
        fetch-depth: 1
        show-progress: false
      continue-on-error: false

    - name: Restore Project Files
      if: inputs.cache == 'true' && ( inputs.stored == 'true' || inputs.source > '0' )
      id: restore
      uses: actions/cache/restore@v5
      env:
        cache-name: check-file-action
      with:
        path: |
          ./build
          compile_commands.json
          check-file-sources.txt
          check-file-includes.txt
          check-file-repaired.txt
        key: ${{ runner.os }}-${{ env.cache-name }}
        restore-keys: |
          ${{ runner.os }}
        enableCrossOsArchive: true
      continue-on-error: true

    - name: Access repo info and branch
      run: |
        echo '';
        if ${{ steps.restore.outputs.cache-hit == 'true' }}; then
          echo -e "####################\n\033[32m\033[1mCHECK-FILE:\033[0m Restored Project Configuration From Cache!\033[0m\n####################\n";
        fi;
        echo "Repository Owner and Name: ${GITHUB_REPOSITORY}";
        echo "Branch Name: ${{ github.ref_name }}";
        echo "GitHub URL: ${{ github.server_url }}";
        echo "Repository URL via context: ${{ github.server_url }}/${{ github.repository }}";
        echo -e "Ref (branch/tag) via context: ${{ github.ref }}\n";
      shell: bash
      continue-on-error: true

    - name: Install OpenJDK
      if: inputs.build == '1' || inputs.build == '2'
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 17
      continue-on-error: true

    - name: Setup Android SDK
      if: inputs.build == '1' || inputs.build == '2'
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
      env:
        SKIP_JDK_VERSION_CHECK: true
      continue-on-error: true

    - name: Set up Go 1.26
      if: inputs.filename != '' || inputs.filetype != '' || inputs.build > '0'
      uses: actions/setup-go@v2
      with:
        go-version: '1.26'
      continue-on-error: true

    - name: Setup An Clang Clean
      if: inputs.project == 'true' || inputs.filename != '' || inputs.filetype != ''
      run: |
        set +e
        source ~/.bashrc
        file_name="${{ env.filename }}";
        file_type="${file_name##*.}";
        github="${GITHUB_WORKSPACE}";
        repository=${{ github.event.repository.name }};
        echo "github_repository=${repository}" >> "${GITHUB_ENV}";
        if ${{ inputs.filename != '' }}; then
          echo "filename=${{ inputs.filename }}" >> "${GITHUB_ENV}";
        else
          echo "filename=${{ inputs.filetype }}" >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.build > '0' }}; then
          echo 'github_build_project=true' >> "${GITHUB_ENV}";
        else
          echo 'github_build_project=false' >> "${GITHUB_ENV}";
        fi;
        if [[ -z "${{ inputs.arch }}" ]]; then
          echo -e '\n::warning::Please remove empty arch option before running if not needed setting default x86_64';
          echo 'arch=x86_64' >> "${GITHUB_ENV}";
          arch='x86_64';
        else
          echo "arch=${{ inputs.arch }}" >> "${GITHUB_ENV}";
          arch="${{ inputs.arch }}";
        fi;
        TOOLCHAIN='';
        AUTO_ARCH="${TARGET_ARCH}";
        ARCH="${{ inputs.arch }}";
        COMPILERS='clang:clang++:gcc:g++:cc:c++';
        SRCTREE="$GITHUB_WORKSPACE" >> "$GITHUB_ENV";
        find_vendor_kernel() {
          local target_arch=$1
          local dirname="${{ inputs.dirname }}";
          [[ "$dirname" != '' ]] && dirname="/${dirname}";
          echo -e "\nSearching for $target_arch module linker script...";
          local compilier=$(find "$GITHUB_WORKSPACE" \( -path "*${dirname}/prebuilts/*" -o -path "*${dirname}/toolchain/*" \) -type f \( -name "*-gcc" -o -name "*-clang" \) -print);
          local lds_file=$(find "$GITHUB_WORKSPACE" -path "*/arch/$target_arch/*" -name "module.lds" | head -n 1);
          if [[ -z "$lds_file" ]]; then
           echo "module.lds not found. Searching for any .lds in arch/$target_arch..."
            lds_file=$(find "$GITHUB_WORKSPACE" -path "*/arch/$target_arch/*" -name "*.lds" | head -n 1)
          fi;
          if [[ -z "$lds_file" ]]; then
            echo "::error::Could not find a valid linker script for $target_arch.";
          fi;
          local current_dir="${lds_file%/*}";
          local kroot=""; 
          while [[ "$current_dir" != "$GITHUB_WORKSPACE" && "$current_dir" != "/" ]]; do
            if [[ -f "${current_dir}/Makefile" && -d "${current_dir}/include" ]]; then
              kroot="$current_dir";
              break;
            elif [[ -f "${current_dir}/Makefile" && -d "${current_dir%/*}/include" ]]; then
              kroot="$current_dir";
              break;
            fi;
            current_dir="${current_dir%/*}";
          done;
          if [[ -z "$kroot" ]]; then
            echo "::error::Found LDS but could not find Kernel Root (Makefile).";
            kroot="$current_dir";
          fi;
          echo "Detected LDS: $lds_file";
          echo "Kernel Directory: $kroot";
          echo "Toolchain Compilier: $compilier";
          export "SRCTREE=$kroot";
          export "LDS_PATH=$lds_file";
          echo "export LDS_PATH=$lds_file" | sudo tee -a ~/.bashrc >/dev/null;
          echo "export SRCTREE=$kroot" | sudo tee -a ~/.bashrc >/dev/null;
        }
        if ${{ inputs.linux == 'false' }}; then
          find_vendor_kernel "$ARCH";
          if [[ "${arch}" == 'arm' || "${arch}" == 'aarch32' || "${arch}" == 'armv7'* || "${arch}" == 'armeabi' || "${arch}" == 'armeabi-v7a' ]]; then
            ARCH="arm";
            TOOLCHAIN=$(find "$github" -path '*/toolchains/*' -type d -name 'arm-linux-androideabi' -print);
            AUTO_ARCH="${TARGET_ARCH:-arm-linux-androideabi}";
            COMPILERS='gcc:g++:arm-linux-androideabi-gcc:arm-linux-androideabi-g++';
          elif [[ "${arch}" == 'arm64' || "${arch}" == 'aarch64' || "${arch}" == 'armv8'* || "${arch}" == 'armeabi-v8a' ]]; then
            ARCH="arm64";
            TOOLCHAIN=$(find "$github" -path '*/toolchains/*' -type d -name 'aarch64-linux-android' -print);
            AUTO_ARCH="${TARGET_ARCH:-aarch64-linux-android}";
            COMPILERS='gcc:g++:aarch64-linux-android-gcc:aarch64-linux-android-g++';
          elif [[ "${arch}" == 'x86_64' ]]; then
            ARCH="x86_64";
            TOOLCHAIN=$(find "$github" -path '*/toolchains/*' -type d -name 'x86_64-linux-android' -print);
            AUTO_ARCH="${TARGET_ARCH:-x86_64-linux-android}";
            COMPILERS='gcc:g++:x86_64-linux-android-gcc:x86_64-linux-android-g++';
          elif [[ "${arch}" == 'x86' || "${arch}" == 'i686' || "${arch}" == 'i386' ]]; then
            ARCH="x86";
            TOOLCHAIN=$(find "$github" -path '*/toolchains/*' -type d -name 'i686-linux-android' -print);
            AUTO_ARCH="${TARGET_ARCH:-i686-linux-android}";
            COMPILERS='gcc:g++:i686-linux-android-gcc:i686-linux-android-g++';
          fi;
        else
          if [[ "${arch}" == 'arm' || "${arch}" == 'armv7'* || "${arch}" == 'armhf' ]]; then
          # Standard 32-bit ARM (Hard Float is common for PC/SBC)
            AUTO_ARCH="${TARGET_ARCH:-arm-linux-gnueabihf}";
            ARCH="arm";
            COMPILERS='gcc:g++:arm-linux-gnueabihf-gcc:arm-linux-gnueabihf-g++';
          elif [[ "${arch}" == 'arm64' || "${arch}" == 'aarch64' || "${arch}" == 'armv8'* ]]; then
          # 64-bit ARM (Server/PC)
            AUTO_ARCH="${TARGET_ARCH:-aarch64-linux-gnu}";
            ARCH="arm64";
            COMPILERS='gcc:g++:aarch64-linux-gnu-gcc:aarch64-linux-gnu-g++';
          elif [[ "${arch}" == 'x86_64' || "${arch}" == 'amd64' ]]; then
          # Standard 64-bit PC
            AUTO_ARCH="${TARGET_ARCH:-x86_64-linux-gnu}";
            ARCH="x86_64";
            COMPILERS='gcc:g++:cc:c++';
          elif [[ "${arch}" == 'i686' || "${arch}" == 'i386' || "${arch}" == 'x86' ]]; then
          # 32-bit PC
            AUTO_ARCH="${TARGET_ARCH:-i686-linux-gnu}";
            ARCH="x86";
            COMPILERS='gcc:g++:cc:c++';
          fi;
        fi;
        echo "BACKUP_PATH=${PATH}" >> "${GITHUB_ENV}";
        echo "ARCH=${ARCH}" >> "${GITHUB_ENV}";
        echo "SRCTREE=${SRCTREE}" >> "${GITHUB_ENV}";
        echo "SYSROOT=${TOOLCHAIN}" >> "${GITHUB_ENV}";
        echo "TARGET_ARCH=${AUTO_ARCH}" >> "${GITHUB_ENV}";
        echo "CC_LOGGER_GCC_LIKE=${COMPILERS}" >> "${GITHUB_ENV}";
        echo "linux=${{ inputs.linux }}" >> "${GITHUB_ENV}"
        echo "release1=" >> "${GITHUB_ENV}";
        echo "release2=" >> "${GITHUB_ENV}";
        echo "release3=" >> "${GITHUB_ENV}";
        echo 'include_count=0' >> "${GITHUB_ENV}";
        echo 'kconfig=include/linux/kconfig.h' >> "${GITHUB_ENV}";
        echo "filetype=${{ inputs.filetype }}" >> "${GITHUB_ENV}";
        echo 'includes=false' >> "${GITHUB_ENV}"
        echo "rsp=${{ inputs.rsp }}" >> "${GITHUB_ENV}";
        echo 'sources=false' >> "${GITHUB_ENV}";
        echo 'file_count=0' >> "${GITHUB_ENV}";
        echo 'file_fixed=0' >> "${GITHUB_ENV}";
        echo 'file_found=0' >> "${GITHUB_ENV}";
        echo 'file_error=0' >> "${GITHUB_ENV}";
        echo 'file1_parted=0' >> "${GITHUB_ENV}";
        echo 'file2_parted=0' >> "${GITHUB_ENV}";
        echo 'build_cache=false' >> "${GITHUB_ENV}";
        echo 'check_build=false' >> "${GITHUB_ENV}";
        echo 'database=database' >> "${GITHUB_ENV}";
        echo 'include_missing=0' >> "${GITHUB_ENV}";
        echo 'expected_file_count=0' >> "${GITHUB_ENV}";
        echo "update=${{ inputs.update }}" >> "${GITHUB_ENV}";
        echo "dirname=${{ inputs.dirname }}" >> "${GITHUB_ENV}";
        echo "export SYSROOT=${TOOLCHAIN}" | sudo tee -a ~/.bashrc >/dev/null;
        echo "export ARCH=${ARCH}" | sudo tee -a ~/.bashrc >/dev/null;
        echo "export TARGET_ARCH=${AUTO_ARCH}" | sudo tee -a ~/.bashrc >/dev/null;
        echo "export CC_LOGGER_GCC_LIKE=${COMPILERS}" | sudo tee -a ~/.bashrc >/dev/null;
        echo 'export ALLOW_MISSING_DEPENDENCIES=true' | sudo tee -a ~/.bashrc >/dev/null;
        echo 'export GIT_DISCOVERY_ACROSS_FILESYSTEM=1' | sudo tee -a ~/.bashrc >/dev/null;
        echo 'export DEBIAN_FRONTEND=noninteractive' | sudo tee -a ~/.bashrc >/dev/null;
        echo 'export LLVM_ENABLE_THREADS=ON' | sudo tee -a ~/.bashrc >/dev/null;
        echo 'export WITH_TIDY=1' | sudo tee -a ~/.bashrc >/dev/null;
        echo 'export LC_ALL=C' | sudo tee -a ~/.bashrc >/dev/null;
        sudo mkdir -p /usr/local/bin /usr/local/lib/android/sdk
        sudo chmod -R 0755 "${{ github.action_path }}/scripts";
        mkdir -p "${HOME}/.local/bin";
        if ${{ inputs.version != '' }} && [[ $(which clang-tidy-18) ]]; then
          sudo apt-get remove -y -q -q clang-tidy-18 >/dev/null;
        fi;
        if ${{ inputs.version != '' }} && [[ $(which clang-18) ]]; then
          sudo apt-get remove -y -q -q clang-18 llvm-18 >/dev/null 2>&1;
        fi;
        if ${{ inputs.version != '' }}; then
          sudo update-alternatives --remove-all clang >/dev/null 2>&1
          sudo update-alternatives --remove-all clang++ >/dev/null 2>&1
        fi;
        sudo apt-get clean
        sudo add-apt-repository -y main >/dev/null;
        sudo add-apt-repository -y universe >/dev/null;
        sudo add-apt-repository -y restricted >/dev/null;
        sudo add-apt-repository -y multiverse >/dev/null;
        sudo apt-get -y -q -q update 2>&1 >/dev/null | sed -E '/Running/,/host./d' | tr -d '\n';
        sudo apt-get -y -q -q install aptitude 2>&1 >/dev/null | sed -E '/Running/,/host./d' | tr -d '\n' && echo -e "\n####################\naptitude dependencies installed\n####################\n" || echo -e '::error::No aptitude installer for installing packages';
        if [[ ! $(which python3) ]]; then
          sudo aptitude -y -q -q install python3 2>&1 >/dev/null | sed -E '/Running/,/host./d' | tr -d '\n' && echo -e "####################\npython3 dependencies installed\n####################" || echo -e '::error::No python3 installed for project checks';
          [[ ! $(which python3) ]] && exit 1
        fi;
        echo 'deb [trusted=yes] https://apt.gabe565.com /' | sudo tee -a /etc/apt/sources.list.d/gabe565.list >/dev/null;
      shell: bash
      continue-on-error: false
    
    - name: Install LLVM and Clang
      if: runner.os == 'Linux' && inputs.pattern == '' && (inputs.project == 'true' || inputs.filename != '' || inputs.filetype != '')
      run: |
        set -a
        source ~/.bashrc
        USER="${USER}";
        if [[ -x "${{ github.action_path }}/scripts/linux.sh" ]]; then
          bash -c "${{ github.action_path }}/scripts/linux.sh";
          if ${{ inputs.project == 'true' }} && ${{ inputs.internal == 'true' }} && ${{ env.arch == 'arm' }}; then
            source ~/.bashrc
            LLVM_VERSION="${{ inputs.version }}";
            export USER LLVM_VERSION LLVM_PATH
            bash -c "${{ github.action_path }}/scripts/linux-arm.sh";
          fi;
        fi;
      env:
        LLVM_VERSION: ${{ inputs.version }}
        LLVM_ARM_VERSION: ${{ inputs.release }}
        SETUP_LLVM_GITHUB_TOKEN: ${{ inputs.token }}
      shell: bash
      continue-on-error: true

    - id: output-path
      if: runner.os == 'Linux' && (inputs.project == 'true' || inputs.filename != '' || inputs.filetype != '')
      run: |
        from __future__ import print_function
        import os
        with open(os.getenv("GITHUB_OUTPUT"), "a") as f:
          print("llvm-path={}".format(os.getenv('LLVM_PATH')), file=f)
      env:
        LLVM_PATH: ${{ env.LLVM_PATH }}
      shell: python
      continue-on-error: true

    - name: Installing Dependencies
      if: inputs.project == 'true' || inputs.filename != '' || inputs.filetype != ''
      run: |
        set +e
        source ~/.bashrc
        file_name="${{ env.filename }}";
        file_type="${file_name##*.}";
        github="${GITHUB_WORKSPACE}";
        linux_distro1="24.04";
        linux_distro2="22.04";
        linux_distro3="20.04";
        linux_verison=$(lsb_release -r | awk '{ print $2; }');
        if ${{ inputs.project == 'true' }} && [[ ! $(which cmake) ]]; then
          sudo aptitude -y -q -q install cmake make 2>&1 >/dev/null | sed -E '/Running/,/host./d' | tr -d '\n' && echo -e "####################\ncmake dependencies installed\n####################" || echo -e '::error::No cmake installed for project build';
          [[ ! $(which cmake) ]] && exit 1
        fi;
        if [[ ! $(which clang) ]]; then
          sudo aptitude -y -q -q install clang 2>&1 >/dev/null | sed -E '/Running/,/host./d' | tr -d '\n' && echo -e "####################\nclang dependencies installed\n####################" || echo -e '::error::No clang installed for repo updates';
          [[ ! $(which clang) ]] && exit 1
        fi;
        cmake_version=$(cmake --version 2>/dev/null | grep version | awk '{ print $3; }');
        clang_version=$(clang --version 2>/dev/null | awk '{ print $4; }');
        clang_tidy_version=$(clang-tidy --version 2>/dev/null | grep version | awk '{ print $3; }');
        clang_tidy_required_version='21.1.6';
        cmake_required_version="4.2.1";
        if (${{ inputs.project == 'true' }} || [[ "${file_type}" == [cth]* ]]) && ([[ ! $(which clang-tidy) ]] || [[ $(printf '%s\n%s' "${clang_tidy_version}" "${clang_tidy_required_version}" | sort -V | head -n1) == "${clang_tidy_version}" ]] && [[ "${clang_tidy_version}" != "${clang_tidy_required_version}" ]]); then
          python3 -m pip install --upgrade clang-tools >/dev/null && echo -e "\n####################\nclang tools pip dependencies installed\n####################" || echo -e '::error::No clang tools installed for project check';
          [[ -e "${HOME}/.local/bin/clang-tidy" ]] && sudo mv -f "${HOME}/.local/bin/clang-tidy" '/usr/bin/clang-tidy';
          [[ -e "${HOME}/.local/bin/run-clang-tidy" ]] && sudo mv -f "${HOME}/.local/bin/run-clang-tidy" '/usr/bin/run-clang-tidy';
          [[ ! $(which clang-tidy) ]] && exit 1
        fi;
        [[ ! $(which make) ]] && sudo aptitude install -y -q -q make >/dev/null && echo -e "\n####################\nmake dependencies installed\n####################";
        if ${{ inputs.project == 'true' }}; then
