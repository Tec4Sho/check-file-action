          fi;
          seconds=$((SECONDS - start_time));
          m=$((seconds / 60));
          s=$((seconds % 60));
          printf "Project Auto Include Runtime:\033[1m %d minutes and %d seconds\033[0m\n" "$m" "$s" | process_input;
        fi;
        if [[ "${source_include}" == 'true' ] || [[ "${includes_found}" == 'true' ]]]; then
          echo "include_count=${count2}" >> "${GITHUB_ENV}";
          echo 'sources=true' >> "${GITHUB_ENV}";
        else
          echo 'include_count=0' >> "${GITHUB_ENV}";
          echo 'sources=false' >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.number > '0' }}; then
          echo 'sources=false' >> "${GITHUB_ENV}";
        elif [[ "${count2}" > '0' ]]; then
          echo 'sources=true' >> "${GITHUB_ENV}";
        else
          echo 'sources=false' >> "${GITHUB_ENV}";
        fi;
        echo '';
      shell: bash
      continue-on-error: true

    - name: Project Compile Commands Json
