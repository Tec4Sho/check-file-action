name: Check File Action
description: 'Check file - Add filename to check for errors or text Word to search for within workspace files'
inputs:
  analysis:
    description: 'Analyze all project files using options 1 2 or 3'
    required: false
    default: 1
    type: choice
    options:
    - 1 # parameter-file for simple repository checks.
    - 2 # compile_commands.json for full project checks.
    - 3 # run-clang-tidy.py for fast parallel file checks.
  filename:
    description: 'Check for filename or search for text word matches'
    type: string
    required: false
    default: ''
  filetype:
    description: 'Check only these file extension types when searching for text word matches'
    type: string
    required: false
    default: 'none'
  database:
    description: 'Use file database over find commands slower performance for searches'
    type: boolean 
    required: false
    default: 'false'
  dirname:
    description: 'Your project root folder if created'
    type: string
    required: false
    default: ''
  pattern:
    description: 'Search for pattern matches in filetypes or all files'
    type: string
    required: false
    default: ''
  project:
    description: 'Fix Errors found while building project or check build only'
    type: boolean
    required: false
    default: 'false'
  rootdir:
    description: 'Search will start from root (/)'
    type: boolean
    required: false
    default: 'false'
  recheck:
    description: 'Recheck files repaired by check-file'
    type: boolean
    required: false
    default: 'false'
  repair:
    description: 'Check file and fix if able when searching for errors'
    type: boolean
    required: false
    default: 'false'
  report:
    description: 'Errors found will be logged and sent to repository releases'
    type: boolean
    required: false
    default: 'false'
  compiler:
    description: 'Clang compiler used for project building only'
    type: string
    required: false
    default: 'clang-19.1.0'
  content:
    description: 'Search will list dir contents of found filename'
    type: boolean
    required: false
    default: 'false'
  include:
    description: 'Check include files called by C/C++ filename searches if true'
    type: boolean
    required: false
    default: 'false'
  number:
    description: 'Number of files to check before stopping action'
    type: number
    required: false
    default: 0
  stored:
    description: 'Check files with errors repaired are skipped if ran again'
    type: boolean
    required: false
    default: 'false'
  update:
    description: 'Errors repaired with check-file will push changes to remote repository'
    type: boolean
    required: false
    default: 'false'
  upload:
    description: 'Upload build files for compile_commands.json'
    type: boolean
    required: false
    default: 'false'
  output:
    description: 'Output log stdout type 1,2 or 3'
    required: false
    default: 1
    type: choice
    options:
    - 1 # Log to terminal and file.
    - 2 # Log to file only.
    - 3 # Log to terminal only.
  build:
    description: 'Fix Errors found while building repository project'
    type: boolean
    required: false
    default: 'false'

runs:
  using: composite
  steps:

    - name: Set up Go 1.25.3
      if: inputs.filename != ''
      uses: actions/setup-go@v2
      with:
        go-version: 1.25.3
      continue-on-error: true

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
      continue-on-error: true

    - name: Setup Clang Compiler 
      if: inputs.project == 'true'
      uses: rlalik/setup-cpp-compiler@master
      with:
        compiler: ${{ inputs.compiler }}
      continue-on-error: true

    - name: Installing Dependencies
      if: inputs.pattern != '' || inputs.filename != '' || inputs.project != 'false'
      run: |
        echo '';
        set -o pipefail
        echo 'export GIT_DISCOVERY_ACROSS_FILESYSTEM=1' | sudo tee -a ~/.bashrc >/dev/null;
        echo 'export DEBIAN_FRONTEND=noninteractive' | sudo tee -a ~/.bashrc >/dev/null;
        echo 'export TERM=xterm-256color' | sudo tee -a ~/.bashrc;
        echo 'deb [trusted=yes] https://apt.gabe565.com /' | sudo tee -a /etc/apt/sources.list.d/gabe565.list;
        sudo add-apt-repository universe >/dev/null;
        sudo add-apt-repository ppa:git-core/ppa >/dev/null;
        sudo apt-get update -yq >/dev/null 2>&1;
        text0="\n####################\ngit dependencies Installed\n####################\n";
        text1="\n####################\nripgrep dependencies Installed\n####################\n";
        text2="\n####################\nansi2txt dependencies Installed\n####################\n";
        text3="\n####################\nca-certificates dependencies Installed\n####################\n";
        text4="\n####################\ncppcheck dependencies Installed\n####################\n";
        text5="\n####################\nclang-tools dependencies Installed\n####################\n";
        text6="\n####################\nshellharden dependencies Installed\n####################\n";
        text7="\n####################\nshellcheck dependencies Installed\n####################\n";
        text8="\n####################\ncheckmake dependencies Installed\n####################\n";
        text9="\n####################\nbatcat dependencies Installed\n####################\n";
        file_name="${{ inputs.filename }}";
        file_type="${file_name##*.}";
        if [[ ! $(clang-tidy --version 2>/dev/null) ]] && ([[ -n $(echo "${file_type}" | egrep "^c$|^c.$|^c..$|^h$|^h.$|^h..$|^t$|^t.$|^t..$") ]] && ${{ inputs.repair }}) || ${{ inputs.project }}; then
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add - >/dev/null;
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs) main" >/dev/null;
          sudo apt-get update -yq >/dev/null 2>&1;
          sudo apt-get install -yq clang clangd clang-tidy clang-tools >/dev/null && echo -e "${text5}" || echo -e '::error::No clang-tools installed Exiting';
          [[ ! $(clang-tidy --version 2>/dev/null) ]] && exit 1
        fi;
        if [[ ! $(llvm-config --version 2>/dev/null) ]] && ${{ inputs.project }}; then
          sudo apt-get -yq install llvm llvm-dev lld libclang-dev >/dev/null && echo -e "\n####################\nllvm tools dependencies Installed\n####################\n" || echo -e '::error::No llvm tools installed for project build';
          [[ ! $(llvm-config --version 2>/dev/null) ]] && exit 1
        fi;
        if [[ ! $(dpkg -s build-essential 2>/dev/null) ]] && ${{ inputs.project }}; then
          sudo apt-get -yq install build-essential device-tree-compiler >/dev/null && echo -e "\n####################\nbuild-essential dependencies Installed\n####################\n" || echo -e '::error::No build-essential installed for project build';
        fi;
        if [[ ! $(which cmake) ]] && ${{ inputs.project }}; then
          sudo apt-get -yq install cmake >/dev/null >/dev/null && echo -e "\n####################\ncmake dependencies Installed\n####################\n" || echo -e '::error::No cmake installed for project build';
          [[ ! $(which cmake) ]] && exit 1
        fi;
        if [[ ! $(which python3) ]] && ${{ inputs.project }} && ${{ inputs.analysis == 2 }}; then
          sudo apt-get -yq install python3 >/dev/null >/dev/null && echo -e "\n####################\npython3 dependencies Installed\n####################\n" || echo -e '::error::No python3 installed for project build';
          [[ ! $(which python3) ]] && exit 1
        fi;
        if [[ ! $(which npm) ]]; then
          sudo npm install >/dev/null && echo -e "\n####################\nnpm dependencies Installed\n####################\n" || echo -e '::error::No npm installed for term_width';
          [[ ! $(which tput) ]] && exit 1
        fi;
        if [[ ! $(which tput) ]]; then
          sudo apt-get -yq install tput >/dev/null && echo -e "\n####################\ntput dependencies Installed\n####################\n" || echo -e '::error::No tput installed for term_width';
          [[ ! $(which tput) ]] && exit 1
        fi;
        if [[ ! $(which git) ]]; then
          sudo apt-get -yq install git git-core >/dev/null && echo -e "${text0}" || echo -e '::error::No git installed for repo updates';
          [[ ! $(which git) ]] && exit 1
        fi;
        if [[ ! $(which rg) ]] && [[ "${{ inputs.pattern }}" != '' ]] && ${{ inputs.database }}; then
          sudo apt-get -yq install ripgrep >/dev/null && echo -e "${text1}" || echo -e '::error::No ripgrep installed for pattern matching';
          [[ ! $(which rg) ]] && exit 1
        fi;
        if [[ ! $(which ansi2txt) ]] && ${{ inputs.report }}; then
          sudo apt-get -yq install ansi2txt >/dev/null && echo -e "${text2}" || echo -e '::error::No ansi2txt installed for cleaning log report';
        fi;
        if [[ ! $(which update-ca-certificates) ]]; then
          sudo apt-get -yq install ca-certificates >/dev/null && echo -e "${text3}" || echo 'No ca-certificates installed effects can vary';
        fi;
        if [[ ! $(which cppcheck) ]] && [[ -n $(echo "${file_type}" | egrep "^c$|^c.$|^c..$|^h$|^h.$|^h..$|^t$|^t.$|^t..$") ]]; then
          sudo apt-get -yq install cppcheck >/dev/null && echo -e "${text4}" || echo -e '::error::No cppcheck installed Exiting';
          [[ ! $(which cppcheck) ]] && exit 1
        fi;
        if [[ ! $(which shellharden) ]] && [[ -n $(echo "${file_type}" | egrep -i "^sh$") ]] && ${{ inputs.repair }}; then
          wget -qO 'shellharden.tar.gz' 'https://github.com/anordal/shellharden/releases/latest/download/shellharden-x86_64-unknown-linux-gnu.tar.gz';
          sudo tar xf 'shellharden.tar.gz' -C '/usr/local/bin' 'shellharden' && rm -vrf 'shellharden.tar.gz' && echo -e "${text6}" || echo -e '::error::No shellharden installed Exiting';
          [[ ! $(which shellharden) ]] && exit 1
        fi;
        if [[ ! $(which shellcheck) ]] && [[ -n $(echo "${file_type}" | egrep -i "^sh$") ]]; then
          sudo apt-get -yq install shellcheck >/dev/null && echo -e "${text7}" || echo -e '::error::No shellcheck installed Exiting';
          [[ ! $(which shellcheck) ]] && exit 1
        fi;
        if [[ $(which checkmake) ]] && [[ -n ${file} ]] && [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]]; then
          sudo cp -vf "${file}" "${path}" 2>/dev/null;
        elif [[ ! -n ${file} ]] && [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]]; then
          echo -e '\ncheckmake.ini file missing, needed for checkmake to function properly\n';
        fi;
        if [[ ! $(which checkmake) ]] && [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]]; then
          go install "github.com/checkmake/checkmake/cmd/checkmake@latest" >/dev/null && echo -e "${text8}" || echo -e '::error::No checkmake installed Exiting';
          [[ ! $(which checkmake) ]] && exit 1
        fi;
        if [[ $(which bat) ]] && [[ ! $(which batcat) ]]; then
          sudo ln -sf ~/usr/bin/bat ~/usr/bin/batcat >/dev/null || echo -e '::error::No batcat installed Exiting';
          [[ ! $(which batcat) ]] && exit 1
          echo -e "\nalias batcat='bat'" | sudo tee -a ~/.bashrc >/dev/null;
          export BAT_THEME="ansi";
        elif [[ ! $(which batcat) ]]; then
          sudo apt-get -yq install bat >/dev/null && echo -e "${text9}" || echo -e '::error::No batcat installed Exiting';
          [[ ! $(which batcat) ]] && exit 1
          export BAT_THEME="ansi";
        fi;
        echo 'update=${{ inputs.update }}' >> "${GITHUB_ENV}";
        sudo apt-get --fix-broken install -yq >/dev/null 2>&1;
      shell: bash
      continue-on-error: false

    - name: Set Directory Base
      if: inputs.pattern != '' || inputs.filename != '' || inputs.project != 'false'
      id: set_dirname 
      env: 
        default_path: "*" 
      run: |
        echo '';
        repair_file='check-file-repaired.txt';
        repository=$(sudo find ${GITHUB_WORKSPACE} -type d -name '.git' -print -quit);
        echo 'database=database' >> "${GITHUB_ENV}";
        text1a="####################";
        text1b="DEFAULT DIRECTORY (SYSTEM ROOT)";
        text1c="####################";
        text2a="####################";
        text2b="DEFAULT DIRECTORY (GITHUB WORKSPACE)";
        text2c="####################";
        text3a="####################";
        text3b="Store repaired files Enabled";
        text3c="####################";
        text4="Creating ${repair_file} for checked files";
        text5a="####################";
        text5b="Database Performance Mode Enabled";
        text5c="####################";
        text6="Database not found exiting"
        text7a="####################";
        text7b="Searching directories for $(echo ${{ inputs.filename }} | sed 's/[\/\$]//g') file(s)";
        text7c="####################";
        text8a="####################";
        text8b="Searching ${{ inputs.filetype }} files for ${{ inputs.pattern }} match(s)";
        text8c="####################";
        text9a="####################";
        text9b="Searching all files for $(echo ${{ inputs.pattern }} | sed 's/[\/\$]//g') match(s)";
        text9c="####################";
        text10a="#####################";
        text10b="\033[1m# CHECK FILE ACTION #\033[0m";
        text10c="#####################";
        export TERM=xterm-256color
        if [[ ${TERM} ]]; then
          center_text() {
            local text="$1";
            local term_cols="$(tput cols)";
            local text_length="${#text}";
            if [[ $(node ${{ github.action_path }}/scripts/mobile.js 2>/dev/null) ]] || [[ $(node ${{ github.action_path }}/scripts/view.js 2>/dev/null) ]]; then
              local padding="$(( (term_cols - text_length) / 2 ))";
              local text="$(echo $1 | tr -d '\n')";
              print '';
              printf "%*s%s\n" "${padding}" "" "${text}"
              print '';
            else
              echo -e "${text}"
            fi;
          }
        fi;
        if ${{ inputs.rootdir }}; then
          center_text "\n${text1a}";
          center_text "${text1b}";
          center_text "${text1c}";
          echo -e '\n~/\n';
          echo 'file_path=/' >> "${GITHUB_ENV}";
          file_path=/
        else
          center_text "\n${text2a}";
          center_text "${text2b}";
          center_text "${text2c}";
          echo -e "\n${GITHUB_WORKSPACE}\n";
          echo "file_path=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}";
          file_path=${GITHUB_WORKSPACE}
        fi;
        if ${{ inputs.stored }} && ${{ env.update }} && [[ -d ${repository} ]]; then
          repository="${repository%/*}/${repair_file}";
          if [[ -f ${repository} ]]; then
            center_text "\n${text3a}";
            center_text "${text3b}";
            center_text "${text3c}\n";
          else
            center_text "\n${text4a}";
            center_text "${text4b}";
            center_text "${text4c}\n";
            date '+%Y%m%d' > "${repository}" || exit 1
          fi;
        elif ${{ inputs.stored }} && [[ -d ${repository} ]]; then
          repository="${repository%/*}/${repair_file}";
          if [[ -f ${repository} ]]; then
            center_text "\n${text3a}";
            center_text "${text3b}";
            center_text "${text3c}\n";
          else
            center_text "\n${text4a}";
            center_text "${text4b}";
            center_text "${text4c}\n";
            date '+%Y%m%d' > "${repository}" || exit 1
          fi;
          echo 'update=true' >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.database }}; then
          sudo find "${file_path}" -type f -print | sort -t/ -k1.2 > "${GITHUB_WORKSPACE}/database";
          if [[ -s "${GITHUB_WORKSPACE}/database" ]]; then
            center_text "\n${text5a}";
            center_text "${text5b}";
            center_text "${text5c}\n";
            echo "database=${GITHUB_WORKSPACE}/database" >> "${GITHUB_ENV}";
          else
            center_text "\n${text6a}";
            center_text "${text6b}";
            center_text "${text6c}\n" && exit 1
          fi;
        fi;
        if [[ -n "${{ inputs.filename }}" ]]; then
          center_text "\n${text7a}";
          center_text "${text7b}";
          center_text "${text7c}\n";
        fi;
        if [[ -n "${{ inputs.pattern }}" ]] && [[ "${{ inputs.filetype }}" != 'none' ]]; then
          center_text "\n${text8a}";
          center_text "${text8b}";
          center_text "${text8c}\n";
        elif [[ "${{ inputs.pattern }}" != '' ]]; then
          center_text "\n${text9a}";
          center_text "${text9b}";
          center_text "${text9c}\n";
        fi;
        if [[ -z "${{ inputs.dirname }}" ]]; then
          if [ -z "${{ github.event.inputs.DEVICE_PATH }}" ]; then 
            echo "dirname=${{ env.default_path }}" >> "${GITHUB_ENV}";
          else 
            echo "dirname=${{ github.event.inputs.DEVICE_PATH }}" >> "${GITHUB_ENV}";
          fi;
        else
          echo "dirname=${{ inputs.dirname }}" >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.project }} && ${{ inputs.filename != '' }} && ${{ inputs.analysis > 0 }}; then
          center_text "::warning:: inputs.project: and inputs.filename: both enabled disables inputs.analysis:\nTo remove this warning use ( inputs.analysis: 0 )\n";
          echo "analysis=0" >> "${GITHUB_ENV}";
        else
          echo "analysis=${{ inputs.analysis }}" >> "${GITHUB_ENV}";
        fi;
        center_text "\n${text10a}" 2>/dev/null;
        center_text "${text10b}" 2>/dev/null;
        center_text "${text10c}\n" 2>/dev/null;
        echo '';
        echo 'file_fixed=0' >> "${GITHUB_ENV}";
        echo 'file_found=0' >> "${GITHUB_ENV}";
        echo 'file_error=0' >> "${GITHUB_ENV}";
        echo "file1_parted=0" >> "${GITHUB_ENV}";
        echo "file2_parted=0" >> "${GITHUB_ENV}";
        echo 'build_cache=false' >> "${GITHUB_ENV}";
      shell: bash
      continue-on-error: false

    - name: Check Build Project
      if: inputs.project != 'false'
      run: |
        export LLVM_ENABLE_THREADS=ON
        export CMAKE_EXPORT_COMPILE_COMMANDS=ON
        export LC_ALL=C
        set +e
        compiler_list=$(dpkg --list | grep compiler | tr -d 'ii');
        clang_version=$(clang --version);
        verify_config=$(clang-tidy --verify-config 2>/dev/null);
        cmake_version=$(cmake --version);
        clang_checks=$(clang-tidy --list-checks 2>/dev/null);
        project_log="${GITHUB_WORKSPACE}/${repository}_project.log";
        gcc_version=$(gcc --version);
        gpp_version=$(g++ --version);
        check_build=false
        file_type='c';
        src_tree=$(sudo find ${{ env.file_path }} -type d -name '.git' -print);
        github=${GITHUB_WORKSPACE};
        update=true
        echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################\n";
        echo -e "\n####################\nProject Build: ${{ github.repository }}\n####################\n";
        echo -e "\n####################\nCompiler: ${gcc_version}\n####################\n";
        echo -e "\n####################\nCompiler: ${gpp_version}\n####################\n";
        echo -e "\n####################\nCompiler: ${clang_version}\n####################\n";
        echo -e "\n####################\nBuilder: ${cmake_version}\n####################\n";
        echo -e "\n####################\nClang-Tidy: ${verify_config}\n####################\n";
        echo -e "\n####################\n\tCLANG OPTIONS\n${clang_checks}\n####################\n";
        echo 'check_build=false' >> "${GITHUB_ENV}";
        process_input() {
          while IFS= read -r log; do
            if [[ ${{ inputs.output == 1 }} ]]; then
              echo "$log" | tee -a "${project_log}";
            elif [[ ${{ inputs.output == 2 }} ]]; then
              echo "$log" >> "${project_log}";
            elif [[ ${{ inputs.output == 3 }} ]]; then
              echo "$log";
            fi;
          done;
        }
        if ! ${{ inputs.update }}; then
          echo 'update=false' >> "${GITHUB_ENV}";
          update=false
        fi;
        if [[ "${{ inputs.filetype }}" != 'none' ]]; then
          file_type="${{ inputs.filetype }}";
        fi;
        echo "filetype=${file_type}" >> "${GITHUB_ENV}";
        if [[ -d "${src_tree}" ]]; then
          echo -e "\n####################\nChecking Repository ${src_tree%/*}\n####################\n";
          echo -e "\n####################\nChecking for ${file_type} file(s)\n####################\n";
          cd "${src_tree%/*}";
          repository=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
          cmake_list='CMakeLists.txt';
          clang_file='parameter-file';
          clang_tidy='.clang-tidy';
          compile_json=$(sudo find . -type f -name 'compile_commands.json' -print -quit);
          clang_run=${{ github.action_path }}/scripts/tools/run-clang-tidy.py
          included=$(sudo find . -type d -name 'include' -print -quit);
          echo "repository=${repository}" >> "${GITHUB_ENV}";
          file_list() {
            sudo find . -type f -name "*.${file_type}" -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r file; do
              echo "${file#./}"
            done
          }
          if [[ -f "${clang_tidy}" ]]; then
            echo -e '\n####################\n\t.clang-tidy found continuing...\n####################\n';
          fi;
          if [[ -f "${cmake_list}" ]]; then
            echo -e '\n####################\n\tCMakeLists.txt found continuing...\n####################\n';
          fi;
          mkdir -p build
          if [[ -d 'build' ]]; then
            echo -e '\n####################\n\tbuild directory created continuing...\n####################\n';
            cmake -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build || echo "::error:: ( $? ) cmake missing or malformed CMakeList.txt (?)";
            if ${{ inputs.upload }}; then
              echo 'build_files=1' >> "${GITHUB_ENV}";
              cp -Rf ./build ${github}/ && echo -e '\n####################\n\tbuild directory copied continuing...\n####################\n';
            fi;
          fi;
          if [[ -e 'compile_commands.json' ]]; then
            echo -e '\n####################\n\tcompile_commands.json file symlinked continuing...\n####################\n';
          fi;
          if [[ -f "${clang_file}" ]] && ${{ env.analysis == 1 }}; then
            echo ' ' >> "${clang_file}";
            files_list=false
            if [[ `file_list` ]]; then
              echo -e "\n####################\n\t${file_type} file(s) found continuing...\n####################\n";
              file_list >> "${clang_file}";
              files_list=true
            else	
              echo -e "\n::error:: No ${file_type} files found searching repository\nExiting...\n";
            fi;
            echo -e "\n####################\n\t${clang_file} found continuing...\n####################\n";
            echo -e '\n####################\nCLANG-TIDY CONFIG CHECKED\n####################\n';
            if [[ "${files_list}" ]]; then
              echo -e '\n####################\nCLANG-TIDY ANALYZING FILE\n####################\n';
              { time -p clang-tidy @parameter-file --fix-errors; } 2>&1 | process_input || echo -e "::error:: ( $? ) checking project files";
              echo -e '\n|RUNTIME|\n';
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            else
              exit 1
            fi;
          elif [[ ! -e "${clang_file}" ]] && ${{ env.analysis == 1 }}; then
            echo -e "\n####################\n\t::error:: parameter-file missing in repo Exiting...\n####################\n";
            exit 1
          fi;
          if [[ $(which run-clang-tidy.py) ]] && ${{ env.analysis == 2 }}; then
            echo -e "\n####################\n\trun-clang-tidy.py found continuing...\n####################\n";
            echo -e '\n####################\nRUN-CLANG-TIDY ANALYZING FILE\n####################\n';
            { time -p run-clang-tidy.py -p ${CMAKE_BINARY_DIR} -config-file="${clang_tidy}" -use-color -quiet -fix -j "$(nproc --all)"; } 2>&1 | process_input || echo -e "::error:: ( $? ) checking project files";
            echo -e '\n|RUNTIME|\n';
            check_build=true
            echo 'check_build=true' >> "${GITHUB_ENV}";
          elif [[ -e "${clang_run}" ]] && ${{ env.analysis == 2 }}; then
            sudo chmod -v 0755 "${clang_run}" 2>/dev/null;
            echo -e "\n####################\n\trun-clang-tidy.py found continuing...\n####################\n";
            echo -e '\n####################\nRUN-CLANG-TIDY ANALYZING FILE\n####################\n';
            { time -p "${clang_run}" -p ${CMAKE_BINARY_DIR} -config-file="${clang_tidy}" -use-color -quiet -fix -j "$(nproc --all)"; } 2>&1 | process_input || echo -e "::error:: ( $? ) checking project files";
            echo -e '\n|RUNTIME|\n';
            check_build=true
            echo 'check_build=true' >> "${GITHUB_ENV}";
          elif [[ ! -e "${clang_run}" ]] && ${{ env.analysis == 2 }}; then
            echo -e "\n####################\n\t::error:: run-clang-tidy.py missing in repo Exiting...\n####################\n";
            exit 1
          fi;
          if [[ -d 'build' ]] && ${{ env.analysis == 3 }}; then
            echo -e '\n####################\n\tbuild directory created continuing...\n####################\n';
