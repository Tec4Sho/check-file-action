        fi;
        if [[ -s "${filename2}" ]]; then
          filesize2=$(sudo stat -c%s "${filename2}" 2>/dev/null);
          ansi2txt "${filename2}" > "${filename2}.tmp";
          mv -vf "${filename2}.tmp" "${filename2}";
          if (( filesize2 > min_size_bytes )); then
            split -l 100000 "${filename2}" 'part_'
            echo "file2_parted=1" >> "${GITHUB_ENV}";
          fi;
        fi;
      shell: bash
      continue-on-error: true
      
    - name: Repository Update
      if: env.update == 'true' && env.file_fixed == '1'
      run: |
        echo '';
        error_log="${GITHUB_WORKSPACE}/${{ inputs.filename }}_error.log";
        repair_date="$(date +%Y%m%d)";
        process_input() {
          while IFS= read -r log; do
            if [[ ${{ inputs.output == '1' }} ]]; then
              echo "$log" | tee -a "${error_log}";
            elif [[ ${{ inputs.output == '2' }} ]]; then
              echo "$log" >> "${error_log}";
            elif [[ ${{ inputs.output == '3' }} ]]; then
              echo "$log";
            fi;
          done;
        }
        if ${{ inputs.project }}; then
          git config --global --add safe.directory .
        fi;
        git config --global user.name "${{ github.actor }}";
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com";
        git config --global credential.helper store
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999
        git add .
        git commit -m "check-file-action repaired errors in ${{ inputs.filename }} file(s)";
        git push origin "${{ github.ref }}";
        if [[ ${PIPESTATUS[0]} == 0 ]] || [[ ${PIPESTATUS[1]} == 0 ]]; then
          echo -e "\n####################\nCHECK FILE UPDATED REPOSITORY\n####################\n";
          echo -e "\n####################\nUPDATED FILE(S) LIST:\n####################\n";
          git diff --name-only @{push}@{1} @{push} | process_input;
          echo -e "\n\t########## ${repair_date} ##########\n";
        else
          echo -e "\n####################\nCHECK FILE COULD NOT UPDATED REPO FILE(S)\n####################\n";
          echo 'Retrying again after git fetches branch';
          git fetch origin "${{ github.ref }}";
          git add .
          git commit -m "check-file-action repaired errors in ${{ inputs.filename }} file(s)";
          git push origin "${{ github.ref }}";
          if [[ ${PIPESTATUS[0]} == 0 ]] || [[ ${PIPESTATUS[1]} == 0 ]]; then
            echo -e "\n####################\nCHECK FILE UPDATED REPOSITORY\n####################\n";
            echo -e "\n####################\nUPDATED FILE(S) LIST:\n####################\n";
            git diff --name-only @{push}@{1} @{push} | process_input;
            echo -e "\n\t########## ${repair_date} ##########\n";
            if ${{ inputs.project }}; then
              git status | process_input 2>/dev/null;
            fi;
          else
            echo 'Was git push event successful status ? unknown';
          fi;
        fi;
      shell: bash
      continue-on-error: true

    - name: Uploading ${{ github.repository }} Project Build Release
      if: inputs.build > '0' && inputs.project == 'true' && env.build_files == '1'
      uses: softprops/action-gh-release@v1
      with:
        files: build/bin/*
        name: Build For ${{ github.repository }} Repository.
        tag_name: ${{ github.run_id }}
      continue-on-error: true

    - name: Uploading ${{ github.repository }} Project Build Checks
      if: inputs.build == '1' || inputs.build == '2' || inputs.analyzer == '4' && inputs.project == 'true' && env.build_files == '1'
      uses: actions/upload-artifact@v4
      with:
        name: Build For ${{ github.repository }} Repository.
        path: results
      continue-on-error: true

    - name: Uploading Build Files Artifacts
      if: inputs.upload == 'true' && inputs.project == 'true' && env.build_files == '1'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.github_repository }}_build
        path: build
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading Build_Cache Artifacts
      if: inputs.report == 'true' && inputs.filename != '' && env.file_found == '1' && inputs.stored == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.github_repository }}_checked
        path: build_cache
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ inputs.filename }} Error Report Artifact
      if: inputs.report == 'true' && inputs.filename != '' && env.file_found == '1'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.filename }}_error.log
        path: ${{ inputs.filename }}_error.log
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ env.github_repository }} Project Report Artifact
      if: inputs.report == 'true' && inputs.project == 'true' && env.check_build == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.github_repository }}_project.log
        path: ${{ env.github_repository }}_project.log
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ inputs.filename }} Error Report Artifacts
      if: inputs.report == 'true' && inputs.filename != '' && env.file_found == '1' && env.file2_parted == '1'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.filename }}_split_error.log
        path: part_*
        include-hidden-files: true
      continue-on-error: true

    - name: Uploading ${{ github.repository }} Project Report Artifacts
      if: inputs.report == 'true' && inputs.project == 'true' && env.check_build == 'true' && env.file1_parted == '1'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.github_repository }}_split_project.log
        path: part_*
        include-hidden-files: true
      continue-on-error: true

    - name: Delete Files
      if: inputs.filename != '' || inputs.pattern != '' || inputs.project == 'true'
      run: |
        date
        if [[ -f "${{ env.github_repository }}_project.log" ]]; then
          echo -e "\nPROJECT: $(rm -vf ${{ env.github_repository }}_project.log)";
        fi;
        if [[ -f "${{ inputs.filename }}_error.log" ]]; then
          echo -e "\nLOGFILE: $(rm -vf ${{ inputs.filename }}_error.log)";
        fi;
        if [[ -e "database" ]]; then
          echo -e "\nDATABASE: $(rm -vf database)";
        fi;
        echo '';
      shell: bash
      continue-on-error: true

    - name: Save Project
      if: inputs.cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      id: save
      with:
        path: '.'
        key: ${{ steps.restore.outputs.cache-primary-key }}
        enableCrossOsArchive: true
      continue-on-error: true

    - name: Action Check
      if: inputs.filename == '' && inputs.pattern == '' && inputs.project == 'false'
      run: |
        echo ''
        echo -e "\n::error::No input provided to • filename: none • pattern: none • project: false\n\tNothing To Do! ?\n";
      shell: bash
      continue-on-error: true

    - name: Check Project Size
      run: |
        echo '';
        echo -e "Repository Project Total Size: $(du ${{ env.base }} -shx)\n";
      shell: bash
      continue-on-error: true

    - name: Exiting
      run: |
        echo '';
        text() {
          local text="$1";
          echo -e "${text}"
        }
        texta="######################";
        textb="\033[1m# CHECK FILE EXITING #\033[0m";
        textc="######################";
        text "${texta}";
        text "${textb}";
        text "${textc}\n";
      shell: bash
      continue-on-error: true
