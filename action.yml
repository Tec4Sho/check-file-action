              elif [[ -s "${project_log}" ]]; then
                echo -e "\n::notice::No errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
              fi;
            [[ $(grep -aiE 'fixit|fix-it' "${project_log}") ]] && echo "file_fixed=1" >> "${GITHUB_ENV}";
            fi;
          elif [[ ! -e "${clang_file}" ]] && ${{ env.analyzer == '2' }} && [[ -e "${compile_json}" ]]; then
            echo -e "\n####################\n::error:: parameter-file missing in repo Exiting...\n####################\n" | process_input;
