            4) cat >/dev/null ;;        # Completely silent
            *) cat ;;                   # Default fallback
          esac
        }
        if ${{ inputs.absolute == 'true' }}; then
          path='--absolute-path';
        else
          path='--relative-path';
        fi;
        if ${{ inputs.database == 'true' }}; then
          if [[ $(echo "${{ inputs.filename }}" | grep -Eo '^[a-zA-Z0-9_-]+.[a-zA-Z0-9_-]+$') ]]; then
            files=$(grep -sF "${{ inputs.dirpath }}/${{ env.filename }}" "${{ env.database }}" | grep . || grep -sF "${{ inputs.filename }}" "${{ env.database }}");
            echo -e "\n####################\nDatabase Filename: ${{ inputs.filename }}\n####################" | process_input;
          elif [[ $(echo "${{ inputs.filename }}" | grep -Eo '^[a-zA-Z0-9_-]+$') ]]; then
            files=$(grep -sF "${{ inputs.dirpath }}/${{ env.filename }}" "${{ env.database }}" | grep . || grep -sF "${{ inputs.filename }}" "${{ env.database }}");
            echo -e "\n####################\nDatabase Filename: ${{ inputs.filename }}\n####################" | process_input;
          elif ${{ inputs.filetype != '' }}; then
            regex="\.${{ inputs.filetype }}$";
            files=$(grep -sE "${{ inputs.dirpath }}/.${regex}" "${{ env.database }}" | grep . || grep -sE "${regex}" "${{ env.database }}");
            echo -e "\n####################\nDatabase File Extension: ${{ env.filename }}\n####################" | process_input;
          fi;
        else
          if [[ $(echo "${{ inputs.filename }}" | grep -Eo '^[a-zA-Z0-9_-]+.[a-zA-Z0-9_-]+$') ]]; then
            files=$(fdfind -j "$(nproc)" -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**/${{ inputs.filename }}" "${{ env.base }}" | grep . || fdfind -j "$(nproc)" -p "${path}" --type file "${{ inputs.filename }}" "${{ env.base }}");
            echo -e "\n####################\nFilename: ${{ inputs.filename }}\n####################" | process_input;
          elif [[ $(echo "${{ inputs.filename }}" | grep -Eo '^[a-zA-Z0-9_-]+$') ]]; then
            files=$(fdfind -j "$(nproc)" -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**/${{ inputs.filename }}" "${{ env.base }}" | grep . || fdfind -j "$(nproc)" -p "${path}" --type file "${{ inputs.filename }}" "${{ env.base }}");
            echo -e "\n####################\nFilename: ${{ inputs.filename }}\n####################" | process_input;
          elif ${{ inputs.filetype != '' }}; then
            files=$(fdfind -j "$(nproc)" -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**/*.${{ inputs.filetype }}" "${{ env.base }}" | grep . || fdfind -j "$(nproc)" -p "${path}" --type file -e "${{ inputs.filetype }}" "${{ env.base }}");
            echo -e "\n####################\nFile Extension: ${{ env.filename }}\n####################" | process_input;
          fi;
        fi;
        usage() {
          echo "Warning no files found" | process_input;
          echo "By default this mode just warn of duplicates" | process_input;
          echo "::notice::No files were located. To remove duplicated includes in place use include: true" | process_input;
          exit 0
        }
        remove=0
        if [[ ! "${files}" ]]; then 
          usage;
        else
          echo "data_file=1" >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.include == 'true' }}; then
          remove=1;
          shift
        fi;
        declare -A includedfiles
        for file in ${files}; do
          if [[ ! -f "${file}" ]]; then
            echo "Error: ${file} is not a regular file." >&2;
            continue;
          fi;
          count=$((file_count++));
          while IFS= read -r line; do
          if [[ "${line}" =~ ^[[:space:]]*#[[:space:]]*include[[:space:]]*[\<\"]([^\>\"]+)[\>\"] ]]; then
            inc_file="${BASH_REMATCH[1]}";
            ((includedfiles["$inc_file"]++))
          fi;
          done < "${file}";
          if [[ ${remove} -eq 0 ]]; then
            for inc in "${!includedfiles[@]}"; do
              if [[ ${includedfiles["$inc"]} -gt 1 ]]; then
                echo -e "\n\033[31m${file}\033[0m: ${inc} is included more than once." | process_input;
              fi;
            done;
          else
            temp_file=$(mktemp);
            dups=0
            while IFS= read -r line; do
              if [[ "${line}" =~ ^[[:space:]]*#[[:space:]]*include[[:space:]]*[\<\"]([^\>\"]+)[\>\"] ]]; then
                inc_file="${BASH_REMATCH[1]}"
                if [[ ${includedfiles["$inc_file"]} -gt 1 ]]; then
                  ((includedfiles["$inc_file"]--));
                  ((dups++));
                  continue;
                fi;
              fi;
              echo "$line" >> "$temp_file";
            done < "${file}";
            if [[ ${dups} -gt 0 ]]; then
              mv "$temp_file" "$file";
              echo -e "\n${file}: \033[32mremoved\033[0m ${dups} \033[32mduplicate includes\033[0m" | process_input;
            else
              rm "$temp_file";
            fi;
          fi;
          includedfiles=();
          if ${{ inputs.number > '0' }}; then
            if [[ "${{ inputs.number }}" -eq "${count}" ]]; then
              echo -e "\nFile checking auto stopped at: ${count} / ${file##*/}" | process_input;
              break;
            fi;
          fi;
        done;
        echo -e "\n Set update: true if you would like to save changes to any duplicates removed from ${{ env.filename }} file(s)!!";
        seconds=$((SECONDS - start_time));
        m=$((seconds / 60));
        s=$((seconds % 60));
        printf "\nSources Duplicate Includes Runtime:\033[1m %d minutes and %d seconds\033[0m\n\n" "$m" "$s" | process_input;
      shell: bash
      continue-on-error: true
    
