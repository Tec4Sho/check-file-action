name: Check File Action
description: 'Check file - Add filename to check for errors or text Word to search for within workspace files'
inputs:
  repository:
    description: 'Auto clone user remote repo locally for checks'
    type: boolean
    required: false
    default: 'true'
  absolute:
    description: 'Search will use absolute over relative path from github workspace'
    type: boolean
    required: false
    default: 'true'
  analyzer:
    description: 'Analyze all project files using options 1 - 2 - 3 - 4'
    required: false
    default: 0
    type: choice
    options:
    - 0 # disable project analyzer
    - 1 # run-clang-tidy.py - fastest for large project file checks. fix-its
    - 2 # clang-tidy - faster for small an large project file checks. fix-its
    - 3 # clangd-tidy - fast large project file checks.
    - 4 # codechecker - compiler project file check reports.
  filename:
    description: 'Check for filename or search for text word matches'
    type: string
    required: false
    default: ''
  filetype:
    description: 'Check only these file extension types when searching for text word matches'
    type: string
    required: false
    default: 'c'
  internal:
    description: 'If checking kernel builds or projects that dont depend on external /usr/ includes'
    type: string
    required: false
    default: 'true'
  makefile:
    description: 'Make filename for building project source'
    type: string
    required: false
    default: 'Makefile'
  database:
    description: 'Use custom database over fdfind real-time file searches for added performance'
    type: boolean 
    required: false
    default: 'false'
  dirpath:
    description: 'Directory to search for files, if set an no file match it will switch to full search for file matches'
    type: string
    required: false
    default: 'workspace'
  dirname:
    description: 'If using project true with build # & repository false the directory for build to check'
    type: string
    required: false
    default: 'workspace'
  pattern:
    description: 'Search for pattern matches in filetypes or all files'
    type: string
    required: false
    default: ''
  project:
    description: 'Fix Errors found while building project or check build only'
    type: boolean
    required: false
    default: 'false'
  version:
    description: 'LLVM Clang vsrsion used for project'
    type: number
    required: false
    default: '21'
  release:
    description: 'LLVM embeded-toolchain-arm version used for arm kernels only'
    type: number
    required: false
    default: '19.1.1'
  recheck:
    description: 'Recheck files repaired by check-file'
    type: boolean
    required: false
    default: 'false'
  repair:
    description: 'Check file and fix if able when searching for errors'
    type: boolean
    required: false
    default: 'false'
  report:
    description: 'Errors found will be logged and sent to repository releases'
    type: boolean
    required: false
    default: 'false'
  content:
    description: 'Search will list dir contents of found filename'
    type: boolean
    required: false
    default: 'false'
  include:
    description: 'Check include file when checking source C/C++ filename'
    type: boolean
    required: false
    default: 'true'
  source:
    description: 'Check all soucre files for include directories to auto add for clang/cmake'
    required: false
    default: 0
    type: choice
    options:
    - 0 # Disabled
    - 1 # Locate user includes in sources and display file info.
    - 2 # Locate system includes in sources and display file info.
    - 3 # Locate user & system includes in sources and display file info fast.
  number:
    description: 'Number of files to check before stopping action'
    type: number
    required: false
    default: 0
  module:
    description: 'Make kernel modules when building project source'
    type: boolean
    required: false
    default: 'false'
  stored:
    description: 'Checked files with errors repaired are skipped if ran again'
    type: boolean
    required: false
    default: 'false'
  update:
    description: 'If errors repaired push changes to remote repository'
    type: boolean
    required: false
    default: 'false'
  upload:
    description: 'Upload build files for compile_commands.json'
    type: boolean
    required: false
    default: 'false'
  output:
    description: 'Output log stdout type 1,2 or 3'
    required: false
    default: 1
    type: choice
    options:
    - 1 # Output to terminal log and error/project file.
    - 2 # Output to error/project file only.
    - 3 # Output to terminal log only.
    - 4 # Disable most output.
  format:
    description: 'Run-clang-tidy with clang-format enabled'
    type: boolean
    required: false
    default: 'false'
  build:
    description: 'Fix Errors found while building repository project'
    type: choice
    required: false
    default: '0'
    options:
    - 0 # Disable building projects.
    - 1 # Build & check project. [CodeChecker Dry-Run Multiple-Files]
    - 2 # Build new compile_commands_json & check project. [CodeChecker Build Multiple-Files]
    - 3 # Build check includes & check project. [Deheader Dry-Run Multiple-Files]
    - 4 # Build fix includes & check project. [Deheader Build Single-Files]
  clean:
    description: 'Clean workflow on checkout'
    type: boolean
    required: false
    default: 'true'
  cache:
    description: 'Cache Needed Project Files'
    type: boolean
    required: false
    default: 'false'
  arch:
    description: 'Arch to set for checking kernel project includes'
    type: string
    required: false
    default: 'arm'
  root:
    description: 'Start search from linux-os root directory not just github_workspace for database'
    type: boolean
    required: false
    default: 'false'
  token:
    description: Token to authenticate GitHub API requests
    type: string
    required: false
    default: ${{ github.token }}
outputs:
  llvm-path:
    description: The absolute path to the LLVM installation
    value: ${{ steps.output-path.outputs.llvm-path }}

runs: # Uses default x86_64 / linux user machine
  using: composite
  steps:
    - name: Linux Distro Check
      run: |
        echo '';
        echo 'export ANSIBLE_FORCE_COLOR=true' | sudo tee -a ~/.bashrc >/dev/null;
        echo -e "####################\n\033[1mCheck-File-Action-Pro version 2.0.0 [\033[32mBeta Release\033[0m]\033[0m\n####################\n";
        echo -e "Check-File Started: ${{ github.event.repository.updated_at }}\n";
        if [[ -r '/etc/os-release' ]]; then
          . /etc/os-release
          if [[ "${ID}" == 'ubuntu' ]]; then
            echo "Name: ${NAME}";
            echo "Version: ${VERSION}";
            echo "ID: ${ID}";
            echo "ID Like: ${ID_LIKE}";
            echo "Pretty Name: ${PRETTY_NAME}";
            echo "Version ID: ${VERSION_ID}";
          else
            echo "Not running an Ubuntu distribution. ID=${ID}, VERSION=${VERSION}";
          fi;
        else
          echo "Not running a distribution with /etc/os-release available";
        fi;
        echo '';
      shell: bash
      continue-on-error: true

    - name: Clone Recovery Repo
      if: inputs.repository == 'true'
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        clean: ${{ inputs.clean }}
        fetch-depth: 1
        show-progress: false
      continue-on-error: false

    - name: Restore Project Files
      if: inputs.cache == 'true' && ( inputs.stored == 'true' || inputs.source > '0' )
      id: restore
      uses: actions/cache/restore@v5
      env:
        cache-name: check-file-action
      with:
        path: |
          ./build
          compile_commands.json
          check-file-sources.txt
          check-file-includes.txt
          check-file-repaired.txt
        key: ${{ runner.os }}-${{ env.cache-name }}
        restore-keys: |
          ${{ runner.os }}
        enableCrossOsArchive: true
      continue-on-error: true

    - name: Access repo info and branch
      run: |
        echo '';
        if ${{ steps.restore.outputs.cache-hit == 'true' }}; then
          echo -e "####################\n\033[32mCheck-File Restored Project Configuration From Cache!\033[0m\n####################\n";
        fi;
        echo "Repository Owner and Name: ${GITHUB_REPOSITORY}";
        echo "Branch Name: ${{ github.ref_name }}";
        echo "GitHub URL: ${{ github.server_url }}";
        echo "Repository URL via context: ${{ github.server_url }}/${{ github.repository }}";
        echo -e "Ref (branch/tag) via context: ${{ github.ref }}\n";
      shell: bash
      continue-on-error: true

    - name: Install OpenJDK
      if: inputs.build == '1' || inputs.build == '2'
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 17
      continue-on-error: true

    - name: Setup Android SDK
      if: inputs.build == '1' || inputs.build == '2'
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
      env:
        SKIP_JDK_VERSION_CHECK: true
      continue-on-error: true

    - name: Set up Go 1.25.3
      if: env.filename != ''
      uses: actions/setup-go@v2
      with:
        go-version: '1.25.3'
      continue-on-error: true

    - name: Setup An Clang Clean
      if: inputs.project == 'true'
      run: |
       echo '';
       repo=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
       echo "github_repository=${repo}" >> "${GITHUB_ENV}";
       if ${{ inputs.filename != '' }}; then
         echo "filename=${{ inputs.filename }}" >> "${GITHUB_ENV}";
       else
         echo "filename=${{ inputs.filetype }}" >> "${GITHUB_ENV}";
       fi;
       if ${{ inputs.build > '0' }}; then
         echo 'github_build_project=true' >> "${GITHUB_ENV}";
       else
         echo 'github_build_project=false' >> "${GITHUB_ENV}";
       fi;
       echo "arch=${{ inputs.arch }}" >> "${GITHUB_ENV}";
       echo "release1=" >> "${GITHUB_ENV}";
       echo "release2=" >> "${GITHUB_ENV}";
       echo "release3=" >> "${GITHUB_ENV}";
       echo 'include_count=0' >> "${GITHUB_ENV}";
       echo "filetype=${{ inputs.filetype }}" >> "${GITHUB_ENV}";
       echo 'includes=false' >> "${GITHUB_ENV}";
       echo "include=${{ inputs.include }}" >> "${GITHUB_ENV}";
       echo 'sources=false' >> "${GITHUB_ENV}";
       echo 'file_fixed=0' >> "${GITHUB_ENV}";
       echo 'file_found=0' >> "${GITHUB_ENV}";
       echo 'file_error=0' >> "${GITHUB_ENV}";
       echo 'file1_parted=0' >> "${GITHUB_ENV}";
       echo 'file2_parted=0' >> "${GITHUB_ENV}";
       echo 'build_cache=false' >> "${GITHUB_ENV}";
       echo 'check_build=false' >> "${GITHUB_ENV}";
       echo 'database=database' >> "${GITHUB_ENV}";
       echo 'include_missing=false' >> "${GITHUB_ENV}";
       echo "update=${{ inputs.update }}" >> "${GITHUB_ENV}";
       echo "dirname=${{ inputs.dirname }}" >> "${GITHUB_ENV}";
       echo 'export ALLOW_MISSING_DEPENDENCIES=true' | sudo tee -a ~/.bashrc >/dev/null;
       echo 'export GIT_DISCOVERY_ACROSS_FILESYSTEM=1' | sudo tee -a ~/.bashrc >/dev/null;
       echo 'export DEBIAN_FRONTEND=noninteractive' | sudo tee -a ~/.bashrc >/dev/null;
       echo 'export LLVM_ENABLE_THREADS=ON' | sudo tee -a ~/.bashrc >/dev/null;
       echo 'export WITH_TIDY=1' | sudo tee -a ~/.bashrc >/dev/null;
       echo 'export LC_ALL=C' | sudo tee -a ~/.bashrc >/dev/null;
       sudo mkdir -p /usr/local/bin /usr/local/lib/android/sdk
       sudo chmod -R 0755 "${{ github.action_path }}/scripts";
       if ${{ inputs.version != '' }} && [[ $(which clang-tidy-18) ]]; then
         sudo apt-get remove -yq clang-tidy-18 >/dev/null;
       fi;
       if ${{ inputs.version != '' }} && [[ $(which clang-18) ]]; then
         sudo apt-get remove -yq clang-18 llvm-18 >/dev/null 2>&1;
       fi;
       if ${{ inputs.version != '' }}; then
         sudo update-alternatives --remove-all clang >/dev/null 2>&1
         sudo update-alternatives --remove-all clang++ >/dev/null 2>&1
       fi;
      shell: bash
      continue-on-error: true

    - name: Install LLVM and Clang
      if: runner.os == 'Linux' && (inputs.project == 'true' || inputs.filename != '' || inputs.filetype != '')
      run: |
        set -a
        source ~/.bashrc
        USER="${USER}";
        if [[ -x "${{ github.action_path }}/scripts/linux.sh" ]]; then
          bash -c "${{ github.action_path }}/scripts/linux.sh";
          if ${{ inputs.project == 'true' }} && ${{ inputs.internal == 'true' }} && ${{ inputs.arch == 'arm' }}; then
            LLVM_VERSION="${{ inputs.version }}";
            export USER LLVM_VERSION
            bash -c "${{ github.action_path }}/scripts/linux-arm.sh";
          fi;
        fi;
      env:
        LLVM_VERSION: ${{ inputs.version }}
        LLVM_ARM_VERSION: ${{ inputs.release }}
        SETUP_LLVM_GITHUB_TOKEN: ${{ inputs.token }}
      shell: bash
      continue-on-error: true

    - id: output-path
      if: runner.os == 'Linux' && (inputs.project == 'true' || inputs.filename != '' || inputs.filetype != '')
      run: |
        print('')
        import os
        with open(os.getenv("GITHUB_OUTPUT"), "a") as f:
          print(f"llvm-path={os.getenv('LLVM_PATH')}", file=f)
      shell: python
      continue-on-error: true
    
    - name: Installing Dependencies
      if: inputs.pattern != '' || env.filename != '' || inputs.project != 'false'
      run: |
        source ~/.bashrc
        set +e;
        sudo apt-get clean
        sudo add-apt-repository universe >/dev/null;
        sudo apt-get -yq update 2>&1 >/dev/null | sed '/Running/,/host./d';
        sudo apt-get -yq install aptitude 2>&1 >/dev/null | sed '/Running/,/host./d' || echo -e '::error::No aptitude installer for installing packages';
        linux_distro1="24.04";
        linux_distro2="22.04";
        linux_distro3="20.04";
        linux_verison=$(lsb_release -r | awk '{ print $2; }');
        if ${{ inputs.project == 'true' }} && [[ ! $(which cmake) ]]; then
          sudo aptitude -yq install cmake make 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "####################\ncmake dependencies installed\n####################" || echo -e '::error::No cmake installed for project build';        
          [[ ! $(which cmake) ]] && exit 1
        fi;
        if [[ ! $(which clang) ]]; then
          sudo aptitude -yq install clang 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "####################\nclang dependencies installed\n####################" || echo -e '::error::No clang installed for repo updates';
          [[ ! $(which clang) ]] && exit 1
        fi;
        cmake_version=$(cmake --version 2>/dev/null | grep version | awk '{ print $3; }');
        clang_version=$(clang --version 2>/dev/null | awk '{ print $4; }');
        clang_tidy_version=$(clang-tidy --version 2>/dev/null | grep version | awk '{ print $3; }');
        clang_tidy_required_version='21.1.6';
        cmake_required_version="4.2.1";
        if (${{ inputs.project == 'true' }} || [[ "${file_type}" == [cth]* ]]) && ([[ ! $(which clang-tidy) ]] || [[ $(printf '%s\n%s' "${clang_tidy_version}" "${clang_tidy_required_version}" | sort -V | head -n1) == "${clang_tidy_version}" ]] && [[ "${clang_tidy_version}" != "${clang_tidy_required_version}" ]]); then
          python3 -m pip install --upgrade clang-tools >/dev/null && echo -e "\n####################\nclang tools pip dependencies installed\n####################\n" || echo -e '::error::No clang tools installed for project check';
          [[ -e "${HOME}/.local/bin/clang-tidy" ]] && sudo mv -vf "${HOME}/.local/bin/clang-tidy" '/usr/bin/clang-tidy' && echo '';
          [[ -e "${HOME}/.local/bin/run-clang-tidy" ]] && sudo mv -vf "${HOME}/.local/bin/run-clang-tidy" '/usr/bin/run-clang-tidy'
          [[ ! $(which clang-tidy) ]] && exit 1
        fi;
        if ${{ inputs.project == 'true' }}; then
          if [[ $(printf '%s\n%s' "${cmake_version}" "${cmake_required_version}" | sort -V | head -n1) == "${cmake_version}" ]] && [[ "${cmake_version}" != "${cmake_required_version}" ]] && ${{ inputs.project }}; then
            echo -e "Current CMake version (${cmake_version}) is older than ${cmake_required_version}. Updating....";
            sudo apt-get remove --purge -yq cmake 2>&1 >/dev/null | sed '/Running/,/host./d'
            sudo aptitude install -yq ca-certificates gpg wget 2>&1 >/dev/null | sed '/Running/,/host./d'
            [[ ! $(which make) ]] && sudo apt-get install -yq make >/dev/null && echo -e "####################\nmake dependencies already installed\n####################\n";
            sudo bash -c "$(sudo wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null)";
            if [[ "${linux_verison}" == "${linux_distro1}" ]]; then
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            elif [[ "${linux_verison}" == "${linux_distro2}" ]]; then
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            elif [[ "${linux_verison}" == "${linux_distro3}" ]]; then
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ focal main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            else
              echo -e "\nKitWare Keyring: Noble ${linux_verison}\n";
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            fi;
          fi;
        fi;
        text0="####################\ngit dependencies installed\n####################";
        text1="####################\nripgrep dependencies installed\n####################";
        text2="####################\ncolorized-logs dependencies installed\n####################";
        text3="####################\nca-certificates dependencies installed\n####################";
        text4="####################\ncppcheck dependencies installed\n####################";
        text5="####################\nclang-tools dependencies installed\n####################";
        text6="####################\nshellharden dependencies installed\n####################";
        text7="####################\nshellcheck dependencies installed\n####################";
        text8="####################\ncheckmake dependencies installed\n####################";
        text9="####################\nbatcat dependencies installed\n####################";
        file_name="${{ env.filename }}";
        file_type="${file_name##*.}";
        github=${GITHUB_WORKSPACE};
        if [[ ! $(which python3) ]]; then
          sudo aptitude -yq install python3 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "####################\npython3 dependencies installed\n####################" || echo -e '::error::No python3 installed for project checks';
          [[ ! $(which python3) ]] && exit 1
        fi;
        echo 'deb [trusted=yes] https://apt.gabe565.com /' | sudo tee -a /etc/apt/sources.list.d/gabe565.list >/dev/null;
        if ${{ inputs.project == 'true' }} && [[ $(printf '%s\n%s' "${cmake_version}" "${cmake_required_version}" | sort -V | head -n1) == "${cmake_version}" ]] && [[ "${cmake_version}" != "${cmake_required_version}" ]]; then
          python3 -m pip install --upgrade pip >/dev/null && echo -e "\n####################\npip dependencies installed\n####################" || echo -e '::warning::pip not updated for project checks';
          echo -e "\nCMake version $cmake_version upgrading to latest python cmake";
          sudo rm -f "$(which cmake)";
          sudo mkdir -p '/usr/local/bin';
          echo "/usr/local/bin" >> "${GITHUB_PATH}";
          python3 -m pip install --upgrade cmake >/dev/null && echo -e "\n####################\ncmake pip dependencies installed\n####################" || echo -e '::error::No cmake pip installed for project checks';
          sudo cp -pf "${HOME}/.local/bin/cmake" '/usr/local/bin/';
        fi;
        if [[ ! $(which bc) ]]; then
          sudo aptitude -yq install bc 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "####################\nbc dependencies installed\n####################" || echo -e '::error::No bc installed for project file amount checks';
          [[ ! $(which bc) ]] && exit 1
        fi;
        if ${{ inputs.project == 'true' }} && [[ ! $(which update-ca-certificates) ]]; then
          sudo aptitude -yq install ca-certificates 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "${text3}" || echo 'No ca-certificates installed effects can vary';
        fi;
        if [[ ! $(which gawk) ]]; then
          sudo aptitude -yq install gawk 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "####################\ngawk dependencies installed\n####################" || echo -e "\n::error::No gawk installed in linux exiting";
        fi;
        if ${{ inputs.project == 'true' }} && (${{ inputs.source == '4' }} || [[ -e 'check-file-compile.txt' ]]); then
          go build ${{ github.action_path }}/scripts/cmakebar.go && echo -e "\n####################\ncmakebar dependencies installed\n####################" || echo -e '::error::No cmakebar installed for project checks';
          [[ -e "cmakebar" ]] && sudo cp -f 'cmakebar' '/usr/local/bin/'
        fi;
        if [[ ! $(which git) ]]; then
          sudo aptitude -yq install git git-core 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "${text0}" || echo -e '::error::No git installed for repo updates';
          [[ ! $(which git) ]] && exit 1
        fi;
        if [[ ! $(whereis gcc-arm-linux-gnueabihf) ]]; then
          sudo aptitude install -y gcc-arm-linux-gnueabihf 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "${text0}" || echo -e '::error::No gcc-arm-linux-gnueabihf installed for arm projects check/build';
          [[ ! $(whereis gcc-arm-linux-gnueabihf) ]] && echo -e '::warning::No gcc-arm-linux-gnueabihf installed for arm projects';
        fi;
        if ${{ inputs.analyzer == '1' }} && ${{ inputs.project == 'true' }} && [[ $(which run-clang-tidy) ]]; then
          echo -e "\n[clang-tools] $(whereis -b run-clang-tidy)";
          [[ $(whereis clang-format) ]] && echo -e "\n[clang-tools]: $(whereis -b clang-format)" || echo -e '::error::No clang-format pip installed for project checks';
          [[ $(whereis clang-apply-replacements) ]] && echo -e "\n[clang-tools]: $(whereis -b clang-apply-replacements)" || echo -e '::error::No clang-apply-replacements pip installed for project checks';
          echo 'run_clang_tidy=run-clang-tidy' >> "${GITHUB_ENV}";
        elif ${{ inputs.analyzer == '1' }} && ${{ inputs.project == 'true' }}; then
          echo -e "\n[clang-tools] run-clang-tidy: /scripts/tools/run-clang-tidy.py" || echo -e '::error::No run-clang-tidy.py pip installed for project checks';
          [[ $(whereis clang-format) ]] && echo -e "\n[clang-tools]: $(whereis -b clang-format)" || echo -e '::error::No clang-format pip installed for project checks';
          [[ $(whereis clang-apply-replacements) ]] && echo -e "\n[clang-tools]: $(whereis -b clang-apply-replacements)" || echo -e '::error::No clang-apply-replacements pip installed for project checks';
          echo "run_clang_tidy=${{ github.action_path }}/scripts/tools/run-clang-tidy.py" >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.project == 'true' }} && ${{ inputs.analyzer == '3' }} && [[ ! $(which clangd-tidy) ]]; then
          python3 -m pip install --upgrade clangd-tidy >/dev/null && echo -e "\n####################\nclangd-tidy dependencies installed\n####################" || echo -e '::error::No clangd-tidy installed for project checks';
          sudo aptitude -yq install clangd 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "\n####################\nclangd pip dependencies installed\n####################" || echo -e '::error::No clangd pip installed for project checks';
          if [[ ! $(which clangd-tidy) ]]; then
            exit 1
          fi;
        fi;
        if ${{ inputs.project == 'true' }} && [[ ! $(apt list linux-headers-generic >/dev/null 2>&1) ]]; then
          sudo aptitude -yq install linux-headers-generic 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "####################\nDependencies $(apt list linux-headers-generic 2>/dev/null)\n####################" || echo -e "::warning::No linux-headers-generic installed for project build";
        fi;
        if [[ ! $(which fdfind) ]]; then
          sudo aptitude -yq install fd-find 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "####################\nfdfind dependencies installed\n####################" || echo -e '::error::No fdfind installed for file searches';
          [[ ! $(which fdfind) ]] && exit 1
        fi;
        if [[ ! $(which gcc) ]] || [[ ! $(which g++) ]] && ${{ inputs.repair == 'true' }} && ${{ env.filename != '' }}; then
          sudo aptitude -yq install gcc g++ 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "####################\ngcc g++ dependencies installed\n####################" || echo -e '::error::No gcc or g++ installed for repo updates';
          [[ ! $(which gcc) ]] || [[ ! $(which g++) ]] && exit 1
        fi;
        if (${{ inputs.analyzer == '4' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}) && [[ ! $(which CodeChecker) ]]; then
          sudo aptitude -yq install python3-pip python3-venv 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "\n####################\npython3-pip dependencies installed\n####################" || echo -e '::error::No python3-pip installed for project checks';
          python3 -m pip install --upgrade codechecker >/dev/null && echo -e "\n####################\ncodechecker dependencies installed\n####################" || echo -e '::error::No codechecker installed for project checks';
          sudo mkdir -p "${HOME}/codechecker/venv/include";
          sudo mkdir -p "${HOME}/codechecker/venv/bin";
          sudo chown -R "${USER}:${USER}" ${HOME}/codechecker/
          cd "${HOME}/codechecker/venv";
          python3 -m venv .
          cd "${github}";
          if [[ ! $(which CodeChecker) ]]; then
            exit 1
          fi;
        fi;
        if ${{ inputs.project == 'true' }} && ${{ inputs.build > '2' }} && [[ ! $(which deheader) ]]; then
          sudo aptitude -yq install deheader 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "\n####################\ndeheader dependencies installed\n####################" || echo -e '::error::No deheader installed for project includes check';
          [[ ! $(which deheader) ]] && exit 1
        fi;
        if ${{ inputs.project == 'true' }} && [[ ! $(dpkg -s build-essential 2>/dev/null) ]]; then
          sudo aptitude -yq install build-essential device-tree-compiler 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "####################\nbuild-essential dependencies installed\n####################" || echo -e '::error::No build-essential installed for project build';
        fi;
        if ${{ inputs.project == 'true' }} && ${{ inputs.analyzer == 3 }} && [[ ! $(which tqdm) ]]; then
          python3 -m pip install tqdm >/dev/null && echo -e "\n####################\ntqdm dependencies installed\n####################\n" || echo -e '::warning::No tpdm installed for project progress checks';
          [[ ! $(which tqdm) ]] && exit 1
        fi;
        if (${{ inputs.pattern != '' }} || ${{ inputs.database == 'true' }} || ${{ inputs.source > '0' }}) && [[ ! $(which rg) ]]; then
          sudo aptitude -yq install ripgrep 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "${text1}" || echo -e '::error::No ripgrep installed for pattern matching';
          [[ ! $(which rg) ]] && exit 1
        fi;
        if ${{ inputs.report == 'true' }} && [[ ! $(which ansi2txt) ]]; then
          python3 -m pip install ansi2txt >/dev/null || sudo aptitude -yq install colorized-logs 2>&1 >/dev/null | sed -E '/Running/,/host./d';
          [[ $(which ansi2txt) ]] && echo -e "\n${text2}" || echo -e '::warning::No ansi2txt installed for cleaning log report';
        fi;
        if [[ "${file_type}" == [cth]* ]] && [[ ! $(which cppcheck) ]]; then
          sudo aptitude -yq install cppcheck 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "${text4}" || echo -e '::error::No cppcheck installed Exiting';
          [[ ! $(which cppcheck) ]] && exit 1
        fi;
        if [[ "${file_type}" == sh ]] && ${{ inputs.repair == 'true' }} && [[ ! $(which shellharden) ]]; then
          sudo wget -qO 'shellharden.tar.gz' 'https://github.com/anordal/shellharden/releases/latest/download/shellharden-x86_64-unknown-linux-gnu.tar.gz' >/dev/null;
          sudo tar xf 'shellharden.tar.gz' -C '/usr/local/bin' 'shellharden' && rm -vrf 'shellharden.tar.gz' && echo -e "${text6}" || echo -e '::error::No shellharden installed Exiting';
          [[ ! $(which shellharden) ]] && exit 1 || echo -e "\nLocation: $(which shellharden)";
        fi;
        if [[ "${file_type}" == sh ]] && [[ ! $(which shellcheck) ]]; then
          sudo aptitude -yq install shellcheck 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "${text7}" || echo -e '::error::No shellcheck installed Exiting';
          [[ ! $(which shellcheck) ]] && exit 1 || echo -e "\nLocation: $(which shellcheck)";
        fi;
        checkmake_src='checkmake.ini';
        checkmake_des="${HOME}/checkmake.ini";
        if [[ "${checkmake_src}" ]] && [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]] && [[ $(which checkmake) ]]; then
          sudo cp -vf "${checkmake_src}" "${checkmake_des}" 2>/dev/null;
        elif [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]] && [[ $(which checkmake) ]]; then
          echo -e '\ncheckmake.ini file missing, needed for checkmake to function properly\n';
        fi;
        if [[ "${checkmake_src}" ]] && [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]] && [[ ! $(which checkmake) ]]; then
          go install "github.com/checkmake/checkmake/cmd/checkmake@latest" >/dev/null && echo -e "\n${text8}\n" || echo -e '::error::No checkmake installed Exiting';
          sudo cp -vf "${checkmake_src}" "${checkmake_des}" 2>/dev/null;
          [[ ! $(which checkmake) ]] && exit 1
        fi;
        if ${{ env.filename != '' }} || ${{ inputs.pattern != '' }}; then
          if [[ $(which bat) ]] && [[ ! $(which batcat) ]]; then
            sudo ln -sf "$(which bat)" /usr/bin/batcat >/dev/null || echo -e '::error::No batcat installed Exiting';
            [[ ! $(which batcat) ]] && exit 1
            echo -e "\nalias batcat='bat'" | sudo tee -a ~/.bashrc >/dev/null;
            echo 'export BAT_THEME=ansi' | sudo tee -a ~/.bashrc >/dev/null;
            echo "export BAT_CONFIG_PATH=${github}/bat.conf" | sudo tee -a ~/.bashrc >/dev/null;
          elif [[ ! $(which batcat) ]]; then
            sudo aptitude -yq install bat 2>&1 >/dev/null | sed -E '/Running/,/host./d' && echo -e "${text9}" || echo -e '::error::No batcat installed Exiting';
            [[ ! $(which batcat) ]] && exit 1
            echo 'export BAT_THEME=ansi' | sudo tee -a ~/.bashrc >/dev/null;
            echo "export BAT_CONFIG_PATH=${github}/bat.conf" | sudo tee -a ~/.bashrc >/dev/null;
          fi;
        fi;
        if [[ -d '/usr/local/bin' ]]; then
          echo '/usr/local/bin' >> "${GITHUB_PATH}";
        fi;
        if [[ -d "${HOME}/.local/bin" ]]; then
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}";
        fi;
        if [[ -d "${HOME}/codechecker/build/CodeChecker/bin" ]]; then
          echo "${HOME}/codechecker/build/CodeChecker/bin" >> "${GITHUB_PATH}";
        fi;
        sudo aptitude install -f -yq 2>&1 >/dev/null | sed '/Running/,/host./d';
        echo '';
      shell: bash
      continue-on-error: false
      
    - name: Set Directory Base
      if: inputs.pattern != '' || env.filename != '' || inputs.project == 'true' || inputs.source > '0'
      run: |
        echo '';
        repair_file='check-file-repaired.txt';
        repo=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
        dirname="${{ inputs.dirname }}";
        text1a="####################";
        text1b="DEFAULT DIRECTORY (GITHUB ROOT)";
        text1c="####################";
        text2a="####################";
        text2b="DEFAULT DIRECTORY (GITHUB WORKSPACE)";
        text2c="####################";
        text3a="####################";
        text3b="Store repaired files Enabled";
        text3c="####################";
        text4="Creating ${repair_file} for checked files";
        text5a="####################";
        text5b="Database Performance Mode Enabled";
        text5c="####################";
        text6="::error::Database not found exiting";
        text7a="####################";
        text7b="Searching directories for ${{ env.filename }} file(s)";
        text7c="####################";
        text8a="####################";
        text8b="Searching ${{ inputs.filetype }} files for ${{ inputs.pattern }} match(s)";
        text8c="####################";
        text9a="####################";
        text9b="Searching all files for ${{ inputs.pattern }} match(s)";
        text9c="####################";
        text10a="#####################";
        text10b="Searching ${{ inputs.dirpath }} directory first for ${{ env.filename }} match(s)";
        text10c="#####################";
        text11a="#####################";
        text11b="#\033[1m\033[32m CHECK FILE ACTION \033[0m#";
        text11c="#####################";
        text() {
          local text="$1";
          echo -e "${text}";
        }
        if ${{ inputs.absolute == 'true' }}; then
          text "${text1a}";
          text "${text1b}";
          text "${text1c}";
          echo -e '\nAbsolute Path Mode';
          echo "base=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}";
          echo 'github_absolute_path=true' >> "${GITHUB_ENV}";
          base="${GITHUB_WORKSPACE}";
        else
          text "${text2a}";
          text "${text2b}";
          text "${text2c}";
          echo -e "\nRelative Path Mode";
          echo 'base=.' >> "${GITHUB_ENV}";
          echo 'github_absolute_path=false' >> "${GITHUB_ENV}";
          base='.'
        fi;
        if (${{ inputs.stored == 'true' }} || ${{ env.update == 'true' }}) && [[ -f "${repair_file}" ]]; then
          repaired="${repair_file}";
          if [[ -f ${repaired} ]]; then
            text "\n${text3a}";
            text "${text3b}";
            text "${text3c}";
          else
            text "\n${text4a}";
            text "${text4b}";
            text "${text4c}";
            date '+%Y%m%d' > "${repaired}" || echo -e "::warning::${repaired} backup file not found";
          fi;
        fi;
        if ${{ inputs.database == 'true' }}; then
          if ${{ inputs.root == 'true' }}; then
            sudo find "/" -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -xdev -type f -print | sort -t/ -k1.2 > 'database';
          else
            find "${base}" -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -type f -print | sort -t/ -k1.2 > 'database';
          fi;
          if [[ -s 'database' ]]; then
            text "\n${text5a}";
            text "${text5b}";
            text "${text5c}";
            echo 'database=database' >> "${GITHUB_ENV}";
          else
            text "\n${text5a}";
            text "${text6}";
            text "${text5c}";
          fi;
        fi;
        if ${{ env.filename != '' }} && ${{ inputs.build == '0' }}; then
          text "\n${text7a}";
          text "${text7b}";
          text "${text7c}";
        fi;
        if ${{ inputs.pattern != '' }} && ${{ inputs.filetype != '' }}; then
          text "\n${text8a}";
          text "${text8b}";
          text "${text8c}";
        elif ${{ inputs.pattern != '' }}; then
          text "\n${text9a}";
          text "${text9b}";
          text "${text9c}";
        fi;
        if ${{ inputs.dirpath != '' }} && ${{ env.filename != '' }}; then
          text "\n${text10a}";
          text "${text10b}";
          text "${text10c}";
        fi;
        if ${{ inputs.project == 'true' }} && ${{ env.filename != '' }} && ${{ inputs.analyzer > '0' }}; then
          text "::warning:: project:true and filename:set both enabled auto sets analyzer:0 to disable\nTo remove this warning use ( analyzer: 0 )\n";
          echo "analyzer=0" >> "${GITHUB_ENV}";
        else
          echo "analyzer=${{ inputs.analyzer }}" >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.repository == 'false' }} && ${{ inputs.dirpath != '' }}; then
          echo -e "\nRepository auto clone disabled checking all project files in: ${GITHUB_WORKSPACE}";
        fi;
        source_dirs=$(ls);
        type_count=0
        total_files=$(find -type f | grep -v '\.git/.' | wc -l);
        file_type0=$(find -type f -name "*.${{ inputs.filetype }}" | grep -v '\.git/.' | wc -l);
        file_type1=$(find -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.c++' -o -name '*.tpp' \) | grep -v '\.git/.' | wc -l);
        file_type2=$(find -type f \( -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.h++' \) | grep -v '\.git/.' | wc -l);
        percentage0=$(echo "scale=2; (${file_type0:-0} / ${total_files:-0}) * 100" | bc);
        percentage1=$(echo "scale=2; (${file_type1:-0} / ${total_files:-0}) * 100" | bc);
        percentage2=$(echo "scale=2; (${file_type2:-0} / ${total_files:-0}) * 100" | bc);
        include_dirs=$(find -type d -name 'include' -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | wc -l);
        file_count() {
          fdfind -j "$(nproc)" --type file . | grep -iEo '\_[[:alnum:]]+$|\-[[:alnum:]]+$|\.[[:alnum:]]+$|[[:alnum:]]+$' | tr -d '_\-\.' | sort | uniq -c | sed 's/^ *//' | while IFS= read -r file; do
            echo "${file} files";
          done;
        }
        directory() {
          while IFS= read -r dir; do
            if [[ -d "${dir}" ]]; then
              count=$(find "${dir}" -type f | wc -l);
              echo "${dir}: ${count} files";
            fi;
          done <<< "${source_dirs[@]}";
        }
        file_types() {
          type_count=0
          while IFS= read -r file; do
            type_count=$(expr ${type_count} + 1);
          done < <(file_count);
          echo "${type_count}";
        }
        if ${{ inputs.content == 'true' }}; then
          if [[ "$(directory)" ]]; then
            echo -e "\n#####################\nProject Source Directories:\n#####################\n\n$(directory)";
          fi;
          if [[ "$(file_count)" ]]; then
            echo -e "\n#####################\nProject File Types:\n#####################\n\n$(file_count)";
          fi;
          if [[ "$(file_types)" ]]; then
            echo -e "\n#####################\nDifferent File Types: \033[1m$(file_types)\033[0m\n#####################";
          fi;
          if [[ "${include_dirs}" ]]; then
            echo -e "\n#####################\nTotal Include Directories: \033[1m${include_dirs}\033[0m\n#####################";
          fi;
          if [[ "${total_files:-0}" > '0' ]] && ${{ inputs.filetype != '' }}; then
            echo -e "\nThe total percentage of ${{ inputs.filetype }} files is: \033[1m${percentage0:-0}%\033[0m";
            echo -e "\nThe total percentage of header files is: \033[1m${percentage2:-0}%\033[0m";
            echo -e "\n#####################\nRepository: \033[1m${repo}\033[0m\n#####################\n\nProject has \033[1m${total_files}\033[0m files total";
          elif [[ "${total_files:-0}" > '0' ]]; then
            echo -e "\nThe total percentage of c/c++ files is: \033[1m${percentage1:-0}%\033[0m";
            echo -e "\nThe total percentage of header files is: \033[1m${percentage2:-0}%\033[0m";
            echo -e "\n#####################\nRepository: \033[1m${repo}\033[0m\n#####################\n\nProject has \033[1m${total_files}\033[0m files total";
          else
            echo -e "\n#####################\n::warning::Repository: ${{ inputs.dirpath }} has no ${{ inputs.filetype }} files build only?! continuing....\n#####################\n";
          fi;
        fi;
        text "\n${text11a}" 2>/dev/null;
        text "${text11b}" 2>/dev/null;
        text "${text11c}\n" 2>/dev/null;
      shell: bash
      continue-on-error: true

    - name: Linux Project Includes
      if: inputs.project == 'true' || env.filename != ''
      run: |
        source ~/.bashrc
        set +e
        [[ -n "${LINUXINCLUDE}" ]] && echo -e "\nUSER INCLUDE CHECK: ${USERINCLUDE}\nLINUX INCLUDE CHECK: ${LINUXINCLUDE}";
        srctree="${GITHUB_WORKSPACE}";
        objtree="${srctree}";
        hdr_arch="${{ inputs.arch }}";
        if ${{ inputs.internal == 'true' }}; then
          ${{ inputs.dirname != '' }} && srctree="${GITHUB_WORKSPACE}/${{ inputs.dirname }}" && objtree="${GITHUB_WORKSPACE}/${{ inputs.dirname }}";
          USERINCLUDE="-I${srctree}/arch/${hdr_arch}/include/uapi \
        -I${objtree}/arch/${hdr_arch}/include/generated/uapi \
        -I${srctree}/include/uapi \
        -I${objtree}/include/generated/uapi \
        -include ${srctree}/include/linux/kconfig.h";
          LINUXINCLUDE="-I${srctree}/arch/${hdr_arch}/include \
        -I${objtree}/arch/${hdr_arch}/include/generated/uapi \
        -I${objtree}/arch/${hdr_arch}/include/generated \
        ${KBUILD_OPT} \
        -I${objtree}/include \
        -I${srctree}/drivers/misc/mediatek/include";
        KBUILD_OPT="";
          if [[ -n "${KBUILD_SRC}" ]]; then
            KBUILD_OPT="-I${srctree}/include";
          fi;
          ${{ inputs.content == 'true' }} && echo -e "\nUSERINCLUDE: ${USERINCLUDE//$'\n'/ }" | tr ' ' '\n' && echo -e "\nLINUXINCLUDE: ${LINUXINCLUDE//$'\n'/ }" | tr ' ' '\n';
        else
          if [[ -n "${KBUILD_SRC}" ]]; then
            KBUILD_OPT="-I${srctree}/include";
          fi;
          LINUXINCLUDE="-I/usr/src/linux-headers-$(uname -r)/include";
          USERINCLUDE="-include ${srctree}/include/linux/kconfig.h";
          ${{ inputs.content == 'true' }} && echo -e "\nUSERINCLUDE: ${USERINCLUDE// /}" && echo -e "\nLINUXINCLUDE: ${LINUXINCLUDE// /}";
        fi;
        if ${{ inputs.project == 'true' }} && ${{ inputs.internal == 'true' }} && ${{ inputs.arch == 'arm' }} && [[ -n "${LLVM_ARM_PATH}" ]]; then
          echo -e "\nLLVM_ARM_PATH: ${LLVM_ARM_PATH}";
          echo -e "LLVM_ARM_TOOLCHAIN: ${LLVM_ARM_TOOLCHAIN}\n";
        fi;
        echo "USERINCLUDE=${USERINCLUDE}" >> "${GITHUB_ENV}";
        echo "LINUXINCLUDE=${LINUXINCLUDE}" >> "${GITHUB_ENV}";
        echo "export srctree=${srctree}" | sudo tee -a ~/.bashrc >/dev/null;
        echo "export objtree=${objtree}" | sudo tee -a ~/.bashrc >/dev/null;
        echo "export hdr_arch=${hdr_arch}" | sudo tee -a ~/.bashrc >/dev/null;
        echo "export USERINCLUDE=${USERINCLUDE}" | sudo tee -a ~/.bashrc >/dev/null;
        echo "export LINUXINCLUDE=${LINUXINCLUDE}" | sudo tee -a ~/.bashrc >/dev/null;
        config=$(find "${{ env.base }}" -type f -path '*/config/*' -name 'kernel.release' | grep . || sudo find "/usr/src" -xdev -type f -name 'kernel.release' -print);
        if [[ "${config}" ]] && ${{ inputs.content == 'true' }}; then
          echo -e "\nLINUXKERNEL RELEASES:";
          sudo less $(echo -n ${config});
          release1="$(sudo less $(echo -n ${config}) | awk 'NR==1')";
          release2="$(sudo less $(echo -n ${config}) | awk 'NR==2')";
          release3="$(sudo less $(echo -n ${config}) | awk 'NR==3')";
          [[ -n "${release1}" ]] && echo "release1=${release1}" >> "${GITHUB_ENV}";
          [[ -n "${release2}" ]] && echo "release2=${release2}" >> "${GITHUB_ENV}";
          [[ -n "${release3}" ]] && echo "release3=${release3}" >> "${GITHUB_ENV}";
        fi;
        echo '';
      shell: bash
      continue-on-error: true

    - name: Source Includes Fixer A
      if: inputs.source == '1' || inputs.source == '2'
      run: |
        echo '';
        set +e
        start_time="${SECONDS}";
        file_name="${{ env.filename }}";
        file_type="${file_name##*.}";
        repository=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
        project_log="${repository}_project.log";
        export LC_ALL=C
        export LS_COLORS=true
        SAVEIFS="${IFS}";
        include_missing=1
        include_count=1
        include_total=1
        include_dirs=1
        file_count=1
        count1=0
        count2=0
        count3=0
        count4=0
        count5=0
        checked=false
        source_include=false
        includes_found=false
        include1='include-file1.txt';
        include_list='check-file-sources.txt';
        name_count_file='name-count-file.txt';
        include_count_file='include-count-file.txt';
        github="${GITHUB_WORKSPACE}";
        process_input() {
          while IFS= read -r output; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${output}" | tee -a "${project_log}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${output}" >> "${project_log}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${output}";
            elif ${{ inputs.output == '4' }}; then
              echo -e "${output}" >/dev/null;
            fi;
          done;
        }
        if ${{ inputs.absolute == 'true' }}; then
          abs='--absolute-path';
        else
          abs='--relative-path';
        fi;
        echo -e "####################\n\t\033[33mPROGRESSIVE SCAN MODE\033[0m\n####################" | process_input;
        include_files1=$(fdfind -p -c auto "${abs}" -e "${{ inputs.filetype }}" "${{ env.base }}" -j "$(nproc)" | gawk -F'/' '{print $NF, $0}' | sort -k1,1 | cut -d' ' -f2-);
        include_files2=$(fdfind -p -c auto "${abs}" -e "${{ inputs.filetype }}" "${{ env.base }}" -j "$(nproc)" | xargs -r rg --sort=path --trim -H -o '^#include[[:space:]]+[<].*[>]' | tr -d '<>' | gawk '{ print $NF, $0 }' | sort -k1,1 -us | cut -d' ' -f2-);
        [[ -f "${include_list}" ]] && mv -f "${include_list}" "${include_list}.old";
        [[ -f "${include1}" ]] && rm -f "include-file*.txt";
        [[ -f "${name_count_file}" ]] && rm -f "${name_count_file}";
        [[ -f "${include_count_file}" ]] && rm -f "${include_count_file}";
        if [[ "${{ inputs.filetype }}" == [c]* ]] && ${{ inputs.source == '1' }} && [[ "${include_files1}" ]]; then
          declare -A processed
          declare -A missing
          echo -e "\n\033[32mCheck-File discovered include objectives running full scan now: \033[0m\033[1mContent Display\033[0m  [\033[1m verbose \033[0m]" | process_input;
          echo -e "\n####################\nCheck-File Auto Fix Sources Include [ Status: \033[32mAnalzying\033[0m ]\n####################" | process_input;
          while IFS= read -r file; do
            include_count=1
            count1=$((file_count++));
            echo -e "\n####################\n\t\033[33mSOURCE FILE\033[0m ( ${count1} )\n####################" | process_input;
            echo -e "\nSource File Location: ${file}" | process_input;
            echo -e "\nAnalyzing Includes Source File ${count1}: ${file##*/}" | process_input;
            if ${{ inputs.include == 'true' }}; then
              includes_found=false
              include_source=$( { rg --sort=path --trim -o '^#include[[:space:]]+["].*["]' "${file}" 2>/dev/null || true; } | gawk '{print $2}' | tr -d '<">' | sort -u);
              if [[ "${include_source}" ]]; then
                echo -e "\n\tuser include file objectives:\n\n${include_source}" | process_input;
                while IFS= read -r include; do
                  if [[ "${include}" == *.[ch]* ]] && [[ ! "${processed[$include]}" ]]; then
                    processed["$include"]=1
                    shopt -s extglob
                    path1="${include##+(*./)}";
                    path2="${path1##[:]*}";
                    path3="${path2%'\n'}";
                    path4="${path3%\\}";
                    clean_path="${path4%/*}";
                    file1="${include##+(*./)}";
                    file2="${file1##[:]*}";
                    file3="${file2%'\n'}";
                    file4="${file3%\\}";
                    clean_file="${file4##*/}";
                    if [[ ${include} == *"/"* ]]; then
                      header=$(fdfind -c auto "${abs}" -p -t f -g "**/${path4##+(*./)}" "${{ env.base }}" --search-path "${file%/*}");  
                    else
                      header=$(fdfind -c auto "${abs}" -p -t f "${clean_file##+(*./)}" "${file%/*}");
                    fi;
                    shopt -u extglob
                    if [[ -n "${header}" ]]; then
                      while IFS= read -r includes; do
                        count2=$((include_count++));
                        count3=$((include_total++));
                        echo "${includes%/*}" >> "${include1}";
                        echo -e "\n\033[33mSource file #include \033[0m\033[1m( ${includes##*/} )\033[0m\033[33m is located!\033[0m  [ ✅ ]\n\n\033[32mREAL FILE LOCATION:\033[0m ${includes}" | process_input;
                      done <<< "${header[@]}";
                      includes_found=true
                    elif [[ -n "${missing[$include]}" ]]; then
