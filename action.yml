            CodeChecker check \
              --add-compiler-defaults \
              --jobs "$(nproc)" \
              --print-steps \
              -b "source ${envsetup} && lunch ${{ inputs.makefile }} && $make ${{ env.filename }} -j$(nproc) -k" \
              2>&1 | process_input || echo -e "\n::notice::CodeChecker check exit-code ($?)" | process_input;
          else
            echo -e "\n${codechecker} file was not found continuing without...\n" | process_input;
            make defconfig 2>&1 | process_input || echo -e "\n::notice::make defconfig exit-code ($?)" | process_input;
            CodeChecker check \
              --add-compiler-defaults \
              --jobs "$(nproc)" \
