            echo -e "\n####################\n\tFILE PATH: ( ${count4} )\n####################\n" | process_input;
            echo "${file%/*}" | process_input;
            if ${{ inputs.content == 'true' }}; then
              echo -e "\n####################\n\tFILE CONTENT:\n####################\n" | process_input;
              if [[ -e 'bat.conf' ]]; then
                batcat "${file}" | process_input;
              else
                batcat --no-config --theme=ansi --paging=never --show-all --color=always --style=full --nonprintable-notation=unicode "${file}" | process_input;
              fi;
            fi;
            echo -e "\n####################\nCHECKMAKE ANALYZING ${file##*/} FOR ERRORS ( $count4 )\n####################" | process_input;
            checkmake "${file}" 2>&1 | process_input || error="$?";
            if [[ -s "${error_log}" ]] && grep -Eq "Target[[:space:]]+${file}" "${error_log}"; then
              echo -e "\n####################\n\033[1mCHECK-FILE\033[0m FOUND ERRORS\n####################" | process_input;
              errors=true
            else
              echo -e "\n####################\n\033[1mCHECK-FILE:\033[0m NO ERRORS FOUND ${file}\n####################" | process_input;
            fi;
            if ${{ inputs.number > '0' }}; then
              if [[ "${{ inputs.number }}" -eq "${count4}" ]]; then
                echo -e "\nFile checking auto stopped at: ${count4} / ${file##*/}" | process_input;
                break;
              fi;
            fi;
          done <<< "${files}";
          echo -e "\n::notice:: Total number of ${{ env.filename }} files checked is: ${count4}" | process_input && echo "file_count=${count4}" >> "$GITHUB_ENV";
          echo -e "\n\033[1mScanning Completed!\033[0m\n\033[32mCheck-File-Action Exiting!\033[0m\n ..........\n" | process_input;
          if [[ "${error}" > '0' ]]; then
            echo -e "::notice::checkmake ( ${error} )" | process_input;
          fi;
          if [[ "${errors}" ]]; then
            echo "file_error=1" >> "${GITHUB_ENV}";
          fi;
          seconds="$((SECONDS + start_time))";
          m=$((seconds / 60));
          s=$((seconds % 60));
          printf "Process Runtime: %d minutes and %d seconds\n" "$m" "$s" | process_input;
          echo "file_found=1" >> "${GITHUB_ENV}";
        elif [[ $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]]; then
          echo -e "\n####################\n\033[1mCHECK-FILE\033[0m FINISHED SEARCHING FILE NOT FOUND: ${{ env.filename }}\n####################\n" | process_input;
        fi;
      shell: bash
      continue-on-error: true

    - name: Check All Files
      if: env.filename != '' && env.file_found == '0' && inputs.build == '0' && inputs.source != '4' && env.data_file == '0' && inputs.pattern == ''
      run: |
        source ~/.bashrc
        set +e
        start_time="${{ env.seconds }}";
        file_name="${{ env.filename }}";
        file_type="${file_name##*.}";
        github="${GITHUB_WORKSPACE}";
        repository=${{ github.event.repository.name }};
        data_log="${github}/${{ env.filename }}_data.log";
        count5=0
        process_input() {
          case "${{ inputs.output }}" in
            1) tee -a "${data_log}" ;; # Show in console AND save
            2) cat >> "${data_log}" ;;  # Save only (append)
            3) cat ;;                   # Show in console only
            4) cat >/dev/null ;;        # Completely silent
            *) cat ;;                   # Default fallback
          esac
        }
        if ${{ inputs.absolute == 'true' }}; then
          path='--absolute-path';
        else
          path='--relative-path';
        fi;
        if ${{ inputs.database == 'true' }}; then
          if [[ $(echo "${{ inputs.filename }}" | grep -qEo '^[a-zA-Z0-9_-]+.[a-zA-Z0-9_-]+$') ]]; then
            files=$(grep -sF "${{ inputs.dirpath }}/${{ env.filename }}" "${{ env.database }}" | grep . || grep -sF "${{ inputs.filename }}" "${{ env.database }}");
            echo -e "\n####################\nDatabase Filename: ${{ inputs.filename }}\n####################" | process_input;
          elif [[ $(echo "${{ inputs.filename }}" | grep -qEo '^[a-zA-Z0-9_-]+$') ]]; then
            files=$(grep -sF "${{ inputs.dirpath }}/${{ env.filename }}" "${{ env.database }}" | grep . || grep -sF "${{ inputs.filename }}" "${{ env.database }}");
            echo -e "\n####################\nDatabase Filename: ${{ inputs.filename }}\n####################" | process_input;
          elif ${{ inputs.filetype != '' }}; then
            regex="\.${{ inputs.filetype }}$";
            files=$(grep -sE "${{ inputs.dirpath }}/.${regex}" "${{ env.database }}" | grep . || grep -sE "${regex}" "${{ env.database }}");
            echo -e "\n####################\nDatabase File Extension: ${{ env.filename }}\n####################" | process_input;
          fi;
        else
          if [[ $(echo "${{ inputs.filename }}" | grep -qEo '^[a-zA-Z0-9_-]+.[a-zA-Z0-9_-]+$') ]]; then
            files=$(sudo fdfind -j "$(nproc)" --xdev -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**/${{ inputs.filename }}" "/" | grep . || sudo fdfind -j "$(nproc)" --xdev -p "${path}" --type file -g "**/${{ inputs.filename }}" "/");
            echo -e "\n####################\nFilename: ${{ inputs.filename }}\n####################" | process_input;
          elif [[ $(echo "${{ inputs.filename }}" | grep -qEo '^[a-zA-Z0-9_-]+$') ]]; then
            files=$(sudo fdfind -j "$(nproc)" --xdev -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**/${{ inputs.filename }}" "/" | grep . || sudo fdfind -j "$(nproc)" --xdev -p "${path}" --type file -g "**/${{ inputs.filename }}" "/");
            echo -e "\n####################\nFilename: ${{ inputs.filename }}\n####################" | process_input;
          elif ${{ inputs.filetype != '' }}; then
            files=$(sudo fdfind -j "$(nproc)" --xdev -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**/*.${{ inputs.filetype }}" "/" | grep . || sudo fdfind -j "$(nproc)" --xdev -p "${path}" --type file -e "${{ inputs.filetype }}" "/");
            echo -e "\n####################\nFile Extension: ${{ env.filename }}\n####################" | process_input;
          fi;
        fi;
        file_count=1
        if [[ -n "${files}" ]]; then
          if ${{ env.dirname != '' }}; then
            echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################" | process_input;
          else
            echo -e "\n####################\nWorkspace Folder: ${repository}\n####################" | process_input;
          fi;
          if ${{ inputs.content == 'true' }}; then
            number="${{ inputs.number }}";
            if ${{ inputs.number > '0' }}; then
              echo -e "\n####################\n\033[32mLocated Files\033[0m:\n####################\n" | process_input; 
              { echo "${files}" 2>/dev/null; } | gawk -v n="${number}" 'NR <= n { print $0; } NR > n { exit; }' | gawk '{ printf "    %s\n", $0; }' | process_input;
              echo -e "\e[4mTotal Files\e[0m: \033[1m$(echo "${files}" 2>/dev/null | gawk -v n="${number}" 'NR <= n { print $0; } NR > n { exit; }' 2>/dev/null | wc -l)\033[0m" | gawk '{ printf "    %s\n", $0; }' | process_input;
            else 
              echo -e "\n####################\n\033[32mLocated Files\033[0m:\n####################\n" | process_input;
              { echo "${files}" 2>/dev/null; } | gawk '{ printf "    %s\n", $0; }' | process_input;
              echo -e "\e[4mTotal Files\e[0m: \033[1m$(echo "${files}" | wc -l)\033[0m" | gawk '{ printf "    %s\n", $0; }' | process_input;
            fi;
          fi;
          echo "expected_file_count=$(echo "${files}" | grep -c '[^[:space:]]')" >> "$GITHUB_ENV";
          while IFS= read -r file; do
            count5=$((file_count++));
            echo "${file}" >> 'check_file_paths.txt';
            echo -e "\n####################\n\tFILE PATH: ( ${count5} )\n####################\n" | process_input;
            echo "${file%/*}" | process_input;
            if ${{ inputs.content == 'true' }}; then
              echo -e "\n####################\n\tFILE CONTENT: ( ${count5} )\n####################\n" | process_input;
              if [[ -e 'bat.conf' ]]; then
                batcat "${file}" | process_input;
              else
                batcat --no-config --theme=ansi --paging=never --show-all --color=always --style=full --nonprintable-notation=unicode "${file}" | process_input;
              fi;
            fi;
            if ${{ inputs.number > '0' }}; then
              if [[ "${{ inputs.number }}" -eq "${count5}" ]]; then
                echo -e "\nFile checking auto stopped at: ${count5} / ${file##*/}" | process_input;
                break;
              fi;
            fi;
          done <<< "${files}";
          echo -e "\n::notice:: Total number of ${{ env.filename }} files checked is: ${count5}" | process_input && echo "file_count=${count5}" >> "$GITHUB_ENV";
          echo -e "\n\033[1mScanning Completed!\033[0m\n\033[32mCheck-File-Action Exiting!\033[0m\n ..........\n" | process_input;
          echo "data_file=1" >> "${GITHUB_ENV}";
          seconds="$((SECONDS + start_time))";
          m=$((seconds / 60));
          s=$((seconds % 60));
          printf "Process Runtime: %d minutes and %d seconds\n" "$m" "$s" | process_input;
        else
          echo -e "\n####################\n\033[1mCHECK-FILE\033[0m FINISHED SEARCHING FILE NOT FOUND: ${{ env.filename }}\n####################\n" | process_input;
        fi;
      shell: bash
      continue-on-error: true

    - name: Word text Match
      if: inputs.pattern != ''
      run: |
        echo '';
        set +e
        file_count=1
        start_time="${{ env.seconds }}";
        file_types="${{ inputs.filetype }}";
        if ${{ inputs.absolute == 'true' }}; then
          path='--absolute-path';
        else
          path='--relative-path';
        fi;
        echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################";
        echo -e "\n####################\nPattern Matching: ${{ inputs.pattern }}\n####################";
        if ${{ inputs.filetype != '' }}; then
          for type in ${file_types[@]}; do
            matched1=$(fdfind -j "$(nproc)" -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**/*.${type}" "${{ env.base }}" -x rg -j "$(nproc)" --color always -sHFn "${{ inputs.pattern }}" | rg . || fdfind -j "$(nproc)" -p "${path}" --type file -e "${type}" "${{ env.base }}" -x rg -j "$(nproc)" --color always -sHFn "${{ inputs.pattern }}");
            content1=$(fdfind -j "$(nproc)" -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**/*.${type}" "${{ env.base }}" -x rg -j "$(nproc)" -l "${{ inputs.pattern }}" | rg . || fdfind -j "$(nproc)" -p "${path}" --type file -e "${type}" "${{ env.base }}" -x rg -j "$(nproc)" -l "${{ inputs.pattern }}");
            if [[ -n ${matched1} ]]; then
              counter=$( echo "${matched1}" | rg -c "${{ inputs.pattern }}" );
              echo -e "\n####################\n ( ${counter} ) CONTENT MATCH FOUND IN ${{ inputs.filetype }} FILE(S)\n####################";
              echo -e "\n${matched1}";
              if ${{ inputs.content == 'true' }}; then
                while IFS= read -r content; do
                  count=$((file_count++));
                  echo -e "\n####################\n\tFILE PATH: ( ${count} )\n####################";
                  echo -e "\n${content%/*}":
                  echo -e "\n####################\n\tFILE CONTENT: ( ${count} )\n####################\n";
                  if [[ -e 'bat.conf' ]]; then
                    batcat "${content}";
                  else
                    batcat --no-config --theme=ansi --paging=never --show-all --color=always --style=full --nonprintable-notation=unicode "${content}";
                  fi;
                  if ${{ inputs.number > '0' }}; then
                    if [[ "${{ inputs.number }}" -eq "${count}" ]]; then
                      echo -e "\nPattern checking auto stopped at: ${count} / ${content##*/}" | process_input;
                      break;
                    fi;
                  fi;
                  echo -e "\n####################\n::notice::PATTERN MATCHED SEARCHING COMPLETED SUCCESSFULLY! ✅\n####################";
                done <<< "${content1}";
              fi;
            else
              echo -e "\n####################\n::warning::SEARCHING COMPLETED PATTERN NOT FOUND: ${{ inputs.pattern }} ❌\n####################";
            fi;
          done;
          echo -e "\n\033[1mScanning Completed!\033[0m\n\033[32mPattern Locator\033[0m\nExiting...\n";
        else
          matched2=$(fdfind -j "$(nproc)" -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**" "${{ env.base }}" -x rg -j "$(nproc)" --color always -sHFn "${{ inputs.pattern }}" | rg . || fdfind -j "$(nproc)" -p "${path}" --type file "${{ env.base }}" -x rg -j "$(nproc)" --color always -sHFn "${{ inputs.pattern }}");
          content2=$(fdfind -j "$(nproc)" -p "${path}" --type file --glob "**/${{ inputs.dirpath }}/**" "${{ env.base }}" -x rg -j "$(nproc)" -l "${{ inputs.pattern }}" | rg . || fdfind -j "$(nproc)" -p "${path}" --type file "${{ env.base }}" -x rg -j "$(nproc)" -l "${{ inputs.pattern }}");
          if [[ -n ${matched2} ]]; then
            counter=$( echo "${matched2}" | rg -c "${{ inputs.pattern }}" );
            echo -e "\n####################\n ( ${counter} ) CONTENT MATCH FOUND IN FILE(S)\n####################";
            echo -e "\n${matched2}\n";
            if ${{ inputs.content == 'true' }}; then
              while IFS= read -r content; do
                count=$((file_count++));
                echo -e "\n####################\n\tFILE PATH: ( ${count} )\n####################";
                echo -e "\n${content%/*}":
                echo -e "\n####################\n\tFILE CONTENT: ( ${count} )\n####################\n";
                if [[ -e 'bat.conf' ]]; then
                  batcat "${content}";
                else
                  batcat --no-config --theme=ansi --paging=never --show-all --color=always --style=full --nonprintable-notation=unicode "${content}";
                fi;
                if ${{ inputs.number > '0' }}; then
                  if [[ "${{ inputs.number }}" -eq "${count}" ]]; then
                    echo -e "\nPattern checking auto stopped at: ${count} / ${content##*/}" | process_input;
                    break;
                  fi;
                fi;
                echo -e "\n####################\n::notice::PATTERN MATCHED SEARCHING COMPLETED SUCCESSFULLY! ✅\n####################";
              done <<< "${content2}";
            fi;
          else
            echo -e "\n####################\n::warning::SEARCHING COMPLETED PATTERN NOT FOUND: ${{ inputs.pattern }} ❌\n####################";
          fi;
          echo -e "\n\033[1mScanning Completed!\033[0m\n\033[32mPattern Locator\033[0m\nExiting...\n";
        fi;
        seconds="$((SECONDS + start_time))";
        m=$((seconds / 60));
        s=$((seconds % 60));
        printf "Process Runtime: %d minutes and %d seconds\n" "$m" "$s";
      shell: bash
      continue-on-error: true

    - name: Directory Contains
      if: env.filename != '' && inputs.content == 'true' && inputs.build == '0' && inputs.pattern == ''
      run: |
        source ~/.bashrc
        set +e
        file_name="${{ env.filename }}";
        file_type="${file_name##*.}";
        file_path='check_file_paths.txt';
        log_file="${{ env.filename }}_error.log"
        [[ -e "${{ env.filename }}_data.log" ]] && logfile="${{ env.filename }}_data.log";
        file_count=1
        count=0
        process_input() {
          case "${{ inputs.output }}" in
            1) tee -a "${log_file}" ;; # Show in console AND save
            2) cat >> "${log_file}" ;;  # Save only (append)
            3) cat ;;                   # Show in console only
            4) cat >/dev/null ;;        # Completely silent
            *) cat ;;                   # Default fallback
          esac
        }
        if ${{ inputs.absolute == 'true' }}; then
          path='--absolute-path';
        else
          path='--relative-path';
        fi;
        if ${{ env.file_found == '1' }}; then
          if [[ -s "${file_path}" ]]; then
            echo -e "\n####################\nNOTE: Contents found in directory for ${{ env.filename }} file(s)\n####################" | process_input;
            while IFS= read -r file; do
              count=$((file_count++));
              echo -e "\nSource File: \033[32m${file} / ${count}\033[0m\n\033[1mDirectory List:\033[0m" | process_input;
              ls -ShApX "${file%/*}" | gawk '{ printf "    %s\n", $0; }' | process_input;
              if ${{ inputs.number > '0' }}; then
                if [[ "${{ inputs.number }}" -eq "${count}" ]]; then
                  echo -e "\nFile checking auto stopped at: ${count} / ${file##*/}" | process_input;
                  break;
                fi;
              fi;
            done < "${file_path}";
          fi;
          echo '';
        fi;
      shell: bash
      continue-on-error: true

    - name: Project Finalized
      if: ( inputs.project == 'true' || env.filename != '' ) && inputs.pattern == ''
      run: |
        source ~/.bashrc
        set +e
        start_time="${{ env.seconds }}";
        compiler_list=$(dpkg --list | grep compiler | tr -d 'ii');
        repository=${{ github.event.repository.name }};
        github="${GITHUB_WORKSPACE}";
        data_log="${github}/${{ env.filename }}_data.log";
        error_log="${github}/${{ env.filename }}_error.log";
        project_log="${github}/${repository}_project.log";
        if [[ -s "${data_log}" ]]; then
          log_file="${data_log}";
        elif [[ -s "${error_log}" ]]; then
          log_file="${error_log}";
        else
          log_file="${project_log}";
        fi;
        if [[ -s "${project_log}" ]] && ${{ env.dirname != '' }}; then
          cp "$project_log" ${{ env.dirname }}/build/
        elif [[ -s "${project_log}" ]]; then
          cp "$project_log" build/
        fi;
        source_include_list='check-file-includes.txt';
        checked_file_count="${{ env.file_count }}";
        [[ "$checked_file_count" -eq '0' ]] && checked_file_count=100
        expected_file_count="${{ env.expected_file_count }}";
        check_build=false
        file_type='c';
        update=true
        fixed=false
        count=1
        process_input() {
          case "${{ inputs.output }}" in
            1) tee -a "${log_file}" ;;  # Show in console AND save
            2) cat >> "${log_file}" ;;  # Save only (append)
            3) cat ;;                   # Show in console only
            4) cat >/dev/null ;;        # Completely silent
            *) cat ;;                   # Default fallback
          esac
        }
        if ${{ inputs.absolute == 'true' }}; then
          abs='--absolute-path';
        else
          abs='--relative-path';
        fi;
        if ${{ env.check_build == 'true' }}; then
          check_build=true
        fi;
        if ${{ env.file_found == '1' }}; then
          file_found=true
        fi;
        if ${{ inputs.update == 'false' }}; then
          echo 'update=false' >> "${GITHUB_ENV}";
          update=false
        fi;
        if ${{ inputs.filetype != '' }}; then
          file_type="${{ env.filename }}";
        fi;
        echo "filetype=${{ inputs.filetype }}" >> "${GITHUB_ENV}";
        if [[ -s "${log_file}" ]] && ([[ "${check_build}" == 'true' ]] || [[ "${file_found}" == 'true' ]]); then
          echo -e "\n####################\n\t${log_file##*/} file found checking stats...\n####################" | process_input;
          deheader_duplicates=$(grep -aFc 'duplicates' "${log_file}");
          deheader_inclusion=$(grep -saFc 'inclusion' "${log_file}");
          deheader_removed=$(grep -saFc 'remove' "${log_file}");
          codechecker_defects=$(grep -saEo 'Found [1-9] defect' "${log_file}" | cut -d ' ' -f2 | gawk '{ sum += $1 } END { print sum; }');
          codechecker_no_defects=$(grep -saFoc 'Found no defects' "${log_file}");
          codechecker_success=$(grep -saFc 'successfully' "${log_file}");
          codechecker_errors=$(grep -saFc 'Error while processing' "${log_file}");
          clang_replacements=$(grep -saF 'Replacements:' "${build_fixes}" | grep -vc '[\[\]]');
          clang_information=$(grep -saiFc 'information:' "${log_file}");
          clang_files_missing=$(grep -saEc 'file not found|Include file' "${log_file}");
          if ${{ env.include_missing == '1' }}; then
            clang_files_list1=$(grep -saEo 'Include file:[[:space:]]+["].*["]' "${log_file}" | awk '{ print $3 }' | tr -d '"' | sort -u);
            clang_files_list2=$(grep -saEo 'Include file:[[:space:]]+[<].*[>]' "${log_file}" | awk '{ print $3 }' | tr -d '<>' | sort -u);
          elif ${{ env.include_missing == '2' }}; then
            clang_files_list1=$(grep -saEo '| #include[[:space:]]+["].*["]' "${log_file}" | awk '{ print $2 }' | tr -d '"' | sort -u);
            clang_files_list2=$(grep -saEo '| #include[[:space:]]+[<].*[>]' "${log_file}" | awk '{ print $2 }' | tr -d '<>' | sort -u);
          fi;
          clang_warnings=$(grep -saEo '[1-9] warnings generated|1 warning generated' "${log_file}" | cut -d ' ' -f1 | gawk '{ sum += $1 } END { print sum; }');
          clang_error1=$(grep -saEo '[1-9] errors generated|1 error generated' "${log_file}" | cut -d ' ' -f1 | gawk '{ sum += $1 } END { print sum; }');
          clang_error2=$(grep -saiEc 'error:|#error' "${log_file}");
          clang_failed=$(grep -saiFc 'failed' "${log_file}");
          clang_fixit1=$(grep -saiEc 'fixes|fixit|fix-its' "${log_file}");
          clang_fixit2=$(grep -saEo 'clang-tidy applied [1-9]' "${log_file}" | cut -d ' ' -f3 | gawk '{ sum += $1 } END { print sum; }');
          clang_notes=$(grep -saoFc 'note:' "${log_file}");
          no_error=$(grep -saiFc 'NO ERRORS' "${log_file}");
          located_count=0
          missing_count=0
          located_arch=0
          file_count=0
          filetype="${{ env.filename }}";
          if (( no_error > 0 )); then
            echo -e "\n####################\n::notice::⚠️ \033[1mCHECK-FILE:\033[0m ${no_error}️ ${file_type} files checked without any errors. [Hints] When using store & update or cache option these wont be rescanned for errors\n####################" | process_input;
          fi;
          if (( clang_information > 0 )) && ${{ inputs.analyzer == '3' }}; then
            echo -e "\n####################\n::notice::⚠️ \033[1mCHECK-FILE:\033[0m added ${clang_information}️ information notes on ${file_type} files checked. [Hints] Information addresses key issues that may have error fixes available.\n####################" | process_input;
          fi;
          if (( clang_warnings > 0 )); then
            echo -e "\n####################\n::notice::⚠️ \033[1mCHECK-FILE:\033[0m found ${clang_warnings}️ warnings in ${file_type} files checked. [Hints] Try using [\033[1mwarnings-as-errors\033[0m] for possible errors.\n####################" | process_input;
          fi;
          if (( codechecker_defects > 0 )) && (${{ inputs.analyzer == '4' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}); then
            echo -e "\n####################\n::notice::⚠️ \033[1mCHECK-FILE:\033[0m checked ${codechecker_defects} ${file_type} files with defects. [Hints] Check require for those files.\n####################" | process_input;
          fi;
          if (( codechecker_no_defects > 0 )) && (${{ inputs.analyzer == '4' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}); then
            echo -e "\n####################\n::notice::✅ \033[1mCHECK-FILE:\033[0m checked ${codechecker_no_defects} ${file_type} files without defects. [Hints] No check require for those files.\n####################" | process_input;
          fi;
          if (( codechecker_success > 0 )) && (${{ inputs.analyzer == '4' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}); then
            echo -e "\n####################\n::notice::✅ \033[1mCHECK-FILE:\033[0m checked ${codechecker_success} ${file_type} files successfully without issues. [Hints] No check require for those files.\n####################" | process_input;
          fi;
          if (( clang_error1 > 0 )); then
            echo -e "\n####################\n::notice::🚫 \033[1mCHECK-FILE:\033[0m found ${clang_error1} errors in ${file_type} files checked. [Hints] Try using a different [analyzer: 1, 2, or 4] for possible error fixes.\n####################" | process_input;
          fi;
          if (( clang_error2 > 0 )); then
            echo -e "\n####################\n::notice::🚫 \033[1mCHECK-FILE:\033[0m recheck found \033[31m${clang_error2}\033[0m errors in ${file_type} files checked. [Hints] Try using a different [analyzer: 1, 2, or 4] for possible error fixes.\n####################" | process_input;
          fi;
          if (( clang_failed > 0 )); then
            echo -e "\n####################\n::notice::⚠️ \033[1mCHECK-FILE:\033[0m found $clang_failed fails in all files checked during build. [Hints] This means your [\033[1mBuild failed\033[0m] from possible errors.\n####################" | process_input;
          fi;
          if (( clang_fixit1 > 0 )) && (${{ inputs.analyzer > '0' }} || ${{ env.file_fixed =='1' }}); then
            echo -e "\n####################\n::notice::✅ \033[1mCHECK-FILE:\033[0m applied ${clang_fixit1} fix-its to ${file_type} files checked. [Hints] Try using [update: true] for updating your remote repository with the fixes.\n####################" | process_input;
            fixed=true
          fi;
          if (( clang_fixit2 > 0 )) && (${{ inputs.analyzer > '0' }} || ${{ env.file_fixed == '1' }}); then
            echo -e "\n####################\n::notice::✅ ${clang_fixit2} To ${file_type} files checked. [Hints] Try using (update: true) for updating your remote repository with any fixed files.\n####################" | process_input;
            fixed=true
          fi;
          if (( clang_notes > 0 )); then
            echo -e "\n####################\n::notice::⚠️ \033[1mCHECK-FILE:\033[0m added ${clang_notes} notes on ${file_type} files checked. [Hints] Notes are fix suggestions for files that should be addressed before compiling.\n####################" | process_input;
          fi;
          if [[ -f "${build_fixes}" ]] && (( clang_replacements > 0 )); then
            echo -e "\n####################\n::notice::✅ \033[1mCHECK-FILE:\033[0m applied ${clang_replacements} clang replacement fixes for ${file_type} files checked. [Hints] Clang export fixes are stored in build/fixes.yaml for download. Try using different (analyzer: 1, 2, or 4) for more possible error fixes.\n####################" | process_input;
          fi;
          if (( deheader_removed > 0 )) && ${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}; then
            echo -e "\n####################\n::notice::✅ \033[1mCHECK-FILE:\033[0m removed ${deheader_removed} extra inclusions in ${file_type} file(s) checked. [Hints] Try manually removing any extra includes in files before compiling.\n####################" | process_input;
            fixed=true
          fi;
          if (( deheader_duplicates > 0 )) && (${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}); then
            echo -e "\n####################\n::notice::🚫 \033[1mCHECK-FILE:\033[0m found ${deheader_duplicates} duplicates or colliding inclusions in ${file_type} files checked. [Hints] Try using [analyzer: 1, 2, or 4] for possible error fixes.\n####################" | process_input;
          elif [[ -n "${deheader_inclusion}" ]] && [[ "${deheader_inclusion:-0}" > '0' ]] && (${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}); then
            echo -e "\n####################\n::notice::🚫 \033[1mCHECK-FILE:\033[0m found ${deheader_inclusion} extra inclusions in ${file_type} files checked. [Hints] Try using (update: true) if headers were fixed to update remote repository.\n####################" | process_input;
          fi;
          # Variables required: e (errors), w (warnings), f (failed compilations), c (checked files), total (expected files) 1. Error Density Logic (Scales for 1 to 20,000 files)
          score_data=$(gawk -v e="$clang_error2" -v w="$clang_warnings" -v f="$clang_failed" \
            -v c="$checked_file_count" -v total="$expected_file_count" 'BEGIN {
            if (total == 0) { total = c; } # Prevent division by zero
            if (c == 0)     { print "0.00 💀 (No Files)"; exit; }    
            if (c > 100)    { error_units = (e * 2) + (w / 4) + (f * 5); }
            else            { error_units = e + (w / 2) + (f * 2); }
            density = error_units / c;
            quality_score = 100 - density;
            if (quality_score < 0) quality_score = 0;
            completion_rate = c / total;
            final_score = quality_score * completion_rate;
            if ((f / c) > 0.15) final_score = 0;
            rank = "NONE";
            icon = "⚪";
            if (final_score >= 95)      { rank="S-TIER"; icon="💎"; }
            else if (final_score >= 85) { rank="A-RANK"; icon="🥇"; }
            else if (final_score >= 70) { rank="B-RANK"; icon="🥈"; }
            else if (final_score >= 50) { rank="C-RANK"; icon="🥉"; }
            else if (final_score > 0)   { rank="D-RANK"; icon="⚠️"; }
            else                        { rank="FAILED"; icon="💀"; }
            if (total > c) { icon = "👻"; } # Use a different icon for incomplete runs
            printf "%.2f %s (%s)", final_score, icon, rank;
          }')
          echo -e "\n::notice::Checked Files Final Grade: $score_data";
          if (( clang_files_missing > 0 )); then
            echo -e "\n####################\n::notice::❌ \033[1mCHECK-FILE:\033[0m discovered ${clang_files_missing} calls to missing include files in all ${file_type} file(s) checked. [Hints] Files may be there yet not included an/or duplicate missing files. Check missing files list for exact files!!!\n####################" | process_input;
            declare -A missing
            found=false
            if [[ -n "${clang_files_list1}" ]]; then 
              echo -e "\n####################\nMISSING USER FILES LIST:\n####################\n\n${clang_files_list1}" | process_input;
              echo -e "\n####################\n\033[1mCHECK-FILE:\033[0m AUTO LOCATE FILE MATCHES IN: ${{ env.base }}/${{ env.dirname }}\n####################\n" | process_input;
              while IFS= read -r missing_file; do
                if [[ "${missing_file}" == *.[ch]* ]]; then
                  file_count=$((file_count + 1));
                  echo -e "\n#################### Locating missing \033[1m${missing_file}\033[0m file ( ${file_count} ) ####################" | process_input;
                  path1="${missing_file//\'/}";
                  path2="${path1##[:]*}";
                  path3="${path2%'\n'}";
                  path4="${path3%\\}";
                  clean_path="${path4##*./}";
                  file1="${missing_file//\'/}";
                  file2="${file1##[:]*}";
                  file3="${file2%'\n'}";
                  file4="${file3%\\}";
                  clean_file="${file4##*/}";
                  if [[ "${missing_file}" == *"/"* && "${clean_path}" != "/" ]]; then
                    locate=$(fdfind "${abs}" -p -t f -g "**/${clean_path//./\\.}" "${{ env.base }}");
                  elif [[ -n "${clean_file}" ]]; then
                    locate=$(fdfind "${abs}" -p -t f -g "**/${clean_file//./\\.}" "${{ env.base }}");
                  fi;
                  if [[ -n "${locate}" ]]; then
                    arch="${{ env.arch }}";     
                    while IFS= read -r includes; do
                      located_count=$((located_count + 1));
                      echo -e "\n\033[32mUserInclude Source ${missing_file} Location:\033[0m ${includes}  [\033[1m ${located_count} / ✅ \033[0m]" | process_input;
                      [[ "$includes" == */linux/* ]] && includes="${includes%/linux/*}" || { [[ "$includes" == */asm/* ]] && includes="${includes%/asm/*}" || includes="${includes%/*/*}"; }
                      echo "${includes}" >> 'check-file-includes.txt';
                    done <<< "${locate[@]}";
                    includes_found=true
                  elif [[ -n "${missing[$missing_file]}" ]]; then
                    includes_found=false
                    echo -e "\n\033[33mUserInclude Source file \033[0m( ${missing_file} )\033[33m already listed missing!\033[0m  [\033[1m skipped \033[0m]" | process_input;
                  else
                    includes_found=false
                    missing["$missing_file"]=1
                    missing_count=$((missing_count + 1));
                    echo -e "\n\033[31mCannot locate missing user include file\033[0m ${missing_file}  [ ${missing_count} / ❌ ]" | process_input;
                  fi;
                fi;             
              done <<< "${clang_files_list1}";
            fi;
            if [[ -n "${clang_files_list2}" ]]; then
              echo -e "\n####################\nMISSING SYSTEM FILES LIST:\n####################\n\n${clang_files_list2}" | process_input;
              echo -e "\n####################\n\033[1mCHECK-FILE:\033[0m AUTO LOCATE FILE MATCHES IN: ${{ env.base }}/${{ env.dirname }}\n####################\n" | process_input;
              while IFS= read -r missing_file; do
                if [[ "${missing_file}" == *.[ch]* ]]; then
                  file_count=$((file_count + 1));
                  echo -e "\n#################### Locating missing \033[1m${missing_file}\033[0m file ( ${file_count} ) ####################" | process_input;
                  path1="${missing_file//\'/}";
                  path2="${path1##[:]*}";
                  path3="${path2%'\n'}";
                  path4="${path3%\\}";
                  clean_path="${path4##*./}";
                  file1="${missing_file//\'/}";
                  file2="${file1##[:]*}";
                  file3="${file2%'\n'}";
                  file4="${file3%\\}";
                  clean_file="${file4##*/}"; 
                  if [[ "${missing_file}" == *"/"* && "${clean_path}" != "/" ]]; then
                    locate=$(fdfind "${abs}" -p -t f -g "**/${clean_path//./\\.}" "${{ env.base }}");
                  elif [[ -n "${clean_file}" ]]; then
                    locate=$(fdfind "${abs}" -p -t f -g "**/${clean_file//./\\.}" "${{ env.base }}");
                  fi;
                  if [[ -n "${locate}" ]]; then
                    arch="${{ env.arch }}";        
                    while IFS= read -r includes; do
                      located_count=$((located_count + 1));
                      echo -e "\n\033[32mSystemInclude Source ${missing_file} Location:\033[0m ${includes}  [ $located_count / ✅ ]" | process_input;
                      [[ "$includes" == */linux/* ]] && includes="${includes%/linux/*}" || { [[ "$includes" == */asm/* ]] && includes="${includes%/asm/*}" || includes="${includes%/*/*}"; }
                      echo "${includes}" >> 'check-file-includes.txt';
                      [[ "$includes" == *"/$arch/"* ]] && located_arch=$((located_arch + 1));
                    done <<< "${locate[@]}";
                    includes_found=true
                  elif [[ -n "${missing[$missing_file]}" ]]; then
                    includes_found=false
                    echo -e "\n\033[33mSystemInclude Source file \033[0m( ${missing_file} )\033[33m already listed missing!\033[0m  [\033[1m skipped \033[0m]" | process_input;{} 
                  else
                    includes_found=false
                    missing["$missing_file"]=1
                    missing_count=$((missing_count + 1));
                    echo -e "\n\033[31mCannot locate missing system include file\033[0m ${missing_file}  [ $missing_count / ❌ ]" | process_input;
                  fi;
                fi;             
              done <<< "${clang_files_list2}";
            fi;
            unset missing;
            if [[ -s "${source_include_list}" ]]; then
              gawk '{ for (i=1;i<=NF;i++) { if ($i ~ /\.(c|cc|cpp|c\+\+|h|hh|hpp|h\+\+)/) { print $i; } } }' "${log_file}" | gawk '{ for (i=1;i<=NF;i++) print $i; }' | sed -E 's/\/[^/]*\.(h|hh|hpp|h\+\+)$//g' | grep -E '^(/[^/[:space:]]*)+/?$' | sed -E 's|(/[.][.]/?)+$||' | grep -vE "\.\..*\.${filetype}$" | gawk -v ext="${filetype}" '$0 ~ "."ext"$" { if (seen[$0]++) next; print; next; } { print; }' | gawk -v ext="${filetype}" '$0 ~ "\\."ext { delete seen; print; next; } !seen[$0]++' > "${source_include_list}" || echo "::notice::File ${source_include_list##*/} was not created!!!" | process_input;
              [[ -s "${source_include_list}" ]] && cp -f "${source_include_list}" 'build/' && echo -e "\n\033[32mCopied ${source_include_list} to build for uploading if needed.\033[0m ✅" | process_input;
            fi;
          fi;
          if ${{ inputs.update }} && ${{ env.analyzer == '2' }}; then
            echo -e "\nPARAMETERS: $(rm -vf ${clang_file} 2>/dev/null)" | process_input;
          fi;
          compilers=$(gcc -v --help 2> /dev/null | grep -iv deprecated | sed -n '/^ *-std=\([^<][^ ]\+\).*/ {s//\1/p}');
          [[ "${located_count}" -gt 0 ]] && echo -e "\n####################\n\tFiles found during scan: ${located_count}\n\tFiles with correct [\033[32m${{ env.arch }}\033[0m] arch: ${located_arch}\n####################" | process_input;
          ${{ inputs.content == 'true' }} && echo -e "\n####################\n\tINSTALLED COMPILER LIST:\n####################\n\n${compiler_list}" | process_input || echo -e "\n####################\n\tINSTALLED COMPILERS:\n####################\n\n${compilers}";
          if [[ "${fixed}" ]]; then
            echo "file_fixed=1" >> "${GITHUB_ENV}";
          fi;
          echo "github_include_dirs=" >> "${GITHUB_ENV}";
          if [[ "${found}" ]]; then
            echo "includes=true" >> "${GITHUB_ENV}";
          else
            echo "includes=false" >> "${GITHUB_ENV}";
          fi;
          [[ -f "/tmp/*/metadata.json" ]] && echo -e"\nCodeChecker Analyzer list: $(cp -vf "/tmp/*/metadata.json" build/)";
          echo -e '\n####################\n\t\033[32mProject Files Checked Exiting...\033[0m\n####################\n' | process_input;
        else
          echo -e '\n####################\n\t\033[33mProject Files Check Skipped Exiting...\033[0m\n####################\n' | process_input;
        fi;
        seconds="$((SECONDS + start_time))";
        m=$((seconds / 60));
        s=$((seconds % 60));
        printf "Project Process Runtime: %d minutes and %d seconds\n\n" "$m" "$s" | process_input;
      shell: bash
      continue-on-error: true

    - name: Cleanup Artifacts Report
      if: inputs.report == 'true'
      run: |
        source ~/.bashrc
        set +e
        echo "file_found=0" >> "${GITHUB_ENV}";
        min_size_bytes=$((20 * 1024 * 1024));
        filename0="${GITHUB_WORKSPACE}/temp_file.log";
        filename1="${GITHUB_WORKSPACE}/${{ env.github_repository }}_project.log";
        filename2="${GITHUB_WORKSPACE}/${{ env.filename }}_error.log";
        filename3="${GITHUB_WORKSPACE}/${{ env.filename }}_data.log";
        if [[ -s "${filename1}" ]]; then
          filesize1=$(stat -c%s "${filename1}");
          ansifilter -i "${filename1}" -o "${filename0}" && echo "file_found=1" >> "${GITHUB_ENV}";
          mv -f "${filename0}" "${filename1}" && echo -e "\nLogFile: ${{ env.github_repository }} [\033[1mansifilter\033[0m] cleaned" 
          if (( filesize1 > min_size_bytes )); then
            split -d -C 10M "${filename1}" 'part_' && echo -e "\nLogFile: ${{ env.github_repository }} file split completed" && echo "file1_parted=1" >> "${GITHUB_ENV}";
          fi;
        fi;
        if [[ -s "${filename2}" ]]; then
          filesize2=$(stat -c%s "${filename2}");
          ansifilter -i "${filename2}" -o "${filename0}" && echo "file_found=2" >> "${GITHUB_ENV}";
          mv -f "${filename0}" "${filename2}" && echo -e "\nLogFile: ${{ env.filename }} [\033[1mansifilter\033[0m] cleaned";
          if (( filesize2 > min_size_bytes )); then
            split -d -C 10M "${filename2}" 'part_' && echo -e "\nLogFile: ${{ env.filename }} file split completed" && echo "file2_parted=2" >> "${GITHUB_ENV}";
          fi;
        fi;
        if [[ -s "${filename3}" ]]; then
          filesize3=$(stat -c%s "${filename3}");
          ansifilter -i "${filename3}" -o "${filename0}" && echo "file_found=3" >> "${GITHUB_ENV}";
          mv -f "${filename0}" "${filename3}" && echo -e "\nLogFile: ${{ env.filename }} [\033[1mansifilter\033[0m] cleaned";
          if (( filesize3 > min_size_bytes )); then
            split -d -C 10M "${filename3}" 'part_' && echo -e "\nLogFile: ${{ env.filename }} file split completed" && echo "file3_parted=3" >> "${GITHUB_ENV}";
          fi;
        fi;
        echo '';
      shell: bash
      continue-on-error: true
      
    - name: Repository Update
      if: env.update == 'true' && env.file_fixed == '1'
      run: |
        echo '';      
        error_log="${GITHUB_WORKSPACE}/${{ env.filename }}_error.log";
        [[ ! -e ${error_log} ]] && error_log="${GITHUB_WORKSPACE}/${{ env.github_repository }}_project.log";
        repair_date="$(date +%Y%m%d)";
        process_input() {
          while IFS= read -r output; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${output}" | tee -a "${error_log}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${output}" >> "${error_log}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${output}";
            elif ${{ inputs.output == '4' }}; then
              echo -e "${output}" >/dev/null;
            fi;
          done;
        }
        if ${{ inputs.repository == 'false' }} && ${{ env.dirname != '' }}; then
          cd "${{ env.dirname }}" && echo -e "User Current Directory;  ${{ env.dirname }}\n" | process_input;
        fi;
        if ${{ inputs.project == 'true' }}; then
          git config --global --add safe.directory . | process_input;
        fi;
        [[ -d '.git/' ]] || echo '::error::git directory not found exiting';
        git config --global user.name "${{ github.actor }}";
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com";
        git config --global credential.helper store
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999
        git add . 2>&1 | process_input;
        git commit -m "check-file-action repaired errors in ${{ env.filename }} file(s)" | process_input;
        git push origin "${{ github.ref }}" 2>&1 | process_input;
        if [[ ${PIPESTATUS[0]} == 0 ]] || [[ ${PIPESTATUS[1]} == 0 ]]; then
          echo -e "\n####################\nCHECK FILE UPDATED REPOSITORY\n####################\n" | process_input;
          echo -e "\n####################\nUPDATED FILE(S) LIST:\n####################\n" | process_input;
          git diff --name-only @{push}@{1} @{push} 2>&1 | process_input;
          echo -e "\n\t########## ${repair_date} ##########\n" | process_input;
        else
          echo -e "\n####################\nCHECK FILE COULD NOT UPDATED REPO FILE(S)\n####################\n" | process_input;
          echo 'Retrying again after git fetches branch' | process_input;
          git fetch origin "${{ github.ref }}" 2>&1 | process_input;
          git add . 2>&1 | process_input;
          git commit -m "check-file-action repaired errors in ${{ env.filename }} file(s)" | process_input;
          git push origin "${{ github.ref }}" 2>&1 | process_input;
          if [[ ${PIPESTATUS[0]} == 0 ]] || [[ ${PIPESTATUS[1]} == 0 ]]; then
            echo -e "\n####################\nCHECK FILE UPDATED REPOSITORY\n####################\n" | process_input;
            echo -e "\n####################\nUPDATED FILE(S) LIST:\n####################\n" | process_input;
            git diff --name-only @{push}@{1} @{push} 2>&1 | process_input;
            echo -e "\n\t########## ${repair_date} ##########\n" | process_input;
            if ${{ inputs.project }}; then
              git status 2>&1 | process_input;
            fi;
          else
            echo 'Was git push event successful status unknown?' | process_input;
          fi;
        fi;
      shell: bash
      continue-on-error: true

    - name: Uploading ${{ github.repository }} Project Build Release
      if: inputs.build > '5' && inputs.project == 'true' && env.build_files == '1' && inputs.repository == 'false'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ inputs.dirname }}/out/target/**/*.zip
          ${{ env.build }}/bin/*
        name: Build For ${{ github.event.repository.name }} Repository.
        tag_name: ${{ github.run_id }}
      env: # Revert to standard paths so LLVM-ARM doesn't break the Node.js logic       
        PATH: ${{ env.BACKUP_PATH }}
        LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
        PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
