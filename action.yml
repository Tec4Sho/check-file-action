          echo 'check_build=false' >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.update == 'false' }}; then
          echo 'update=false' >> "${GITHUB_ENV}";
          update=false
        fi;
        if ${{ inputs.filetype != '' }}; then
          file_type="${{ inputs.filetype }}";
        fi;
        echo "filetype=${file_type}" >> "${GITHUB_ENV}";
        build_alone() {
          local llvm_version="${{ inputs.release }}";
          local arch_target="${{ inputs.arch }}";
          local kernel_path=$(find ${{ env.base }} -maxdepth 3 -type f -name "Makefile" -exec grep -l "VERSION =" {} + | xargs -n1 dirname | head -n 1)
          local kernel_cpus=$(find ${{ env.base }} -maxdepth 3 -type f -name "BoardConfig.mk" -print | grep -F -m 1 "TARGET_CPU_VARIANT" | awk '{ print $3; }')
          [[ -f 'BoardConfig.mk' ]] && echo '::warning;;Cant find BoardConfig.mk for setup aborting cpu targeting' | process_input;
          [[ -z $kernel_cpus ]] && echo '::warning;;Cant find TARGET_CPU_VARIANT for setup aborting cpu targeting' | process_input;
          # Run make with ARM overrides
          if [[ "$arch_target" == "arm"* ]] && [[ "$arch_target" != *"64"* ]] && [[ "$kernel_cpus" == 'cortex-a7' ]]; then
            make CC=clang \
            CXX=clang++ \
            CFLAGS="--target=arm-linux-gnueabihf -mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard --sysroot=/usr/arm-linux-gnueabihf" \
            LDFLAGS="--target=arm-linux-gnueabihf --sysroot=/usr/arm-linux-gnueabihf"
          elif [[ "$arch_target" =~ ^(arm64|aarch64) ]] && [[ "$kernel_cpus" == 'cortex-a53' ]]; then
            make CC=clang \
            CXX=clang++ \
            CFLAGS="--target=aarch64-unknown-linux-gnu -mcpu=cortex-a53 --sysroot=/usr/aarch64-linux-gnu" \
            LDFLAGS="--target=aarch64-unknown-linux-gnu --sysroot=/usr/aarch64-linux-gnu"
          elif [[ "$arch_target" =~ ^(arm64|aarch64) ]] && [[ "$kernel_cpus" == 'cortex-a72' ]]; then
            make CC=clang \
            CXX=clang++ \
            CFLAGS="--target=aarch64-unknown-linux-gnu -mcpu=cortex-a72 --sysroot=/usr/aarch64-linux-gnu" \
            LDFLAGS="--target=aarch64-unknown-linux-gnu --sysroot=/usr/aarch64-linux-gnu"
          else
          # Native x86_64
            make CC=clang \
            CXX=clang++
          fi;
        }
        build_module() {
          local llvm_version="${{ inputs.release }}";
          local arch_target="${{ inputs.arch }}";
          local kernel_path=$(find ${{ env.base }} -maxdepth 3 -type f -name "Makefile" -exec grep -l "VERSION =" {} + | xargs -n1 dirname | head -n 1)
          local kernel_cpus=$(find ${{ env.base }} -maxdepth 3 -type f -name "BoardConfig.mk" -print | grep -F -m 1 "TARGET_CPU_VARIANT" | awk '{ print $3; }')
          if [[ "$arch_target" == "arm"* ]] && [[ "$arch_target" != *"64"* ]] && [[ "$kernel_cpus" == 'cortex-a7' ]]; then
          # Cross-compile for Cortex-A7
            make ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="clang --target=arm-linux-gnueabihf" \
            LD="clang --target=arm-linux-gnueabihf -fuse-ld=lld" \
            KCFLAGS="-mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard" \
