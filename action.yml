                  if [[ "${include_source_count}" -eq "${file_count}" ]]; then
                    break;
                  fi;              
                done < "${clang_sources}";
              fi;
            else
              header_source=$(sudo find "${linux_usr_src}" \( -path "*/${{ inputs.dirpath }}/*" -o -path "/*linux-headers-${{ env.release1 }}/*" -o -path "*/linux-headers-${{ env.release2 }}/*" -o -path "*/linux-headers-${{ env.release3 }}/*" \) -xdev -type d -name 'include' | gawk '{ print length($0), $0 }' | sort -n -u | cut -d' ' -f 2- 2>/dev/null | grep . || find "${linux_usr_src}" -type d -name 'include' | gawk '{ print length($0), $0 }' | sort -n -u | cut -d' ' -f 2- 2>/dev/null);
              ${{ inputs.internal == 'true' }} && header_source=$(find "${{ env.base }}" -path "*/${{ inputs.dirpath }}/*" -type d \( -name 'include' -o -name 'uapi' -o -name 'asm' \) | gawk '{ print length($0), $0 }' | sort -n -u | cut -d' ' -f 2- 2>/dev/null | grep . || find "${{ env.base }}" -type d \( -name 'include' -o -name 'uapi' -o -name 'asm' \) | gawk '{ print length($0), $0 }' | sort -n -u | cut -d' ' -f 2- 2>/dev/null);
              while IFS= read -r include; do
                include_count=$((include_count + 1));
                echo "${include_count}" > "${count1}";
                echo -e "-I${include}" >> 'compile_flags.txt';
                echo -n "${include};";
              done <<< "${header_source}";
              if [[ -s "${clang_includes}" ]] && ${{ inputs.include }}; then
                while IFS= read -r include; do
                  include_count_extra=$((include_count_extra + 1));
                  echo "${include_count_extra}" > "${count2}";
                  echo -e "-I${include}" >> 'compile_flags.txt';
                  echo -n "${include#./};";
                done < "${clang_includes}";
              fi;
            fi;
          }
          clang_includes() {
            find "${{ env.base }}" -type d \( -name 'include' -o -name 'uapi' -o -name 'asm' \) | gawk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r include; do
