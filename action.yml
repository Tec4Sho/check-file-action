          }
          cmake_includes() {
            include_source_count=0
            include_count_extra=0
            include_count=0
            if ${{ inputs.number > '0' }}; then
              file_count=${{ inputs.number }};
              echo "include_source=false" >> "${GITHUB_ENV}";
              include_source=false
            elif ${{ env.include_count > '1000' }}; then
              file_count=${{ env.include_count }};
              echo "include_source=true" >> "${GITHUB_ENV}";
              include_source=true
            else
              file_count='500';
              echo "include_source=false" >> "${GITHUB_ENV}";
              include_source=false
            fi;            
            if [[ -s "${clang_sources}" ]] && ${{ inputs.include }}; then
              if [[ "${file_count}" < '1000' ]]; then
                while IFS= read -r include; do
                  include_source_count=$((include_source_count + 1));      
                  echo "${include_source_count}" > "${count3}";
                  echo -e "-I${include}" >> 'compile_flags.txt';
                  echo -n "${include#./};";
                  if [[ "${include_source_count}" -eq "${file_count}" ]]; then
                    break;
                  fi;              
                done < "${clang_sources}";
              fi;
            else
              header_source=$(find "${{ env.base }}" -not \( -path '*/CMakeFiles' -prune -o -path '*/build' -prune -o -path '*/.github' -prune -o -path '*/.git' -prune \) -type d \( -name 'acpi' -o -name 'api' -o -name 'asm' -o -name 'core' -o -name 'drivers' -o -name 'fs' -o -name 'generated' -o -name 'gpu' -o -name 'include' -o -name 'linux' -o -name 'mtk' -o -name 'mt-plat' -o -name 'subcmd' -o -name 'subdev' -o -name 'sysdep' -o -name 'util' \) -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null);
              while IFS= read -r dir; do
                if [[ -d "${dir}" ]]; then
                  include_count=$((include_count + 1));
                  echo "${include_count}" > "${count1}";
                  echo -e "-I${dir}" >> 'compile_flags.txt';
                  echo -n "${dir};";
                fi;
              done <<< "${header_source}";
              if [[ -s "${clang_includes}" ]] && ${{ inputs.include }}; then
                while IFS= read -r include; do
                  include_count_extra=$((include_count_extra + 1));
                  echo "${include_count_extra}" > "${count2}";
                  echo -e "-I${include}" >> 'compile_flags.txt';
                  echo -n "${include#./};";
                done < "${clang_includes}";
              fi;
            fi;
          }
          clang_includes() {
            find "${{ env.base }}" -not \( -path '*/CMakeFiles' -prune -o -path '*/build' -prune -o -path '*/.github' -prune -o -path '*/.git' -prune \) -type d -name 'include' -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r include; do
              if [[ -d "${include}" ]]; then
                echo -e "--extra-arg=-I${include#./}";
              fi;
            done;
          }
          source_files() {
            find "${{ env.base }}" -not \( -path '*/CMakeFiles' -prune -o -path '*/build' -prune -o -path '*/.git' -prune -o -path '*/.github' -prune \) -type f -name "*.${file_type}" -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r file; do
              echo -e "${file#./}";
            done;
          }
          mkdir -p build/bin
          echo 'build_error=false' >> "${GITHUB_ENV}";
          echo 'github_source_files=false' >> "${GITHUB_ENV}";
          echo 'github_include_dirs=false' >> "${GITHUB_ENV}";
          echo 'github_source_dirs=false' >> "${GITHUB_ENV}";
          if [[ "$(source_files)" ]]; then
            echo 'github_source_files=true' >> "${GITHUB_ENV}";
          fi;
          if [[ "$(cmake_includes)" ]]; then
            echo "github_include_dirs=$(cmake_includes)" >> "${GITHUB_ENV}";
           if [[ -f "${count3}" ]]; then
              echo -e "\n####################\n\tcheck-file added \033[1m$(cat ${count3})\033[0m source include directories [source:\033[32m auto mode\033[0m]\n\tcmake additional header objectives updated successfully!\n####################" | process_input;
            elif [[ -f "${count2}" ]]; then
              echo -e "\n####################\n\tcheck-file added $(cat ${count1}) header include directories\n\tcheck-file updated $(cat ${count2}) additional header directories\n####################" | process_input;
            else
              echo -e "\n####################\n\tcheck-file added $(cat ${count1}) header include directories\n####################" | process_input;
            fi;
          elif ${{ env.include_count > '1000' }} && ${{ env.sources }}; then
            echo -e "\n####################\n\tcheck-file added \033[1m${{ env.include_count }}\033[0m source files & their include directories [source:\033[32m auto mode\033[0m]\n\tcmake source & header objectives updated successfully!\n####################" | process_input;
          elif ${{ env.include_count > '1000' }}; then
            echo -e "\n####################\n\tcheck-file added \033[1m${{ env.include_count }}\033[0m source include directories [source:\033[32m auto mode\033[0m]\n\tcmake max additional header objectives updated successfully!\n####################" | process_input;
          elif [[ -e 'check-file-compile.txt' ]]; then
            total_count=$(gawk 'NF > 0 { count++ } END { print count }' 'check-file-compile.txt');
            echo -e "\n####################\n\tcheck-file added \033[1m${total_count}\033[0m source files & their include directories [source:\033[32m auto mode\033[0m]\n\tcmake source files & header objectives updated successfully!\n####################" | process_input;
          fi;
          if [[ -f "${clang_tidy}" ]]; then
            echo -e '\n####################\n\t.clang-tidy found continuing...\n####################' | process_input;
          fi;
          if [[ -f "${cmake_list}" ]]; then
            echo -e '\n####################\n\tCMakeLists.txt found continuing...\n####################' | process_input;
          fi;
          if [[ -d 'build' ]]; then
            echo -e '\n####################\n\tbuild directory created continuing...\n####################\n' | process_input;
            if ${{ inputs.content == 'false' }} && [[ "$(source_dirs)" ]] && [[ ! -f "${compile_json}" ]] && (${{ env.sources }} || [[ -e 'check-file-compile.txt' ]]); then
              echo "github_source_dirs=$(source_dirs)" >> "${GITHUB_ENV}";
              echo -e '\nsource true\n';
              cmake -S . -DPROJECT_INCLUDE_SRC="${include_source}" -DPROJECT_SRC_DIRS="$(source_dirs)" -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build 2>&1 | cmakebar --replay | process_input || echo "::error::( $? ) Missing or malformed CMakeList.txt!?" | process_input;
            elif ([[ "$(source_dirs)" ]] || [[ "$(cmake_includes)" ]]) && [[ ! -f "${compile_json}" ]]; then
              echo "github_source_dirs=$(source_dirs)" >> "${GITHUB_ENV}";
              echo -e '\nsource false\n';
              cmake -S . -DPROJECT_INCLUDE_SRC="${include_source}" -DPROJECT_INCLUDE_DIRS="$(cmake_includes)" -DPROJECT_SRC_DIRS="$(source_dirs)" -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build 2>&1 | process_input || echo "::error::( $? ) Missing or malformed CMakeList.txt!?" | process_input;
            elif [[ ! -f "${compile_json}" ]]; then
              cmake -S . -DPROJECT_INCLUDE_SRC="${include_source}" -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build 2>&1 | process_input || echo "::error::( $? ) Missing or malformed CMakeList.txt!?" | process_input;
            fi;
            if [[ "${PIPESTATUS[0]}" == '0' ]]; then
              if ${{ inputs.upload }}; then
                echo 'build_files=1' >> "${GITHUB_ENV}";
              fi;
            fi;
          fi;
          if [[ "${user_compile_json}" == 'true' ]]; then
            echo -e "\n####################\n\t${compile_json} was found successfully...\n####################" | process_input;
          elif [[ -e "${compile_json}" ]]; then
            echo -e "\n####################\n\t${compile_json} was created successfully...\n####################" | process_input;
          fi;
        fi;
        echo '';
        seconds="$((SECONDS - start_time))";
        echo "seconds=${seconds}" >> "${GITHUB_ENV}";
      shell: bash
      continue-on-error: true

    - name: Project Analyze
      if: inputs.project == 'true' && inputs.analyzer > '0'
      run: |        
        echo '';
        set +e
        start_time="${{ env.seconds }}";
        export CMAKE_EXPORT_COMPILE_COMMANDS=ON
        repository=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
        github=${GITHUB_WORKSPACE};
        project_log="${github}/${repository}_project.log";
        clang_sources='check-file-sources.txt';
        codechecker='codechecker.yaml';
        user_compile_json=false
        count1='count1.txt';
        count2='count2.txt';
        count3='count3.txt';
        check_build=false
        include_source=false
        file_type='c';
        update=true
        fixed=false;
        if ${{ inputs.repository == 'false' }} && [[ -d "${{ env.dirname }}" ]]; then
          cd "${{ env.dirname }}";
        fi;
        process_input() {
          while IFS= read -r output; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${output}" | tee -a "${project_log}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${output}" >> "${project_log}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${output}";
            elif ${{ inputs.output == '4' }}; then
              echo -e "${output}" >/dev/null;
            fi;
          done;
        }
        if ${{ env.check_build == 'false' }}; then
          echo 'check_build=false' >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.update == 'false' }}; then
          echo 'update=false' >> "${GITHUB_ENV}";
          update=false
        fi;
        if ${{ inputs.filetype != '' }}; then
          file_type="${{ inputs.filetype }}";
        fi;
        echo "filetype=${file_type}" >> "${GITHUB_ENV}";
        if [[ "${file_type}" == [cth]* ]]; then
          clang_tidy_version=$(clang-tidy --version);
          clang_version=$(clang --version);
          verify_config=$(clang-tidy --verify-config);
          cmake_version=$(cmake --version);
          if [[ -f 'compile_commands.json' ]]; then
             user_compile_json=true
             compile_json='compile_commands.json';
             mkdir build && cp -vf ${compile_json} build/
          elif [[ -f 'build/compile_commands.json' ]]; then
             compile_json='build/compile_commands.json';
          else
             compile_json='build/compile_commands.json';
          fi;
          if ${{ inputs.absolute }}; then
            abs='-a';
          else
            abs='';
          fi;
          clang_checks=$(clang-tidy --list-checks);
          gcc_version=$(gcc --version);
          gpp_version=$(g++ --version);
          cmake_list='CMakeLists.txt';
          clang_file='parameter-file';
          clang_tidy='.clang-tidy';
          clangd_tidy='/home/runner/.local/bin/clangd-tidy';
          clang_includes='check-file-includes.txt';
          [[ ! -f "${cmake_list}" ]] && cmake_list="${{ github.action_path }}/${cmake_list}"; 
          if [[ "${{ env.run_clang_tidy }}" ]] && ${{ env.analyzer == '1' }} && [[ -e "${compile_json}" ]]; then
            echo -e '\n####################\nRUN-CLANG-TIDY ANALYZING FILES\n####################\n' | process_input;
            [[ $(whereis clang-format) ]] && [[ ! -f '.clang-format' ]] && echo -e '[check-file] creating new ,clang-format file as none was found\n' | process_input && clang-format -style=LLVM -dump-config > .clang-format || echo -e "\n::notice::clang-format exit-code ($?)" | process_input;
            "${{ env.run_clang_tidy }}" -j $(nproc --all) -p build -config-file "${clang_tidy}" -export-fixes build/fixes.yaml -fix -format -style 'file' 2>&1 | process_input || echo -e "\n::notice::run-clang-tidy exit-code ($?)" | process_input;
            if [[ "${PIPESTATUS[0]}" == '0' ]] || [[ -s "${project_log}" ]] && [[ $(grep -siF 'Process completed with exit code' "${project_log}") ]]; then
              echo 'check_build=false' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]] && [[ $(grep -sE 'error:|Error:|Error while processing|ERROR:' "${project_log}") ]]; then
              echo -e "\n::notice::Errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
            elif [[ -s "${project_log}" ]]; then
              echo -e "\n::notice::No errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
            fi;
          elif [[ ! "${{ env.run_clang_tidy }}" ]] && ${{ env.analyzer == '1' }} && [[ -e "${compile_json}" ]]; then
            echo -e "\n####################\n\t::error:: run-clang-tidy missing in repo Exiting...\n####################\n" | process_input;
          fi;
          if [[ -f "${clang_file}" ]] && ${{ env.analyzer == '2' }} && [[ -e "${compile_json}" ]]; then
            files_list=false
            if [[ "$(clang_includes)" ]] && [[ "$(source_files)" ]] ; then
              echo -e "\n####################\n\t${file_type} file(s) & include objectives found continuing...\n####################" | process_input;
              clang_includes >> "${clang_file}" && source_files >> "${clang_file}" && files_list=true
            elif [[ "$(source_files)" ]]; then
              echo -e "\n####################\n\t${file_type} file(s) found continuing...\n####################" | process_input;
              source_files >> "${clang_file}" && files_list=true
            else	
              echo -e "\n::error::No ${file_type} files found searching repository\nExiting...\n" | process_input;
            fi;
            echo -e "\n####################\n\t${clang_file} found continuing...\n####################" | process_input;
            echo -e '\n####################\nCLANG-TIDY CONFIG CHECKED\n####################\n' | process_input;
            if [[ "${files_list}" ]]; then
              cp -vf "${clang_file}" 'build/parameter-source.txt' 2>/dev/null;
              echo -e '\n####################\nCLANG-TIDY ANALYZING FILES\n####################\n' | process_input;
              clang-tidy @parameter-file 2>&1 | process_input || echo -e "\n::notice::clang-tidy exit-code ($?)" | process_input;
              if [[ "${PIPESTATUS[0]}" == '0' ]] || [[ -s "${project_log}" ]] && [[ $(grep -siF 'Process completed with exit code' "${project_log}") ]]; then
                echo 'check_build=false' >> "${GITHUB_ENV}";
              elif [[ -s "${project_log}" ]] && [[ $(grep -sE 'error:|Error:|Error while processing|ERROR:' "${project_log}") ]]; then
                echo -e "\n::notice::Errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
              elif [[ -s "${project_log}" ]]; then
                echo -e "\n::notice::No errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
              fi;
            fi;
          elif [[ ! -e "${clang_file}" ]] && ${{ env.analyzer == '2' }} && [[ -e "${compile_json}" ]]; then
            echo -e "\n####################\n\t::error:: parameter-file missing in repo Exiting...\n####################\n" | process_input;
          fi;
          if [[ -f "${clangd_tidy}" ]] && ${{ env.analyzer == '3' }} && [[ -e "${compile_json}" ]]; then
            echo -e '\n####################\nCLANGD-TIDY ANALYZING FILES\n####################\n' | process_input;
            fdfind -p -c auto "${abs}" -e "${{ inputs.filetype }}" "${{ env.base }}" -x clangd-tidy -p build -j "$(nproc --all)" --color always --tqdm 2>&1 | process_input || echo -e "\n::notice::clangd-tidy exit-code ($?)" | process_input;
            if [[ "${PIPESTATUS[0]}" == '0' ]] || [[ -s "${project_log}" ]] && [[ $(grep -siF 'Process completed with exit code' "${project_log}") ]]; then
              echo 'check_build=false' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]] && [[ $(grep -sE 'error:|Error:|Error while processing|ERROR:' "${project_log}") ]]; then
              echo -e "\n::notice::Errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
            elif [[ -s "${project_log}" ]]; then
              echo -e "\n::notice::No errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
            fi;
          elif [[ ! -e "${clangd_tidy}" ]] && ${{ env.analyzer == '3' }} && [[ -e "${compile_json}" ]]; then
            echo -e "\n####################\n\t::error::${clangd_tidy##/*} file missing in repo Exiting...\n####################\n" | process_input;
          fi;
          if [[ $(which CodeChecker) ]] && ${{ env.analyzer == '4' }} && [[ -e "${compile_json}" ]]; then
            echo -e '\n####################\n\tCODECHECKER ANALYZING FILES...\n####################\n' | process_input;
            sudo bash -c 'source ~/.bashrc';
            export TERM=dumb; export CC_LOGGER_GCC_LIKE="gcc:g++:clang:clang++:/cc:c++";
            if [[ -e "/home/runner/codechecker/venv/bin/activate" ]]; then
              sudo bash -c 'source /home/runner/codechecker/venv/bin/activate'
            else
              echo -e "\nUnable to source ( /home/runner/codechecker/venv/bin/activate ) file\n" | process_input;
            fi;
            [[ ! -s 'skip.txt' ]] && echo -e '# Skip all system includes\n-*/usr/include/*\n-*/usr/local/include/*\n-*/site-packages/*' > 'skip.txt';
            if ${{ inputs.repair }}; then
              echo -e "\nRepair mode continuing without config file continuing...\n" | process_input;
              CodeChecker analyze "${compile_json}" --jobs "$(nproc --all)" --output ./reports 2>&1 | process_input || echo -e "\nCodeChecker analyzer exit-code ($?)" | process_input;
              CodeChecker fixit --checker-name bugprone-suspicious-string-compare --jobs "$(nproc --all)" --apply ./reports 2>&1 | process_input || echo -e "\nCodeChecker fixit exit-code ($?)" | process_input;
              CodeChecker parse ./reports 2>&1 | process_input || echo -e "\nCodeChecker parse exit-code ($?)" | process_input;
            else
              [[ -e "${codechecker}" ]] && echo -e "\n${codechecker} file was found continuing...\n" | process_input || echo -e "\n::warning::${codechecker} file was not found continuing...\n" | process_input;
              CodeChecker check --logfile "${compile_json}" --config "${codechecker}" --jobs "$(nproc --all)" 2>&1 | process_input || echo -e "\nCodeChecker check exit-code ($?)" | process_input;
            fi;
            if [[ "${PIPESTATUS[0]}" == '0' ]] || [[ -s "${project_log}" ]] && [[ $(grep -siF 'Process completed with exit code' "${project_log}") ]]; then
              echo 'check_build=false' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]] && [[ $(grep -siE 'error:|Error while processing' "${project_log}") ]]; then
              echo -e "\n::notice::Errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
            elif [[ -s "${project_log}" ]]; then
              echo -e "\n::notice::No errors found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
            fi;
          elif [[ ! $(which CodeChecker) ]] && ${{ env.analyzer == '4' }} && [[ -e 'compile_commands.json' ]]; then
            echo -e "\n####################\n\t::error::CodeChecker not installed Exiting...\n####################\n" | process_input;
          fi;
          [[ -f 'compile_flags.txt' ]] && mv -f 'compile_flags.txt' 'build/';
        fi;
        echo '';
        seconds="$((SECONDS + start_time))";
        echo "seconds=${seconds}" >> "${GITHUB_ENV}";
      shell: bash
      continue-on-error: true
      
    - name: Build Project
      if: inputs.project == 'true' && inputs.build > '0'
      run: |
        echo -n '';
        set +e
        start_time="${{ env.seconds }}";
        export CMAKE_EXPORT_COMPILE_COMMANDS=ON
        export CMAKE_BUILD_PARALLEL_LEVEL=4
        export CC_LOGGER_GCC_LIKE="gcc:g++:clang:clang++:/cc:c++";
        codechecker='codechecker.yaml';
        compiler_list=$(dpkg --list | grep compiler | tr -d 'ii');
        repository=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
        github=${GITHUB_WORKSPACE};
        project_log="${github}/${repository}_project.log";
        build_fixes='build/fixes.yaml';
        check_build=false
        file_type='c';
        update=true
        fixed=false
        count=1
        if ${{ inputs.repository == 'false' }} && [[ -d "${{ env.dirname }}" ]]; then
          cd "${{ env.dirname }}";
        fi;
        process_input() {
          while IFS= read -r output; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${output}" | tee -a "${project_log}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${output}" >> "${project_log}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${output}";
            elif ${{ inputs.output == '4' }}; then
              echo -e "${output}" >/dev/null;
            fi;
          done;
        }
        if [[ -f 'compile_commands.json' ]]; then
          compile_json='compile_commands.json';
        elif [[ -f 'build/compile_commands.json' ]]; then
          compile_json='build/compile_commands.json';
        else
          compile_json='build/compile_commands.json';
        fi;
        if ${{ inputs.absolute }}; then
          abs='-a';
        else
          abs='';
        fi;
        if ${{ env.check_build == 'false' }}; then
          echo 'check_build=false' >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.update == 'false' }}; then
          echo 'update=false' >> "${GITHUB_ENV}";
          update=false
        fi;
        if ${{ inputs.filetype != 'none' }}; then
          file_type="${{ inputs.filetype }}";
        fi;
        echo "filetype=${file_type}" >> "${GITHUB_ENV}";
        if ${{ env.build_files == '1' }} && ${{ inputs.build == '1' }} && ${{ env.build_error == 'false' }}; then
          echo -e '\n####################\n\tCodeChecker building project from sources...(test-run -1)\n####################\n' | process_input;
          sudo bash -c 'source ~/.bashrc';
          export TERM=dumb
          if [[ -e "/home/runner/codechecker/venv/bin/activate" ]]; then
            sudo bash -c 'source /home/runner/codechecker/venv/bin/activate'
          else
            echo -e "\nUnable to source ( /home/runner/codechecker/venv/bin/activate ) file\n" | process_input;
          fi;
          [[ -e 'build/envsetup.sh' ]] && source build/envsetup.sh
          if [[ -e "${codechecker}" ]]; then
            echo -e "\n${codechecker} file was found continuing...\n" | process_input;
            CodeChecker check -b "make -j$(nproc --all)" --config "${codechecker}" --jobs "$(nproc --all)" --print-steps 2>&1 | process_input || echo -e "\n::notice::CodeChecker check exit-code ($?)" | process_input;
          else
            echo -e "\n${codechecker} file was not found continuing without...\n" | process_input;
            CodeChecker check -b "make" --jobs "$(nproc --all)" --print-steps 2>&1 | process_input || echo -e "\n::notice::CodeChecker check exit-code ($?)" | process_input;
          fi;
          if [[ "${PIPESTATUS[0]}" == '0' ]] || [[ -s "${project_log}" ]] && [[ $(grep -siF 'Process completed with exit code' "${project_log}") ]]; then
            echo 'check_build=false' >> "${GITHUB_ENV}";
          elif [[ -s "${project_log}" ]] && [[ $(grep -sE 'error:|Error:|Error while processing|ERROR:' "${project_log}") ]]; then
            echo -e "\n::notice::Errors found building project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
          elif [[ -s "${project_log}" ]]; then
            echo -e "\n::notice::No errors found building project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
          fi;
          if ${{ inputs.upload }}; then
            echo 'build_files=1' >> "${GITHUB_ENV}";
          fi;
        elif ${{ env.build_files == '1' }} && ${{ inputs.build == '1' }}; then
          echo -e "\n####################\n\t::error:: build directory missing in repo Exiting...\n####################\n" | process_input;
        fi;
        if ${{ env.build_files == '1' }} && ${{ inputs.build == '2' }} && ${{ env.build_error == 'false' }}; then
          echo -e '\n####################\n\tCodeChecker building compile_commands.json from project sources...(json-run -2)\n####################\n' | process_input;
          sudo bash -c 'source ~/.bashrc';
          export TERM=dumb
          if [[ -e "/home/runner/codechecker/venv/bin/activate" ]]; then
            sudo bash -c 'source /home/runner/codechecker/venv/bin/activate';
          else
            echo -e "\nUnable to source ( /home/runner/codechecker/venv/bin/activate ) file\n" | process_input;
          fi;
          [[ -e "${compile_json}" ]] && rm -vf "${compile_json}" | process_input;
          CodeChecker log --build "make -j$(nproc --all)" --output "${compile_json}" 2>&1 | process_input || echo -e "\n::notice::CodeChecker log exit-code ($?)" | process_input;
          if [[ "${PIPESTATUS[0]}" == '0' ]] || [[ -s "${project_log}" ]] && [[ $(grep -siF 'Process completed with exit code' "${project_log}") ]]; then
            echo 'check_build=false' >> "${GITHUB_ENV}";
          elif [[ -s "${project_log}" ]] && [[ $(grep -sE 'error:|Error:|Error while processing|ERROR:' "${project_log}") ]]; then
            echo -e "\n::notice::Errors found building commands JSON file" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && echo 'build_error=true' >> "${GITHUB_ENV}" && check_build=true;
          elif [[ -s "${project_log}" ]]; then
            echo -e "\n::notice::No errors found building commands JSON file" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
          fi;
          if ${{ inputs.upload }}; then
            echo 'build_files=1' >> "${GITHUB_ENV}";     
          fi;
        elif ${{ env.build_files == '1' }} && ${{ inputs.build == '2' }}; then
          echo -e "\n####################\n\t::error:: build directory missing in repo Exiting...\n####################" | process_input;
        fi;
        if ${{ env.build_files == '1' }} && ${{ inputs.build == '3' }} && ${{ env.build_error == 'false' }}; then
          echo -e '\n####################\n\tDeheader analyze sources includes on build...(dry-run -3)\n####################\n' | process_input;
          sudo bash -c 'source ~/.bashrc'
          deheader -v -r -m "make -n -j$(nproc --all)" 2>&1 | process_input || echo -e "\n::notice::deheader check exit-code ($?)" | process_input;
          if [[ "${PIPESTATUS[0]}" == '0' ]] || [[ -s "${project_log}" ]] && [[ $(grep -siF 'Process completed with exit code' "${project_log}") ]]; then
            echo 'check_build=false' >> "${GITHUB_ENV}";
          elif [[ -s "${project_log}" ]] && [[ $(grep -sE ' duplicates|inclusion' "${project_log}") ]]; then
            echo -e "\n::notice::duplicate includes found building project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
          elif [[ -s "${project_log}" ]]; then
            echo -e "\n::notice::No duplicate includes found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
          fi;
          if ${{ inputs.upload }}; then
            echo 'build_files=1' >> "${GITHUB_ENV}";
          fi;
        elif ${{ env.build_files == '1' }} && ${{ inputs.build == '3' }}; then
          echo -e "\n####################\n\t::error:: build directory missing in repo Exiting...\n####################" | process_input;
        fi;
        if ${{ env.build_files == '1' }} && ${{ inputs.build == '4' }} && ${{ env.build_error == 'false' }}; then
          echo -e '\n####################\n\tDeheader analyze & repair sources includes on build...(test-run -4)\n####################\n' | process_input;
          sudo bash -c 'source ~/.bashrc'
          [[ -e 'build/envsetup.sh' ]] && source build/envsetup.sh
          deheader -v -r -m "lunch ${{ inputs.makefile }} && make clean && make ${{ inputs.filename }} -j$(nproc --all) -k" 2>&1 | process_input || echo -e "\n::notice::deheader build exit-code ($?)" | process_input;
          if [[ "${PIPESTATUS[0]}" == '0' ]] || [[ -s "${project_log}" ]] && [[ $(grep -siF 'Process completed with exit code' "${project_log}") ]]; then
            echo 'check_build=false' >> "${GITHUB_ENV}";
          elif [[ -s "${project_log}" ]] && [[ $(grep -sE ' duplicates|inclusion' "${project_log}") ]]; then
            echo -e "\n::notice::duplicate includes found building project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
          elif [[ -s "${project_log}" ]]; then
            echo -e "\n::notice::No duplicate includes found checking project files" | process_input && echo 'check_build=true' >> "${GITHUB_ENV}" && check_build=true;
          fi;
          if ${{ inputs.upload }}; then
            echo 'build_files=1' >> "${GITHUB_ENV}";
          fi;
        elif ${{ env.build_files == '1' }} && ${{ inputs.build == '4' }}; then
          echo -e "\n####################\n\t::error:: build directory missing in repo Exiting...\n####################\n" | process_input;
        fi;
        echo '';
        seconds="$((SECONDS + start_time))";
        echo "seconds=${seconds}" >> "${GITHUB_ENV}";
      shell: bash
      continue-on-error: true

    - name: Build Project
      if: inputs.project == 'true'
      run: |
        echo -n '';
        set +e
        start_time="${{ env.seconds }}";
        codechecker='codechecker.yaml';
        compiler_list=$(dpkg --list | grep compiler | tr -d 'ii');
        repository=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
        github=${GITHUB_WORKSPACE};
        project_log="${github}/${repository}_project.log";
        build_fixes='build/fixes.yaml';
        check_build=false
        file_type='c';
        update=true
        fixed=false
        count=1
        if ${{ inputs.repository == 'false' }} && [[ -d "${{ env.dirname }}" ]]; then
          cd "${{ env.dirname }}";
        fi;
        process_input() {
          while IFS= read -r output; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${output}" | tee -a "${project_log}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${output}" >> "${project_log}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${output}";
            elif ${{ inputs.output == '4' }}; then
              echo -e "${output}" >/dev/null;
            fi;
          done;
        }
        if ${{ inputs.absolute }}; then
          abs='-a';
        else
          abs='';
        fi;
        if ${{ env.check_build == 'false' }}; then
          echo 'check_build=false' >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.update == 'false' }}; then
          echo 'update=false' >> "${GITHUB_ENV}";
          update=false
        fi;
        if ${{ inputs.filetype != 'none' }}; then
          file_type="${{ inputs.filetype }}";
        fi;
        echo "filetype=${file_type}" >> "${GITHUB_ENV}";
        if [[ -s "${project_log}" ]] && (${{ env.check_build == 'true' }} || [[ "${check_build}" == 'true' ]]); then
          echo -e "\n####################\n\t${project_log##*/} file found checking stats...\n####################" | process_input;
          deheader_duplicates=$(grep -sFc 'duplicates' "${project_log}");
          deheader_inclusion=$(grep -sFc 'inclusion' "${project_log}");
          deheader_removed=$(grep -sFc 'remove' "${project_log}");
          codechecker_defects=$(grep -so 'Found [1-9] defect' "${project_log}" | cut -d ' ' -f2 | awk '{sum += $1} END {print sum}');
          codechecker_no_defects=$(grep -sFoc 'Found no defects' "${project_log}");
          codechecker_success=$(grep -sFc 'successfully' "${project_log}");
          codechecker_errors=$(grep -sFc 'Error while processing' "${project_log}");
          clang_replacements=$(grep -sF 'Replacements:' "${build_fixes}" | grep -vc '[\[\]]');
          clang_information=$(grep -siFc 'information:' "${project_log}");
          clang_files_missing=$(grep -sFc 'file not found' "${project_log}");
          clang_files_list=$(grep -sEo '#include[[:space:]]+[<"].*[>"]' "${project_log}" | awk '{print $2}' | tr -d '<">' | sort -u);
          clang_warnings=$(grep -sEo '[1-9] warnings generated|1 warning generated' "${project_log}" | cut -d ' ' -f1 | awk '{sum += $1} END {print sum}');
          clang_errors=$(grep -sEo '[1-9] errors generated|1 error generated' "${project_log}" | cut -d ' ' -f1 | awk '{sum += $1} END {print sum}');
          clang_fixit1=$(grep -siEc 'fixit|fix-its' "${project_log}");
          clang_fixit2=$(grep -siF 'clang-tidy applied' "${project_log}");
          clang_notes=$(grep -siFc 'note:' "${project_log}");
          located_count=0
          missing_count=0
          file_count=0
          if [[ -n "${clang_information}" ]] && [[ "${clang_information:-0}" > '0' ]] && ${{ inputs.analyzer == '3' }}; then
            echo -e "\n####################\n::notice::⚠️ check-file added ${clang_information}️ information notes on ${file_type} file(s) checked. [Hints] Information addresses key issues that may have error fixes available.\n####################" | process_input;
          fi;
          if [[ -n "${clang_warnings}" ]] && [[ "${clang_warnings:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::⚠️ check-file found ${clang_warnings}️ warnings in ${file_type} file(s) checked. [Hints] Try using ( warnings-as-errors ) for possible errors.\n####################" | process_input;
          fi;
          if [[ -n "${codechecker_defects}" ]] && [[ "${codechecker_defects:-0}" > '0' ]] && (${{ inputs.analyzer == '4' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}); then
            echo -e "\n####################\n::notice::⚠️ check-file checked ${codechecker_defects} ${file_type} file(s) with defects. [Hints] Check require for those files.\n####################" | process_input;
          fi;
          if [[ -n "${codechecker_no_defects}" ]] && [[ "${codechecker_no_defects:-0}" > '0' ]] && (${{ inputs.analyzer == '4' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}); then
            echo -e "\n####################\n::notice::✅ check-file checked ${codechecker_no_defects} ${file_type} file(s) without defects. [Hints] No check require for those files.\n####################" | process_input;
          fi;
          if [[ -n "${codechecker_success}" ]] && [[ "${codechecker_success:-0}" > '0' ]] && (${{ inputs.analyzer == '4' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}); then
            echo -e "\n####################\n::notice::✅ check-file checked ${codechecker_success} ${file_type} file(s) successfully without issues. [Hints] No check require for those files.\n####################" | process_input;
          fi;
          if [[ -n "${clang_errors}" ]] && [[ "${clang_errors:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::🚫 check-file found ${clang_errors} errors in ${file_type} file(s) checked. [Hints] Try using different (analyzer: 1, 2, or 4) for possible error fixes.\n####################" | process_input;
          fi;
          if [[ -n "${clang_fixit1}" ]] && [[ "${clang_fixit1:-0}" > '0' ]] && ${{ inputs.analyzer > '0' }}; then
            echo -e "\n####################\n::notice::✅ check-file applied ${clang_fixit1} fix-its to ${file_type} file(s) checked. [Hints] Try using (update: true) for updating your remote repository with the fixes.\n####################" | process_input;
            fixed=true
          fi;
          if [[ -n "${clang_fixit2}" ]] && [[ "${clang_fixit2:-0}" > '0' ]] && ${{ inputs.analyzer > '0' }}; then
            echo -e "\n####################\n::notice::✅ ${clang_fixit2} To ${file_type} file(s) checked. [Hints] Try using (update: true) for updating your remote repository with any fixed files.\n####################" | process_input;
            fixed=true
          fi;
          if [[ -n "${clang_notes}" ]] && [[ "${clang_notes:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::⚠️ check-file added ${clang_notes} notes on ${file_type} file(s) checked. [Hints] Notes are fix suggestions for files that should be addressed before compiling.\n####################" | process_input;
          fi;
          if [[ -f "${build_fixes}" ]] && [[ "${clang_replacements:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::✅ check-file applied ${clang_replacements} clang replacement fixes for ${file_type} file(s) checked. [Hints] Clang export fixes are stored in build/fixes.yaml for download. Try using different (analyzer: 1, 2, or 4) for more possible error fixes.\n####################" | process_input;
          fi;
          if [[ -n "${deheader_removed}" ]] && [[ "${deheader_removed:-0}" > '0' ]] && ${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}; then
            echo -e "\n####################\n::notice::✅ check-file removed ${deheader_removed} extra inclusions in ${file_type} file(s) checked. [Hints] Try manually removing any extra includes in files before compiling.\n####################" | process_input;
            fixed=true
          fi;
          if [[ -n "${deheader_duplicates}" ]] && [[ "${deheader_duplicates:-0}" > '0' ]] && (${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}); then
            echo -e "\n####################\n::notice::🚫 check-file found ${deheader_duplicates} duplicates or colliding inclusions in ${file_type} file(s) checked. [Hints] Try using (analyzer: 1, 2, or 4) for possible error fixes.\n####################" | process_input;
          elif [[ -n "${deheader_inclusion}" ]] && [[ "${deheader_inclusion:-0}" > '0' ]] && (${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}); then
            echo -e "\n####################\n::notice::🚫 check-file found ${deheader_inclusion} extra inclusions in ${file_type} file(s) checked. [Hints] Try using (update: true) if headers were fixed to update remote repository.\n####################" | process_input;
          fi;
          if [[ -n "${clang_files_missing}" ]] && [[ "${clang_files_missing:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::❌ check-file discovered ${clang_files_missing} calls to missing include files in all ${file_type} file(s) checked. [Hints] Files may be there yet not included an/or duplicate missing files. Check missing files list for exact files!!!\n####################" | process_input;
            echo -e "\n####################\nMISSING FILES LIST:\n####################\n\n${clang_files_list}" | process_input;
            echo -e "\n####################\nCHECK-FILE AUTO LOCATE FILES IN: ${{ env.base }}\n####################\n" | process_input;
            declare -A missing
            found=false
            while IFS= read -r missing_file; do
              if [[ "${missing_file}" == *.[h]* ]] || [[ "${missing_file}" == *.[c]* ]]; then
                file_count=$((file_count + 1));
                echo "Locating missing ${missing_file} file ...." | process_input;
                path1="${missing_file//\'/}";
                path2="${path1##[:]*}";
                path3="${path2%'\n'}";
                path4="${path3%\\}";
                clean_path="${path4##+(*./)}";
                file1="${missing_file//\'/}";
                file2="${file1##[:]*}";
                file3="${file2%'\n'}";
                file4="${file3%\\}";
                clean_file="${clean_file##*/}";
                shopt -s extglob
                if [[ ${missing_file} == *"/"* ]]; then          
                  locate=$(fdfind -p -c auto "${abs}" -t f -g "**/${clean_path##+(*./)}" "${{ env.base }}");
                else
                  locate=$(fdfind -p -c auto "${abs}" -t f "${clean_file##+(*./)}" "${{ env.base }}");
                fi;
                if [[ "${locate}" ]]; then            
                  while IFS= read -r includes; do
                    located_count=$((located_count + 1));
                    echo -e "\n\033[32mSource Location:\033[0m ${includes}  [ ✅ ]" | process_input;
                    echo "${includes%/*}" >> 'check-file-includes.txt';
                  done <<< "${locate[@]}";
                  includes_found=true
                elif [[ -n "${missing[$missing_file]}" ]]; then
                  includes_found=false
                  echo -e "\n\033[33mSource file #include \033[0m( ${missing_file} )\033[33m already listed missing!\033[0m  [\033[1m skipped \033[0m]" | process_input;
                else
                  includes_found=false
                  missing["$missing_file"]=1
                  missing_count=$((missing_count + 1));
                  echo -e "\n\033[31mCannot locate missing file\033[0m ${missing_file}  [ ❌ ]" | process_input;
                fi;
                shopt -u extglob
              fi;             
            done <<< "${clang_files_list}";
            unset missing;
            if [[ -s 'check-file-includes.txt' ]]; then
              awk '!/\.h$|\.c$/ { sub(/\/$/, ""); print }' 'check-file-includes.txt' > 'check-file-includes-tmp.txt';
              awk '!seen[$0]++' 'check-file-includes-tmp.txt' > 'check-file-includes.txt' && cp -f 'check-file-includes.txt' 'build/check-file-includes.txt' && echo -e "\n::notice::✅ check-file located ${located_count} files. ${missing_count} missing out of ${file_count} total!!!\n\nDuplicate paths removed from check-file-includes.txt\nFound include directories added to build/check-file-includes.txt\nTo get the file set option ( upload: true )\nRetrive file from artifacts zip download\nThen add it to your repository root before re-check!!!\n\nYou can also set ( cache: true )\nFeature caches local project current state\nThis will store the missing files found list during auto detect mode\nWhich will auto update included directories for checking during next re-check!!!" | process_input && found=true;
            fi;
          fi;
          if [[ ${update} ]] && ${{ env.analyzer == '2' }}; then
            echo -e "\nPARAMETERS: $(rm -vf ${clang_file} 2>/dev/null)" | process_input;
          fi;
          [[ -f ${count1} ]] && rm "${count1}";
          [[ -f ${count2} ]] && rm "${count2}";
          [[ -f ${count3} ]] && rm "${count3}";
          ${{ inputs.content }} && echo -e "\n####################\n\tINSTALLED COMPILERS\n####################\n\n${compiler_list}" | process_input;
          if [[ "${fixed}" ]]; then
            echo "file_fixed=1" >> "${GITHUB_ENV}";
          fi;
          echo "github_include_dirs=" >> "${GITHUB_ENV}";
          if [[ "${found}" ]]; then
            echo "includes=true" >> "${GITHUB_ENV}";
          else
            echo "includes=false" >> "${GITHUB_ENV}";
          fi;
          [[ -f "/tmp/*/metadata.json" ]] && echo -e"\nCodeChecker Analyzer list: $(cp -vf "/tmp/*/metadata.json" build/)";
          echo -e '\n####################\n\tProject Checked Exiting...\n####################\n' | process_input;
        else
          echo -e '\n####################\n\tProject Not Checked Exiting...\n####################\n' | process_input;
        fi;
        seconds="$((SECONDS + start_time))";
        m=$((seconds / 60));
        s=$((seconds % 60));
        printf "Project Process Runtime: %d minutes and %d seconds\n" "$m" "$s";
      shell: bash
      continue-on-error: true

    - name: Check & Repair (Clang-tools)
      if: inputs.filename != '' && inputs.build == '0'
      run: |
        echo '';
        set +e
        SAVEIFS=${IFS}
        include_count=1
        include_total=1
        build_cache='build_cache';
        clang_file='.clang-tidy';
        repaired='check-file-repaired.txt';
        file_count=1
        file_name="${{ inputs.filename }}";
        file_type="${file_name##*.}";
        cppchecks='.cppcheck';
        error_log="${{ inputs.filename }}_error.log";
        checked=false
        count2=0
        github=${GITHUB_WORKSPACE};
        process_input() {
          while IFS= read -r output; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${output}" | tee -a "${error_log}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${output}" >> "${error_log}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${output}";
            elif ${{ inputs.output == '4' }}; then
              echo -e "${output}" >/dev/null;
            fi;
          done;
        } 2>&1;
        if [[ -f 'compile_commands.json' ]]; then
          compile_json='compile_commands.json';
        elif [[ -f 'build/compile_commands.json' ]]; then
          compile_json='build/compile_commands.json';
        else
          compile_json='build/compile_commands.json';
        fi;
        if ${{ inputs.database }}; then
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(LC_ALL=C grep -sF "/${{ inputs.filename }}" "${{ env.database }}" 2>/dev/null);
            echo -e "\n####################\nLiteral String Pattern Matching Active\n####################\n" | process_input;
          else
            regex="\${{ inputs.filename }}$";
            files=$(LC_ALL=C grep -sE "${regex}" "${{ env.database }}" 2>/dev/null);
            echo -e "\n####################\nExtended Regex Pattern Matching Active\n####################\n" | process_input;
          fi;
        else
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(sudo find ${{ env.base }} -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -type f \( -path "*/${{ env.dirname }}/*" -o -path "*/*/*" \) -name "${{ inputs.filename }}" -print);
          else
            files=$(sudo find ${{ env.base }} -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -type f \( -path "*/${{ env.dirname }}/*" -o -path "*/*/*" \) -name "*${{ inputs.filename }}" -print);
          fi;
        fi;
        if [[ "${file_type}" == [cth]* ]] && [[ -n ${files} ]]; then
          echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################\n" | process_input;
          if [[ -f "${clang_file}" ]] && ${{ inputs.repair }}; then
            echo -e '\n####################\n\t.clang-tidy found continuing...\n####################\n' | process_input
          elif [[ ! -f "${clang_file}" ]] && ${{ inputs.repair }}; then
            echo -e "\n####################\n::error:: .clang-tidy not found exiting...\n####################\n" | process_input;
            exit 1
          fi;
          if [[ -f "${compile_json}" ]] && ! ${{ inputs.include }}; then
            echo -e '\n####################\n\tcompile_commands.json found continuing...\n####################\n' | process_input 
          elif [[ ! -f "${compile_json}" ]] && ! ${{ inputs.include }}; then
            echo -e "\n####################\n::error:: compile_commands.json not found\nUse inputs.project: true to create it exiting...\n####################\n" | process_input;
            exit 1
          fi;
          if [[ -f "${cppchecks}" ]]; then
             echo -e "\n####################\n\t${cppchecks} found continuing...\n####################\n" | process_input;
             cppchecks=$(cat ${cppchecks} | tr -d ' \n');
          else
             cppchecks=all
          fi;
          if [[ -d "${build_cache}" ]]; then
             echo -e '\n####################\n\tbuild_cache found continuing...\n####################\n' | process_input;
             echo 'build_cache=true' >> "${GITHUB_ENV}";
          else
             mkdir -p "${build_cache}";
          fi;
          if ${{ inputs.content }}; then
            echo -e "\n# Found File Path(s)\n" | process_input;
            awk 'NR % 10 == 1 {print "---- Lines " NR " to " NR+9 " ----"} {print}' "${files}" | process_input;
            echo -e '\t--------------------\n' | process_input
          fi;
          { time for file in ${files[@]}; do
            search_path="${file}";
            check_date=$(LC_ALL=C grep -sF "${search_path}" "${repaired}" | cut -d' ' -f 2-);
            count1=$((file_count++));
            echo -e "\n####################\n\tFILE PATH (${count1})\n####################\n" | process_input;
            echo "$(dirname ${file})";
            if ${{ inputs.content }}; then
              echo -e "\n####################\n\tFILE CONTENT (${count1})\n####################\n" | process_input;
              batcat --theme=ansi --paging=never --show-all --color=always --style=full "{file}";
            fi;
            if ${{ inputs.include }}; then
              IFS=$'\n';
              includes=$(find $(dirname ${file}) -name $(basename ${file}) -exec sed -n 's/^#include <\(.*\)>/\1/p; s/^#include "\(.*\)"/\1/p' "{}" \;);
              include1='include_file1.txt';
              include2='include_file2.txt';
              if [[ ${includes} ]]; then
                echo -e "\n# Found Include File(s):\n${includes}\n" | process_input;
                echo > "${include1}";
                for i in ${includes[@]}; do
                  final="${i}";
                  count2=$((include_count++));
                  count3=$((include_total++));
                  header=$(find . -type f \( -path "*/$(dirname ${i})/*" -o -path "*/$(dirname ${file})/*" -o -path "*/*/*" \) -name "$(basename ${i})" -print -quit);
                  if [[ -f "${header}" ]]; then
                    echo "$(dirname ${header#./})" >> "${include1}";
                  else
                    echo -e "\n::notice:: include source file ${i} is missing\n" | process_input;
                  fi;
                done;
                IFS=${SAVEIFS};
                if [[ -f "${include1}" ]]; then
                  awk '!seen[$0]++' "${include1}" > "${include2}";
                fi;
                if [[ -f "${include2}" ]]; then
                  if ${{ inputs.repair }}; then
                    if ${{ inputs.stored }} && ${{ env.update }} && [[ $(LC_ALL=C grep -sF "${search_path}" "${repaired}") ]]; then
