name: Check File Action
description: 'Check file - Add filename to check for errors or text Word to search for within workspace files'
inputs:
  repository:
    description: 'Auto clone user remote repo locally for checks'
    type: boolean
    required: false
    default: 'true'
  analyzer:
    description: 'Analyze all project files using options 1 - 2 - 3 - 4'
    required: false
    default: 0
    type: choice
    options:
    - 0 # disable project analyzer
    - 1 # run-clang-tidy.py - fastest for large project file checks. fix-its
    - 2 # clang-tidy - faster for small an large project file checks. fix-its
    - 3 # clangd-tidy - fast large project file checks.
    - 4 # codechecker - compiler project file check reports.
  makefile:
    description: 'Make filename for building project source'
    type: string
    required: false
    default: 'Makefile'
  filename:
    description: 'Check for filename or search for text word matches'
    type: string
    required: false
    default: ''
  filetype:
    description: 'Check only these file extension types when searching for text word matches'
    type: string
    required: false
    default: 'none'
  database:
    description: 'Use file database over find commands slower performance for searches'
    type: boolean 
    required: false
    default: 'false'
  dirname:
    description: 'Directory to check files or if using project option the dir to include for header checks & builds'
    type: string
    required: false
    default: ''
  pattern:
    description: 'Search for pattern matches in filetypes or all files'
    type: string
    required: false
    default: ''
  project:
    description: 'Fix Errors found while building project or check build only'
    type: boolean
    required: false
    default: 'false'
  rootdir:
    description: 'Search will use absolute over relative path from github workspace'
    type: boolean
    required: false
    default: 'true'
  recheck:
    description: 'Recheck files repaired by check-file'
    type: boolean
    required: false
    default: 'false'
  repair:
    description: 'Check file and fix if able when searching for errors'
    type: boolean
    required: false
    default: 'false'
  report:
    description: 'Errors found will be logged and sent to repository releases'
    type: boolean
    required: false
    default: 'false'
  compiler:
    description: 'Clang compiler used for project building only'
    type: string
    required: false
    default: 'clang-latest'
  content:
    description: 'Search will list dir contents of found filename'
    type: boolean
    required: false
    default: 'false'
  include:
    description: 'Check include files called by C/C++ filename searches if true'
    type: boolean
    required: false
    default: 'true'
  number:
    description: 'Number of files to check before stopping action'
    type: number
    required: false
    default: 0
  stored:
    description: 'Checked files with errors repaired are skipped if ran again'
    type: boolean
    required: false
    default: 'false'
  update:
    description: 'Errors repaired with check-file will push changes to remote repository'
    type: boolean
    required: false
    default: 'false'
  upload:
    description: 'Upload build files for compile_commands.json'
    type: boolean
    required: false
    default: 'false'
  output:
    description: 'Output log stdout type 1,2 or 3'
    required: false
    default: 1
    type: choice
    options:
    - 1 # Log to terminal and file.
    - 2 # Log to file only.
    - 3 # Log to terminal only.
  build:
    description: 'Fix Errors found while building repository project'
    type: choice
    required: false
    default: '0'
    options:
    - 0 # Disable building projects.
    - 1 # Build & check project. [CodeChecker Dry-Run Multiple-Files]
    - 2 # Build new compile_commands_json & check project. [CodeChecker Build Multiple-Files]
    - 3 # Build check includes & check project. [Deheader Dry-Run Multiple-Files]
    - 4 # Build fix includes & check project. [Deheader Build Single-Files]
  clean:
    description: 'Clean workflow on checkout'
    type: boolean
    required: false
    default: 'true'
  cache:
    description: 'Cache Repository Project'
    type: boolean
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Linux Distro Check
      run: |
        echo '';
        echo -e "####################\nCheck-File-Action-Pro version 2.0.0 [Beta Stable]\n####################\n";
        if [[ -r '/etc/os-release' ]]; then
          . /etc/os-release
          if [[ "${ID}" == 'ubuntu' ]]; then
            echo "Name: ${NAME}"
            echo "Version: ${VERSION}"
            echo "ID: ${ID}"
            echo "ID Like: ${ID_LIKE}"
            echo "Pretty Name: ${PRETTY_NAME}"
            echo "Version ID: ${VERSION_ID}"
          else
            echo "Not running an Ubuntu distribution. ID=${ID}, VERSION=${VERSION}"
          fi;
        else
          echo "Not running a distribution with /etc/os-release available"
        fi;
        echo '';
      shell: bash
      continue-on-error: true

    - name: Restore Project
      if: inputs.cache == 'true'
      id: restore
      uses: actions/cache/restore@v5
      env:
        cache-name: check-file-action
      with:
        path: '.'
        key: ${{ runner.os }}-${{ env.cache-name }}
        restore-keys: |
          ${{ runner.os }}
        enableCrossOsArchive: true
      continue-on-error: false

    - name: Clone Recovery Repo
      if: inputs.repository == 'true' && ( inputs.cache == 'false' || steps.restore.outputs.cache-hit != 'true' )
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        clean: ${{ inputs.clean }}
        fetch-depth: 1
        show-progress: false
      continue-on-error: false

    - name: Access repo info and branch
      run: |
        echo '';
        if ${{ steps.restore.outputs.cache-hit == 'true' }}; then
          echo -e "####################\nCheck-File Restored Repository Project From Cache\n####################\n";
        fi;
        echo "Repository Owner and Name: ${GITHUB_REPOSITORY}"
        echo "Branch Name: ${{ github.ref_name }}"
        echo "GitHub URL: ${{ github.server_url }}"
        echo "Repository URL via context: ${{ github.server_url }}/${{ github.repository }}"
        echo -e "Ref (branch/tag) via context: ${{ github.ref }}\n"
      shell: bash
      continue-on-error: true

    - name: Set up Go 1.25.3
      if: inputs.filename != ''
      uses: actions/setup-go@v2
      with:
        go-version: 'stable'
      continue-on-error: true

    - name: Setup Clang Compiler
      if: inputs.project == 'true'
      uses: rlalik/setup-cpp-compiler@master
      with:
        compiler: ${{ inputs.compiler }}
      continue-on-error: true

    - name: Installing Dependencies
      if: inputs.pattern != '' || inputs.filename != '' || inputs.project != 'false'
      run: |
        echo '';
        cmake_version=$(cmake --version 2>/dev/null | grep version | awk '{print $3}');
        required_version="4.2.1";
        linux_distro1="24.04";
        linux_distro2="22.04";
        linux_distro3="20.04";
        linux_verison=$(lsb_release -r | awk '{print $2}');
        echo 'export GIT_DISCOVERY_ACROSS_FILESYSTEM=1' | sudo tee -a ~/.bashrc >/dev/null;
        echo 'export DEBIAN_FRONTEND=noninteractive' | sudo tee -a ~/.bashrc >/dev/null;
        echo 'deb [trusted=yes] https://apt.gabe565.com /' | sudo tee -a /etc/apt/sources.list.d/gabe565.list >/dev/null;
        sudo add-apt-repository universe >/dev/null;
        sudo add-apt-repository ppa:git-core/ppa >/dev/null;
        sudo apt-get update -yq 2>&1 >/dev/null | sed '/Running/,/host./d';
        if ${{ inputs.project }}; then
          if [[ "${cmake_version}" < "${required_version}" ]] && ${{ inputs.project }}; then
            echo -e "Current CMake version (${cmake_version}) is older than ${required_version}. Updating..."
            sudo apt-get remove --purge -yq cmake >/dev/null;
            sudo apt-get install -yq ca-certificates gpg wget >/dev/null;
            sudo bash -c "$(sudo wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null)";
            if [[ "${linux_verison}" == "${linux_distro1}" ]]; then
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            elif [[ "${linux_verison}" == "${linux_distro2}" ]]; then
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            elif [[ "${linux_verison}" == "${linux_distro3}" ]]; then
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ focal main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            else
              echo -e "\nKitWare Keyring: Noble ${linux_verison}\n";
              echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' | sudo tee -a /etc/apt/sources.list.d/kitware.list >/dev/null;
            fi;
          fi;
        fi;
        text0="####################\ngit dependencies Installed\n####################";
        text1="####################\nripgrep dependencies Installed\n####################";
        text2="####################\nansi2txt dependencies Installed\n####################";
        text3="####################\nca-certificates dependencies Installed\n####################";
        text4="####################\ncppcheck dependencies Installed\n####################";
        text5="####################\nclang-tools dependencies Installed\n####################";
        text6="####################\nshellharden dependencies Installed\n####################";
        text7="####################\nshellcheck dependencies Installed\n####################";
        text8="####################\ncheckmake dependencies Installed\n####################";
        text9="####################\nbatcat dependencies Installed\n####################";
        file_name="${{ inputs.filename }}";
        file_type="${file_name##*.}";
        github=${GITHUB_WORKSPACE};
        if ${{ inputs.project }} && [[ "${cmake_version}" < "${required_version}" ]]; then
          echo -e "CMake version $cmake_version upgrading to latest python cmake\n"
          sudo rm -vf "$(which cmake)";
          sudo mkdir -p '/usr/local/bin'
          echo "/usr/local/bin" >> "${GITHUB_PATH}";
          python -m pip install cmake --upgrade >/dev/null && echo -e "\n####################\ncmake pip dependencies Installed\n####################\n" || echo -e '::error::No cmake pip installed for project checks';
          sudo cp -vpf "${HOME}/.local/bin/cmake" '/usr/local/bin/'
        fi;
        if ${{ inputs.project }} && [[ ! $(which cmake) ]]; then
          sudo apt-get -yq install cmake 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "####################\ncmake dependencies Installed\n####################" || echo -e '::error::No cmake installed for project build'; 
          [[ ! $(which cmake) ]] && exit 1
        fi;
        if ${{ inputs.project }} && [[ ! $(apt list linux-headers-generic 2>/dev/null) ]]; then
          sudo apt-get -yq install linux-headers-generic 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "####################\n$(apt list linux-headers-generic 2>/dev/null) - $(uname -r) dependencies Installed\n####################" || echo -e "::error::No linux-headers-generic $(uname -r) installed for project build"; 
          [[ ! $(apt list linux-headers-generic 2>/dev/null) ]] && exit 1
        fi;
        if [[ ! $(which git) ]]; then
          sudo apt-get -yq install git git-core 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "${text0}" || echo -e '::error::No git installed for repo updates';
          [[ ! $(which git) ]] && exit 1
        fi;
        if [[ ! $(which gcc) ]] || [[ ! $(which g++) ]] && ${{ inputs.repair }} && ${{ inputs.filename != '' }}; then
          sudo apt-get -yq install gcc g++ 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "####################\ngcc g++ dependencies Installed\n####################" || echo -e '::error::No gcc or g++ installed for repo updates';
          [[ ! $(which gcc) ]] || [[ ! $(which g++) ]] && exit 1
        fi;
        if ${{ inputs.project }} && ${{ inputs.analyzer == '2' }} && [[ ! $(which python3) ]]; then
          sudo apt-get -yq install python3 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "####################\npython3 dependencies Installed\n####################" || echo -e '::error::No python3 installed for project checks';
          [[ ! $(which python3) ]] && exit 1
        fi;
        if ${{ inputs.project }} && [[ ! $(llvm-config --version 2>/dev/null) ]]; then
          sudo bash -c "$(sudo wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add - >/dev/null 2>&1)"
          sudo bash -c "$(sudo wget -qO - https://apt.llvm.org/llvm.sh | sudo bash -s -- 21 >/dev/null 2>&1)"
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs) main" >/dev/null;
          sudo apt-get -yq install lld llvm llvm-dev liblldb-dev libclang-dev 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "####################\nllvm tools dependencies Installed\n####################\n" || echo -e '::error::No llvm tools installed for project build';
          [[ $(which clang-tidy) ]] && sudo rm -vf "$(which clang-tidy)" && echo '';
          [[ $(which clang-tidy-18) ]] && sudo rm -vf "$(which clang-tidy-18)";
          sudo apt-get -yq install clang-tools clang-tidy 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "${text5}" || echo -e '::error::No clang-tools installed';
          [[ ! $(llvm-config --version 2>/dev/null) ]] && exit 1
        fi;
        if (${{ inputs.project }} || [[ -n $(echo "${file_type}" | egrep "^c$|^c.$|^c..$|^h$|^h.$|^h..$|^t$|^t.$|^t..$") ]]) && [[ ! $(which clang-tidy) ]]; then
          python3 -m pip install clang-tools >/dev/null && clang-tools --install latest --directory /usr/bin >/dev/null && echo -e "\n####################\nclang tools pip dependencies Installed\n####################\n" || echo -e '::error::No clang tools installed for project check'; # Adjust directory as needed
          [[ ! -e '/usr/bin/clang-tidy' ]] && [[ -e "${HOME}/.local/bin/clang-tidy" ]] && sudo mv -vf "${HOME}/.local/bin/clang-tidy" '/usr/bin/clang-tidy'
          [[ -e "${HOME}/.local/bin/run-clang-tidy" ]] && sudo mv -vf "${HOME}/.local/bin/run-clang-tidy" '/usr/bin/run-clang-tidy'
          [[ ! $(which clang-tidy) ]] && exit 1
        fi;
        if ${{ inputs.analyzer == '1' }} && ${{ inputs.project }} && [[ $(which run-clang-tidy) ]]; then
          echo -e "\n[clang-tools] $(whereis -b run-clang-tidy)";
          [[ $(whereis clang-format) ]] && echo -e "\n[clang-tools]: $(whereis -b clang-format)";
          [[ $(whereis clang-apply-replacements) ]] && echo -e "\n[clang-tools]: $(whereis -b clang-apply-replacements)";
          echo 'run_clang_tidy=run-clang-tidy' >> "${GITHUB_ENV}";
        elif ${{ inputs.analyzer == '1' }} && ${{ inputs.project }}; then
          echo -e "\n[clang-tools] run-clang-tidy: /scripts/tools/run-clang-tidy.py";
          [[ $(whereis clang-format) ]] && echo -e "\n[clang-tools]: $(whereis -b clang-format)";
          [[ $(whereis clang-apply-replacements) ]] && echo -e "\n[clang-tools]: $(whereis -b clang-apply-replacements)";
          echo "run_clang_tidy=${{ github.action_path }}/scripts/tools/run-clang-tidy.py" >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.project }} && ${{ inputs.analyzer == '3' }} && [[ ! $(which clangd-tidy) ]]; then
          python3 -m pip install clangd-tidy >/dev/null && echo -e "\n####################\nclangd-tidy dependencies Installed\n####################" || echo -e '::error::No clangd-tidy installed for project checks';
          if [[ $(which clangd-tidy) ]]; then
            echo -e "\nclangd-tidy path: $(which clangd-tidy)\n";
          else
            exit 1
          fi;
        fi;
        if (${{ inputs.analyzer == '4' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}) && [[ ! $(which CodeChecker) ]]; then
          sudo apt-get -yq install python3-pip python3-venv make 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "\n####################\npython3-pip dependencies Installed\n####################" || echo -e '::error::No python3-pip installed for project checks';
          python3 -m pip install codechecker >/dev/null && echo -e "\n####################\ncodechecker dependencies Installed\n####################" || echo -e '::error::No codechecker installed for project checks';
          sudo mkdir -p "/home/runner/codechecker/venv/include"
          sudo mkdir -p "/home/runner/codechecker/venv/bin"
          sudo chown -R "${USER}:${USER}" /home/runner/codechecker/
          cd "/home/runner/codechecker/venv"
          python3 -m venv .
          cd "${github}"
          if [[ $(which CodeChecker) ]]; then
            echo -e "\nCodeChecker path: $(which CodeChecker)";
          else
            exit 1
          fi;
        fi;
        if ${{ inputs.project }} && ${{ inputs.build > '2' }} && [[ ! $(which deheader) ]]; then
          sudo apt-get -yq install deheader 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "####################\ndeheader dependencies Installed\n####################" || echo -e '::error::No deheader installed for project includes check';
          [[ ! $(which deheader) ]] && exit 1
        fi;
        if ${{ inputs.project }} && [[ ! $(dpkg -s build-essential 2>/dev/null) ]]; then
          sudo apt-get -yq install build-essential device-tree-compiler 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "####################\nbuild-essential dependencies Installed\n####################" || echo -e '::error::No build-essential installed for project build';
        fi;
        if ${{ inputs.project }} && ${{ inputs.analyzer == 3 }} && [[ ! $(which tqdm) ]]; then
          python -m pip install tqdm >/dev/null && echo -e "\n####################\ntqdm dependencies Installed\n####################\n" || echo -e '::warning::No tpdm installed for project progress checks';
          [[ ! $(which tqdm) ]] && exit 1
        fi;
        if ${{ inputs.pattern != '' }} && ${{ inputs.database }} && [[ ! $(which rg) ]]; then
          sudo apt-get -yq install ripgrep 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "${text1}" || echo -e '::error::No ripgrep installed for pattern matching';
          [[ ! $(which rg) ]] && exit 1
        fi;
        if ${{ inputs.report }} && [[ ! $(which ansi2txt) ]]; then
          sudo apt-get -yq install ansi2txt 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "${text2}" || echo -e '::error::No ansi2txt installed for cleaning log report';
        fi;
        if ${{ inputs.project }} && [[ ! $(which update-ca-certificates) ]]; then
          sudo apt-get -yq install ca-certificates 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "${text3}" || echo 'No ca-certificates installed effects can vary';
        fi;
        if [[ -n $(echo "${file_type}" | egrep "^c$|^c.$|^c..$|^h$|^h.$|^h..$|^t$|^t.$|^t..$") ]] && [[ ! $(which cppcheck) ]]; then
          sudo apt-get -yq install cppcheck 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "${text4}" || echo -e '::error::No cppcheck installed Exiting';
          [[ ! $(which cppcheck) ]] && exit 1
        fi;
        if [[ -n $(echo "${file_type}" | egrep -i "^sh$") ]] && ${{ inputs.repair }} && [[ ! $(which shellharden) ]]; then
          sudo wget -qO 'shellharden.tar.gz' 'https://github.com/anordal/shellharden/releases/latest/download/shellharden-x86_64-unknown-linux-gnu.tar.gz' >/dev/null;
          sudo tar xf 'shellharden.tar.gz' -C '/usr/local/bin' 'shellharden' && rm -vrf 'shellharden.tar.gz' && echo -e "${text6}" || echo -e '::error::No shellharden installed Exiting';
          [[ ! $(which shellharden) ]] && exit 1
        fi;
        if [[ -n $(echo "${file_type}" | egrep -i "^sh$") ]] && [[ ! $(which shellcheck) ]]; then
          sudo apt-get -yq install shellcheck 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "${text7}" || echo -e '::error::No shellcheck installed Exiting';
          [[ ! $(which shellcheck) ]] && exit 1
        fi;
        checkmake_src='checkmake.ini';
        checkmake_des="${HOME}/checkmake.ini";
        if [[ "${checkmake_src}" ]] && [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]] && [[ $(which checkmake) ]]; then
          sudo cp -vf "${checkmake_src}" "${checkmake_des}" 2>/dev/null;
        elif [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]] && [[ $(which checkmake) ]]; then
          echo -e '\ncheckmake.ini file missing, needed for checkmake to function properly\n';
        fi;
        if [[ "${checkmake_src}" ]] && [[ -n $(echo "${file_type}" | egrep -i "^mk$|.*Makefile$") ]] && [[ ! $(which checkmake) ]]; then
          go install "github.com/checkmake/checkmake/cmd/checkmake@latest" >/dev/null && echo -e "\n${text8}\n" || echo -e '::error::No checkmake installed Exiting';
          sudo cp -vf "${checkmake_src}" "${checkmake_des}" 2>/dev/null;
          [[ ! $(which checkmake) ]] && exit 1
        fi;
        if ${{ inputs.filename != '' }} || ${{ inputs.pattern != '' }}; then
          if [[ $(which bat) ]] && [[ ! $(which batcat) ]]; then
            sudo ln -sf "$(which bat)" /usr/bin/batcat >/dev/null || echo -e '::error::No batcat installed Exiting';
            [[ ! $(which batcat) ]] && exit 1
            echo -e "\nalias batcat='bat'" | sudo tee -a ~/.bashrc >/dev/null;
            echo 'export BAT_THEME=ansi' | sudo tee -a ~/.bashrc >/dev/null;
          elif [[ ! $(which batcat) ]]; then
            sudo apt-get -yq install bat 2>&1 >/dev/null | sed '/Running/,/host./d' && echo -e "${text9}" || echo -e '::error::No batcat installed Exiting';
            [[ ! $(which batcat) ]] && exit 1
            echo 'export BAT_THEME=ansi' | sudo tee -a ~/.bashrc >/dev/null;
          fi;
        fi;
        echo "update=${{ inputs.update }}" >> "${GITHUB_ENV}";
        if [[ -d '/usr/local/bin' ]]; then
          echo '/usr/local/bin' >> "${GITHUB_PATH}";
        fi;
        if [[ -d "${HOME}/.local/bin" ]]; then
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}";
        fi;
        if [[ -d "${HOME}/codechecker/build/CodeChecker/bin" ]]; then
          echo "${HOME}/codechecker/build/CodeChecker/bin" >> "${GITHUB_PATH}";
        fi;
        sudo apt-get --fix-broken install -yq 2>&1 >/dev/null | sed '/Running/,/host./d';
        echo '';
      shell: bash
      continue-on-error: false
      
    - name: Set Directory Base
      if: inputs.pattern != '' || inputs.filename != '' || inputs.project == 'true'
      run: |
        echo '';
        set -o pipefail
        repair_file='check-file-repaired.txt';
        repo=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
        echo 'database=database' >> "${GITHUB_ENV}";
        text1a="####################";
        text1b="DEFAULT DIRECTORY (GITHUB ROOT)";
        text1c="####################";
        text2a="####################";
        text2b="DEFAULT DIRECTORY (GITHUB WORKSPACE)";
        text2c="####################";
        text3a="####################";
        text3b="Store repaired files Enabled";
        text3c="####################";
        text4="Creating ${repair_file} for checked files";
        text5a="####################";
        text5b="Database Performance Mode Enabled";
        text5c="####################";
        text6="::error::Database not found exiting";
        text7a="####################";
        text7b="Searching directories for ${{ inputs.filename }}) file(s)";
        text7c="####################";
        text8a="####################";
        text8b="Searching ${{ inputs.filetype }} files for ${{ inputs.pattern }} match(s)";
        text8c="####################";
        text9a="####################";
        text9b="Searching all files for ${{ inputs.pattern }} match(s)";
        text9c="####################";
        text10a="#####################";
        text10b="\033[1m# CHECK FILE ACTION #\033[0m";
        text10c="#####################";
        chmod -R 0755 "${{ github.action_path }}/scripts";
        text() {
          local text="$1";
          echo -e "${text}";
        }
        if ${{ inputs.rootdir }}; then
          text "${text1a}";
          text "${text1b}";
          text "${text1c}";
          echo -e '\nAbsolute Path Mode';
          echo "base=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}";
          base="${GITHUB_WORKSPACE}";
        else
          text "${text2a}";
          text "${text2b}";
          text "${text2c}";
          echo -e "\nRelative Path Mode";
          echo 'base=.' >> "${GITHUB_ENV}";
          base='.'
        fi;
        if (${{ inputs.stored }} || ${{ env.update }}) && [[ -f "${repair_file}" ]]; then
          repaired="${repair_file}";
          if [[ -f ${repaired} ]]; then
            text "\n${text3a}";
            text "${text3b}";
            text "${text3c}";
          else
            text "\n${text4a}";
            text "${text4b}";
            text "${text4c}";
            date '+%Y%m%d' > "${repaired}" || echo -e "::warning::${repaired} backup file not found";
          fi;
        fi;
        if ${{ inputs.database }}; then
          sudo find "${base}" -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -type f -print | sort -t/ -k1.2 > 'database';
          if [[ -s 'database' ]]; then
            text "\n${text5a}";
            text "${text5b}";
            text "${text5c}";
            echo 'database=database' >> "${GITHUB_ENV}";
          else
            text "\n${text5a}";
            text "${text6}";
            text "${text5c}";
          fi;
        fi;
        if ${{ inputs.filename != '' }}; then
          text "\n${text7a}";
          text "${text7b}";
          text "${text7c}";
        fi;
        if ${{ inputs.pattern != '' }} && ${{ inputs.filetype != '' }}; then
          text "\n${text8a}";
          text "${text8b}";
          text "${text8c}";
        elif ${{ inputs.pattern != '' }}; then
          text "\n${text9a}";
          text "${text9b}";
          text "${text9c}";
        fi;
        dirname=${{ inputs.dirname }};
        echo "dirname=${dirname}" >> "${GITHUB_ENV}";
        if ${{ inputs.project }} && ${{ inputs.filename != '' }} && ${{ inputs.analyzer > '0' }}; then
          text "::warning:: project:true and filename:set both enabled auto sets analyzer:0 to disable\nTo remove this warning use ( analyzer: 0 )\n";
          echo "analyzer=0" >> "${GITHUB_ENV}";
        else
          echo "analyzer=${{ inputs.analyzer }}" >> "${GITHUB_ENV}";
        fi;
        src=$(ls .);
        type_count=0
        total_files=$(find -type f | grep -v '\.git/.' | wc -l);
        file_type0=$(find -type f -name "*.${{ inputs.filetype }}" | grep -v '\.git/.' | wc -l);
        file_type1=$(find -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.c++' -o -name '*.tpp' \) | grep -v '\.git/.' | wc -l);
        file_type2=$(find -type f \( -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.h++' \) | grep -v '\.git/.' | wc -l);
        percentage0=$(echo "scale=2; (${file_type0:-0} / ${total_files:-0}) * 100" | bc);
        percentage1=$(echo "scale=2; (${file_type1:-0} / ${total_files:-0}) * 100" | bc);
        percentage2=$(echo "scale=2; (${file_type2:-0} / ${total_files:-0}) * 100" | bc);
        include_dirs=$(find -type d -name 'include' -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | wc -l);
        file_count() {
          find -type f | grep -iEo '\_[[:alnum:]]+$|\-[[:alnum:]]+$|\.[[:alnum:]]+$|[[:alnum:]]+$' | tr -d '_\-\.' | sort | uniq -c | sed 's/^ *//' | while IFS= read -r file; do
            echo "${file} files"
          done;
        }
        directory() {
          for dir in ${src[@]}; do
            if [ -d "${dir}" ]; then
              count=$(find "${dir}" -type f | wc -l);
              echo "${dir}: ${count} files";
             fi;
          done;
        }
        file_types() {
          type_count=0
          while IFS= read -r file; do
            type_count=$(expr ${type_count} + 1);
          done < <(file_count);
          echo "${type_count}";
        }     
        if ${{ inputs.project }} && [[ "$(directory)" ]]; then
          echo -e "\n#####################\nProject Source Directories:\n#####################\n\n$(directory)";
        fi;
        if ${{ inputs.project }} && [[ "$(file_count)" ]]; then
          echo -e "\n#####################\nProject File Types:\n#####################\n\n$(file_count)";
        fi;
        if [[ "$(file_types)" ]]; then
          echo -e "\n#####################\nDifferent File Types: \033[1m$(file_types)\033[0m\n#####################";
        fi;
        if [[ "${include_dirs}" ]]; then
          echo -e "\n#####################\nTotal Include Directories: \033[1m${include_dirs}\033[0m\n#####################";
        fi;
        if [[ "${total_files:-0}" > '0' ]] && ${{ inputs.filetype != '' }}; then
          echo -e "\nThe total percentage of ${{ inputs.filetype }} files is: \033[1m${percentage0:-0}%\033[0m";
          echo -e "\nThe total percentage of header files is: \033[1m${percentage2:-0}%\033[0m";
          echo -e "\n#####################\nRepository: \033[1m${repo}\033[0m\n#####################\n\nProject has \033[1m${total_files}\033[0m files total";
        elif [[ "${total_files:-0}" > '0' ]]; then
          echo -e "\nThe total percentage of c/c++ files is: \033[1m${percentage1:-0}%\033[0m";
          echo -e "\nThe total percentage of header files is: \033[1m${percentage2:-0}%\033[0m";
          echo -e "\n#####################\nRepository: \033[1m${repo}\033[0m\n#####################\n\nProject has \033[1m${total_files}\033[0m files total";
        else
          echo -e "\n#####################\n::error::Repository: ${repo} files missing? Exiting....\n#####################\n";
        fi;
        text "\n${text10a}" 2>/dev/null;
        text "${text10b}" 2>/dev/null;
        text "${text10c}\n" 2>/dev/null;
        if ${{ inputs.build > '0' }}; then
          echo 'github_build_project=true' >> "${GITHUB_ENV}";
        fi;
        echo "github_repository=${repo}" >> "${GITHUB_ENV}";
        echo 'file_fixed=0' >> "${GITHUB_ENV}";
        echo 'file_found=0' >> "${GITHUB_ENV}";
        echo 'file_error=0' >> "${GITHUB_ENV}";
        echo 'file1_parted=0' >> "${GITHUB_ENV}";
        echo 'file2_parted=0' >> "${GITHUB_ENV}";
        echo 'build_cache=false' >> "${GITHUB_ENV}";
      shell: bash
      continue-on-error: false

    - name: Check Project
      if: inputs.project == 'true'
      run: |
        export WITH_TIDY=1
        export LLVM_ENABLE_THREADS=ON
        export CMAKE_EXPORT_COMPILE_COMMANDS=ON
        export ALLOW_MISSING_DEPENDENCIES=true
        export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
        export LC_ALL=C
        set +e
        repository=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
        project_log="${repository}_project.log";
        check_build=false
        file_type='c';
        github=${GITHUB_WORKSPACE};
        update=true
        fixed=false
        count1='count1.txt';
        count2='count2.txt';
        include_count=0
        process_input() {
          while IFS= read -r log; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${log}" | tee -a "${project_log}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${log}" >> "${project_log}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${log}";
            fi;
          done;
        }
        echo 'check_build=false' >> "${GITHUB_ENV}";
        if ! ${{ inputs.update }}; then
          echo 'update=false' >> "${GITHUB_ENV}";
          update=false
        fi;
        if ${{ inputs.filetype != 'none' }}; then
          file_type="${{ inputs.filetype }}";
        fi;
        echo "filetype=${file_type}" >> "${GITHUB_ENV}";
        if [[ -d "${{ env.base }}" ]]; then
          clang_tidy_version="$(clang-tidy --version)";
          clang_version="$(clang --version)";
          verify_config="$(clang-tidy --verify-config)";
          cmake_version="$(cmake --version)";
          compile_json='build/compile_commands.json';
          clang_checks="$(clang-tidy --list-checks)";
          gcc_version="$(gcc --version)";
          gpp_version="$(g++ --version)";
          cmake_list='CMakeLists.txt';
          clang_file='parameter-file';
          clang_tidy='.clang-tidy';
          clangd_tidy='/home/runner/.local/bin/clangd-tidy';
          clang_includes='check-file-includes.txt';
          if ${{ env.dirname != '' }}; then
            echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################" | process_input;
          else
            echo -e "\n####################\nWorkspace Folder: ${repository}\n####################" | process_input;
          fi;
          echo -e "\n####################\nProject Build: ${{ github.repository }}\n####################" | process_input;
          echo -e "\n####################\nCompiler: ${gcc_version}\n####################" | process_input;
          echo -e "\n####################\nCompiler: ${gpp_version}\n####################" | process_input;
          echo -e "\n####################\nCompiler: ${clang_version}\n####################" | process_input;
          echo -e "\n####################\nBuilder: ${cmake_version}\n####################" | process_input;
          if ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }} || ${{ inputs.analyzer == '4' }}; then
            codechecker_version=$(CodeChecker version);
            echo -e "\n####################\nCodeChecker: ${codechecker_version}\n####################" | process_input;
          fi;
          if ${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}; then
            deheader_version=$(deheader --version);
            echo -e "\n####################\nDeheader: ${deheader_version}\n####################" | process_input;
          fi;
          if ${{ inputs.analyzer == 3 }}; then
            clangd_version=$(clangd-tidy --version);
            echo -e "\n####################\nClangd-Tidy: ${clangd_version}\n####################" | process_input;
          fi;
          echo -e "\n####################\nClang-Tidy: ${clang_tidy_version}\n####################" | process_input;
          echo -e "\n####################\nCLANG TIDY: ${verify_config}\n####################" | process_input;
          if ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }} || ${{ inputs.analyzer == '4' }}; then
            codechecker_analyzers=$(CodeChecker checkers | grep -B 1 -m 50 "enable" | grep -v "enable");
            echo -e "\n####################\n\tCODECHECKER OPTIONS\n####################\n\n${codechecker_analyzers}" | process_input;
          fi;
          echo -e "\n####################\n\tCLANG OPTIONS\n####################\n\n${clang_checks}" | process_input;
          echo -e "\n####################\nChecking Repository ${{ env.base }}\n####################" | process_input;
          echo -e "\n####################\nChecking for ${file_type} files\n####################" | process_input;
          source_dirs() {
            find -not \( -path '*/.github' -prune -o -path '*/.git' -prune \) -type d -maxdepth 1 -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r dir; do
              if [[ "${dir}" != '.' ]]; then
                echo -n "${dir#./} ";
              fi;
            done;
          }
          cmake_includes() {
            include_count_extra='0';
            include_count='0';
            header_source=$(find "${{ env.base }}" -not \( -path '*/.github' -prune -o -path '*/.git' -prune \) -type d \( -name 'android' -o -name 'acpi' -o -name 'api' -o -name 'asm' -o -name 'babeltrace' -o -name 'block' -o -name 'boardcom' -o -name 'core' -o -name 'crypto' -o -name 'drm' -o -name 'drivers' -o -name 'elfutils' -o -name 'engine' -o -name 'fs' -o -name 'generated' -o -name 'glade' -o -name 'gpu' -o -name 'gxio' -o -name 'helpers' -o -name 'hv' -o -name 'idle_monitor' -o -name 'inc' -o -name 'include' -o -name 'internal' -o -name 'kwregs' -o -name 'kutf' -o -name 'lib' -o -name 'liblockdep' -o -name 'linux' -o -name 'mach' -o -name 'media' -o -name 'mtk' -o -name 'mt-plat' -o -name 'net' -o -name 'nvif' -o -name 'pci' -o -name 'sound' -o -name 'subcmd' -o -name 'subdev' -o -name 'symbol' -o -name 'sysdep' -o -name 'traceevent' -o -name 'ttm' -o -name 'tests' -o -name 'uapi' -o -name 'util' \) -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null);
            while IFS= read -r dir; do
              if [[ -d "${dir}" ]]; then
                include_count=$((include_count + 1));
                echo "${include_count}" > "${count1}";
                echo -e "-I${dir}" >> 'compile_flags.txt';
                echo -n "${dir};";
              fi;
            done <<< "${header_source}";
            if [[ -s "${clang_includes}" ]] && ${{ inputs.include }}; then
              while IFS= read -r include; do
                include_count_extra=$((include_count_extra + 1));
                echo "${include_count_extra}" > "${count2}";
                echo -e "-I${include}" >> 'compile_flags.txt';
                echo -n "${include#./};";
              done < "${clang_includes}";
            fi;
          }
          clang_includes() {
            find "${{ env.base }}" -not \( -path '*/.github' -prune -o -path '*/.git' -prune \) -type d -name 'include' -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r include; do
              if [[ -d "${include}" ]]; then
                echo -e "--extra-arg=-I${include#./}";
              fi;
            done;
          }
          source_files() {
            find "${{ env.base }}" -not \( -path '*/CMakeFiles' -prune -o -path '*/build' -prune -o -path '*/.git' -prune -o -path '*/.github' -prune \) -type f -name "*.${file_type}" -print | awk '{ print length($0), $0 }' | sort -n | cut -d' ' -f 2- 2>/dev/null | while IFS= read -r file; do
              echo -e "${file#./}";
            done;
          }
          mkdir -p build/fixes
          echo 'build_error=false' >> "${GITHUB_ENV}";
          echo "github_source_dirs=$(source_dirs)" >> "${GITHUB_ENV}";
          echo "github_source_files=false" >> "${GITHUB_ENV}";
          echo 'github_include_dirs=false' >> "${GITHUB_ENV}";
          if [[ "$(source_files)" ]]; then
            echo "github_source_files=true" >> "${GITHUB_ENV}";
          fi;
          if [[ "$(cmake_includes)" ]]; then
            echo "github_include_dirs=$(cmake_includes)" >> "${GITHUB_ENV}";
            if [[ -s "${count2}" ]]; then
              echo -e "\n####################\n\tcheck-file added $(cat ${count1}) header include directories\n\tcheck-file updated $(cat ${count2}) additional header directories\n####################" | process_input;
            else
              echo -e "\n####################\n\tcheck-file added $(cat ${count1}) header include directories\n####################" | process_input;
            fi;
          fi;
          if [[ -f "${clang_tidy}" ]]; then
            echo -e '\n####################\n\t.clang-tidy found continuing...\n####################' | process_input;
          fi;
          if [[ -f "${cmake_list}" ]]; then
            echo -e '\n####################\n\tCMakeLists.txt found continuing...\n####################' | process_input;
          fi;
          if [[ -d 'build' ]]; then
            echo -e '\n####################\n\tbuild directory created continuing...\n####################\n' | process_input;
            if [[ "$(source_dirs)" ]] && [[ "$(cmake_includes)" ]]; then
              cmake -S . -DPROJECT_INCLUDE_DIRS="$(cmake_includes)" -DPROJECT_SRC_DIRS="$(source_dirs)" -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build | process_input || echo "::warning:: ( $? ) cmake missing or malformed CMakeList.txt (?)" | process_input;
            else
              cmake -S . -DGITHUB_PROJECT_NAME="${repository}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON build | process_input || echo "::warning:: ( $? ) cmake missing or malformed CMakeList.txt (?)" | process_input;
            fi;
            if [[ "${PIPESTATUS[0]}" == '0' ]]; then
              if ${{ inputs.upload }}; then
                echo 'build_files=1' >> "${GITHUB_ENV}";
              fi;
            fi;
          fi;
          if [[ -e 'compile_commands.json' ]]; then
            echo -e '\n####################\n\tcompile_commands.json file symlinked continuing...\n####################' | process_input;
          fi;
          if [[ "${{ env.run_clang_tidy }}" ]] && ${{ env.analyzer == '1' }} && [[ -e 'compile_commands.json' ]]; then
            echo -e '\n####################\nRUN-CLANG-TIDY ANALYZING FILES\n####################\n' | process_input;
            { time "${{ env.run_clang_tidy }}" -p build -config-file "${clang_tidy}" -fix -export-fixes build/fixes -j "$(nproc --all)"; } 2>&1 | process_input;
            [[ $(whereis clang-format) ]] && [[ ! -f '.clang-format' ]] && clang-format -style=LLVM -dump-config > .clang-format | process_input;
            [[ $(whereis clang-apply-replacements) ]] && { time clang-apply-replacements build/fixes --format --style='.clang-format' --ignore-insert-conflict --remove-change-desc-files; } 2>&1 | process_input;
            if [[ -s "${project_log}" ]] && [[ $(grep -sE ' error:| Error:|Error while processing| ERROR:' "${project_log}") ]]; then
              echo -e "\n::notice::Errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
              echo 'build_error=true' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]]; then
              echo -e "\n::notice::No errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            fi;
          elif [[ ! "${{ env.run_clang_tidy }}" ]] && ${{ env.analyzer == '1' }} && [[ -e 'compile_commands.json' ]]; then
            echo -e "\n####################\n\t::error:: run-clang-tidy missing in repo Exiting...\n####################\n" | process_input;
          fi;
          if [[ -f "${clang_file}" ]] && ${{ env.analyzer == '2' }} && [[ -e 'compile_commands.json' ]]; then
            echo ' ' >> "${clang_file}";
            files_list=false
            if [[ "$(clang_includes)" ]] && [[ "$(source_files)" ]] ; then
              echo -e "\n####################\n\t${file_type} file(s) found continuing...\n####################" | process_input;
              clang_includes >> "${clang_file}" && source_files >> "${clang_file}" && files_list=true
            elif [[ "$(source_files)" ]]; then
              echo -e "\n####################\n\t${file_type} file(s) found continuing...\n####################" | process_input;
              source_files >> "${clang_file}" && files_list=true
            else	
              echo -e "\n::error::No ${file_type} files found searching repository\nExiting...\n" | process_input;
            fi;
            echo -e "\n####################\n\t${clang_file} found continuing...\n####################" | process_input;
            echo -e '\n####################\nCLANG-TIDY CONFIG CHECKED\n####################\n' | process_input;
            if [[ "${files_list}" ]]; then
              cp -vf "${clang_file}" 'build/check-source-files.txt' 2>/dev/null;
              echo -e '\n####################\nCLANG-TIDY ANALYZING FILES\n####################\n' | process_input;
              { time clang-tidy @parameter-file; } 2>&1 | process_input;
              if [[ -s "${project_log}" ]] && [[ $(grep -sE ' error:| Error:|Error while processing| ERROR:' "${project_log}") ]]; then
                echo -e "\n::notice::Errors found checking project files" | process_input;
                check_build=true
                echo 'check_build=true' >> "${GITHUB_ENV}";
                echo 'build_error=true' >> "${GITHUB_ENV}";
              elif [[ -s "${project_log}" ]]; then
                echo -e "\n::notice::No errors found checking project files" | process_input;
                check_build=true
                echo 'check_build=true' >> "${GITHUB_ENV}";
              fi;
            fi;
          elif [[ ! -e "${clang_file}" ]] && ${{ env.analyzer == '2' }} && [[ -e 'compile_commands.json' ]]; then
            echo -e "\n####################\n\t::error:: parameter-file missing in repo Exiting...\n####################\n" | process_input;
          fi;
          if [[ -f "${clangd_tidy}" ]] && ${{ env.analyzer == '3' }} && [[ -e 'compile_commands.json' ]]; then
            echo -e '\n####################\nCLANGD-TIDY ANALYZING FILES\n####################\n' | process_input;
            { time find "${{ env.base }}" -not \( -path "*/CMakeFiles" -prune -o -path "*/build" -prune -o -path "*/.git" -prune -o -path "*/.github" -prune \) -type f -name "*.${file_type}" -print0 | sort -nz | cut -d' ' -f 2- 2>/dev/null | xargs -0 -r -n 100 -P "$(nproc --all)" bash -c 'clangd-tidy "$@" -p build/ -j "$(nproc --all)" --color always --tqdm -- -I"include/" || true' bash; } 2>&1 | process_input;
            if [[ -s "${project_log}" ]] && [[ $(grep -sE ' error:| Error:|Error while processing| ERROR:' "${project_log}") ]]; then
              echo -e "\n::notice::Errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
              echo 'build_error=true' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]]; then
              echo -e "\n::notice::No errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            fi;
          elif [[ ! -e "${clangd_tidy}" ]] && ${{ env.analyzer == '3' }} && [[ -e 'compile_commands.json' ]]; then
            echo -e "\n####################\n\t::error::${clangd_tidy##/*} file missing in repo Exiting...\n####################\n" | process_input;
          fi;
          if [[ $(which CodeChecker) ]] && ${{ env.analyzer == '4' }} && [[ -e 'compile_commands.json' ]]; then
            echo -e '\n####################\n\tCODECHECKER ANALYZING FILES...\n####################\n' | process_input;
            sudo bash -c 'source ~/.bashrc';
            if [[ -e "/home/runner/codechecker/venv/bin/activate" ]]; then
              sudo bash -c 'source /home/runner/codechecker/venv/bin/activate'
            else
              echo -e "\nUnable to source ( /home/runner/codechecker/venv/bin/activate ) file\n" | process_input;
            fi;
            { time CodeChecker analyze ./build/compile_commands.json --enable sensitive --output ./reports && CodeChecker fixit --checker-name bugprone-suspicious-string-compare --apply ./reports && CodeChecker parse ./results &&  CodeChecker store ./results -n "${repository}"; } 2>&1 | process_input;
            if [[ -s "${project_log}" ]] && [[ $(grep -sE 'error:|Error:|Error while processing|ERROR:' "${project_log}") ]]; then
              echo -e "\n::notice::Errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
              echo 'build_error=true' >> "${GITHUB_ENV}";
            elif [[ -s "${project_log}" ]]; then
              echo -e "\n::notice::No errors found checking project files" | process_input;
              check_build=true
              echo 'check_build=true' >> "${GITHUB_ENV}";
            fi;
          elif [[ ! $(which CodeChecker) ]] && ${{ env.analyzer == '4' }} && [[ -e 'compile_commands.json' ]]; then
            echo -e "\n####################\n\t::error::CodeChecker not installed Exiting...\n####################\n" | process_input;
          fi;
          [[ -f 'compile_flags.txt' ]] && mv -f 'compile_flags.txt' 'build/';
        fi;
        echo '';
      shell: bash
      continue-on-error: true
      
    - name: Build Project
      if: inputs.project == 'true' && env.build_files == '1'
      run: |
        export LLVM_ENABLE_THREADS=ON
        export CMAKE_EXPORT_COMPILE_COMMANDS=ON
        export ALLOW_MISSING_DEPENDENCIES=true
        export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
        export WITH_TIDY=1
        export LC_ALL=C
        set +e
        compiler_list=$(dpkg --list | grep compiler | tr -d 'ii');
        repository=$(echo ${{ github.repository }} | cut -d'/' -f 2-);
        project_log="${repository}_project.log";
        check_build=false
        file_type='c';
        github=${GITHUB_WORKSPACE};
        update=true
        fixed=false
        count=1
        process_input() {
          while IFS= read -r log; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${log}" | tee -a "${project_log}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${log}" >> "${project_log}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${log}";
            fi;
          done;
        }
        if ! ${{ env.check_build }}; then
          echo 'check_build=false' >> "${GITHUB_ENV}";
        fi;
        if ! ${{ inputs.update }}; then
          echo 'update=false' >> "${GITHUB_ENV}";
          update=false
        fi;
        if ${{ inputs.filetype != 'none' }}; then
          file_type="${{ inputs.filetype }}";
        fi;
        echo "filetype=${file_type}" >> "${GITHUB_ENV}";
        if [[ -d 'build' ]] && ${{ inputs.build == '1' }} && ${{ env.build_error == 'false' }}; then
          echo -e '\n####################\n\t[1] CodeChecker building project from source files...(dry-run -1)\n####################\n' | process_input;
          sudo bash -c 'source ~/.bashrc';
          if [[ -e "/home/runner/codechecker/venv/bin/activate" ]]; then
            sudo bash -c 'source /home/runner/codechecker/venv/bin/activate'
          else
            echo -e "\nUnable to source ( /home/runner/codechecker/venv/bin/activate ) file\n" | process_input;
          fi;
          { time CodeChecker check -b "make clean && make -v -n -k -j $(nproc --all) -f ${{ inputs.makefile }}" -o ./results; } 2>&1 | process_input;
          if [[ -s "${project_log}" ]] && [[ $(grep -sE ' error:| Error:|Error while processing| ERROR:' "${project_log}") ]]; then
            echo -e "\n::notice::Errors found checking building files" | process_input;
            check_build=true
            echo 'check_build=true' >> "${GITHUB_ENV}";
          elif [[ -s "${project_log}" ]]; then
            echo -e "\n::notice::No errors found building project files" | process_input;
            check_build=true
            echo 'check_build=true' >> "${GITHUB_ENV}";
          fi;
          if ${{ inputs.upload }}; then
            echo 'build_files=1' >> "${GITHUB_ENV}";
          fi;
        elif [[ ! -d 'build' ]] && ${{ inputs.build == '1' }}; then
          echo -e "\n####################\n\t::error:: build directory missing in repo Exiting...\n####################\n" | process_input;
          exit 1
        fi;
        if [[ -d 'build' ]] && ${{ inputs.build == '2' }} && ${{ env.build_error == 'false' }}; then
          echo -e '\n####################\n\tCodeChecker building compile_commands.json & project sources...(build -2)\n####################\n' | process_input;
          sudo bash -c 'source ~/.bashrc';
          if [[ -e "/home/runner/codechecker/venv/bin/activate" ]]; then
            sudo bash -c 'source /home/runner/codechecker/venv/bin/activate'
          else
            echo -e "\nUnable to source ( /home/runner/codechecker/venv/bin/activate ) file\n" | process_input;
          fi;
          [[ -e '/build/compile_commands.json' ]] && rm -vf ./build/compile_commands.json | process_input;
          { time CodeChecker log --build "make -v -f ${{ inputs.makefile }} -j $(nproc --all)" --output ./build/compile_commands.json; } 2>&1 | process_input;
          if [[ -s "${project_log}" ]] && [[ $(grep -sE ' error:| Error:|Error while processing| ERROR:' "${project_log}") ]]; then
            echo -e "\n::notice::Errors found building project files" | process_input;
            check_build=true
            echo 'check_build=true' >> "${GITHUB_ENV}";
          elif [[ -s "${project_log}" ]]; then
            echo -e "\n::notice::No errors found building project files" | process_input;
            check_build=true
            echo 'check_build=true' >> "${GITHUB_ENV}";
          fi;
          if ${{ inputs.upload }}; then
            echo 'build_files=1' >> "${GITHUB_ENV}";
         
          fi;
        elif [[ ! -d 'build' ]] && ${{ inputs.build == '2' }}; then
          echo -e "\n####################\n\t::error:: build directory missing in repo Exiting...\n####################" | process_input;
          exit 1
        fi;
        if [[ -d 'build' ]] && ${{ inputs.build == '3' }} && ${{ env.build_error == 'false' }}; then
          echo -e '\n####################\n\tDeheader analyze sources includes...(dry-run -3)\n####################\n' | process_input;
          sudo bash -c 'source ~/.bashrc'
          { time deheader -m "make -v 3 -n -j $(nproc --all) -f ${{ inputs.makefile }}" -r -v; } 2>&1 | process_input;
          if [[ -s "${project_log}" ]] && [[ $(grep -sE ' duplicates|inclusion' "${project_log}") ]]; then
            echo -e "\n::notice::duplicate includes found building project files" | process_input;
            check_build=true
            echo 'check_build=true' >> "${GITHUB_ENV}";
          elif [[ -s "${project_log}" ]]; then
            echo -e "\n::notice::No duplicate includes found checking project files" | process_input;
            check_build=true
            echo 'check_build=true' >> "${GITHUB_ENV}";
          fi;
          if ${{ inputs.upload }}; then
            echo 'build_files=1' >> "${GITHUB_ENV}";
          fi;
        elif [[ ! -d 'build' ]] && ${{ inputs.build == '3' }}; then
          echo -e "\n####################\n\t::error:: build directory missing in repo Exiting...\n####################" | process_input;
          exit 1
        fi;
        if [[ -d 'build' ]] && ${{ inputs.build == '4' }} && ${{ env.build_error == 'false' }}; then
          echo -e '\n####################\n\tDeheader analyze & repair sources includes...(build -4)\n####################\n' | process_input;
          sudo bash -c 'source ~/.bashrc'
          { time deheader -m "make -v 2 -f ${{ inputs.makefile }}" -r -v; } 2>&1 | process_input;
          if [[ -s "${project_log}" ]] && [[ $(grep -sE ' duplicates|inclusion' "${project_log}") ]]; then
            echo -e "\n::notice::duplicate includes found building project files" | process_input;
            check_build=true
            echo 'check_build=true' >> "${GITHUB_ENV}";
          elif [[ -s "${project_log}" ]]; then
            echo -e "\n::notice::No duplicate includes found checking project files" | process_input;
            check_build=true
            echo 'check_build=true' >> "${GITHUB_ENV}";
          fi;
          if ${{ inputs.upload }}; then
            echo 'build_files=1' >> "${GITHUB_ENV}";
          fi;
        elif [[ ! -d 'build' ]] && ${{ inputs.build == '4' }}; then
          echo -e "\n####################\n\t::error:: build directory missing in repo Exiting...\n####################\n" | process_input;
          exit 1
        fi;
        if [[ -s "${project_log}" ]]; then
          echo -e "\n####################\n\t${project_log##*/} file found continuing...\n####################" | process_input;
          deheader_duplicates=$(grep -sEc 'duplicates' "${project_log}");
          deheader_inclusion=$(grep -sEc 'inclusion' "${project_log}");
          deheader_removed=$(grep -sEc 'remove' "${project_log}");
          codechecker_success=$(grep -sFc 'successfully' "${project_log}");
          codechecker_errors=$(grep -sFc 'Error while processing' "${project_log}");
          clang_replacements=$(find -path '*/fixes/*' -type f -name "*.yaml" -print | xargs -r -P "$(nproc --all)" -n 500 grep -F 'Replacements:' | grep -v -c '[\[\]]');
          clang_files_missing=$(grep -sFc 'file not found' "${project_log}");
          clang_files_list=$(grep -sF 'file not found' "${project_log}" | awk '{print $3}' | awk '!seen[$0]++');
          clang_warnings=$(grep -sEo '[1-9] warnings generated|1 warning generated' "${project_log}" | cut -d ' ' -f1 | awk '{sum += $1} END {print sum}');
          clang_errors=$(grep -sEo '[1-9] errors generated|1 error generated' "${project_log}" | cut -d ' ' -f1 | awk '{sum += $1} END {print sum}');
          clang_fixits=$(grep -sEc 'fixit|fix-its|Fixit|Fix-Its|FIXIT|FIX-ITS' "${project_log}");
          clang_notes=$(grep -sEc 'note:|Note:|NOTE:' "${project_log}");
          located_count=0
          missing_count=0
          file_count=0
          if [[ "${clang_warnings:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::⚠️ check-file found ${clang_warnings}️ warnings in ${file_type} file(s) checked. [Hints] Try using (warnings-as-errors) for possible errors.\n####################" | process_input;
          fi;
          if [[ "${codechecker_success:-0}" > '0' ]] && (${{ inputs.analyzer > '0' }} || ${{ inputs.build == '1' }} || ${{ inputs.build == '2' }}); then
            echo -e "\n####################\n::notice::✅ check-file checked ${codechecker_success} ${file_type} file(s) successfully without issues. [Hints] No check require for those files.\n####################" | process_input;
          fi;
          if [[ "${clang_errors:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::🚫 check-file found ${clang_errors} errors in ${file_type} file(s) checked. [Hints] Try using different (analyzer: 1, 2, or 4) for possible error fixes.\n####################" | process_input;
          fi;
          if [[ "${clang_fixits:-0}" > '0' ]] && ${{ inputs.analyzer > '0' }}; then
            echo -e "\n####################\n::notice::✅ check-file applied ${clang_fixits} fix-its to ${file_type} file(s) checked. [Hints] Try using (update: true) for updating remote repository.\n####################" | process_input;
            fixed=true
          fi;
          if [[ "${clang_notes:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::⚠️ check-file added ${clang_notes} notes on ${file_type} file(s) checked. [Hints] Notes are fix suggestions for files that should be addressed before compiling.\n####################" | process_input;
          fi;
          if [[ "${clang_replacements:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::✅ check-file applied ${clang_replacements} clang replacement fixes for ${file_type} file(s) checked. [Hints] Clang export fixes are stored in build/fixes for download. Try using different (analyzer: 1, 2, or 4) for more possible error fixes.\n####################" | process_input;
          fi;
          if [[ "${deheader_removed:-0}" > '0' ]] && (${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}); then
            echo -e "\n####################\n::notice::✅ check-file removed ${deheader_removed} extra inclusions in ${file_type} file(s) checked. [Hints] Try manually removing any extra includes in files before compiling.\n####################" | process_input;
            fixed=true
          fi;
          if [[ "${deheader_duplicates:-0}" > '0' ]] && (${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}); then
            echo -e "\n####################\n::notice::🚫 check-file found ${deheader_duplicates} duplicates or colliding inclusions in ${file_type} file(s) checked. [Hints] Try using (analyzer: 1, 2, or 4) for possible error fixes.\n####################" | process_input;
          elif [[ "${deheader_inclusion:-0}" > '0' ]] && (${{ inputs.build == '3' }} || ${{ inputs.build == '4' }}); then
            echo -e "\n####################\n::notice::🚫 check-file found ${deheader_inclusion} extra inclusions in ${file_type} file(s) checked. [Hints] Try using (update: true) if headers were fixed to update remote repository.\n####################" | process_input;
          fi;
          if [[ "${clang_files_missing:-0}" > '0' ]]; then
            echo -e "\n####################\n::notice::❌ check-file discovered ${clang_files_missing} missing include files in ${file_type} file(s) checked. [Hints] Files may be there yet not included and many duplicate files.\n####################" | process_input;
            echo -e "\n####################\nMISSING FILES:\n####################\n\n${clang_files_list}" | process_input;
            echo -e "\n####################\nCHECK-FILE AUTO LOCATE FILES IN: ${{ env.base }}\n####################\n" | process_input;
            while IFS= read -r missing_file; do
              echo "Locating missing ${missing_file} file ...." | process_input;
              path1="${missing_file//\'/}";
              path2="${path1%/*}";
              path3="${path2#../}";
              path="${path3#..}";
              file1="${missing_file//\'/}";
              file2="${file1##*/}";
              file3="${file2#../}";
              file="${file3#..}";
              if [[ "${path}" == "${file}" ]]; then
                locate=$(find "${{ env.base }}" -type f -name "${file}" -print);
                if [[ "${locate}" ]]; then
                  located_count=$((located_count + 1));
                  echo "Location found @: ${locate}  [ ✅ ]" | process_input;
                  echo "${locate%/*}" >> 'check-file-includes.txt';
                else
                  missing_count=$((missing_count + 1));
                  echo "Cannot locate missing file ${file}  [ ❌ ]" | process_input;
                fi;
              elif [[ "${path}" != "${file}" ]]; then
                locate=$(find "${{ env.base }}" -regextype posix-extended -regex ".*/${path}/${file}" -print);
                if [[ "${locate}" ]]; then
                  located_count=$((located_count + 1));
                  echo "Location found @: ${locate}  [ ✅ ]" | process_input;
                  echo "${locate%/*}" >> 'check-file-includes.txt'
                else
                  missing_count=$((missing_count + 1));
                  echo "Cannot locate missing file ${path}/${file}  [ ❌ ]" | process_input;
                fi;
              else
                missing_count=$((missing_count + 1));
                echo "Location unknown for ${missing_file} file  [ ❌ ]" | process_input;
              fi;
              file_count=$((file_count + 1));
            done <<< "${clang_files_list}";
            found=false
            if [[ -s 'check-file-includes.txt' ]]; then
              awk '!/\.h$|\.c$/ { sub(/\/$/, ""); print }' 'check-file-includes.txt' > 'check-file-includes-tmp.txt';
              awk '!seen[$0]++' 'check-file-includes-tmp.txt' > 'check-file-includes.txt' && cp -f 'check-file-includes.txt' 'build/check-file-includes.txt' && echo -e "\n::notice::✅ check-file located ${located_count} files. ${missing_count} missing out of ${file_count} total!!!\n\nDuplicate paths removed from check-file-includes.txt\nFound include directories added to build/check-file-includes.txt\nTo get the file set option ( upload: true )\nRetrive file from artifacts zip download\nThen add it to your repository root before re-check!!!\n\nYou can also set ( cache: true )\nFeature caches local project current state\nThis will store the missing files found list during auto detect mode\nWhich will auto update included directories for checking during next re-check!!!" | process_input && found=true;
            fi;
          fi;
          if [[ ${update} ]] && ${{ env.analyzer == '2' }}; then
            echo -e "\nPARAMETERS: $(rm -vf ${clang_file} 2>/dev/null)" | process_input;
          fi;
          echo -e "\n####################\n\tINSTALLED COMPILERS\n####################\n\n${compiler_list}" | process_input;
          if [[ "${fixed}" ]]; then
            echo "file_fixed=1" >> "${GITHUB_ENV}";
          fi;
          echo "github_include_dirs=false" >> "${GITHUB_ENV}";
          if [[ "${found}" ]]; then
            echo "github_include_dirs=true" >> "${GITHUB_ENV}";
          fi;
          if [[ "${check_build}" ]]; then
            echo -e '\n####################\n\tProject Checked Exiting...\n####################\n' | process_input;
          else
            echo -e '\n####################\n\tProject Not Checked Exiting...\n####################\n' | process_input;
          fi;
        else
          echo -e '::error::Missing/Bad source directory' | process_input;
        fi;
      shell: bash
      continue-on-error: true

    - name: Check & Repair (Clang-tools)
      if: inputs.filename != ''
      run: |
        export LC_ALL=C
        SAVEIFS=${IFS}
        include_count=1
        include_total=1
        compile_json='compile_commands.json';
        build_cache='build_cache';
        clang_file='.clang-tidy';
        repaired='check-file-repaired.txt';
        file_count=1
        file_name="${{ inputs.filename }}";
        file_type="${file_name##*.}";
        cppchecks='.cppcheck';
        error_log="${{ inputs.filename }}_error.log";
        checked=false
        count2=0
        github=${GITHUB_WORKSPACE};
        process_input() {
          while IFS= read -r log; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${log}" | tee -a "${error_log}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${log}" >> "${error_log}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${log}";
            fi;
          done;
        } 2>&1;
        if ${{ inputs.database }}; then
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(grep -sF "/${{ inputs.filename }}" "${{ env.database }}" 2>/dev/null);
            echo -e "\n####################\nLiteral String Pattern Matching Active\n####################\n" | process_input;
          else
            regex="\${{ inputs.filename }}$";
            files=$(grep -sE "${regex}" "${{ env.database }}" 2>/dev/null);
            echo -e "\n####################\nExtended Regex Pattern Matching Active\n####################\n" | process_input;
          fi;
        else
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(sudo find ${{ env.base }} -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -type f \( -path "*/${{ env.dirname }}/*" -o -path "*/*/*" \) -name "${{ inputs.filename }}" -print);
          else
            files=$(sudo find ${{ env.base }} -not \( -path "*/build/*" -prune -o -path "*/.git/*" -prune \) -type f \( -path "*/${{ env.dirname }}/*" -o -path "*/*/*" \) -name "*${{ inputs.filename }}" -print);
          fi;
        fi;
        if [[ $(echo "${file_type}" | egrep "^c$|^c.$|^c..$|^h$|^h.$|^h..$|^t$|^t.$|^t..$") ]] && [[ -n ${files} ]]; then
          echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################\n" | process_input;
          if [[ -f "${clang_file}" ]] && ${{ inputs.repair }}; then
            echo -e '\n####################\n\t.clang-tidy found continuing...\n####################\n' | process_input
          elif [[ ! -f "${clang_file}" ]] && ${{ inputs.repair }}; then
            echo -e "\n####################\n::error:: .clang-tidy not found exiting...\n####################\n" | process_input;
            exit 1
          fi;
          if [[ -f "${compile_json}" ]] && ! ${{ inputs.include }}; then
            echo -e '\n####################\n\tcompile_commands.json found continuing...\n####################\n' | process_input 
          elif [[ ! -f "${compile_json}" ]] && ! ${{ inputs.include }}; then
            echo -e "\n####################\n::error:: compile_commands.json not found\nUse inputs.project: true to create it exiting...\n####################\n" | process_input;
            exit 1
          fi;
          if [[ -f "${cppchecks}" ]]; then
             echo -e "\n####################\n\t${cppchecks} found continuing...\n####################\n" | process_input;
             cppchecks=$(cat ${cppchecks} | tr -d ' \n');
          else
             cppchecks=all
          fi;
          if [[ -d "${build_cache}" ]]; then
             echo -e '\n####################\n\tbuild_cache found continuing...\n####################\n' | process_input;
             echo 'build_cache=true' >> "${GITHUB_ENV}";
          else
             mkdir -p "${build_cache}";
          fi;
          if ${{ inputs.content }}; then
            echo -e "\n# Found File Path(s)\n" | process_input;
            awk 'NR % 10 == 1 {print "---- Lines " NR " to " NR+9 " ----"} {print}' "${files}" | process_input;
            echo -e '\t--------------------\n' | process_input
          fi;
          { time for file in ${files[@]}; do
            search_path="${file}";
            check_date=$(grep -sF "${search_path}" "${repaired}" | cut -d' ' -f 2-);
            count1=$((file_count++));
            echo -e "\n####################\n\tFILE PATH (${count1})\n####################\n" | process_input;
            echo "$(dirname ${file})";
            if ${{ inputs.content }}; then
              echo -e "\n####################\n\tFILE CONTENT (${count1})\n####################\n" | process_input;
              batcat --theme=ansi --paging=never --show-all --color=always --style=full "{file}";
            fi;
            if ${{ inputs.include }}; then
              IFS=$'\n';
              includes=$(sudo find $(dirname ${file}) -name $(basename ${file}) -exec sed -n 's/^#include <\(.*\)>/\1/p; s/^#include "\(.*\)"/\1/p' "{}" \;);
              include1='include_file1.txt';
              include2='include_file2.txt';
              if [[ ${includes} ]]; then
                echo -e "\n# Found Include File(s):\n${includes}\n" | process_input;
                echo > "${include1}";
                for i in ${includes[@]}; do
                  final="${i}";
                  count2=$((include_count++));
                  count3=$((include_total++));
                  header=$(sudo find . -type f \( -path "*/$(dirname ${i})/*" -o -path "*/$(dirname ${file})/*" -o -path "*/*/*" \) -name "$(basename ${i})" -print -quit);
                  if [[ -f "${header}" ]]; then
                    echo "$(dirname ${header#./})" >> "${include1}";
                  else
                    echo -e "\n::notice:: include source file ${i} is missing\n" | process_input;
                  fi;
                done;
                IFS=${SAVEIFS};
                if [[ -f "${include1}" ]]; then
                  awk '!seen[$0]++' "${include1}" > "${include2}";
                fi;
                if [[ -f "${include2}" ]]; then
                  if ${{ inputs.repair }}; then
                    if ${{ inputs.stored }} && ${{ env.update }} && [[ $(grep -sF "${search_path}" "${repaired}") ]]; then
                      echo -e "\n####################\nSTORED NOTHING TO REPAIR\n####################\n" | process_input;
                      echo -e "\n####################\nChecked on ${check_date}\nSkipping $(basename ${file})\n####################\n" | process_input;
                    elif ${{ inputs.stored }} && ${{ env.update }}; then
                      echo -e "\n\n####################\nDEHEADER & CLANG-TIDY FIX FILES ANALYZER (${count1})\n####################\n\n" | process_input;
                      if [[ $(echo "${file_type}" | egrep "^c$|^cc$") ]]; then
                        gcc -MM "${file}" | process_input || echo -e "::error:: ( $? ) & broken pipe" | process_input;
                      elif [[ $(echo "${file_type}" | egrep "^c..$") ]]; then
                        g++ -MM "${file}" | process_input || echo -e "::error:: ( $? ) & broken pipe" | process_input;
                      fi;
                      clang-tidy "${file}" --config-file="${clang_file}" --fix-errors --fix-notes -- -I"include/" | process_input || echo -e "::error:: ( $? )" | process_input;
                      if [[ -s "${error_log}" ]] && [[ ! $(grep -sE "${file}.*error:" "${error_log}") ]]; then
                        echo -e "\n####################\nSTORING NO ERRORS FOUND\n####################\n\n${file}\n" | process_input;
                      else
                        echo -e "\n####################\nSTORING FOUND ERROR(S) TO REPAIR\n####################\n" | process_input;
                        errors=true
                      fi;
                      echo "${file} $(date)" >> "${repaired}";
                      fixed=true
                    elif ! ${{ inputs.stored }} || ! ${{ env.update }}; then
                      echo -e "\n\n####################\nCLANG-TIDY FILES ANALYZER (${count1})\n####################\n\n" | process_input;
                      if [[ $(echo "${file_type}" | egrep "^c$|^cc$") ]]; then
                        gcc -MM "${file}" | process_input || echo -e "::error:: ( $? ) & broken pipe" | process_input;
                      elif [[ $(echo "${file_type}" | egrep "^c..$") ]]; then
                        g++ -MM "${file}" | process_input || echo -e "::error:: ( $? ) & broken pipe" | process_input;
                      fi;
                      clang-tidy "${file}" --config-file="${clang_file}" --fix-errors --fix-notes -- -I"include/" 2>/dev/null | process_input || echo -e "::error:: ( $? )" | process_input;
                      if [[ -s "${error_log}" ]] && [[ ! $(grep -sE "${file}.*error:" "${error_log}") ]]; then
                        echo -e "\n####################\nCHECK-FILE NO ERRORS FOUND ${file}\n####################\n" | process_input;
                      else
                        echo -e "\n####################\nCHECK-FILE FOUND ERROR(S) TO REPAIR\n####################\n" | process_input;
                        errors=true
                      fi;
                      fixed=true
                    fi;
                  else
                    echo -e "\n####################\nCPPCHECK INCLUDE FILE(S) ANALYZER (${count2})\n####################\n\nFinal File: ${final}\n\n" | process_input;
                    cppcheck --verbose --force --enable="${cppchecks}" --report-progress --suppress=* --suppress=checkersReport --includes-file="${include2}" "${file}" 2>/dev/null | process_input || echo -e "::error:: ( $? )" | process_input;
                    if [[ -s "${error_log}" ]] && [[ ! $(grep -sE "${file}.*error:" "${error_log}") ]]; then
                      echo -e "\n####################\nCHECK-FILE NO ERRORS FOUND ${file}\n####################\n" | process_input;
                    else
                      echo -e "\n####################\nCHECK-FILE FOUND ERROR(S)\n####################\n" | process_input;
                      errors=true
                    fi;
                  fi;
                fi;
              else
                echo -e "\n\n####################\nINCLUDE FILE(S) FOR $(basename ${file}) NOT PRESENT\n####################\n\n" | process_input;
              fi;
              echo -e "\n::notice:: Number of $(basename ${file}) include file(s): ${count2}\n" | process_input;
              include_count=1
            else
              if ${{ inputs.repair }}; then
                if ${{ inputs.stored }} && ${{ env.update }} && [[ $(grep -sF "${search_path}" "${repaired}") ]]; then
                  echo -e "\n####################\nSTORED NOTHING TO REPAIR\n####################\n" | process_input;
                  echo -e "\n####################\nChecked on ${check_date}\nSkipping $(basename ${file})\n####################\n" | process_input;
                elif ${{ inputs.stored }} && ${{ env.update }}; then
