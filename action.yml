              cmake --build build || echo "::error:: ( $? ) cmake build source corrupted or malformed CMakeList.txt (?)";
              check_build=true
              if ${{ inputs.upload }}; then
                echo 'build_files=1' >> "${GITHUB_ENV}";
                cp -Rf ./build ${github}/ && echo -e '\n####################\n\tbuild directory copied continuing...\n####################\n';
              fi;
            fi;
          elif [[ ! -d 'build' ]] && ${{ env.analysis == 3 }}; then
            echo -e "\n####################\n\t::error:: build directory missing in repo Exiting...\n####################\n";
            exit 1
          fi;
          if [[ ${update} ]] && ${{ env.analysis == 1 }}; then
            echo -e "\nPARAMETERS: $(rm -vf ${clang_file} 2>/dev/null)\n";
          fi;
          echo -e "\n####################\n# INSTALLED COMPILERS #\n${compiler_list}\n####################\n";
          if [[ ${check_build} ]]; then
            echo -e '\n####################\n\tProject Checked Exiting...\n####################\n';
          else
            echo -e '\n####################\n\tProject Not Checked Exiting...\n####################\n';
          fi;
        else
          echo -e '::error:: .git directory not found?';
        fi;
      shell: bash
      continue-on-error: true

    - name: Check & Repair (Clang-tools)
      if: inputs.filename != ''
      run: |
        export LC_ALL=C
        set +e
        SAVEIFS=${IFS}
        include_count=1
        include_total=1
        compile_json=$(sudo find . -type f -name 'compile_commands.json' -print -quit);
        build_cache='build_cache';
        file_count=1
        file_name="${{ inputs.filename }}";
        file_type="${file_name##*.}";
        cppchecks='.cppcheck';
        error_log="${GITHUB_WORKSPACE}/${{ inputs.filename }}_error.log";
        src_tree=$(sudo find ${{ env.file_path }} -type d -name '.git' -print -quit);
        checked=false
        count2=0
        github=${GITHUB_WORKSPACE};
        if ${{ inputs.database }}; then
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(grep -sF "/${{ inputs.filename }}" "${{ env.database }}" 2>/dev/null);
            echo -e "\n####################\nLiteral String Pattern Matching Active\n####################\n";
          else
            regex="\${{ inputs.filename }}$";
            files=$(grep -sE "${regex}" "${{ env.database }}" 2>/dev/null);
            echo -e "\n####################\nExtended Regex Pattern Matching Active\n####################\n";
          fi;
          clang_file=$(grep -sF -m 1 '.clang-tidy' "${{ env.database }}");
          repaired=$(grep -sF -m 1 'check-file-repaired.txt' "${{ env.database }}");
        else
          if [[ $(echo "${{ inputs.filename }}" | sed 's/[\/\$]//g' | grep -Po "\b\w+\.\w+\b") ]]; then
            files=$(sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "${{ inputs.filename }}" -print);
          else
            files=$(sudo find ${{ env.file_path }} -type f \( -path "*/${{ env.dirname }}/*" -o -path "*" \) -name "*${{ inputs.filename }}" -print);
          fi;
          clang_file=$(sudo find ${{ env.file_path }} -type f -name '.clang-tidy' -print -quit);
          repaired=$(sudo find ${{ env.file_path }} -type f -name 'check-file-repaired.txt' -print -quit);
        fi;
        if [[ $(echo "${file_type}" | egrep "^c$|^c.$|^c..$|^h$|^h.$|^h..$|^t$|^t.$|^t..$") ]] && [[ -n ${files} ]]; then
          process_input() {
            while IFS= read -r log; do
              if [[ ${{ inputs.output == 1 }} ]]; then
                echo "$log" | tee -a "${error_log}";
              elif [[ ${{ inputs.output == 2 }} ]]; then
                echo "$log" >> "${error_log}";
              elif [[ ${{ inputs.output == 3 }} ]]; then
                echo "$log";
              fi;
            done;
          }
          echo -e "\n####################\nWorkspace Folder: ${{ env.dirname }}\n####################\n";
          if [[ -f "${clang_file}" ]] && ${{ inputs.repair }}; then
            echo -e '\n####################\n\t.clang-tidy found continuing...\n####################\n';
          elif [[ ! -f "${clang_file}" ]] && ${{ inputs.repair }}; then
            echo -e "\n####################\n::error:: .clang-tidy not found exiting...\n####################\n";
            exit 1
          fi;
          if [[ -f "${compile_json}" ]] && ! ${{ inputs.include }}; then
            echo -e '\n####################\n\tcompile_commands.json found continuing...\n####################\n';
          elif [[ ! -f "${compile_json}" ]] && ! ${{ inputs.include }}; then
            echo -e "\n####################\n::error:: compile_commands.json not found\nUse inputs.project: true to create it exiting...\n####################\n";
            exit 1
          fi;
          if [[ -f "${src_tree%/*}/${cppchecks}" ]]; then
             cp -f "${src_tree%/*}/${cppchecks}" "${github}" 2>/dev/null && echo -e "\n####################\n\t${cppchecks} found continuing...\n####################\n";
             cppchecks=$(cat ${cppchecks} | tr -d ' \n');
          else
             cppchecks=all
          fi;
          if [[ -d "${src_tree%/*}/${build_cache}" ]]; then
             echo -e '\n####################\n\tbuild_cache found continuing...\n####################\n';
             cp -Rf "${src_tree%/*}/${build_cache}" "${github}" 2>/dev/null;
             echo 'build_cache=true' >> "${GITHUB_ENV}";
          else
             mkdir -p "${github}/${build_cache}";
          fi;
          if ${{ inputs.content }}; then
            echo -e "\n# Found File Path(s)\n";
            awk 'NR % 10 == 1 {print "---- Lines " NR " to " NR+9 " ----"} {print}' "${files}";
            echo -e '\t--------------------\n';
          fi;
          { time -p for file in ${files[@]}; do
            search_path="${file}";
            check_date=$(grep -sF "${search_path}" "${repaired}" | cut -d' ' -f 2-);
            count1=$((file_count++));
            echo -e "\n####################\n\tFILE PATH (${count1})\n####################\n";
            echo "$(dirname ${file})";
            if ${{ inputs.content }}; then
              echo -e "\n####################\n\tFILE CONTENT (${count1})\n####################\n";
              batcat --theme=ansi --paging=never --show-all --color=always --style=full "{file}";
            fi;
            if ${{ inputs.include }}; then
              IFS=$'\n';
              includes=$(sudo find $(dirname ${file}) -name $(basename ${file}) -exec sed -n 's/^#include <\(.*\)>/\1/p; s/^#include "\(.*\)"/\1/p' "{}" \;);
              include1="${GITHUB_WORKSPACE}/include_file1.txt";
              include2="${GITHUB_WORKSPACE}/include_file2.txt";
              if [[ ${includes} ]]; then
                echo -e "\n# Found Include File(s):\n${includes}\n";
                echo > "${include1}";
                cd "${src_tree%/*}";
                for i in ${includes[@]}; do
                  final="${i}";
                  count2=$((include_count++));
                  count3=$((include_total++));
                  header=$(sudo find . -type f \( -path "*/$(dirname ${i})/*" -o -path "*/$(dirname ${file})/*" -o -path "*" \) -name "$(basename ${i})" -print -quit);
                  if [[ -f "${header}" ]]; then
                    echo "$(dirname ${header#./})" >> "${include1}";
                  else
                    echo -e "\n::notice:: include source file ${i} is missing\n"
                  fi;
                done;
                IFS=${SAVEIFS};
                if [[ -f "${include1}" ]]; then
                  awk '!seen[$0]++' "${include1}" > "${include2}";
                fi;
                if [[ -f "${include2}" ]]; then
                  if ${{ inputs.repair }}; then
                    if ${{ inputs.stored }} && ${{ env.update }} && [[ $(grep -sF "${search_path}" "${repaired}") ]]; then
                      echo -e "\n####################\nSTORED NOTHING TO REPAIR\n####################\n";
                      echo -e "\n####################\nChecked on ${check_date}\nSkipping $(basename ${file})\n####################\n";
                    elif ${{ inputs.stored }} && ${{ env.update }}; then
                      echo -e "\n\n####################\nCLANG-TIDY FILES ANALYZER (${count1})\n####################\n\n";
                      clang-tidy "${file}" --config-file="${clang_file}" --fix-errors --fix-notes -- -I"${src_tree%/*}" 2>/dev/null | process_input || echo -e "::error:: ( $? ) broken pipe\nStatus [0]: ${PIPESTATUS[0]}\nStatus [1]: ${PIPESTATUS[1]}";
                      if [[ -s "${error_log}" ]] && [[ ! $(grep -sE "${file}.*error:" "${error_log}") ]]; then
                        echo -e "\n####################\nSTORING NO ERRORS FOUND\n####################\n\n${file}\n";
                      else
                        echo -e "\n####################\nSTORING FOUND ERROR(S) TO REPAIR\n####################\n";
                        errors=true
                      fi;
                      echo "${file} $(date)" >> "${repaired}";
                      fixed=true
                    elif ! ${{ inputs.stored }} || ! ${{ env.update }}; then
                      echo -e "\n\n####################\nCLANG-TIDY FILES ANALYZER (${count1})\n####################\n\n";
                      clang-tidy "${file}" --config-file="${clang_file}" --fix-errors --fix-notes -- -I"${src_tree%/*}" 2>/dev/null | process_input || echo -e "::error:: ( $? ) Broken pipe check. PipeStatus [0]: ${PIPESTATUS[0]}, PipeStatus [1]: ${PIPESTATUS[1]}";
                      if [[ -s "${error_log}" ]] && [[ ! $(grep -sE "${file}.*error:" "${error_log}") ]]; then
                        echo -e "\n####################\nCHECK-FILE NO ERRORS FOUND ${file}\n####################\n";
                      else
                        echo -e "\n####################\nCHECK-FILE FOUND ERROR(S) TO REPAIR\n####################\n";
                        errors=true
                      fi;
                      fixed=true
                    fi;
                  else
                    echo -e "\n####################\nCPPCHECK INCLUDE FILE(S) ANALYZER (${count2})\n####################\n\nFinal File: ${final}\n\n";
                    cppcheck --verbose --force --enable="${cppchecks}" --report-progress --suppress=* --suppress=checkersReport --includes-file="${include2}" "${file}" 2>/dev/null | process_input || echo -e "::error:: ( $? ) Broken pipe check. PipeStatus [0]: ${PIPESTATUS[0]}, PipeStatus [1]: ${PIPESTATUS[1]}";
                    if [[ -s "${error_log}" ]] && [[ ! $(grep -sE "${file}.*error:" "${error_log}") ]]; then
                      echo -e "\n####################\nCHECK-FILE NO ERRORS FOUND ${file}\n####################\n";
                    else
                      echo -e "\n####################\nCHECK-FILE FOUND ERROR(S)\n####################\n";
                      errors=true
                    fi;
                  fi;
                fi;
              else
                echo -e "\n\n####################\nINCLUDE FILE(S) FOR $(basename ${file}) NOT PRESENT\n####################\n\n";
              fi;
              echo -e "\n::notice:: Number of $(basename ${file}) include file(s): ${count2}\n" |& process_input;
              include_count=1
            else
              if ${{ inputs.repair }}; then
                if ${{ inputs.stored }} && ${{ env.update }} && [[ $(grep -sF "${search_path}" "${repaired}") ]]; then
                  echo -e "\n####################\nSTORED NOTHING TO REPAIR\n####################\n";
                  echo -e "\n####################\nChecked on ${check_date}\nSkipping $(basename ${file})\n####################\n";
                elif ${{ inputs.stored }} && ${{ env.update }}; then
                  echo -e "\n\n####################\nCLANG-TIDY FILES ANALYZER (${count1})\n####################\n\n";
                  clang-tidy "${file}" --config-file="${clang_file}" --fix-errors --fix-notes --quiet 2>/dev/null | process_input || echo -e "::error:: ( $? ) Broken pipe check. PipeStatus [0]: ${PIPESTATUS[0]}, PipeStatus [1]: ${PIPESTATUS[1]}";
                  if [[ -s "${error_log}" ]] && [[ ! $(grep -sE "${file}.*error:" "${error_log}") ]]; then
                    echo -e "\n####################\nSTORING NO ERRORS FOUND\n####################\n\n${file}\n";
                  else
                    echo -e "\n####################\nSTORING FOUND ERROR(S) TO REPAIR\n####################\n";
                    errors=true
                  fi;
                  echo "${file} $(date)" >> "${repaired}";
                  fixed=true
                elif ! ${{ inputs.stored }} || ! ${{ env.update }}; then
                  echo -e "\n\n####################\nCLANG-TIDY FILES ANALYZER (${count1})\n####################\n\n";
                  clang-tidy "${file}" --config-file="${clang_file}" --fix-errors --fix-notes --quiet 2>/dev/null | process_input || echo -e "::error:: ( $? ) Broken pipe check. PipeStatus [0]: ${PIPESTATUS[0]}, PipeStatus [1]: ${PIPESTATUS[1]}";
                  if [[ -s "${error_log}" ]] && [[ ! $(grep -sE "${file}.*error:" "${error_log}") ]]; then
                    echo -e "\n####################\nCHECK-FILE NO ERRORS FOUND ${file}\n####################\n";
                  else
                    echo -e "\n####################\nCHECK-FILE FOUND ERROR(S) TO REPAIR\n####################\n";
                    errors=true
                  fi;
                  fixed=true
                fi;
              else
                echo -e "\n\n####################\nCPPCHECK FILE ANALYZER (${count1})\n####################\n\n";
                if ${{ inputs.stored }}; then
                  cppcheck -j "$(nproc --all)" --verbose --force --enable="${cppchecks}" --report-progress --suppress=checkersReport --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unmatchedSuppression:"{}" --cppcheck-build-dir="${build_cache}" --project="${compile_json}" "${file}" 2>/dev/null | process_input || echo -e "::error:: ( $? ) Broken pipe check. PipeStatus [0]: ${PIPESTATUS[0]}, PipeStatus [1]: ${PIPESTATUS[1]}";
                  echo 'build_cache=true' >> "${GITHUB_ENV}";
                else
                  cppcheck --verbose --force --enable="${cppchecks}" --report-progress --suppress=checkersReport --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unmatchedSuppression:"{}" --project="${compile_json}" "${file}" 2>/dev/null | process_input || echo -e "::error:: ( $? ) Broken pipe check. PipeStatus [0]: ${PIPESTATUS[0]}, PipeStatus [1]: ${PIPESTATUS[1]}";
                fi;
                if [[ -s "${error_log}" ]] && [[ ! $(grep -sE "${file}.*error:" "${error_log}") ]]; then
                  echo -e "\n####################\nCHECK-FILE NO ERRORS FOUND ${file}\n####################\n";
                else
                  echo -e "\n####################\nCHECK-FILE FOUND ERROR(S)\n####################\n";
                  errors=true
                fi;
              fi;
            fi;
            if ${{ inputs.recheck }} && ${{ inputs.repair }}; then
              echo -e "\n\n####################\nCPPCHECK RE-ANALYZING FILE(S) (${count1})\n####################\n\n";
              cppcheck -j "$(nproc --all)" --verbose --force --enable="${cppchecks}" --report-progress --suppress=checkersReport --suppress=* --quiet "${file}" 2>/dev/null | process_input || echo -e "::error:: ( $? ) Broken pipe check. PipeStatus [0]: ${PIPESTATUS[0]}, PipeStatus [1]: ${PIPESTATUS[1]}";
              if [[ -s "${error_log}" ]] && [[ ! $(grep -sE "${file}.*error:" "${error_log}") ]]; then
                echo -e "\n####################\nRECHECK-FILE NO ERRORS FOUND ${file}\n####################\n";
