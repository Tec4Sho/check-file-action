          fi;
          CodeChecker log --build "make -nB -j$(nproc)" --output "${compile_json}" 2>&1 | process_input || echo -e "\n::notice::CodeChecker log exit-code ($?)" | process_input;
          if [[ "${PIPESTATUS[0]}" == '1' ]] || [[ -s "${project_log}" ]] && grep -qaiF 'Process completed with exit code' "${project_log}"; then
