        export LS_COLORS
        SAVEIFS="${IFS}";
        include_missing=1
        include_count=1
        include_total=1
        include_dirs=1
        file_count=1
        count1=0
        count2=0
        count3=0
        count4=0
        count5=0
        checked=false
        source_include=false
        includes_found=false
        include1='include-file1.txt';
        include2='include-file2.txt';
        include3='include-file3.txt';
        include_list='check-file-sources.txt';
        name_count_file='name-count-file.txt';
        include_count_file='include-count-file.txt';
        github="${GITHUB_WORKSPACE}";
        process_input() {
          while IFS= read -r output; do
            if ${{ inputs.output == '1' }}; then
              echo -e "${output}" | tee -a "${project_log}";
            elif ${{ inputs.output == '2' }}; then
              echo -e "${output}" >> "${project_log}";
            elif ${{ inputs.output == '3' }}; then
              echo -e "${output}";
            elif ${{ inputs.output == '4' }}; then
              echo -e "${output}" >/dev/null;
            fi;
          done;
        }
        if ${{ inputs.absolute }}; then
          abs='-a';
        else
          abs='';
        fi;
        echo -e "####################\n\t\033[33mPROGRESSIVE SCAN MODE\033[0m\n####################" | process_input;
        include_files3=$(fdfind -p -c auto "${abs}" -e "${{ inputs.filetype }}" "${{ env.base }}" | LC_ALL=C xargs -r rg --sort=path --trim -o '^#include[[:space:]]+["].*["]' | awk '{print $2}' | tr -d '<">' | sort -u);
        include_files4=$(fdfind -p -c auto "${abs}" -e "${{ inputs.filetype }}" "${{ env.base }}" | awk -F'/' '{print $NF, $0}' | sort -k1,1 | cut -d' ' -f2-);
        [[ -f "${include_list}" ]] && mv -f "${include_list}" "${include_list}.old";
        [[ -f "${include1}" ]] && rm -f "include-file*.txt";
        [[ -f "${name_count_file}" ]] && rm -f "${name_count_file}";
        [[ -f "${include_count_file}" ]] && rm -f "${include_count_file}";
        if [[ "${{ inputs.filetype }}" == [c]* ]] && ${{ inputs.source == '3' }} && [[ "${include_files3}" ]]; then
          echo -e "\n\033[32mCheck-File discovered include objectives running full scan now: \033[0m\033[1mContent Display\033[0m  [\033[35m low \033[0m]" | process_input;
          echo -e "\n####################\nCheck-File Auto Fix Sources Include [ Status: \033[32mAnalzying\033[0m ]\n####################" | process_input;
          declare -A processed
          while IFS= read -r include; do
            if [[ "${include}" == *.[h]* ]]; then
              path1="${include##+(*./)}";
              path2="${path1##[:]*}";
              path3="${path2%'\n'}";
              path4="${path3%\\}";
              clean_path="${path4%/*}";
              file1="${include##+(*./)}";
              file2="${file1##[:]*}";
              file3="${file2%'\n'}";
              file4="${file3%\\}";
              clean_file="${file4##*/}";
              if [[ ${include} == *"/"* ]]; then
                shopt -s extglob
                header=$(fdfind -p -c auto "${abs}" -t f -g "**/${path4##+(*./)}" "${{ env.base }}");
                shopt -u extglob
              else
                header=$(fdfind -p -c auto "${abs}" -t f "${clean_file##+(*./)}" "${{ env.base }}");
              fi;
              if [[ "${header}" ]]; then            
                while IFS= read -r includes; do
                  count2=$((include_count++));
                  echo "${includes%/*}" >> "${include1}";
                done <<< "${header[@]}";
                includes_found=true
              elif [[ -n "${processed[$include]}" ]]; then
                includes_found=false
                echo -e "\n\033[33mSource file #include \033[0m( ${include} )\033[33m already listed missing!\033[0m  [\033[1m skipped \033[0m]" | process_input;
              else
                includes_found=false
                processed["$include"]=1
                count5=$((include_missing++));
                echo -e "\n::notice::\033[31mSource file #include \033[0m( ${include} )\033[31m is missing!?\033[0m  [ ❌ ]" | process_input;
              fi;
            fi;
          done <<< "${include_files3[@]}";
          if [[ -s "${include1}" ]]; then
            awk '!seen[$0]++' "${include1}" > "${include_list}";
          fi;
          if [[ -s "${include_list}" ]]; then
            count4=$(awk 'NF > 0 { count++ } END { print count }' "${include_list}");
          fi;
          if [[ "${includes_found}" == 'true' ]]; then
            source_include=true
            echo 'check_build=true' >> "${GITHUB_ENV}";
            echo -e "\n::notice::\033[34mTotal include source file added during scan\033[0m\033[1m ${count3}\033[0m\n[Hint] \033[1m${count4}\033[0m included directories added after duplicate cleaning!!!\033[0m\nSet option (\033[1m cache: true \033[0m) to use this list for source include checks without manually downloading an adding the file to your repo\n With cache you should set (\033[1m source: 0 \033[0m)running sources again each check!" | process_input;
          else
            echo -e '\n::notice::\033[31mNo include objectives discovered or check-file encountered an issue!!!\033[0m' | process_input;
          fi;
          if [[ "${count5}" > '0' ]]; then
            echo -e "\n::notice::\033[34m⚠️ Total include source files missing during scan\033[0m\033[1m ${count5}\033[0m\n[Hint] Many source files may call these \033[31mmissing include files.\nYou may need to remove the missing include file objectives or added the file before compiling!!!" | process_input;
          fi;
          unset processed;
          [[ -s "${include_list}" ]] && mkdir -p build && echo -e "\nSaving list to build: $(cp -vf ${include_list} build/)" | process_input;
          seconds=$((SECONDS - start_time));
          m=$((seconds / 60));
          s=$((seconds % 60));
          printf "Project Auto Include Runtime:\033[1m %d minutes and %d seconds\033[0m\n" "$m" "$s" | process_input;
        elif [[ "${{ inputs.filetype }}" == [c]* ]] && ${{ inputs.source == '4' }} && [[ "${include_files4}" ]]; then
          echo -e "\n\033[32mCheck-File gcc include objectives running full scan now: \033[0m\033[1mContent Display\033[0m  [\033[1m high \033[0m]" | process_input;
          echo -e "\n####################\nCheck-File Auto Fix Sources Include Status: [ \033[32mAnalzying\033[0m ]\n####################" | process_input;
          if [[ "${{ inputs.filetype }}" == [c] ]] && [[ "$(which gcc)" ]]; then
            echo -e '\n[\033[1mgcc mode\033[0m]\n';
            while IFS= read -r file; do
              count1=$((file_count++));
              gcc -MM -MG -MP "${file}" 2>&1 | process_input;
            done <<< "${include_files4[@]}";
          echo 'check_build=true' >> "${GITHUB_ENV}";
          elif [[ "${{ inputs.filetype }}" == [c]* ]] && [[ "$(which g++)" ]]; then
            echo -e '\n[\033[1mg++ mode\033[0m]\n';
            while IFS= read -r file; do
              count1=$((file_count++));
              g++ -MM -MG -MP "${file}" 2>&1 | process_input;
            done <<< "${include_files4[@]}";
            echo 'check_build=true' >> "${GITHUB_ENV}";
          fi;
          if [[ -s "${project_log}" ]]; then
            LC_ALL=C grep -E '^[^/].*\.(h|hpp)$' "${project_log}" | grep -v '.o:' | awk '{print $1}' > 'input_file.txt' && sed -E 's|/[^/]*$||' 'input_file.txt' > 'output_file.txt';
            if [[ -s 'output_file.txt' ]]; then
              while IFS= read -r path; do
                count4=$((include_dirs++));
                echo "${path%/..}" >> 'output.txt';
              done < 'output_file.txt';
            fi;
            [[ -s 'output.txt' ]] && cat 'output.txt' | sort -u > "${include_list}" && rm output.txt input_file.txt output_file.txt 2>/dev/null;
            if [[ -s "${include_list}" ]]; then
              source_include=true
              count4=$(awk 'NF > 0 { count++ } END { print count }' "${include_list}");
              mkdir -p build && echo -e "\nSaving list to build: $(cp -vf ${include_list} build/)" | process_input;
            fi;
            clang_files_missing=$(LC_ALL=C grep -sFc 'No such file or directory' "${project_log}");
            clang_missing_count=$(LC_ALL=C grep -sF 'No such file or directory' "${project_log}" | awk '{print $4}' | tr -d ': ' | sort -u | wc -l);
            clang_file_errors=$(LC_ALL=C grep -sFc 'error:' "${project_log}");
            echo -e "\n::notice::\033[34mTotal source files scanned:\033[0m \033[1m${count1}\033[0m. Their were \033[1m${count4}\033[0m include directories added,\n[Hint] You can \033[31mlimit\033[0m include directories added using (\033[1m number: # \033[0m) option.\nDefault limit is set at \033[31m500\033[0m" | process_input;
            if [[ "${clang_file_errors}" > '0' ]]; then
              echo -e "\n::notice::\033[34m⚠️ Total include source file errors during scan\033[0m\033[1m ${clang_file_errors}\033[0m\n[Hint] Many source files may report these \033[31mfatal file errors.\033[0m\n\033[1mCheck-file notice file issues that needs repair before a build!!!\033[0m" | process_input;
            fi;
            if [[ "${clang_files_missing}" > '0' ]]; then
              echo -e "\n::notice::\033[34m⚠️ Total include source file missing calls during scan\033[0m\033[1m ${clang_files_missing}\033[0m\n[Hint] Many source files may call these \033[31mmissing include files.\033[0m\nYou may need to remove the missing include file objectives or added the files before compiling!!!" | process_input;
              echo -e "\n::notice::\033[31m⚠️ Total include source files actually missing after scan\033[0m\033[1m ${clang_missing_count:-0}\033[0m\n";
            fi;
            includes_found=true
          fi;
          seconds=$((SECONDS - start_time));
          m=$((seconds / 60));
          s=$((seconds % 60));
          printf "Project Auto Include Runtime:\033[1m %d minutes and %d seconds\033[0m\n" "$m" "$s" | process_input;
        fi;
        if [[ "${source_include}" == 'true' ]]; then
          echo "include_count=${count4}" >> "${GITHUB_ENV}";
        else
          echo 'include_count=0' >> "${GITHUB_ENV}";
        fi;
        if ${{ inputs.number > '0' }}; then
          echo 'include_source=false' >> "${GITHUB_ENV}";
        elif [[ "${count4}" > '2000' ]]; then
          echo 'include_source=true' >> "${GITHUB_ENV}";
        else
          echo 'include_source=false' >> "${GITHUB_ENV}";
        fi;
        echo '';
      shell: bash
      continue-on-error: true

    - name: Source File Includes Fix
      if: inputs.source == '5'
      run: |
        echo '';
        set +e
        start_time="${SECONDS}";
