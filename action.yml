              [[ "${clang_missing_count}" == '0' ]] && clang_missing_count=$(grep -oE '\b[^/[:space:]][^[:space:]]*' "${project_log}" | awk '{ for (i=1;i<=NF;i++) print $i; }' | grep -E '[a-zA-Z0-9_-]+\.(h|hh|hpp|hxx)$' | sort -u | wc -l);
