# codechecker.yaml
analyzer:
  # Enable/disable checkers.
  - --enable=core.DivideZero
  - --enable=core.CallAndMessage
  # Analyzer configurations.
  - --analyzer-config=clangsa:unroll-loops=true
  - --analyzer-config=clang-tidy:take-config-from-directory=true # Corrected location
  # Optional options.
  - --keep-gcc-include-fixed
  - --no-missing-checker-error
  - --report-hash=context-free-v2
  - --verbose=debug
  - --clean
parse:
  - --trim-path-prefix=$HOME/workspace
server:
  - --workspace=$HOME/workspace
  - --port=9090
store:
  - --name=run_name
  - --tag=my_tag
  - --url=http://codechecker.my:9090/MyProduct
